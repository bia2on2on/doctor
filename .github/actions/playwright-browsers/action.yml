name: Playwright browsers (pinned + exact-key cache)
description: >-
  Installs one exact Playwright Python release and the exact browser builds that
  release pins, reusing them from an exact-key cache on later runs.

  Browsers are executables, so the cache handling is deliberately strict:
  * the cache key is exact — runner OS + arch + Playwright version + the exact
    browser set — with no `restore-keys`, so a different version or a different
    browser set can never be restored by accident;
  * GitHub caches are branch-scoped, so a pull request from a fork cannot write
    the cache that default-branch runs read;
  * after a restore the browsers are re-validated every run: `playwright
    install` (which checks the pinned build revisions) and a real headless
    launch of each browser. Only a launch failure triggers the apt-based
    `install-deps`, once, followed by a fail-closed re-verification.

  Cold (cache miss): `playwright install --with-deps <browsers>` downloads the
  pinned builds and provisions system dependencies, then verifies a launch.
  Warm (cache hit): no download, no apt unless the launch verification fails.

inputs:
  playwright-version:
    description: >-
      Exact `playwright` PyPI release. 1.64.1 is the release the previously
      unpinned install resolved to (PyPI latest, published 2026-10-22T16:29Z)
      and the pin freezes that resolution. Browser builds are fixed per release:
      chromium-1248, firefox-1555, webkit-2370, ffmpeg-1013.
    required: false
    default: '1.64.1'
  browsers:
    description: 'Space-separated browsers to install: chromium, firefox, webkit.'
    required: false
    default: 'chromium'
  cache:
    description: 'Reuse the exact-key browser cache (recommended).'
    required: false
    default: 'true'
  install-timeout-seconds:
    description: >-
      Upper bound for one `playwright install` / `install-deps` invocation, so a
      stalled CDN or apt mirror fails the step instead of hanging the job.
    required: false
    default: '900'

outputs:
  cache-hit:
    description: '`true` when the exact-key browser cache was restored.'
    value: ${{ steps.browsers-cache.outputs.cache-hit }}
  seconds:
    description: 'Wall-clock seconds spent in the browser install/verify phase.'
    value: ${{ steps.browsers.outputs.playwright_seconds }}
  deps:
    description: 'How system dependencies were handled on this run.'
    value: ${{ steps.browsers.outputs.playwright_deps }}

runs:
  using: composite
  steps:
    - name: Prepare cache key
      id: key
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PW_BROWSERS: ${{ inputs.browsers }}
        PW_VERSION: ${{ inputs.playwright-version }}
        PW_ARCH: ${{ runner.arch }}
        PW_OS: ${{ runner.os }}
      run: |
        set -euo pipefail
        # Cache keys are a single token: normalise the browser list here so the
        # key is byte-stable and the same list is still passed as argv later.
        normalised="$(printf '%s' "$PW_BROWSERS" | tr -s ' ' '-' | sed 's/^-//; s/-$//')"
        if [ -z "$normalised" ]; then
          echo "::error title=playwright-browsers::no browsers requested"
          exit 1
        fi
        key="pw-browsers-v1-${PW_OS}-${PW_ARCH}-${PW_VERSION}-${normalised}"
        echo "PW_CACHE_KEY=${key}" >> "$GITHUB_ENV"
        echo "normalised_browsers=${normalised}"

    - name: Install Playwright Python package (exact version)
      id: pkg
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PW_VERSION: ${{ inputs.playwright-version }}
      run: |
        set -euo pipefail
        spec="playwright==${PW_VERSION}"
        if ! python3 -m pip install --quiet --disable-pip-version-check "$spec" > /tmp/pw-pip.log 2>&1; then
          # Ubuntu 24.04 marks the system interpreter externally managed (PEP 668);
          # the previously used install line had the same fallback. The reason for
          # the fallback stays visible instead of being discarded.
          echo "::notice title=playwright pip::default pip install was refused; retrying with --break-system-packages (PEP 668 externally-managed environment). Detail: $(tail -2 /tmp/pw-pip.log | tr '\n' ' ' | cut -c1-300)"
          python3 -m pip install --quiet --disable-pip-version-check --break-system-packages "$spec" >> /tmp/pw-pip.log 2>&1 || {
            tail -30 /tmp/pw-pip.log
            echo "::error title=playwright pip::could not install ${spec}"
            exit 1
          }
        fi
        actual="$(python3 -m playwright --version | awk '{print $NF}')"
        if [ "$actual" != "$PW_VERSION" ]; then
          echo "::error title=playwright version::expected ${PW_VERSION}, interpreter reports '${actual}'"
          exit 1
        fi
        echo "playwright --version: ${actual}"

    - name: Restore browser cache (exact key, no restore-keys)
      id: browsers-cache
      if: inputs.cache == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ env.PW_CACHE_KEY }}

    - name: Install/verify browsers
      id: browsers
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PW_BROWSERS: ${{ inputs.browsers }}
        PW_VERSION: ${{ inputs.playwright-version }}
        PW_CACHE_HIT: ${{ steps.browsers-cache.outputs.cache-hit }}
        PW_INSTALL_TIMEOUT: ${{ inputs.install-timeout-seconds }}
      run: |
        set -euo pipefail
        read -r -a BROWSERS <<< "$PW_BROWSERS"
        if [ "${#BROWSERS[@]}" -eq 0 ]; then
          echo "::error title=playwright-browsers::no browsers requested"
          exit 1
        fi
        # Documented Playwright knob: idle socket timeout for a stalled browser
        # download (default 30s is short for cdn.playwright.dev under load).
        export PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT=120000
        verifier="$GITHUB_ACTION_PATH/verify_launch.py"
        started=$(date +%s)

        install_with_deps() {
          timeout "$PW_INSTALL_TIMEOUT" python3 -m playwright install --with-deps --no-progress "${BROWSERS[@]}" > /tmp/pw-install.log 2>&1 || {
            echo "::error title=playwright install failed::$(tail -15 /tmp/pw-install.log | tr '\n\r' '  ' | sed 's/%/%25/g' | cut -c1-1200)"
            tail -40 /tmp/pw-install.log || true
            exit 1
          }
        }

        install_deps_only() {
          timeout "$PW_INSTALL_TIMEOUT" python3 -m playwright install-deps "${BROWSERS[@]}" > /tmp/pw-deps.log 2>&1 || {
            echo "::error title=playwright install-deps failed::$(tail -15 /tmp/pw-deps.log | tr '\n\r' '  ' | sed 's/%/%25/g' | cut -c1-1200)"
            tail -40 /tmp/pw-deps.log || true
            exit 1
          }
        }

        if [ "$PW_CACHE_HIT" = "true" ]; then
          # `install` against a complete cache validates the pinned build
          # revisions and downloads nothing; it also prunes builds that this
          # browser set does not use.
          timeout "$PW_INSTALL_TIMEOUT" python3 -m playwright install --no-progress "${BROWSERS[@]}" > /tmp/pw-install.log 2>&1 || {
            echo "::error title=playwright install failed::$(tail -15 /tmp/pw-install.log | tr '\n\r' '  ' | sed 's/%/%25/g' | cut -c1-1200)"
            tail -40 /tmp/pw-install.log || true
            exit 1
          }
          if python3 "$verifier" "${BROWSERS[@]}"; then
            deps="reused (cached browsers launched; system deps already present)"
          else
            echo "::warning title=playwright system dependencies::cached browser binaries did not launch on this runner, so the system dependency set is provisioned once with 'playwright install-deps'. Bounded: one attempt, then a fail-closed re-verification."
            install_deps_only
            python3 "$verifier" "${BROWSERS[@]}" || {
              echo "::error title=playwright launch failed::browsers still do not launch after one bounded install-deps"
              exit 1
            }
            deps="installed (one bounded install-deps after a launch failure)"
          fi
        else
          install_with_deps
          python3 "$verifier" "${BROWSERS[@]}" || {
            echo "::error title=playwright launch failed::freshly installed browsers do not launch"
            exit 1
          }
          deps="installed with browsers (cache miss)"
        fi

        seconds=$(( $(date +%s) - started ))
        builds="$(ls "${HOME}/.cache/ms-playwright" 2>/dev/null | tr '\n' ' ' || true)"
        echo "playwright_seconds=${seconds}" >> "$GITHUB_OUTPUT"
        echo "playwright_deps=${deps}" >> "$GITHUB_OUTPUT"
        echo "playwright version=${PW_VERSION} browsers=${BROWSERS[*]} cache_hit=${PW_CACHE_HIT:-false} deps=${deps} seconds=${seconds} builds=${builds}" >> "$GITHUB_STEP_SUMMARY"
        echo "::notice title=playwright browsers::version=${PW_VERSION} browsers=${BROWSERS[*]} cache_hit=${PW_CACHE_HIT:-false} deps=${deps} seconds=${seconds} builds=${builds:-none}"
