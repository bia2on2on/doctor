name: Disposable Demo Installer (browser-only companion)

# Acceptance for tools/disposable-demo-installer: static gates + the real
# WordPress run (clean WP + MySQL 8 + production CPMS ZIP → activate companion →
# preflight → provision → six logins → public booking → real OTP → teardown).
#
# The production plugin's own workflows are untouched; this lane never modifies
# clinic-practice-management/**.
#
# Path-scoped on purpose: the lane's own guard fails whenever the production
# subtree differs from the PR base, so running it on a PR that legitimately
# changes clinic-practice-management/** (its whole purpose) would fail for a
# reason that has nothing to do with this lane. It runs only when its own files
# change; `workflow_dispatch` still allows a manual run anywhere.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/disposable-demo-installer.yml'
      - '.github/scripts/companion-isolation.py'
      - '.github/actions/playwright-browsers/**'
      - 'bin/build-demo-installer.sh'
      - 'tools/disposable-demo-installer/**'
      - 'docs/demo-setup-fa.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/disposable-demo-installer.yml'
      - '.github/scripts/companion-isolation.py'
      - '.github/actions/playwright-browsers/**'
      - 'bin/build-demo-installer.sh'
      - 'tools/disposable-demo-installer/**'
      - 'docs/demo-setup-fa.md'

permissions:
  contents: read
  pull-requests: write

env:
  WP_VERSION: '7.1.3'
  PHP_VERSION: '8.2'
  WP_DIR: /home/runner/cpdd-wp
  WP_URL: http://localhost:8080
  DB_NAME: cpdd_demo
  ADMIN_USER: cpdd_admin
  COMPANION_DIR: tools/disposable-demo-installer

concurrency:
  group: cpdd-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    name: Static gates + reproducible installer ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: PHP syntax (every shipped and test file)
        run: |
          set -Eeuo pipefail
          FILES="$(git ls-files "$COMPANION_DIR" | grep -E '\.php$')"
          test -n "$FILES"
          for FILE in $FILES; do
            php -l "$FILE" >/dev/null
            echo "LINT_OK $FILE"
          done

      - name: Automated tests (authorization, preflight, ownership, OTP, credentials)
        run: php "$COMPANION_DIR/tests/run-tests.php" | tee /tmp/cpdd-tests.log

      # Workflow-only edits must not be able to disable the lane's own controls:
      # the contract/security suite (and the isolation-rule unit tests inside it)
      # runs on every lane invocation, including changes to this file alone.
      - name: Companion compatibility gate (schema/table/ownership contract)
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests/companion-compat -p 'test_*.py'
          python3 .github/scripts/companion-compat/evaluate.py --root . --gate compatibility

      - name: Lane contract & isolation-rule tests
        run: python3 -m unittest discover -s .github/workflows -p 'test_workflow_contracts.py' -v

      - name: Build installer ZIP twice and prove reproducibility + content
        run: |
          set -Eeuo pipefail
          OUT_DIR=/tmp/cpdd-build-1 bash bin/build-demo-installer.sh --companion | tee /tmp/cpdd-build-1.log
          OUT_DIR=/tmp/cpdd-build-2 bash bin/build-demo-installer.sh --companion >/tmp/cpdd-build-2.log
          ZIP1=/tmp/cpdd-build-1/cpms-disposable-demo-companion-1.0.0.zip
          ZIP2=/tmp/cpdd-build-2/cpms-disposable-demo-companion-1.0.0.zip
          test "$(sha256sum "$ZIP1" | cut -d' ' -f1)" = "$(sha256sum "$ZIP2" | cut -d' ' -f1)"
          # Exactly one top-level plugin directory, no repository/test/doc paths.
          test "$(unzip -Z1 "$ZIP1" | cut -d/ -f1 | sort -u)" = 'cpms-disposable-demo'
          if unzip -Z1 "$ZIP1" | grep -Eq '^(clinic-practice-management/|tests/|docs/|\.github/|bin/)'; then
            echo 'FAIL: installer ZIP contains repository paths' >&2; exit 1
          fi
          unzip -p "$ZIP1" cpms-disposable-demo/cpms-disposable-demo.php | head -20 | grep -q 'Plugin Name:'
          # Mission H: the package no longer declares a production dependency; the
          # companion lane proves the absence is deliberate, the standalone lane proves
          # the embedded core boots.
          if unzip -p "$ZIP1" cpms-disposable-demo/cpms-disposable-demo.php | grep -q 'Requires Plugins:'; then
            echo 'FAIL: Requires Plugins header reintroduced' >&2; exit 1
          fi
          if unzip -Z1 "$ZIP1" | grep -q '/core/'; then
            echo 'FAIL: companion build must not embed the production core' >&2; exit 1
          fi
          # The companion must never carry the production plugin's sources.
          if unzip -Z1 "$ZIP1" | grep -q 'ClinicCore'; then echo 'FAIL: production sources packaged' >&2; exit 1; fi
          python3 - "$ZIP1" <<'PY'
          import hashlib, json, sys, zipfile
          path = sys.argv[1]
          data = open(path, 'rb').read()
          with zipfile.ZipFile(path) as archive:
              names = archive.namelist()
              bad = archive.testzip()
          proof = {
              "file": path.rsplit('/', 1)[-1],
              "bytes": len(data),
              "sha256": hashlib.sha256(data).hexdigest(),
              "entries": len(names),
              "zip_integrity": "ok" if bad is None else f"corrupt:{bad}",
          }
          json.dump(proof, open('/tmp/cpdd-installer-proof.json', 'w'), indent=2)
          print(json.dumps(proof))
          PY
          cp "$ZIP1" /tmp/cpms-disposable-demo-companion-1.0.0.zip

      - name: Upload the genuine installer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cpms-disposable-demo-installer
          path: /tmp/cpms-disposable-demo-companion-1.0.0.zip
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: cpdd-static-evidence
          path: |
            /tmp/cpdd-installer-proof.json
            /tmp/cpdd-tests.log
            /tmp/cpdd-build-1.log
          if-no-files-found: error
          retention-days: 30

  real-wordpress:
    name: Real WordPress acceptance (clean WP → CPMS → companion → teardown)
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mysqli, curl, mbstring, xml, zip, gd, sodium, intl
          coverage: none

      - name: Tooling (checksum-verified WP-CLI + Apache + mysql client)
        uses: ./.github/actions/wp-stack-tooling
        with:
          apt-packages: >-
            mysql-client apache2
            libapache2-mod-php
            php-mysql
            php-mbstring
            php-xml
            php-curl
            php-zip
            php-gd
          apt-log-dir: /tmp/cpdd-ci

      - name: Playwright Chromium (pinned)
        uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium

      # Isolation rule, decided by an executable, unit-tested script
      # (.github/scripts/companion-isolation.py, pinned by
      # .github/workflows/test_workflow_contracts.py):
      #   production-only  -> PASS  (legitimate production development)
      #   companion-only   -> PASS  (production untouched)
      #   workflow-only    -> PASS  (lane plumbing; the lane's own contract and
      #                              security checks still run below)
      #   mixed            -> FAIL closed
      - name: Companion/production isolation (fail closed on mixed changes)
        run: |
          set -Eeuo pipefail
          BASE="$(git rev-parse "${{ github.event.pull_request.base.sha || 'origin/main' }}")"
          git diff --name-only "$BASE" HEAD > /tmp/cpdd-changed.txt
          wc -l < /tmp/cpdd-changed.txt | xargs echo 'changed paths:'
          python3 "$GITHUB_WORKSPACE/.github/scripts/companion-isolation.py" \
            --changed-files /tmp/cpdd-changed.txt

      - name: Build production CPMS ZIP (unmodified main-line build script)
        run: |
          set -Eeuo pipefail
          composer install --no-interaction --no-progress --working-dir=clinic-practice-management --no-dev >/tmp/cpdd-ci/composer.log 2>&1
          bash clinic-practice-management/bin/build-release.sh | tee /tmp/cpdd-ci/release-build.log
          ZIP="$(find clinic-practice-management/dist -maxdepth 1 -name 'clinic-practice-management-*.zip' -print -quit)"
          test -n "$ZIP"
          echo "CPMS_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Clean WordPress + CSPRNG Administrator password
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/cpdd-ci
          curl -fsS "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" -o /tmp/wp.tar.gz
          tar -xzf /tmp/wp.tar.gz -C /tmp
          mv /tmp/wordpress "$WP_DIR"
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "CREATE DATABASE $DB_NAME CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          cd "$WP_DIR"
          wp config create --dbname="$DB_NAME" --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --dbprefix='wp_' --skip-salts --allow-root
          wp config shuffle-salts --allow-root
          wp config set DISABLE_WP_CRON true --raw --allow-root
          wp config set WP_DEBUG true --raw --allow-root
          wp config set WP_DEBUG_LOG true --raw --allow-root
          wp config set WP_DEBUG_DISPLAY false --raw --allow-root
          # Private clinical storage must live outside the document root and be
          # writable by the web server (php-fpm/apache user). A real host does
          # this once by hand; here it is provisioned explicitly so the plugin
          # never has to fall back or log a failed initialization on a pristine site.
          sudo mkdir -p /home/runner/cpdd-private
          sudo chown www-data:runner /home/runner/cpdd-private
          sudo chmod 0775 /home/runner/cpdd-private
          wp config set CPMS_PRIVATE_STORAGE_DIR /home/runner/cpdd-private --type=constant --allow-root
          ADMIN_PASS="$(python3 -c 'import secrets; print(secrets.token_hex(24))')"
          wp core install --url="$WP_URL" --title="CPDD Acceptance" --admin_user="$ADMIN_USER" --admin_password="$ADMIN_PASS" --admin_email=admin@cpdd.invalid --skip-email --allow-root
          echo "WP_ADMIN_CREATED=1"

      - name: Activate production CPMS, then install and activate the companion ZIP
        run: |
          set -Eeuo pipefail
          wp plugin install "$GITHUB_WORKSPACE/$CPMS_ZIP" --activate --path="$WP_DIR" --allow-root
          wp plugin is-active clinic-practice-management --path="$WP_DIR" --allow-root
          SCHEMA="$(wp eval 'echo \ClinicCore\Bootstrap\App::migrations()->currentVersion();' --path="$WP_DIR" --allow-root)"
          test "$SCHEMA" = '2026_10_31_0031'
          echo "SCHEMA=$SCHEMA"
          OUT_DIR=/tmp/cpdd-ci bash "$GITHUB_WORKSPACE/bin/build-demo-installer.sh" --companion | tee /tmp/cpdd-ci/companion-build.log
          wp plugin install /tmp/cpdd-ci/cpms-disposable-demo-companion-1.0.0.zip --activate --path="$WP_DIR" --allow-root
          wp plugin is-active cpms-disposable-demo --path="$WP_DIR" --allow-root

      - name: Companion surface is read-only by construction (no REST/AJAX/frontend)
        run: |
          set -Eeuo pipefail
          SRC="$WP_DIR/wp-content/plugins/cpms-disposable-demo"
          test -d "$SRC"
          for PATTERN in 'register_rest_route' 'wp_ajax_' 'add_shortcode' 'wp_schedule_event' 'admin_post_nopriv'; do
            if grep -rq "$PATTERN" "$SRC" --include='*.php'; then
              echo "FAIL: companion registers $PATTERN" >&2; exit 1
            fi
          done
          echo 'PASS: no REST route, AJAX action, shortcode, cron event or public POST surface in the companion'
          wp eval '
            echo "SHORTCODE_TAG=" . ( shortcode_exists( "cpms_public_booking" ) ? "yes" : "no" ) . PHP_EOL;
            echo "COMPANION_ACTIVE=" . ( is_plugin_active( "cpms-disposable-demo/cpms-disposable-demo.php" ) ? "yes" : "no" ) . PHP_EOL;
            echo "USERS=" . count( get_users( array( "fields" => "ID" ) ) ) . PHP_EOL;
          ' --path="$WP_DIR" --allow-root --user="$ADMIN_USER" | tee /tmp/cpdd-ci/surface.log

      - name: Integration acceptance (provision → logins → booking → OTP → teardown)
        run: |
          set -Eeuo pipefail
          wp eval-file "$GITHUB_WORKSPACE/$COMPANION_DIR/tests/integration-wp.php" \
            --use-include --path="$WP_DIR" --allow-root --user="$ADMIN_USER" \
            2>&1 | tee /tmp/cpdd-ci/integration.log
          grep -q '^CPDD_INTEGRATION=PASS' /tmp/cpdd-ci/integration.log

      - name: Post-teardown site state (default data intact, no demo artefacts)
        run: |
          set -Eeuo pipefail
          wp eval '
            global $wpdb;
            echo "USERS=" . count( get_users( array( "fields" => "ID" ) ) ) . PHP_EOL;
            echo "MANIFEST=" . ( get_option( "cpdd_manifest", false ) ? "present" : "absent" ) . PHP_EOL;
            echo "CLINICS=" . (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$wpdb->prefix}cpms_clinics" ) . PHP_EOL;
            echo "PATIENTS=" . (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$wpdb->prefix}cpms_patients" ) . PHP_EOL;
            echo "APPOINTMENTS=" . (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$wpdb->prefix}cpms_appointments" ) . PHP_EOL;
            echo "INVOICES=" . (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$wpdb->prefix}cpms_invoices" ) . PHP_EOL;
          ' --path="$WP_DIR" --allow-root --user="$ADMIN_USER" | tee /tmp/cpdd-ci/post-teardown.log
          grep -q '^USERS=1$' /tmp/cpdd-ci/post-teardown.log
          grep -q '^MANIFEST=absent$' /tmp/cpdd-ci/post-teardown.log
          grep -q '^CLINICS=1$' /tmp/cpdd-ci/post-teardown.log
          grep -q '^PATIENTS=0$' /tmp/cpdd-ci/post-teardown.log

      - name: Real-Chromium browser acceptance (wp-admin ZIP install → provision → 6 personas → booking/OTP → clinical/finance → RTL 320/390 → teardown → delete plugin)
        run: |
          set -Eeuo pipefail
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "DROP DATABASE IF EXISTS $DB_NAME; CREATE DATABASE $DB_NAME CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          rm -rf "$WP_DIR"
          tar -xzf /tmp/wp.tar.gz -C /tmp
          mv /tmp/wordpress "$WP_DIR"
          cd "$WP_DIR"
          wp config create --dbname="$DB_NAME" --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --dbprefix='wp_' --skip-salts --allow-root
          wp config shuffle-salts --allow-root
          wp config set DISABLE_WP_CRON true --raw --allow-root
          wp config set WP_DEBUG true --raw --allow-root
          wp config set WP_DEBUG_LOG true --raw --allow-root
          wp config set WP_DEBUG_DISPLAY false --raw --allow-root
          wp config set FS_METHOD direct --allow-root
          wp config set FS_CHMOD_DIR 0775 --raw --allow-root
          wp config set FS_CHMOD_FILE 0664 --raw --allow-root
          # Fresh, web-server-owned private storage root. The earlier CLI stage
          # already created files/backups-roots (0750) owned by the runner user,
          # and this stage activates the plugin as www-data through wp-admin; a
          # host provisions its private root once, for the web-server user.
          # Reusing the CLI-owned tree would make activation fail its own storage
          # guard and log a non-default operational event.
          sudo rm -rf /home/runner/cpdd-private
          sudo mkdir -p /home/runner/cpdd-private
          sudo chown -R www-data:runner /home/runner/cpdd-private
          sudo chmod 0775 /home/runner/cpdd-private
          wp config set CPMS_PRIVATE_STORAGE_DIR /home/runner/cpdd-private --type=constant --allow-root
          ADMIN_PASS_FILE=/tmp/cpdd-ci/.admin-pass
          python3 -c 'import secrets; print(secrets.token_hex(24), end="")' > "$ADMIN_PASS_FILE"
          chmod 600 "$ADMIN_PASS_FILE"
          wp core install --url="$WP_URL" --title="CPDD Browser Acceptance" --admin_user="$ADMIN_USER" --admin_password="$(cat "$ADMIN_PASS_FILE")" --admin_email=admin@cpdd.invalid --skip-email --allow-root
          wp rewrite structure '/%postname%/' --allow-root
          cat > "$WP_DIR/.htaccess" <<'HT'
          # BEGIN WordPress
          <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
          RewriteBase /
          RewriteRule ^index\.php$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.php [L]
          </IfModule>
          # END WordPress
          HT
          sudo chmod a+rx /home/runner
          sudo chown -R "$(id -un)":www-data "$WP_DIR"
          sudo chmod -R ug+rwX,o+rX "$WP_DIR"
          sudo find "$WP_DIR" -type d -exec chmod g+s {} +

          for INI in /etc/php/*/apache2/php.ini; do
            sudo sed -i 's/^display_errors = .*/display_errors = Off/; s/^upload_max_filesize.*/upload_max_filesize = 32M/; s/^post_max_size.*/post_max_size = 32M/' "$INI"
          done
          sudo a2enmod rewrite headers >/dev/null
          sudo sed -i 's/^Listen 80$/Listen 8080/' /etc/apache2/ports.conf
          sudo tee /etc/apache2/sites-available/cpdd.conf >/dev/null <<EOF
          <VirtualHost *:8080>
            ServerName localhost
            DocumentRoot $WP_DIR
            <Directory $WP_DIR>
              Options FollowSymLinks
              AllowOverride All
              Require all granted
            </Directory>
            ErrorLog \${APACHE_LOG_DIR}/cpdd-error.log
            CustomLog \${APACHE_LOG_DIR}/cpdd-access.log combined
          </VirtualHost>
          EOF
          sudo a2dissite 000-default >/dev/null || true
          sudo a2ensite cpdd >/dev/null
          sudo apache2ctl configtest
          sudo service apache2 restart
          curl -fsS -o /dev/null -w 'home HTTP %{http_code}\n' "$WP_URL/"
          curl -fsS -o /dev/null -w 'rest HTTP %{http_code}\n' "$WP_URL/wp-json/"

          BASE="$WP_URL" \
          WP_DIR="$WP_DIR" \
          OUT="/tmp/cpdd-ci" \
          ADMIN_USER="$ADMIN_USER" \
          ADMIN_PASS_FILE="$ADMIN_PASS_FILE" \
          CPMS_ZIP="$GITHUB_WORKSPACE/$CPMS_ZIP" \
          COMPANION_ZIP="/tmp/cpdd-ci/cpms-disposable-demo-companion-1.0.0.zip" \
          python3 "$GITHUB_WORKSPACE/$COMPANION_DIR/tests/browser-acceptance.py" \
            2>&1 | tee /tmp/cpdd-ci/browser-acceptance.log
          rm -f "$ADMIN_PASS_FILE"
          grep -q '^CPDD_BROWSER_ACCEPTANCE=PASS' /tmp/cpdd-ci/browser-acceptance.log

      # A "non-default operational event" verdict is not actionable on its own:
      # name the row so the next run does not need another guess. Runs only when
      # something already failed, and never changes the acceptance result.
      - name: Diagnose non-default operational log rows (failure only)
        if: failure()
        run: |
          set -Euo pipefail
          mkdir -p /tmp/cpdd-ci
          wp eval "
            global \$wpdb;
            \$baseline = array( 'MIGRATION_START', 'MIGRATION_DONE', 'MIGRATION_0011_LOCATIONS_BACKFILL', 'CPMS_ACTIVATED', 'CPMS_PRIVATE_STORAGE_MIGRATION' );
            \$table    = \$wpdb->prefix . 'cpms_operational_logs';
            \$placeholders = implode( ',', array_fill( 0, count( \$baseline ), '%s' ) );
            \$params   = array_merge( array( 'info' ), \$baseline );
            \$sql      = 'SELECT level, message, context_json, created_at FROM ' . \$table . ' WHERE NOT ( level = %s AND message IN (' . \$placeholders . ') ) ORDER BY id';
            \$rows     = \$wpdb->get_results( \$wpdb->prepare( \$sql, \$params ), ARRAY_A );
            foreach ( (array) \$rows as \$row ) {
                echo 'OPLOG_NON_DEFAULT=' . wp_json_encode( \$row ) . PHP_EOL;
            }
            echo 'OPLOG_TOTAL=' . (int) \$wpdb->get_var( 'SELECT COUNT(*) FROM ' . \$table ) . PHP_EOL;
            echo 'PRIVATE_STORAGE_STATE=' . wp_json_encode( get_option( 'cpms_private_storage_state' ) ) . PHP_EOL;
            echo 'PRIVATE_STORAGE_ROOT=' . ( defined( 'CPMS_PRIVATE_STORAGE_DIR' ) ? CPMS_PRIVATE_STORAGE_DIR : '(undefined)' ) . PHP_EOL;
          " --path="$WP_DIR" --allow-root 2>&1 | tee /tmp/cpdd-ci/oplog-diagnosis.log

      - name: No credentials or OTP codes leaked into logs
        if: always()
        run: |
          set -Eeuo pipefail
          rm -f /tmp/cpdd-ci/.admin-pass
          for LOG_FILE in /tmp/cpdd-ci/integration.log /tmp/cpdd-ci/browser-acceptance.log /tmp/cpdd-ci/browser-results.json; do
            if [ -f "$LOG_FILE" ] && grep -rEiq '(password|passwd|cpdd-[a-z_]+-[a-f0-9]{16}[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{20,}|OTP_CODE=)' "$LOG_FILE"; then
              echo "FAIL: possible credential material in $LOG_FILE" >&2; exit 1
            fi
          done
          echo 'PASS: integration and browser evidence contain no credential material'

      - name: Publish sanitized acceptance detail to the PR (no credentials)
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/cpdd-ci
          {
            echo '### CPMS disposable demo — real-WordPress & real-Chromium acceptance detail'
            echo
            echo "Commit: \`${{ github.sha }}\`"
            echo "Workflow run & artifact download: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            echo '--- companion zip proof ---'
            cat /tmp/cpdd-ci/companion-build.log 2>/dev/null || true
            echo '--- surface ---'
            sed -E 's/\b[a-f0-9]{48}\b/<redacted>/g' /tmp/cpdd-ci/surface.log 2>/dev/null | tail -20 || true
            echo '--- integration ---'
            sed -E 's/\b[a-f0-9]{48}\b/<redacted>/g' /tmp/cpdd-ci/integration.log 2>/dev/null | tail -120 || true
            echo '--- post-teardown ---'
            sed -E 's/\b[a-f0-9]{48}\b/<redacted>/g' /tmp/cpdd-ci/post-teardown.log 2>/dev/null | tail -20 || true
            echo '--- browser-acceptance ---'
            sed -E 's/\b[a-f0-9]{48}\b/<redacted>/g' /tmp/cpdd-ci/browser-acceptance.log 2>/dev/null | tail -160 || true
            echo '--- oplog diagnosis (failure only) ---'
            sed -E 's/\b[a-f0-9]{48}\b/<redacted>/g' /tmp/cpdd-ci/oplog-diagnosis.log 2>/dev/null | tail -40 || true
            echo '```'
          } > /tmp/cpdd-ci/pr-comment.md
          if [ -s /tmp/cpdd-ci/pr-comment.md ]; then
            bash "${GITHUB_WORKSPACE:-.}/.github/scripts/pr-evidence-comment.sh" --family cpdd-real-wordpress --pr "$PR_NUMBER" \
              --repo "${{ github.repository }}" --body-file /tmp/cpdd-ci/pr-comment.md
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpdd-real-wordpress-evidence
          path: /tmp/cpdd-ci/
          if-no-files-found: warn
          retention-days: 30
