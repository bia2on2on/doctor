name: FU Diagnostic Evidence (temporary)

# ⚠️ فایل موقت — فقط برای ثبت شواهد تشخیصی شکست CI در FollowUpReminderLocationCalendarRedTest
# این فایل پس از ثبت شواهد و طبق دستورالعمل در یک کامیت forward-only حذف می‌شود.

on:
  workflow_dispatch:
  push:
    branches: ['arena/01a0a474-doctor']

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    working-directory: clinic-practice-management

jobs:
  diagnostic:
    name: FU Diagnostic (fresh process reproduction)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      WP_TESTS_DIR: /tmp/wordpress-test-lib
      WP_CORE_DIR: /tmp/wordpress

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, mysqli, pcntl, curl
          coverage: none

      - name: Install dependencies (PHPUnit 9.6 for WP test lib)
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          composer require --dev phpunit/phpunit:^9.6 --no-interaction --no-progress --with-all-dependencies

      - name: Prepare WordPress test suite
        run: bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 6.7.2

      - name: Durable diagnostic probe (environment, timezones, calendar, quiet-hours)
        run: |
          php -d memory_limit=1G -r '
            require_once "vendor/autoload.php";
            require_once "tests/integration-bootstrap.php";
            use ClinicCore\Bootstrap\App;
            use ClinicCore\Settings\Settings;

            echo "=== DURABLE DIAGNOSTIC PROBE ===" . PHP_EOL;
            $wallClockUtc = new \DateTimeImmutable("now", new \DateTimeZone("UTC"));
            echo "current_wall_clock_utc: " . $wallClockUtc->format("Y-m-d\TH:i:s\Z") . PHP_EOL;

            $tzA = new \DateTimeZone("Pacific/Kiritimati");
            $tzB = new \DateTimeZone("Pacific/Niue");
            echo "location_a_iana_timezone: " . $tzA->getName() . " (offset: " . ($tzA->getOffset($wallClockUtc)/3600) . "h)" . PHP_EOL;
            echo "location_b_iana_timezone: " . $tzB->getName() . " (offset: " . ($tzB->getOffset($wallClockUtc)/3600) . "h)" . PHP_EOL;

            $localA = $wallClockUtc->setTimezone($tzA);
            $localB = $wallClockUtc->setTimezone($tzB);
            echo "location_a_local_now: " . $localA->format("Y-m-d H:i:s") . " (hour: " . (int)$localA->format("G") . ")" . PHP_EOL;
            echo "location_b_local_now: " . $localB->format("Y-m-d H:i:s") . " (hour: " . (int)$localB->format("G") . ")" . PHP_EOL;

            echo "location_a_derived_tomorrow: " . $localA->modify("+1 day")->format("Y-m-d") . PHP_EOL;
            echo "location_b_derived_tomorrow: " . $localB->modify("+1 day")->format("Y-m-d") . PHP_EOL;

            // Probe the CI failure instant (2026-09-15 09:02:33 UTC)
            $ciFailureUtc = new \DateTimeImmutable("2026-09-15T09:02:33Z", new \DateTimeZone("UTC"));
            echo "ci_failed_run_instant_utc: " . $ciFailureUtc->format("Y-m-d\TH:i:s\Z") . PHP_EOL;
            $failLocalA = $ciFailureUtc->setTimezone($tzA);
            $failHourA = (int)$failLocalA->format("G");
            echo "ci_failed_run_kiritimati_local_time: " . $failLocalA->format("Y-m-d H:i:s") . " (hour: " . $failHourA . ")" . PHP_EOL;

            // Quiet hours parsing breakdown
            $parseHour = function(string $hhmm): ?int {
                if (preg_match("/^([01]?\d|2[0-3]):[0-5]\d$/", $hhmm) !== 1) return null;
                return (int) substr($hhmm, 0, 2);
            };
            $startOld = $parseHour("00:00");
            $endOld = $parseHour("23:59");
            $endFixed = $parseHour("24:00");
            echo "quiet_hours_start_parsed: " . var_export($startOld, true) . PHP_EOL;
            echo "quiet_hours_end_old_parsed: " . var_export($endOld, true) . " (truncated from 23:59)" . PHP_EOL;
            echo "quiet_hours_end_fixed_parsed: " . var_export($endFixed, true) . " (null from 24:00 => fail-open 24/7)" . PHP_EOL;

            $checkOpen = function(int $nowHour, ?int $s, ?int $e): bool {
                if ($s === null || $e === null) return true;
                if ($s <= $e) return $nowHour >= $s && $nowHour < $e;
                return $nowHour >= $s || $nowHour < $e;
            };

            echo "old_quiet_hours_open_at_ci_failure_hour_23: " . var_export($checkOpen($failHourA, $startOld, $endOld), true) . " (FALSE => CLOSED => reminder_sent_at skipped)" . PHP_EOL;
            echo "fixed_quiet_hours_open_at_ci_failure_hour_23: " . var_export($checkOpen($failHourA, $startOld, $endFixed), true) . " (TRUE => OPEN => reminder_sent_at written)" . PHP_EOL;
            echo "fixed_quiet_hours_open_at_current_hour_" . (int)$localA->format("G") . ": " . var_export($checkOpen((int)$localA->format("G"), $startOld, $endFixed), true) . PHP_EOL;
            echo "=== END PROBE ===" . PHP_EOL;
          ' 2>&1 | tee /tmp/fu-probe.log

      - name: Fresh-process reproduction (exact 2 intended tests)
        run: |
          set +e
          php -d memory_limit=1G vendor/bin/phpunit --no-configuration \
            --bootstrap tests/integration-bootstrap.php \
            tests/Integration/FollowUpReminderLocationCalendarRedTest.php \
            --filter 'testLocationLocalCalendarSelectsPerRow|testClinicVisitLocationMismatchFailsClosed' \
            --testdox \
            --verbose 2>&1 | tee /tmp/fu-exec.log
          EXIT_CODE=$?
          set -e
          echo "phpunit_exit_code=$EXIT_CODE"

      - name: Selection guard (must execute exactly 2 tests)
        run: |
          EXECUTED=$(sed -nE 's/^Tests: ([0-9]+),.*/\1/p; s/^OK \(([0-9]+) tests?,.*/\1/p' /tmp/fu-exec.log | tail -1)
          echo "executed_tests=$EXECUTED"
          [ "$EXECUTED" = "2" ] || { echo "::error::selection guard failed: expected exactly 2 tests, got '$EXECUTED'"; exit 1; }

          grep -iE "Location local calendar selects per row|testLocationLocalCalendarSelectsPerRow" /tmp/fu-exec.log || { echo "::error::testLocationLocalCalendarSelectsPerRow was not executed"; exit 1; }
          grep -iE "Clinic visit location mismatch fails closed|testClinicVisitLocationMismatchFailsClosed" /tmp/fu-exec.log || { echo "::error::testClinicVisitLocationMismatchFailsClosed was not executed"; exit 1; }
          echo "Selection guard PASSED: exactly 2 intended tests executed."

      - name: Publish diagnostic evidence comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### FollowUpReminderLocationCalendarRedTest Diagnostic Evidence (run ${{ github.run_id }})"
            echo ""
            echo "commit: \`${{ github.sha }}\` — event: \`${{ github.event_name }}\`"
            echo ""
            echo "#### Probe Output"
            echo '```'
            cat /tmp/fu-probe.log 2>/dev/null || echo "(missing)"
            echo '```'
            echo ""
            echo "#### Test Execution Log (head 120 lines)"
            echo '```'
            head -n 120 /tmp/fu-exec.log 2>/dev/null || echo "(missing)"
            echo '```'
            echo ""
            echo "#### Test Summary"
            echo '```'
            tail -n 30 /tmp/fu-exec.log 2>/dev/null || echo "(missing)"
            echo '```'
          } > /tmp/diagnostic-evidence.md
          head -c 60000 /tmp/diagnostic-evidence.md | iconv -f utf-8 -t utf-8 -c > /tmp/diagnostic-evidence.txt
          jq -Rs '{body: .}' /tmp/diagnostic-evidence.txt > /tmp/diagnostic-evidence.json
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            --input /tmp/diagnostic-evidence.json \
            || echo "::warning::could not post commit comment"
