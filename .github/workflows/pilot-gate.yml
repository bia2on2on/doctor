  # ============================================================
  # 4) Responsive smoke — Chromium واقعی × 4 viewport × 4 صفحه
  # ============================================================
  responsive:
    name: Responsive smoke (Chromium ×4 viewport)
    runs-on: ubuntu-latest
    needs: release-artifact
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      WP_DIR: /home/runner/www
      WP_URL: http://localhost:8080
      DB_MAIN: cpms_main
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', extensions: 'mysqli, curl, mbstring, xml', coverage: none }
      - name: Tooling (wp-cli + apache + playwright)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client apache2 libapache2-mod-php php-mysql php-mbstring php-xml php-curl > /tmp/apt.log 2>&1 || { tail -5 /tmp/apt.log; exit 1; }
          curl -sS https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp && sudo chmod +x /usr/local/bin/wp
          (pip install --quiet playwright 2>/dev/null || pip install --quiet --break-system-packages playwright)
          python3 -m playwright install --with-deps chromium > /tmp/pw.log 2>&1 || { tail -10 /tmp/pw.log; exit 1; }
      - name: WP + Plugin از Artifact + داده حداقلی Synthetic
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -proot -e "CREATE DATABASE $DB_MAIN;"
          curl -sS https://wordpress.org/wordpress-6.7.2.tar.gz -o /tmp/wp.tar.gz && tar -xzf /tmp/wp.tar.gz -C /tmp && mv /tmp/wordpress "$WP_DIR"
          cd "$WP_DIR"
          wp config create --dbname="$DB_MAIN" --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --dbprefix=cpmswp_ --skip-salts --allow-root
          wp config shuffle-salts --allow-root
          wp config set WP_DEBUG false --raw --allow-root
          wp core install --url="$WP_URL" --title="Responsive" --admin_user=pilot_admin --admin_password='Pilot-Gate-2026!' --admin_email=a@b.local --skip-email --allow-root
          wp rewrite structure '/%postname%/' --allow-root

          # wp-cli --hard گاهی htaccess نمی‌نویسد؛ قواعد استاندارد WP مستقیم (معادل Save Permalinks)
          cat > "$WP_DIR/.htaccess" <<'HT'
          # BEGIN WordPress
          <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
          RewriteBase /
          RewriteRule ^index\.php$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.php [L]
          </IfModule>
          # END WordPress
          HT
          echo "run_id=${{ github.run_id }} run_head_sha=${{ github.sha }}"
          gh run download "${{ github.run_id }}" -n release-zip -D /tmp/release --repo "$GITHUB_REPOSITORY"
          unzip -q /tmp/release/clinic-practice-management-1.0.0.zip -d "$WP_DIR/wp-content/plugins/"
          wp plugin activate clinic-practice-management --path="$WP_DIR" --allow-root
          wp user create pilot_secretary 'sec@r.local' --user_pass='Pilot-Gate-2026!' --role=cpms_secretary --path="$WP_DIR" --allow-root
          wp user create pilot_doctor 'doc@r.local' --user_pass='Pilot-Gate-2026!' --role=cpms_doctor --path="$WP_DIR" --allow-root
          cat > /tmp/resp-fixture.php <<'PHPEOF'
          <?php
          require getenv('WP_HOME') . '/wp-load.php';
          global $wpdb;
          $db = \ClinicCore\Bootstrap\App::db();
          $now = $db->nowUtcSql();
          $uid = (int) get_user_by('login', 'pilot_doctor')->ID;
          $wpdb->query($wpdb->prepare('INSERT INTO ' . $db->table('cpms_clinicians') . ' (clinic_id, full_name, wp_user_id, is_active, created_at, updated_at) VALUES (1, %s, %d, 1, %s, %s)', 'دکتر ریسپانسیو (Synthetic)', $uid, $now, $now));
          $wpdb->query($wpdb->prepare('INSERT INTO ' . $db->table('cpms_patients') . ' (clinic_id, mrn, first_name, last_name, mobile, status, created_at, updated_at) VALUES (1, %s, %s, %s, %s, %s, %s, %s)', 'SYN-RESP-001', 'بیمار', 'ریسپانسیو (Synthetic)', '09120008888', 'active', $now, $now));
          $pid = (int) $wpdb->insert_id;
          $wpdb->query($wpdb->prepare('INSERT INTO ' . $db->table('cpms_visits') . ' (clinic_id, location_id, clinician_id, patient_id, source, status, visit_date, check_in_at, waiting_since, active, created_at, updated_at) VALUES (1, (SELECT id FROM ' . $db->table('cpms_locations') . ' WHERE clinic_id = 1 AND is_primary = 1 LIMIT 1), 1, %d, %s, %s, %s, %s, %s, 1, %s, %s)', $pid, 'walk_in', 'waiting', gmdate('Y-m-d'), $now, $now, $now, $now));
          echo 'fixture: clinician+patient+waiting visit #' . (int) $wpdb->insert_id . "\n";
          // --- Phase 8 Slice 1: صفحهٔ عمومیِ shortcode برای Responsive smoke ---
          // Clinic/Location/پزشک از ردیف‌های **پایدارِ** خودِ نصب خوانده می‌شوند
          // (derived، نه literal): سطح عمومی به یک Clinicِ صریح پیوند می‌خورد و
          // fixture همان idِ واقعی را به shortcode می‌دهد تا هارنس بتواند
          // «پیوندِ صریح و درست» را روی مرورگرِ واقعی بررسی کند.
          $respClinician = $wpdb->get_row($wpdb->prepare('SELECT id, clinic_id FROM ' . $db->table('cpms_clinicians') . ' WHERE wp_user_id = %d ORDER BY id DESC LIMIT 1', $uid), ARRAY_A);
          if (!is_array($respClinician)) { echo "RESP_FIXTURE_ERROR: synthetic clinician row not found\n"; exit(1); }
          $respClinicianId = (int) $respClinician['id'];
          $respClinicId = (int) $respClinician['clinic_id'];
          $respLocation = $wpdb->get_row($wpdb->prepare('SELECT id, timezone FROM ' . $db->table('cpms_locations') . ' WHERE clinic_id = %d AND is_active = 1 ORDER BY is_primary DESC, id ASC LIMIT 1', $respClinicId), ARRAY_A);
          if (!is_array($respLocation)) { echo "RESP_FIXTURE_ERROR: no active Location for clinic {$respClinicId}\n"; exit(1); }
          $respLocationId = (int) $respLocation['id'];
          $respTzName = (is_string($respLocation['timezone']) && $respLocation['timezone'] !== '') ? $respLocation['timezone'] : 'UTC';
          $respTz = new DateTimeZone($respTzName);
          // برنامهٔ فعالِ پزشک — A1 پنجرهٔ پیش‌فرضِ مرور را فقط از Locationِ
          // دارای برنامهٔ فعالِ همان پزشک می‌سازد؛ بدون این ردیف پاسخ {days:[]}
          // می‌شود و گذارِ وضعیتِ مرور قابل مشاهده نیست.
          $wpdb->query($wpdb->prepare('INSERT INTO ' . $db->table('cpms_schedule') . ' (clinic_id, clinician_id, day_of_week, start_time, end_time, appointment_duration_min, slot_capacity, is_active, location_id, created_at, updated_at) VALUES (%d, %d, %d, %s, %s, %d, %d, 1, %d, %s, %s)', $respClinicId, $respClinicianId, 6, '09:00:00', '13:00:00', 20, 2, $respLocationId, $now, $now));
          // نوبت‌های آزاد — wall-clock محلیِ همان Location (قرارداد ذخیرهٔ
          // slot_date/slot_time)، ۲ و ۳ روز بعد: خارج از min-lead و داخلِ
          // پنجرهٔ پیش‌فرضِ A1. دو روز ⇒ گریدِ روزها هم exercised می‌شود.
          $respSlotCount = 0;
          foreach ([[2, '10:00:00'], [2, '10:20:00'], [3, '09:30:00']] as $respSpec) {
            $respDate = (new DateTimeImmutable('now', $respTz))->modify('+' . $respSpec[0] . ' days')->format('Y-m-d');
