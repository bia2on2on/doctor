          IDX=$(mysql -h127.0.0.1 -P3306 -uroot -proot -N -e "SELECT DISTINCT index_name FROM information_schema.statistics WHERE table_schema='$DB_MAIN' AND table_name='cpmswp_cpms_idempotency_keys';" | tr '\n' ' ')
