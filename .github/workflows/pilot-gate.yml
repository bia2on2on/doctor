          $user->set_role('cpms_patient');
          $mobile = '0914' . sprintf('%07d', mt_rand(1000000, 9999999));
          $wpdb->query($wpdb->prepare('INSERT INTO ' . $db->table('cpms_patients') . ' (clinic_id, mrn, first_name, last_name, mobile, status, created_at, updated_at) VALUES (%d, %s, %s, %s, %s, %s, %s, %s)', $clinicId, 'SYN-P9S1-' . $uniq, 'بیمار', 'پورتال (Synthetic)', $mobile, 'active', $now, $now));
          $patientId = (int) $wpdb->insert_id;
          $wpdb->query($wpdb->prepare('INSERT INTO ' . $db->table('cpms_patient_user_links') . ' (clinic_id, patient_id, wp_user_id, mobile_at_link, is_primary, linked_at) VALUES (%d, %d, %d, %s, %d, %s)', $clinicId, $patientId, $userId, $mobile, 1, $now));
          $tz = new DateTimeZone('Asia/Tehran');
          $nowTehran = new DateTimeImmutable('now', $tz);
          $soon = $nowTehran->modify('+2 hours');
          // key => [DateTimeImmutable start, status]
          $specs = [
            'ok390'   => [$nowTehran->modify('+5 days')->setTime(10, 0), 'confirmed'],
            'ok1366'  => [$nowTehran->modify('+6 days')->setTime(10, 20), 'confirmed'],
            'fail'    => [$soon->setTime((int) $soon->format('G'), (int) $soon->format('i') - ((int) $soon->format('i') % 20)), 'confirmed'],
            'pending' => [$nowTehran->modify('+7 days')->setTime(10, 40), 'pending'],
            'history' => [$nowTehran->modify('-3 days')->setTime(9, 0), 'cancelled_by_patient'],
          ];
          $ids = [];
          foreach ($specs as $key => [$start, $status]) {
            $date = $start->format('Y-m-d');
            $time = $start->format('H:i:s');
            $end = $start->modify('+20 minutes')->format('H:i:s');
            $isCancelled = str_starts_with($status, 'cancelled_');
            $wpdb->query($wpdb->prepare('INSERT INTO ' . $db->table('cpms_schedule_slots') . ' (clinic_id, location_id, clinician_id, slot_date, slot_time, duration_min, capacity, booked_count, held_count, is_open, generated_from, created_at, updated_at) VALUES (%d, %d, %d, %s, %s, %d, %d, %d, 0, 1, %s, %s, %s)', $clinicId, $locationId, $clinicianId, $date, $time, 20, 1, $isCancelled ? 0 : 1, 'manual', $now, $now));
            $slotId = (int) $wpdb->insert_id;
            if ($slotId <= 0) { echo "PORTAL_FIXTURE_ERROR: slot {$key} insert failed: {$wpdb->last_error}\n"; exit(1); }
            $ref = 'P9S1' . strtoupper(substr($uniq, 0, 4)) . strtoupper(substr($key, 0, 2)) . strtoupper(substr(bin2hex(random_bytes(3)), 0, 6));
            $okIns = $wpdb->query($wpdb->prepare('INSERT INTO ' . $db->table('cpms_appointments') . ' (clinic_id, location_id, reference_code, patient_id, clinician_id, slot_id, wp_user_id, slot_date, slot_time, duration_min, slot_end_time, status, is_walkin_express, confirmed_at, cancelled_at, created_at, updated_at) VALUES (%d, %d, %s, %d, %d, %d, %d, %s, %s, %d, %s, %s, 0, %s, ' . ($isCancelled ? '%s' : 'NULL') . ', %s, %s)', ...array_merge([$clinicId, $locationId, $ref, $patientId, $clinicianId, $slotId, $userId, $date, $time, 20, $end, $status, $now], $isCancelled ? [$now] : [], [$now, $now])));
            if ($okIns === false) { echo "PORTAL_FIXTURE_ERROR: appointment {$key} insert failed: {$wpdb->last_error}\n"; exit(1); }
            $ids[$key] = (int) $wpdb->insert_id;
          }
          // Verify the portal data path sees exactly these five rows for this user (listMine — ownership via link).
          $rows = \ClinicCore\Bootstrap\App::bookingService()->listMine((int) $userId, gmdate('Y-m-d', strtotime('-365 days')), gmdate('Y-m-d', strtotime('+180 days')));
          $seen = array_map(fn($r) => (int) $r['id'], $rows);
          sort($seen);
          $expected = array_values($ids);
          sort($expected);
          if ($seen !== $expected) { echo 'PORTAL_FIXTURE_ERROR: listMine mismatch seen=' . implode(',', $seen) . ' expected=' . implode(',', $expected) . "\n"; exit(1); }
          echo 'fixture: portal-cancel clinic=' . $clinicId . ' clinician=' . $clinicianId . ' location=' . $locationId . ' patient=' . $patientId . ' user=' . $login . ' ok390=' . $ids['ok390'] . ' ok1366=' . $ids['ok1366'] . ' fail=' . $ids['fail'] . ' pending=' . $ids['pending'] . ' history=' . $ids['history'] . "\n";
          file_put_contents('/tmp/portal-cancel.env', 'PORTAL_CANCEL=' . $login . '|' . $pass . '|' . $clinicId . '|' . $patientId . '|' . $ids['ok390'] . '|' . $ids['ok1366'] . '|' . $ids['fail'] . '|' . $ids['pending'] . '|' . $ids['history'] . "\n");
          PHPEOF
          WP_HOME="$WP_DIR" php /tmp/portal-cancel-fixture.php 2>&1 | tee /tmp/portal-cancel-fixture.log
          test "${PIPESTATUS[0]}" -eq 0
          test -s /tmp/portal-cancel.env
          cat /tmp/portal-cancel.env >> "$GITHUB_ENV"
          # فقط شناسه‌ها (بدون رمز) در لاگ
          cut -d'|' -f1,3- /tmp/portal-cancel.env
      - name: Apache up
        run: |
          sudo tee /etc/apache2/sites-available/pilot.conf >/dev/null <<CONF
          <VirtualHost *:8080>
            DocumentRoot $WP_DIR
            <Directory $WP_DIR>
              AllowOverride All
              Require all granted
            </Directory>
          </VirtualHost>
          CONF
          sudo sed -i 's/^Listen 80$/Listen 8080/' /etc/apache2/ports.conf
          sudo a2dissite 000-default >/dev/null; sudo a2ensite pilot >/dev/null
          sudo a2enmod rewrite >/dev/null
          sudo chmod a+rx /home/runner
          sudo chmod -R a+rX "$WP_DIR"
          sudo apache2ctl configtest && sudo service apache2 start && sleep 2
          ls -la "$WP_DIR/.htaccess" 2>&1 || true
          apache2ctl -M 2>/dev/null | grep rewrite || sudo apache2ctl -M 2>&1 | grep rewrite || echo 'NO REWRITE MODULE'
          curl -s -o /dev/null -w 'pretty: %{http_code}\n' "$WP_URL/wp-json/"
          curl -s -o /dev/null -w 'rest_route: %{http_code}\n' "$WP_URL/?rest_route=/"
          curl -s -o /dev/null -w '%{http_code}\n' "$WP_URL/wp-json/" | grep -q 200
      - name: Responsive smoke (4 viewport × 4 صفحه — بدون overflow افقی)
        env:
          BASE: http://localhost:8080
          RESP_PASS: 'Pilot-Gate-2026!'
          RESP_DOCTOR_PASS: 'Pilot-Gate-2026!'
        run: |
          python3 bin/pilot-responsive.py | tee /tmp/resp.log
          {
            echo '## Responsive Smoke (Chromium واقعی — NFR-UI-3/5)'
            echo '```'
            grep -E '^(PASS|FAIL)' /tmp/resp.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Phase 8 Slice 2 — سفرِ کاملِ بیمار روی مرورگرِ واقعی (scoping از انتخاب).
      # OTP از مسیرِ فقط-تست (پتچِ code_hash در DB با همان الگوی Integration)
      # خوانده می‌شود؛ service واقعیِ OtpService بدون bypass. شواهد فقط
      # boolean/شناسه/تعداد-transition هستند — OTP/موبایل/نام/cookie/nonce
      # هرگز در لاگ print نمی‌شوند.
      - name: Slice-2 OTP journey — سفرِ کامل بیمار در مرورگر واقعی
        env:
          BASE: http://localhost:8080
        run: |
          python3 -m py_compile bin/pilot-otp-journey.py
          python3 bin/pilot-otp-journey.py | tee /tmp/journey.log
          # gate fail-closed: tee هرگز کد خطای سفر را نمی‌بلعد
          test "${PIPESTATUS[0]}" -eq 0

      # Phase 8 Slice 3 — N>1 Chooser: اثباتِ مرورگرِ واقعی در دو viewport
      # (390×844 و 1366×768) روی Clinicِ سومِ Synthetic با دو بیمارِ فعالِ هم‌پیوند
      # و سه decoy (unlinked/inactive/cross). ۱) anon بی‌chooser، ۲) auth دقیقاً
      # A/B بدون decoy، ۳) select B با aria-pressed، ۴) B1 patient_id=B روی نگهداشتِ
      # واقعی، ۵) B2 Appointment patient_id=B بدون ایجاد بیمار/پیوندِ تازه، ۶) بدون
      # overflow/console/failed. شواهد فقط boolean/تعداد/شناسه‌های غیرحساس.
      - name: Slice-3 N>1 chooser — اثبات مرورگر واقعی (390×844 + 1366×768)
        env:
          BASE: http://localhost:8080
        run: |
          python3 -m py_compile bin/pilot-slice3-chooser.py
          python3 bin/pilot-slice3-chooser.py | tee /tmp/slice3.log
          test "${PIPESTATUS[0]}" -eq 0

      # Phase 9 Slice 1 — پورتال بیمار: لغو نوبت توسط خود بیمار روی مرورگر واقعی
      # (390×844 + 1366×768) از طریق همان B4 موجود. ۱) ورود + رندرِ احرازشده: config
      # فقط rest_root/cancel_path/nonce، کنترل فقط روی ردیف‌های confirmed؛ ۲) کیبورد:
      # Enter ⇒ دیالوگ تأیید، Escape ⇒ بدون درخواست؛ ۳) مسیرِ خطا: 409 سیاستِ مهلت ⇒
      # alert فارسی + کنترل در حین درخواست disabled/aria-busy و بعد دوباره فعال؛
      # ۴) مسیرِ موفق: 200 ⇒ reload ⇒ ردیف در تاریخچه، DB=cancelled_by_patient،
      # ظرفیت آزاد، Audit؛ ۵) بدون overflow/console/failed. شواهد فقط boolean/شناسه.
      - name: Slice-1 portal self-cancel — اثبات مرورگر واقعی (390×844 + 1366×768)
        env:
          BASE: http://localhost:8080
        run: |
          python3 -m py_compile bin/pilot-slice-portal-cancel.py
          python3 bin/pilot-slice-portal-cancel.py | tee /tmp/portal-cancel.log
          test "${PIPESTATUS[0]}" -eq 0

      # خلاصهٔ Responsive باید از sandbox هم قابل بازیابی باشد: لاگِ job به blob
      # ریدایرکت می‌شود و دانلودشدنی نیست و `$GITHUB_STEP_SUMMARY` هم از API
      # خوانده نمی‌شود. پس همان خلاصهٔ PASS/FAIL (که برای صفحهٔ عمومیِ shortcode
      # شامل A1/تعداد روز/تعداد نوبت/گذارِ وضعیت/A4 است) به PR post می‌شود.
      # کاملاً الحاقی و `always()` — هیچ معیار یا آستانهٔ گیتی تغییر نکرد.
      - name: Post responsive evidence to PR (لاگ Blob از Sandbox در دسترس نیست)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Responsive smoke evidence (run ${{ github.run_id }}, job ${GITHUB_JOB}, sha ${{ github.sha }})"
            echo '```'
            echo '--- fixture: anonymous public booking page ---'
            cat /tmp/resp-public-page.env 2>/dev/null || echo '(RESP_PUBLIC_PAGE not produced — anonymous surface NOT exercised)'
            echo '--- PASS/FAIL summary (per viewport) ---'
            grep -E '^(PASS|FAIL)' /tmp/resp.log 2>/dev/null || echo '(resp.log missing)'
            echo '--- INFO (cross-origin / advisory) ---'
            grep -E '^INFO' /tmp/resp.log 2>/dev/null || echo '(none)'
            echo '```'
          } > /tmp/resp-evidence.md
          PR=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --body-file /tmp/resp-evidence.md || echo "::notice::PR comment failed (permissions?)"
          else
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/resp-evidence.md || true
          fi

      # همان الگوی evidence channel — sandbox نمی‌تواند blob artifact را دانلود
      # کند، پس خلاصهٔ PASS/FAIL سفر OTP هم (فقط boolean/شناسه/تعداد) به PR
      # post می‌شود. `always()` و صرفاً الحاقی — هیچ معیارِ گیتی تغییر نکرد.
      - name: Post OTP journey evidence to PR (لاگ Blob از Sandbox در دسترس نیست)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Slice-2 OTP journey evidence (run ${{ github.run_id }}, job ${GITHUB_JOB}, sha ${{ github.sha }})"
            echo '```'
            echo '--- fixture: second synthetic clinic + own public booking page ---'
            cat /tmp/otp-journey.env 2>/dev/null || echo '(JOURNEY_PAGE not produced — journey NOT exercised)'
            echo '--- PASS/FAIL summary (per viewport × stage) ---'
            grep -E '^(PASS|FAIL)' /tmp/journey.log 2>/dev/null || echo '(journey.log missing)'
            echo '```'
            echo 'قرارداد شواهد: فقط boolean/شناسه/تعداد — کد OTP، موبایل، نام بیمار(ها)، cookie، nonce و secret در شواهد نشت نکرده‌اند.'
          } > /tmp/journey-evidence.md
          PR=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --body-file /tmp/journey-evidence.md || echo "::notice::PR comment failed (permissions?)"
          else
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/journey-evidence.md || true
          fi

      # Slice 3 — همان کانال شواهد: مرورگر واقعی با Clinicِ سوم و N>1 chooser.
      # sandbox نمی‌تواند blob را دانلود کند، پس خلاصه PASS/FAIL هم به PR پست
      # می‌شود. فقط boolean/تعداد/شناسه — بدون نام/موبایل/nonce/cookie.
      - name: Post Slice-3 chooser evidence to PR (لاگ Blob از Sandbox در دسترس نیست)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Slice-3 N>1 chooser evidence (run ${{ github.run_id }}, job ${GITHUB_JOB}, sha ${{ github.sha }})"
            echo '```'
            echo '--- fixture: third synthetic clinic + N>1 chooser + decoys ---'
            cat /tmp/slice3.env 2>/dev/null || echo '(SLICE3_PAGE not produced — N>1 chooser NOT exercised)'
            echo '--- PASS/FAIL summary (per viewport × stage) ---'
            grep -E '^(PASS|FAIL)' /tmp/slice3.log 2>/dev/null || echo '(slice3.log missing)'
            echo '```'
            echo 'قرارداد شواهد: فقط boolean/تعداد/شناسه‌های غیرحساس — هیچ نام/موبایل/nonce/cookie/secret در شواهد نشت نکرده.'
          } > /tmp/slice3-evidence.md
          PR=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --body-file /tmp/slice3-evidence.md || echo "::notice::PR comment failed (permissions?)"
          else
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/slice3-evidence.md || true
          fi

      # Phase 9 Slice 1 — همان کانال شواهد برای پورتال بیمار (لغو نوبت). فقط
      # boolean/تعداد/شناسه — بدون نام/موبایل/رمز/nonce/cookie.
      - name: Post Slice-1 portal self-cancel evidence to PR (لاگ Blob از Sandbox در دسترس نیست)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Phase 9 Slice 1 — portal self-cancel evidence (run ${{ github.run_id }}, job ${GITHUB_JOB}, sha ${{ github.sha }})"
            echo '```'
            echo '--- fixture: fourth synthetic clinic + pure patient + confirmed/pending/history appointments (ids only) ---'
            cut -d'|' -f1,3- /tmp/portal-cancel.env 2>/dev/null || echo '(PORTAL_CANCEL not produced — portal self-cancel NOT exercised)'
            echo '--- PASS/FAIL summary (per viewport × stage) ---'
            grep -E '^(PASS|FAIL)' /tmp/portal-cancel.log 2>/dev/null || echo '(portal-cancel.log missing)'
            echo '```'
            echo 'قرارداد شواهد: فقط boolean/تعداد/شناسه‌های غیرحساس — هیچ نام/موبایل/رمز/nonce/cookie/secret در شواهد نشت نکرده.'
          } > /tmp/portal-cancel-evidence.md
          PR=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --body-file /tmp/portal-cancel-evidence.md || echo "::notice::PR comment failed (permissions?)"
          else
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/portal-cancel-evidence.md || true
          fi

      - name: Debug dump به PR (لاگ Blob از Sandbox در دسترس نیست)
        if: failure()
        run: |
          {
            echo "### Pilot Gate FAILURE — job: ${GITHUB_JOB} (run ${{ github.run_id }})"
            echo '```'
            for f in /tmp/apt.log /tmp/seed.json /tmp/smoke.log /tmp/bench.txt /tmp/ab.txt /tmp/headers.txt \
                     /tmp/perms.txt /tmp/audit-actions.txt /tmp/jobs-queued.txt /tmp/jobs-success.txt /tmp/failed-jobs.txt \
                     /tmp/tick-1.log /tmp/tick-2.log /tmp/restore.log /tmp/orig-files.txt /tmp/restored-files.txt /tmp/backup-hashes.txt /tmp/backup-counts.txt \
                     /tmp/health.json /tmp/avail.json /tmp/unauth.json /tmp/probe-body.txt \
                     /tmp/leak.txt /tmp/leak2.txt /tmp/cpms-tick.log /tmp/tick-manual.log /tmp/health-check.log /tmp/pw.log /tmp/resp.log /tmp/journey.log /tmp/otp-journey-fixture.log /tmp/slice3.log /tmp/slice3-fixture.log /tmp/portal-cancel.log /tmp/portal-cancel-fixture.log; do
              if [ -f "$f" ]; then echo "--- $f (tail 50) ---"; tail -50 "$f"; fi
            done
            echo '--- apache diagnostics ---'
            sudo apache2ctl configtest 2>&1 | tail -5
            sudo service apache2 status 2>&1 | tail -3
            sudo ss -tlnp 2>/dev/null | grep -E ':(80|8080)\b' || echo '(no listener on 80/8080)'
            sudo tail -15 /var/log/apache2/pilot-error.log 2>/dev/null || sudo tail -15 /var/log/apache2/error.log 2>/dev/null || true
            ls -la /etc/php/*/apache2/php.ini 2>/dev/null || echo '(no mod_php ini!)'
            curl -s -o /dev/null -w 'curl /wp-json/: %{http_code}\n' http://localhost:8080/wp-json/ 2>&1 || true
            curl -s http://localhost:8080/ 2>&1 | head -c 300; echo
            curl -s "http://localhost:8080/?rest_route=/" 2>&1 | head -c 300; echo
            sudo cat /etc/apache2/sites-available/pilot.conf 2>/dev/null || true
            cat "$WP_DIR/.htaccess" 2>/dev/null || echo '(no .htaccess)'
            echo '```'
          } > /tmp/debug.md
          PR=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --body-file /tmp/debug.md || true
          else
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/debug.md || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-screenshots
          path: clinic-practice-management/pilot-screenshots/
          retention-days: 14
          if-no-files-found: ignore
