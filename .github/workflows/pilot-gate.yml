          BROWSER_EXIT="${PIPESTATUS[0]}"
          if [ "${BROWSER_EXIT}" != "0" ]; then
            echo '::error::doctor-portal-browser: Doctor Portal browser acceptance failed; dynamic diagnostics withheld'
          fi
          test "${BROWSER_EXIT}" -eq 0

      # Phase 11 Slice 1 — keep PHP, Apache, and Chromium on the runner's ordinary
      # wall clock. The fixture policy chooses a real future slot on the Location's
      # TODAY and fails closed if the day no longer has the required browser runway;
      # it never changes the day to make the acceptance pass.
      - name: Reception fixture — two Locations + today's booked rows + empty Location
        id: reception_fixture
        run: |
          # Keep the PHP CLI fatal/stack log because WordPress renders a generic error page.
          : > /tmp/reception-php-error.log
          WP_HOME="$WP_DIR" php -d log_errors=1 -d error_log=/tmp/reception-php-error.log tests/fixtures/pilot-reception-fixture.php 2>&1 | tee /tmp/reception-fixture.log
          FIX_EXIT="${PIPESTATUS[0]}"
          if [ "${FIX_EXIT}" != "0" ] || [ ! -s /tmp/reception.env ]; then
            echo '::error::reception-fixture: Reception fixture failed; raw fixture and PHP logs are not posted'
          fi
          test "${FIX_EXIT}" -eq 0
          test -s /tmp/reception.env
          cat /tmp/reception.env >> "$GITHUB_ENV"
          grep -q '^RECEPTION_PUBLIC=' /tmp/reception.env
          echo 'Reception fixture environment loaded; values withheld.'

      - name: Reception Apache/PHP preflight — normal wall clock
        id: reception_preflight
        run: |
          bash tests/bin/reception-http-probe.sh http://localhost:8080 before-browser "$WP_DIR" | tee /tmp/reception-http-before.log

      - name: Staff Portal Reception — real browser (390×844, 768×1024, 1366×768)
        id: reception_browser
        env:
          BASE: http://localhost:8080
        run: |
          python3 -m py_compile bin/pilot-reception.py
          # Deterministic correlation self-test first: it proves the destination
          # slot read is bound to the selected Location/clinician/date (no browser,
          # no WordPress, no acceptance env required) before the live journey runs.
          python3 bin/pilot-reception.py --test
          python3 bin/pilot-reception.py | tee /tmp/reception.log
          BROWSER_EXIT="${PIPESTATUS[0]}"
          if [ "${BROWSER_EXIT}" != "0" ]; then
            echo '::error::reception-browser: Staff Portal Reception browser acceptance failed; dynamic diagnostics withheld'
          fi
          test "${BROWSER_EXIT}" -eq 0

      - name: Reception Apache/PHP postflight — always
        id: reception_postflight
        if: always() && !cancelled()
        run: |
          bash tests/bin/reception-http-probe.sh http://localhost:8080 after-browser "$WP_DIR" | tee /tmp/reception-http-after.log

      - name: Restore Apache wall clock after Reception acceptance
        if: always() && !cancelled()
        run: |
          if [ -s /tmp/reception-apache-envvars.original ]; then
            sudo cp /tmp/reception-apache-envvars.original /etc/apache2/envvars
            sudo service apache2 restart
            echo 'Apache wall clock restored after Reception acceptance.'
          else
            echo 'Reception clock override was not installed; nothing to restore.'
          fi

      # Phase 14 Slice 1 (multi-Clinic repair) — همان Chromium و همان وردپرس. ماژول
      # گزارش‌ها: یک Clinic مجاز (خودکار) / دو Clinic مجاز (انتخاب صریح، بدون پیش‌فرض)
      # / انتخابگر جعلی (رد سمت سرور). بدون فریم‌ورک جدید و بدون توقف زمان.
      - name: Phase 14 Reports fixture — two eligible Clinics + one eligible Clinic + foreign Clinic
        run: |
          WP_HOME="$WP_DIR" php tests/fixtures/pilot-reports-fixture.php 2>&1 | tee /tmp/reports-fixture.log
          FIX_EXIT="${PIPESTATUS[0]}"
          if [ "${FIX_EXIT}" != "0" ] || [ ! -s /tmp/reports.env ]; then
