name: Pilot/Staging Readiness Gate

# Pilot Gate — NOT feature development. اثبات آمادگی V1 در محیط واقعی
# (Ubuntu VM + MySQL 8 + Apache + mod_php) طبق docs: user-guide, backup-recovery,
# performance-baseline, threat-model, file-storage.
# هیچ نتیجه‌ای بدون اجرای واقعی ثبت نمی‌شود؛ موارد وابسته به زیرساخت واقعی
# (Domain/TLS/SMS Provider واقعی/سرور مرجع) در گزارش BLOCKED_BY_ENVIRONMENT
# با Runbook ثبت می‌شوند.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 0'
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # PR runs are keyed by PR number; non-PR runs by their full ref. Event names
  # keep pull_request and push evidence in separate cancellation domains.
  # Main refs add the unique run ID so even a pending main run is never replaced.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && format('main-run-{0}', github.run_id) || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref) }}
  # Preserve every main-ref run as post-merge evidence; superseded non-main work may stop.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read
  pull-requests: write

defaults:
  run:
    working-directory: clinic-practice-management

env:
  WP_DIR: /home/runner/www          # نه /tmp — Apache با PrivateTmp=/tmp را نمی‌بیند
  WP_URL: http://localhost:8080
  WP_RESTORE_DIR: /home/runner/www-restore
  DB_MAIN: cpms_main
  DB_RESTORE: cpms_restore
  STORAGE_OUT: /home/runner/clinic-storage
  GH_TOKEN: ${{ github.token }}
  CPMS_PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  # ============================================================
  # 1) Release Artifact — ZIP تمیز + Policy + Manifest
  # ============================================================
  release-artifact:
    name: Release Artifact (build + policy)
    runs-on: ubuntu-latest
    # Measured across 48 completed runs: max 0.5m, median 0.3m. 10m is ~20x the
    # worst observed, which is appropriate because the other three jobs in this
    # workflow all `needs:` this one — a premature timeout here would cancel the
    # downstream release-acceptance evidence rather than fail it.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, mbstring, xml
          coverage: none
          tools: composer:v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # A release artifact must not be published for a schema the demo companion
      # has not declared compatible: the disposable demo is the documented way to
      # evaluate a release, so an undetected mismatch would ship a release nobody
      # can exercise or safely tear down.
      - name: Companion compatibility gate (blocks publication on mismatch)
        # This job's default working directory is the plugin source directory, so
        # a repo-relative `.github/scripts/...` invocation could not be resolved:
        # python exited 2 ("can't open file") and the gate never actually ran.
        working-directory: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail
          python3 --version
          test -f .github/scripts/companion-compat/evaluate.py || {
            echo '::error::companion-compat-gate: compatibility gate script is missing'; exit 2; }
          # `$?` inside `if ! cmd; then` is the status of the NEGATION, i.e. always
          # 0 - so the previous form reported "failed with exit 0" and then
          # `exit 0`, turning a failed gate into a green release gate. The exit
          # status is captured before it is tested.
          set +e
          python3 .github/scripts/companion-compat/evaluate.py --root . --gate compatibility
          GATE_EXIT=$?
          set -e
          if [ "${GATE_EXIT}" -ne 0 ]; then
            echo '::error::companion-compat-gate: compatibility gate failed'
            exit "${GATE_EXIT}"
          fi

      - name: Build release ZIP (whitelist-only)
        run: bash bin/build-release.sh

      - name: Measure inner installable release ZIP (not the outer Actions artifact)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=dist/clinic-practice-management-1.0.0.zip
          test -f "$zip"
          bytes=$(wc -c < "$zip" | tr -d ' ')
          case "$bytes" in
            ''|*[!0-9]*)
              safe_bytes=unavailable
              zip_policy=WARN
              ;;
            *)
              if [ "${#bytes}" -le 10 ]; then
                safe_bytes="$bytes"
                if [ "$bytes" -gt 33554432 ]; then
                  zip_policy=WARN
                else
                  zip_policy=PASS
                fi
              else
                safe_bytes=unavailable
                zip_policy=WARN
              fi
              ;;
          esac
          printf 'pilot-inner-zip: %s bytes=%s\n' "$zip_policy" "$safe_bytes" > /tmp/cpms-inner-zip-evidence.md
          printf 'pilot-inner-zip: %s bytes=%s\n' "$zip_policy" "$safe_bytes" >> "$GITHUB_STEP_SUMMARY"
          bash "$GITHUB_WORKSPACE/.github/scripts/post-pr-evidence.sh" /tmp/cpms-inner-zip-evidence.md "pilot-inner-zip"

      - name: Runtime SDK contract (built ZIP, no network)
        run: python3 tests/bin/release-runtime-contract.py

      - name: Policy — forbidden content scan (اسمبل ZIP)
        run: |
          unzip -Z1 dist/clinic-practice-management-1.0.0.zip > /tmp/ziplist.txt
          if grep -Eqi '\.git|\.env|tests/|phpunit|composer\.(json|lock)|installed\.json|auth\.json|(^|/)credentials$|/(\.cache|cache)/|vendor/(phpstan|php-stubs|yoast|szepeviktor)/|\.log|pilot-(seed|smoke|responsive)' /tmp/ziplist.txt; then
            echo 'FORBIDDEN CONTENT FOUND:' >&2
            grep -Ei '\.git|\.env|tests/|phpunit|composer\.(json|lock)|installed\.json|auth\.json|(^|/)credentials$|/(\.cache|cache)/|vendor/(phpstan|php-stubs|yoast|szepeviktor)/|\.log|pilot-' /tmp/ziplist.txt >&2
            exit 1
          fi
          mkdir -p /tmp/zscan && unzip -qq dist/clinic-practice-management-1.0.0.zip -d /tmp/zscan
          if grep -rniE "(api[_-]?key|secret|password|token)[^a-z0-9]{0,3}(=>|:|=)[\"'][A-Za-z0-9+/]{16,}[\"']" /tmp/zscan --include='*.php' | grep -viE 'placeholder|example|your-'; then
            echo 'POSSIBLE SECRET IN ARTIFACT' >&2
            exit 1
          fi
          echo 'ZIP policy scan: CLEAN'
          raw_manifest_lines=$(wc -l < dist/clinic-practice-management-1.0.0-manifest.txt | tr -d ' ')
          case "$raw_manifest_lines" in
            ''|*[!0-9]*) manifest_files=unavailable ;;
            *)
              if [ "${#raw_manifest_lines}" -le 7 ]; then
                manifest_files="$raw_manifest_lines"
              else
                manifest_files=unavailable
              fi
              ;;
          esac
          printf 'release-artifact-policy: CLEAN manifest_files=%s\n' "$manifest_files" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: clinic-practice-management/dist/
          retention-days: 14

  # ============================================================
  # 2) Staging Gate — fresh install → smoke → perf → backup → restore
  # ============================================================
  staging-gate:
    name: Staging Gate (fresh install → restore drill)
    runs-on: ubuntu-latest
    needs: release-artifact
    # Measured across 48 completed runs: max 14.8m, median 5.3m — the longest
    # job in the repository (fresh WordPress install + full restore drill). 30m
    # is ~2.0x the worst observed. Tightest margin applied in this change
    # alongside Responsive smoke, and stated for the same reason. This job
    # produces release-acceptance evidence; the limit bounds a wedged run and is
    # not a performance budget.
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=20
      mysql-restore:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3307:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, curl, mbstring, xml, zip, gd
          coverage: none

      # Apt package list unchanged (shared action only adds bounded retries and a
      # fail-closed verification). No browser on this job.
      - name: Tooling (wp-cli, mysql-client, apache, ab, bc)
        uses: ./.github/actions/wp-stack-tooling
        with:
          apt-packages: >-
            mysql-client apache2 libapache2-mod-php
            php-mysql php-mbstring php-xml php-curl php-zip php-gd
            apache2-utils bc
          apt-log-dir: /tmp

      - name: Lint gate tools (php -l)
        run: |
          php -l bin/pilot-seed.php
          php -l bin/pilot-smoke.php
          php -l bin/pilot-job-start.php
          bash -n bin/build-release.sh
          # The benchmark step runs on pull_request, main push, schedule, and
          # workflow_dispatch events. The parse/report/privacy self-tests below prove
          # that logic deterministically on every run, regardless of whether `ab`/the server
          # are reachable (no network, no WordPress, no `ab` binary needed).
          python3 -m py_compile bin/pilot-bench-report.py bin/pilot-bench-diagnostics.py bin/pilot-page-overhead.py bin/pilot-job-start.py
          python3 bin/pilot-bench-diagnostics.py --test
          python3 bin/pilot-bench-report.py --test
          python3 bin/pilot-page-overhead.py --test
          python3 bin/pilot-job-start.py --test
          echo 'pilot-bench-selftest: PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: Environment specs (گزارش واقعی محیط)
        run: |
          nproc >/dev/null
          free -h >/dev/null
          php -v >/dev/null
          mysql --version >/dev/null
          apache2 -v >/dev/null
          echo 'staging-environment: READY' >> "$GITHUB_STEP_SUMMARY"

      # ---------- Clean deployment از Release Artifact ----------
      - name: WordPress 7.1.3 + wp-config (production-like)
        run: |
          curl -sS https://wordpress.org/wordpress-7.1.3.tar.gz -o /tmp/wp.tar.gz
          tar -xzf /tmp/wp.tar.gz -C /tmp && mv /tmp/wordpress "$WP_DIR"
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "CREATE DATABASE $DB_MAIN CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          cd "$WP_DIR"
          wp config create --dbname="$DB_MAIN" --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --dbprefix=cpmswp_ --skip-salts --allow-root
          wp config shuffle-salts --allow-root
          wp config set WP_DEBUG false --raw --allow-root
          wp config set WP_DEBUG_LOG false --raw --allow-root
          wp config set WP_DEBUG_DISPLAY false --raw --allow-root
          wp config set DISABLE_WP_CRON true --raw --allow-root
          wp config set DISALLOW_FILE_EDIT true --raw --allow-root
          wp core install --url="$WP_URL" --title="CPMS Pilot Staging" --admin_user=pilot_admin --admin_password='Pilot-Gate-2026!' --admin_email=admin@pilot-staging.local --skip-email --allow-root
          wp rewrite structure '/%postname%/' --allow-root

          # wp-cli --hard گاهی htaccess نمی‌نویسد؛ قواعد استاندارد WP مستقیم (معادل Save Permalinks)
          cat > "$WP_DIR/.htaccess" <<'HT'
          # BEGIN WordPress
          <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
          RewriteBase /
          RewriteRule ^index\.php$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.php [L]
          </IfModule>
          # END WordPress
          HT
          echo 'wp-config (production-like): WP_DEBUG off, salts unique, prefix cpmswp_, DISABLE_WP_CRON (system cron mode), DISALLOW_FILE_EDIT'

      - name: Deploy release ZIP (مثل آپلود واقعی افزونه در wp-admin)
        run: |
          echo "run_id=${{ github.run_id }} run_head_sha=${{ github.sha }}"
          gh run download "${{ github.run_id }}" -n release-zip -D /tmp/release --repo "$GITHUB_REPOSITORY"
          unzip -q /tmp/release/clinic-practice-management-1.0.0.zip -d "$WP_DIR/wp-content/plugins/"
          wp plugin activate clinic-practice-management --path="$WP_DIR" --allow-root
          echo 'deployed from release artifact (نه از checkout)'

      - name: Fresh install — جداول/Schema/Roles/Cron-event
        run: |
          cd "$WP_DIR/wp-content/plugins/clinic-practice-management"
          WP_HOME="$WP_DIR" php bin/cpms status
          echo '--- roles ---'
          wp role list --path="$WP_DIR" --allow-root | grep -E 'cpms_(doctor|secretary|patient)' || { echo 'ROLES MISSING'; exit 1; }
          echo '--- wp-cron event (fallback) ---'
          wp cron event list --path="$WP_DIR" --allow-root | grep 'cpms_jobs_tick' || { echo 'cpms_jobs_tick NOT scheduled'; exit 1; }
          TABLES=$(mysql -h127.0.0.1 -P3306 -uroot -proot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='$DB_MAIN' AND table_name LIKE 'cpmswp_cpms_%';")
          echo "cpms tables: $TABLES"
          [ "$TABLES" -ge 30 ] || { echo "TOO FEW TABLES ($TABLES)"; exit 1; }
          cat > /tmp/check-schema.php <<'PHPEOF'
          <?php
          require getenv('WP_HOME') . '/wp-load.php';
          $v = \ClinicCore\Bootstrap\App::migrations()->currentVersion();
          echo "schema: $v\n";
          exit($v === '2026_10_31_0031' ? 0 : 1);
          PHPEOF
          WP_HOME="$WP_DIR" php /tmp/check-schema.php
          # F10 — نصب تازه: پنجرهٔ فعال‌سازی (fresh، بدون دادهٔ legacy) باید
          # ACTIVATION_PENDING باشد نه ACTIVATION_GRACE/migration (تصمیم کارفرما)
          cat > /tmp/check-f10-fresh.php <<'PHPEOF'
          <?php
          require getenv('WP_HOME') . '/wp-load.php';
          $db = \ClinicCore\Bootstrap\App::db();
          foreach (['cpms_license_install', 'cpms_license_state'] as $t) {
              $row = $db->fetchRow('SELECT 1 FROM ' . $db->table($t) . ' LIMIT 1');
              if ($row === null && $t === 'cpms_license_state') { continue; } // state تا فعال‌سازی خالی است
              if ($row === null) { echo "MISSING ROW: $t\n"; exit(1); }
          }
          $meta = \ClinicCore\Bootstrap\App::licenseService()->statusMeta();
          echo 'license: ' . $meta['status'] . ' (window=' . (string) ($meta['activation_window_type'] ?? 'n/a') . ")\n";
          if ($meta['status'] !== 'activation_pending') { fwrite(STDERR, "expected ACTIVATION_PENDING on fresh install, got " . $meta['status'] . "\n"); exit(1); }
          if (($meta['activation_window_type'] ?? '') !== 'fresh') { fwrite(STDERR, "expected window type fresh\n"); exit(1); }
          echo "F10 fresh-install license window OK (ACTIVATION_PENDING / fresh)\n";
          PHPEOF
          WP_HOME="$WP_DIR" php /tmp/check-f10-fresh.php

      - name: کاربران Pilot + Clinicianها + Storage خارج webroot
        run: |
          wp user create pilot_secretary 'sec@pilot-staging.local' --user_pass='Pilot-Gate-2026!' --role=cpms_secretary --path="$WP_DIR" --allow-root
          wp user create pilot_doctor 'doc@pilot-staging.local' --user_pass='Pilot-Gate-2026!' --role=cpms_doctor --path="$WP_DIR" --allow-root
          cat > /tmp/setup-pilot.php <<'PHPEOF'
          <?php
          require getenv('WP_HOME') . '/wp-load.php';
          global $wpdb;
          $db = \ClinicCore\Bootstrap\App::db();
          $now = $db->nowUtcSql();
          $uid = (int) get_user_by('login', 'pilot_doctor')->ID;
          $wpdb->query($wpdb->prepare(
              'INSERT INTO ' . $db->table('cpms_clinicians') . ' (clinic_id, full_name, wp_user_id, is_active, created_at, updated_at) VALUES (1, %s, %d, 1, %s, %s)',
              'دکتر پایلوت (Synthetic)', $uid, $now, $now));
          $wpdb->query($wpdb->prepare(
              'INSERT INTO ' . $db->table('cpms_clinicians') . ' (clinic_id, full_name, wp_user_id, is_active, created_at, updated_at) VALUES (1, %s, NULL, 1, %s, %s)',
              'دکتر دوم بدون پیوند (Synthetic)', $now, $now));
          \ClinicCore\Bootstrap\App::settings()->set('files.storage_path', getenv('STORAGE_OUT'));
          echo 'clinicians OK (one linked, one NULL); files.storage_path=' . getenv('STORAGE_OUT') . "\n";
          PHPEOF
          mkdir -p "$STORAGE_OUT"
          WP_HOME="$WP_DIR" STORAGE_OUT="$STORAGE_OUT" php /tmp/setup-pilot.php
          sudo chmod -R 777 "$STORAGE_OUT"

      # ---------- Apache (production-like) ----------
      - name: Apache + mod_php + hardening
        run: |
          sudo tee /etc/apache2/sites-available/pilot.conf >/dev/null <<CONF
          <VirtualHost *:8080>
            DocumentRoot $WP_DIR
            <Directory $WP_DIR>
              AllowOverride All
              Require all granted
            </Directory>
            ErrorLog \${APACHE_LOG_DIR}/pilot-error.log
            CustomLog \${APACHE_LOG_DIR}/pilot-access.log combined
          </VirtualHost>
          CONF
          sudo sed -i 's/^Listen 80$/Listen 8080/' /etc/apache2/ports.conf
          sudo a2dissite 000-default >/dev/null && sudo a2ensite pilot >/dev/null
          sudo a2enmod rewrite >/dev/null   # WP pretty permalinks (/wp-json/...)
          sudo sed -i 's/^ServerTokens .*/ServerTokens Prod/' /etc/apache2/conf-available/security.conf
          sudo sed -i 's/^ServerSignature .*/ServerSignature Off/' /etc/apache2/conf-available/security.conf
          # Apache از mod_php اپت (8.3) استفاده می‌کند؛ همه iniهای apache2 را harden می‌کنیم
          for INI in /etc/php/*/apache2/php.ini; do
            sudo sed -i 's/^expose_php = .*/expose_php = Off/' "$INI"
            sudo sed -i 's/^display_errors = .*/display_errors = Off/' "$INI"
          done
          sudo chmod a+rx /home/runner
          sudo chmod -R a+rX "$WP_DIR"
          sudo chown -R www-data:www-data "$WP_DIR/wp-content/uploads" 2>/dev/null || true
          # apache2.service: PrivateTmp=true → DocumentRoot نباید زیر /tmp باشد
          sudo apache2ctl configtest && sudo service apache2 start
          sleep 2
          echo "--- vhost ---"; sudo cat /etc/apache2/sites-available/pilot.conf
          echo "--- htaccess ---"; ls -la "$WP_DIR/.htaccess" "$WP_DIR/index.php" 2>&1
          echo "--- modules ---"; apache2ctl -M 2>/dev/null | grep -E 'rewrite|php' || sudo apache2ctl -M | grep -E 'rewrite|php'
          echo "--- pretty /wp-json/ ---"
          curl -s -o /tmp/root.json -w 'HTTP %{http_code}\n' "$WP_URL/wp-json/"
          head -c 200 /tmp/root.json; echo
          echo "--- plain ?rest_route=/ ---"
          curl -s -o /tmp/rest.json -w 'HTTP %{http_code}\n' "$WP_URL/?rest_route=/"
          head -c 200 /tmp/rest.json; echo
          echo "--- homepage ---"
          curl -s -o /tmp/home.html -w 'HTTP %{http_code}\n' "$WP_URL/"
          if ! grep -q 200 <(curl -s -o /dev/null -w '%{http_code}' "$WP_URL/?rest_route=/"); then
            echo 'WP ITSELF NOT SERVING (rest_route)'; exit 1
          fi
          curl -s -o /dev/null -w '%{http_code}\n' "$WP_URL/wp-json/" | grep -q 200 || { echo 'PRETTY PERMALINKS BROKEN (rewrite)'; exit 1; }

      # ---------- Phase 17 autonomous fast-wake first-start measurement ----------
      # PLACEMENT — harness ordering only; production source is UNTOUCHED:
      #   * runs AFTER the Apache + mod_php step above has PROVEN the site-local HTTP
      #     path is serving (`?rest_route=/` and `/wp-json/` both HTTP 200). The
      #     production fast wake dispatches a WordPress-native non-blocking loopback to
      #     the site's OWN wp-cron.php (site_url() derived); with no listener answering
      #     that loopback, core's own `doing_cron` lock stays behind — wp-cron.php only
      #     clears it when its request actually finishes — and core then legitimately
      #     refuses the NEXT spawn (observed before this fix: spawn refused, wake event
      #     never consumed, 0/100 started, lock still present ~23 s later).
      #   * runs BEFORE the later web-traffic-heavy steps (seeded journeys, smoke
      #     workflows, REST spot checks, benchmark) so unrelated activity cannot hold
      #     core's 60 s spawn lock inside the measurement window.
      #   * NO lock is cleared/reset/overridden, WP_CRON_LOCK_TIMEOUT is untouched, no
      #     retry/polling is added to product code, no daemon/dependency/permission is
      #     added and the queue cadence is unchanged. This is also the FIRST enqueue in
      #     this install, so the natural preconditions are exactly: site serving +
      #     CPMS health reachable through the production HTTP path.
      #   * NO tick is called anywhere in this step (the explicit-tick CONTROL follows
      #     it): the ONLY trigger for these 100 rows is the production fast-wake path
      #     that the ordinary enqueue itself requested. The bounded wait below is
      #     observation only — it neither ticks nor mutates the queue.
      #   * Diagnostics are fixed-key booleans / bounded integers only (never a URL,
      #     filesystem path, token, job id, payload, SQL or free-form error text).
      - name: Phase 17 queue first-start — autonomous fast wake, 100 synthetic jobs
        run: |
          set -euo pipefail
          TEMP_DIR=$(mktemp -d /tmp/cpms-job-start.auto-XXXXXX)
          chmod 700 "$TEMP_DIR"
          trap 'unset CPMS_JOB_START_TOKEN CPMS_JOB_START_RAW_PATH CPMS_JOB_START_MODE; rm -rf "$TEMP_DIR"' EXIT
          # Natural preconditions only (no queue/lock manipulation): the site's own HTTP
          # path must be serving and the production enqueue path's health endpoint must
          # answer through it before any synthetic row is enqueued.
          SITE_HTTP=$(curl -s -o /dev/null -w '%{http_code}' "$WP_URL/?rest_route=/" || true)
          HEALTH_BODY="$TEMP_DIR/health.json"
          HEALTH_HTTP=$(curl -s -o "$HEALTH_BODY" -w '%{http_code}' "$WP_URL/wp-json/clinic/v1/health" || true)
          if [ "$SITE_HTTP" != "200" ] || [ "$HEALTH_HTTP" != "200" ] || ! grep -q '"ok":true' "$HEALTH_BODY"; then
            echo '::error::phase17-autonomous-job-start: autonomous measurement preconditions not met'; exit 1
          fi
          # Bounded, READ-ONLY wait for WordPress's own cron spawn lock to lapse
          # naturally. A previous legitimate spawn can hold core's `doing_cron` lock for
          # up to WP_CRON_LOCK_TIMEOUT (60 s), and while it is held core correctly refuses
          # the next spawn — exactly the failure this measurement hit before. The lock is
          # only observed here: it is never cleared, deleted, reset, overridden, replaced
          # or shortened, no tick is called, and the wait is bounded.
          LOCK_WAIT_START=$(date +%s)
          LOCK_PRESENT=1
          while [ $(( $(date +%s) - LOCK_WAIT_START )) -lt 75 ]; do
            LOCK_PRESENT=$(WP_HOME="$WP_DIR" php bin/pilot-job-start.php lock-state 2>/dev/null | tail -1 || echo 1)
            [ "$LOCK_PRESENT" = "0" ] && break
            sleep 5
          done
          export CPMS_JOB_START_MODE=autonomous
          export CPMS_JOB_START_TOKEN="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          export CPMS_JOB_START_RAW_PATH="$TEMP_DIR/raw.json"
          if ! WP_HOME="$WP_DIR" php bin/pilot-job-start.php enqueue >"$TEMP_DIR/enqueue.log" 2>&1; then
            echo '::error::phase17-autonomous-job-start: synthetic job enqueue refused by fail-closed preconditions'; exit 1
          fi
          if ! WP_HOME="$WP_DIR" php bin/pilot-job-start.php collect >"$TEMP_DIR/collect.log" 2>&1; then
            echo '::warning::phase17-autonomous-job-start: evidence was NOT adjudicated within the bounded wait; job-start block stays explicit_tick'
            echo 'phase17-autonomous-job-start: NOT_ADJUDICATED fallback=explicit_tick' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! python3 bin/pilot-job-start.py --raw "$TEMP_DIR/raw.json" --out /tmp/cpms-pilot-job-start-autonomous.json; then
            echo '::warning::autonomous first-start aggregate refused (fail closed) — the run-bound job-start block stays explicit_tick'
            echo 'phase17-autonomous-job-start: AGGREGATE_REFUSED fallback=explicit_tick' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'phase17-autonomous-job-start: PASS sample_count=100' >> "$GITHUB_STEP_SUMMARY"


      # ---------- Phase 17 background-job first-start measurement (control) ----------
      # Runs AFTER the autonomous pass and is the EXPLICIT control. Its 100 synthetic rows are
      # enqueued through the same production JobQueue class WITHOUT the advisory JobWake
      # collaborator, so this fixture requests no cpms_jobs_wake event and no loopback spawn.
      # Before the tick the step waits (bounded, read-only) for quiescence: no WordPress cron
      # spawn in flight (doing_cron absent) and the production tick lock free. Immediately
      # before the tick it re-checks that all 100 rows are still queued and unstarted. The
      # production CLI tick then runs once (bounded, output captured). Publication requires
      # the captured output to be the exact `Processed N job(s)` form, N to cover the batch's
      # successful rows, and every row to be started with a terminal outcome. A skipped-lock
      # result is NEVER success. Every refusal writes fixed-key diagnostics (booleans, bounded
      # integers, fixed reason codes) to the step summary: no URL, path, token, job id,
      # payload, SQL or raw CLI text. Quiescence + the precheck narrow the window to the
      # production lock; they are not a hermetic exclusivity proof.
      # runTick() processes the GLOBAL due queue; only the 100 token-correlated rows are
      # aggregated. Do not interpret the tick as isolated to the 100 samples.
      # The System Cron step below starts the daemon and performs its manual tick first;
      # keep this controlled observation ahead of it and label it explicit_tick only.
      # The Pilot PHP producer runs from this checkout (not the whitelist-only Release ZIP);
      # the actual tick command below comes from the deployed Release ZIP.
      - name: Phase 17 queue first-start — explicit tick, 100 synthetic jobs (control)
        run: |
          set -euo pipefail
          PLUGIN_DIR="$WP_DIR/wp-content/plugins/clinic-practice-management"
          TEMP_DIR=$(mktemp -d /tmp/cpms-job-start.XXXXXX)
          chmod 700 "$TEMP_DIR"
          trap 'unset CPMS_JOB_START_TOKEN CPMS_JOB_START_RAW_PATH CPMS_JOB_START_MODE; rm -rf "$TEMP_DIR"' EXIT
          export CPMS_JOB_START_MODE=explicit_tick
          export CPMS_JOB_START_TOKEN="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          export CPMS_JOB_START_RAW_PATH="$TEMP_DIR/raw.json"
          QUIET_STATE=not_probed
          ENQ_STATE=not_run
          PRECHECK_STATE=not_run
          TICK_STATE=not_run
          COLLECT_STATE=not_run
          AGG_STATE=not_run

          # Fixed-key refusal: the summary and the annotation carry only fixed tokens.
          control_fail() {
            case "${1:-}" in
              quiescence_not_reached) refusal=quiescence_not_reached ;;
              enqueue_refused) refusal=enqueue_refused ;;
              precheck_refused) refusal=precheck_refused ;;
              collect_refused) refusal=collect_refused ;;
              aggregate_refused) refusal=aggregate_refused ;;
              *) refusal=unknown_refusal ;;
            esac
            printf 'phase17-explicit-tick-control: FAIL refusal=%s quiescence=%s enqueue=%s precheck=%s tick=%s collect=%s aggregate=%s\n' \
              "$refusal" "$QUIET_STATE" "$ENQ_STATE" "$PRECHECK_STATE" "$TICK_STATE" "$COLLECT_STATE" "$AGG_STATE" >> "$GITHUB_STEP_SUMMARY"
            echo '::error::phase17-explicit-tick-control: explicit-tick control refused; fixed-key status is in the step summary'
            exit 1
          }

          # 1) Bounded, read-only quiescence wait. The 2 s pause only paces the probe; the
          #    quiescence condition itself is the synchronization mechanism.
          Q_START=$(date +%s)
          until WP_HOME="$WP_DIR" php bin/pilot-job-start.php quiet >"$TEMP_DIR/quiet.log" 2>&1; do
            QUIET_STATE=refused
            if [ $(( $(date +%s) - Q_START )) -ge 75 ]; then
              control_fail quiescence_not_reached
            fi
            sleep 2
          done
          QUIET_STATE=ok

          # 2) Explicit fixture: production enqueue WITHOUT the advisory wake collaborator.
          if ! WP_HOME="$WP_DIR" php bin/pilot-job-start.php enqueue >"$TEMP_DIR/enqueue.log" 2>&1; then
            ENQ_STATE=refused
            control_fail enqueue_refused
          fi
          ENQ_STATE=ok

          # 3) Immediately before the tick: all 100 rows still queued and unstarted, still quiescent.
          if ! WP_HOME="$WP_DIR" php bin/pilot-job-start.php precheck >"$TEMP_DIR/precheck.log" 2>&1; then
            PRECHECK_STATE=refused
            control_fail precheck_refused
          fi
          PRECHECK_STATE=ok

          # 4) Production CLI tick (App::runTick: GET_LOCK, recurring schedule, claim loop).
          #    Output is captured and bounded. The limit is above the 100-row batch so that
          #    leftovers from an unadjudicated autonomous pass cannot saturate the tick.
          TICK_RC=0
          timeout 120 env WP_HOME="$WP_DIR" php "$PLUGIN_DIR/bin/cpms" jobs tick --limit=500 \
            >"$TEMP_DIR/tick.out" 2>"$TEMP_DIR/tick.err" || TICK_RC=$?
          if [ "$TICK_RC" -eq 0 ]; then
            TICK_STATE=ok
          else
            TICK_STATE=refused
          fi

          # 5) Collect the batch's exact queue state, then aggregate with the captured tick evidence.
          if ! WP_HOME="$WP_DIR" php bin/pilot-job-start.php collect >"$TEMP_DIR/collect.log" 2>&1; then
            COLLECT_STATE=refused
            control_fail collect_refused
          fi
          COLLECT_STATE=ok

          set +e
          python3 bin/pilot-job-start.py --raw "$TEMP_DIR/raw.json" --out /tmp/cpms-pilot-job-start.json \
            --tick-output "$TEMP_DIR/tick.out" --tick-rc "$TICK_RC" \
            >"$TEMP_DIR/aggregate.log" 2>"$TEMP_DIR/aggregate.err"
          AGG_RC=$?
          set -e
          if [ "$AGG_RC" -ne 0 ]; then
            AGG_STATE=refused
            control_fail aggregate_refused
          fi
          AGG_STATE=ok

          echo 'phase17-explicit-tick-control: PASS sample_count=100' >> "$GITHUB_STEP_SUMMARY"

      # ---------- System Cron verification ----------
      - name: System Cron — daemon واقعی + bin/cpms (دستور تولید طبق user-guide)
        run: |
          PHP_BIN=$(which php)
          CRON_OK=1
          (sudo service cron start && sleep 1 && pgrep -x cron >/dev/null) || CRON_OK=0
          if [ "$CRON_OK" = "1" ]; then
            (crontab -l 2>/dev/null; echo "* * * * * WP_HOME=$WP_DIR $PHP_BIN $WP_DIR/wp-content/plugins/clinic-practice-management/bin/cpms jobs tick --limit=20 >> /tmp/cpms-tick.log 2>&1") | crontab -
            echo "crontab installed: $(crontab -l | tail -1)"
          else
            echo '::warning::cron daemon در دسترس نیست — فقط دستور tick دستی verify می‌شود (Production: systemd-timer/crontab طبق user-guide)'
          fi
          # دستور واقعی تولید (همان که crontab اجرا می‌کند) — یک‌بار دستی:
          WP_HOME="$WP_DIR" php "$WP_DIR/wp-content/plugins/clinic-practice-management/bin/cpms" jobs tick --limit=20 2>&1 | tee /tmp/tick-manual.log
          PIPE_STATUS="${PIPESTATUS[0]}"
          echo "manual tick exit: $PIPE_STATUS"
          if [ "$CRON_OK" = "1" ]; then
            sleep 75
            echo '--- syslog cron ---'
            sudo grep -i 'cron' /var/log/syslog 2>/dev/null | tail -5 || true
            echo '--- /tmp/cpms-tick.log (system cron خروجی) ---'
            tail -3 /tmp/cpms-tick.log 2>/dev/null || echo '(empty)'
            if ! grep -q 'Processed' /tmp/cpms-tick.log 2>/dev/null; then
              echo '::warning::crontab نصب شد ولی daemon در runner افیمرال اجرا نکرد — fallback: scheduler loop جدا برای اثبات recurring tick'
              # اثبات اینکه زمان‌بندی دقیقه‌ای، صف را زنده نگه می‌دارد (معادل عملیاتی همان crontab)
              nohup bash -c "for i in 1 2 3; do WP_HOME=$WP_DIR $PHP_BIN $WP_DIR/wp-content/plugins/clinic-practice-management/bin/cpms jobs tick --limit=20 >> /tmp/cpms-tick.log 2>&1; sleep 25; done" >/dev/null 2>&1 &
              sleep 80
              grep -q 'Processed' /tmp/cpms-tick.log 2>/dev/null || { echo 'RECURRING TICK LOOP FAILED'; exit 1; }
              echo 'CRON_MODE=scheduler-loop (runner daemon محدودیت دارد؛ روی سرور واقعی: crontab/systemd-timer طبق user-guide)'
            fi
          fi
          cat > /tmp/check-health.php <<'PHPEOF'
          <?php
          require getenv('WP_HOME') . '/wp-load.php';
          $q = \ClinicCore\Bootstrap\App::queueHealth();
          echo json_encode($q), "\n";
          exit($q['stale'] ? 3 : 0);
          PHPEOF
          WP_HOME="$WP_DIR" php /tmp/check-health.php 2>&1 | tee /tmp/health-check.log
          HP_STATUS="${PIPESTATUS[0]}"
          echo "health exit: $HP_STATUS"

      # ---------- Synthetic Seed ----------
      - name: Synthetic Seed (بدون داده واقعی بیمار)
        run: |
          set -o pipefail
          PILOT_PATIENTS=400 PILOT_DAYS=30 PILOT_SLOTS_PER_DAY=15 wp eval-file bin/pilot-seed.php --path="$WP_DIR" --allow-root 2>&1 | tee /tmp/seed.json
          tail -1 /tmp/seed.json | grep -q '"ok":true' || { echo 'SEED FAILED'; cat /tmp/seed.json; exit 1; }
          set +o pipefail
          echo 'synthetic-seed: PASS' >> "$GITHUB_STEP_SUMMARY"

      # ---------- Background Jobs verification ----------
      - name: Background Jobs — recurring + بدون failed
        run: |
          cd "$WP_DIR/wp-content/plugins/clinic-practice-management"
          # دو Tick پشت‌سرهم: Tick اول recurring را re-enqueue و اجرا می‌کند؛
          # Tick دوم «فقط» اگر زمان‌بندی دوره‌ای زنده باشد دوباره اجرا می‌کند
          # (Regression: bin/cpms قبلاً scheduleRecurringJobs را صدا نمی‌زد)
          set -o pipefail
          WP_HOME="$WP_DIR" php bin/cpms jobs tick --limit=50 2>&1 | tee /tmp/tick-1.log
          WP_HOME="$WP_DIR" php bin/cpms jobs tick --limit=50 2>&1 | tee /tmp/tick-2.log
          N2=$(grep -oE 'Processed [0-9]+' /tmp/tick-2.log | tail -1 | grep -oE '[0-9]+' || echo 0)
          [ "${N2:-0}" -ge 10 ] || { echo "TICK2 processed only ${N2:-0} job(s) — recurring re-schedule broken (10 types expected)"; exit 1; }
          echo '--- failed jobs (expect none) ---'
          WP_HOME="$WP_DIR" php bin/cpms jobs list --status=failed | tee /tmp/failed-jobs.txt
          ! grep -qE '^#[0-9]+' /tmp/failed-jobs.txt || { echo 'FAILED JOBS EXIST'; exit 1; }
          echo '--- queued jobs (dump) ---'
          mysql -h127.0.0.1 -P3306 -uroot -proot -N -e "SELECT CONCAT(type,':',COUNT(*)) FROM ${DB_MAIN}.cpmswp_cpms_jobs WHERE status='queued' GROUP BY type ORDER BY type;" | tee /tmp/jobs-queued.txt
          echo '--- executed recurring jobs (status=success, per type — expect all 10 types) ---'
          mysql -h127.0.0.1 -P3306 -uroot -proot -N -e "SELECT CONCAT(type,':',COUNT(*)) FROM ${DB_MAIN}.cpmswp_cpms_jobs WHERE status='success' GROUP BY type ORDER BY type;" | tee /tmp/jobs-success.txt
          for J in holds.expire slots.generate visits.no_show handwriting.gc notif.dispatch appt.reminder fu.reminder cleanup.otp cleanup.rate_limits cleanup.idem; do
            grep -q "^$J:" /tmp/jobs-success.txt || { echo "$J NEVER RAN"; exit 1; }
          done
          echo 'background-jobs: PASS recurring_types=10 failed_jobs=0' >> "$GITHUB_STEP_SUMMARY"

      # ---------- Protected medical file access ----------
      - name: Protected files — private storage outside webroot + legacy deny (Apache واقعی)
        run: |
          # اصل امنیتی (OD-7): «Private clinical storage must remain outside the
          # effective web/document root.» تا پیش از OD-7 مسیر پیش‌فرض داخل
          # webroot بود و این مرحله فقط ۴۰۳ بودنِ آن را می‌سنجید. آن ادعا منسوخ
          # شده است؛ اینجا خودِ invariant اثبات می‌شود، نه معماری قدیم.
          #
          # A) مسیر پیش‌فرض بیرون از DocumentRoot
          # B) مسیر فعال/مؤثر هم بیرون + فایل واقعی روی آن + بدون نگاشت URL
          # C) اگر مسیر legacy وجود دارد، Apache واقعی باید ۴۰۳ بدهد
          # D) مسیر تحویلِ مجوزدارِ برنامه همچنان کار می‌کند
          # هیچ ادعایی نرم نشده و هیچ شکستی پنهان نمی‌شود (بدون
          # حالت‌های نرم‌کننده مانند continue-on-error یا نادیده‌گرفتن
          # کد خروج، عمداً استفاده نشده‌اند).

          cat > /tmp/protected-files.php <<'PHPEOF'
          <?php
          require getenv('WP_HOME') . '/wp-load.php';

          use ClinicCore\Bootstrap\App;
          use ClinicCore\Infrastructure\Storage\LocalFileStorage;

          global $wpdb;
          $db = App::db();
          $out = static fn (string $k, string $v) => print($k . '=' . $v . "\n");

          // ---- A) مسیر پیش‌فرض ----
          $out('default_path', LocalFileStorage::defaultBasePath());

          // ---- B) مسیر فعال ----
          $storage = App::localFileStorage();
          $out('active_path', $storage->basePath());

          // یک ضمیمهٔ بالینی واقعی از مسیر واقعی برنامه (Synthetic PDF، بدون PHI)
          $doctorId = (int) get_user_by('login', 'pilot_doctor')->ID;
          $patientId = (int) $wpdb->get_var('SELECT id FROM ' . $db->table('cpms_patients') . ' ORDER BY id ASC LIMIT 1');
          if ($patientId <= 0) {
              $out('fatal', 'NO_SYNTHETIC_PATIENT');
              exit(1);
          }
          // Phase 3 Slice 5 — آپلود/استریم کارکنان مجوز Clinic-scoped از
          // عضویت فعال می‌گیرد؛ probe هم همان پیش‌نیازِ واقعی را می‌سازد.
          $gateClinicId = App::scope()->clinicId;
          if (App::membership_service()->membership_for($gateClinicId, $doctorId) === null) {
              App::membership_service()->create_membership($gateClinicId, $doctorId, 'cpms_doctor');
          }
          $tmp = tempnam(sys_get_temp_dir(), 'cpms-protected') . '.pdf';
          file_put_contents($tmp, "%PDF-1.4\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 99 99]>>endobj\nxref\n0 4\ntrailer<</Size 4/Root 1 0 R>>\n%%EOF\n");
          wp_set_current_user($doctorId);
          $meta = App::medicalFileService()->upload($doctorId, [
              'name' => 'protected-gate-probe.pdf',
              'type' => 'application/pdf',
              'size' => (int) filesize($tmp),
              'tmp_name' => $tmp,
              'error' => 0,
          ], $patientId, null, 'document', 'patient_visible');
          @unlink($tmp);
          $attachmentId = (int) $meta['id'];
          $relative = (string) $wpdb->get_var($wpdb->prepare(
              'SELECT storage_path FROM ' . $db->table('cpms_medical_attachments') . ' WHERE id = %d',
              $attachmentId
          ));
          $absolute = (string) App::localFileStorage()->absolutePath($relative);
          $out('relative_path', $relative);
          $out('absolute_path', $absolute);
          $out('file_exists', is_file($absolute) ? '1' : '0');

          // ---- D) تحویل مجوزدار ----
          wp_set_current_user(0);
          $anon = rest_do_request(new WP_REST_Request('GET', '/clinic/v1/files/' . $attachmentId . '/stream'));
          $out('anon_status', (string) $anon->get_status());

          wp_set_current_user($doctorId);
          $req = new WP_REST_Request('GET', '/clinic/v1/files/' . $attachmentId . '/stream');
          $req->set_header('X-WP-Nonce', wp_create_nonce('wp_rest'));
          ob_start();
          $authz = rest_do_request($req);
          ob_end_clean();
          $out('authz_status', (string) $authz->get_status());
          PHPEOF
          WP_HOME="$WP_DIR" php /tmp/protected-files.php | tee /tmp/protected.txt
          val() { grep -m1 "^$1=" /tmp/protected.txt | cut -d= -f2-; }

          # ---------- A ----------
          DEFAULT_PATH=$(val default_path)
          [ -n "$DEFAULT_PATH" ] || { echo 'DEFAULT PATH NOT REPORTED'; exit 1; }
          case "$DEFAULT_PATH" in
            "$WP_DIR"/*|"$WP_DIR") echo "DEFAULT STORAGE INSIDE WEBROOT: $DEFAULT_PATH"; exit 1;;
            *) echo "A ✓ default storage outside webroot: $DEFAULT_PATH";;
          esac

          # ---------- B ----------
          ACTIVE_PATH=$(val active_path)
          ABS=$(val absolute_path)
          REL=$(val relative_path)
          [ -n "$ACTIVE_PATH" ] && [ -n "$ABS" ] && [ -n "$REL" ] || { echo 'ACTIVE STORAGE NOT REPORTED'; cat /tmp/protected.txt; exit 1; }
          case "$ACTIVE_PATH" in
            "$WP_DIR"/*|"$WP_DIR") echo "ACTIVE STORAGE INSIDE WEBROOT: $ACTIVE_PATH"; exit 1;;
            *) echo "B ✓ active storage outside webroot: $ACTIVE_PATH";;
          esac
          case "$ABS" in
            "$WP_DIR"/*) echo "CLINICAL FILE WRITTEN INSIDE WEBROOT: $ABS"; exit 1;;
          esac
          [ "$(val file_exists)" = "1" ] || { echo "CLINICAL FILE NOT WRITTEN: $ABS"; exit 1; }
          # همان مسیر نسبی زیر webroot نباید با HTTP قابل دریافت باشد.
          for BASE in wp-content/clinic-files wp-content/uploads; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$WP_URL/$BASE/$REL")
            echo "  direct URL /$BASE/$REL → $CODE"
            [ "$CODE" != "200" ] || { echo "PRIVATE CLINICAL FILE SERVED OVER HTTP: /$BASE/$REL"; exit 1; }
          done
          echo 'B ✓ no HTTP mapping to the private clinical file'

          # ---------- C ----------
          # حضور مسیر legacy الزامی نیست؛ نبودنش موفقیت است. ولی اگر هست،
          # باید روی Apache واقعی deny کند و chmod نباید روی مسیر ناموجود
          # مرحله را بشکند.
          LEGACY="$WP_DIR/wp-content/clinic-files"
          if [ -d "$LEGACY" ]; then
            echo "C — legacy dir present, asserting real-Apache deny"
            echo 'LEGACY-PROBE synthetic — NOT PHI' | sudo tee "$LEGACY/legacy-probe.txt" > /dev/null
            sudo chmod -R a+rX "$LEGACY"
            LCODE=$(curl -s -o /tmp/legacy-body.txt -w '%{http_code}' "$WP_URL/wp-content/clinic-files/legacy-probe.txt")
            echo "  legacy direct URL → $LCODE (expect 403)"
            [ "$LCODE" = "403" ] || { echo 'LEGACY HTACCESS GUARD FAILED'; head -c 400 /tmp/legacy-body.txt; exit 1; }
            echo 'C ✓ legacy path still denied by Apache'
          else
            echo 'C ✓ legacy dir absent — nothing clinical inside webroot to guard'
          fi

          # ---------- D ----------
          ANON=$(val anon_status)
          AUTHZ=$(val authz_status)
          echo "  anon_status=$ANON authz_status=$AUTHZ"
          case "$ANON" in
            401|403) echo 'D ✓ unauthenticated stream denied';;
            *) echo "UNAUTHENTICATED STREAM NOT DENIED: $ANON"; exit 1;;
          esac
          [ "$AUTHZ" = "200" ] || { echo "AUTHORIZED STREAM BROKEN: $AUTHZ"; exit 1; }
          echo 'D ✓ application-authorized delivery works'

          if [ -d "$LEGACY" ]; then
            legacy_state=present_denied_403
          else
            legacy_state=absent
          fi
          printf 'protected-files: PASS legacy_dir=%s\n' "$legacy_state" >> "$GITHUB_STEP_SUMMARY"

      # ---------- Smoke workflows (S1..S9) ----------
      - name: Workflow Smokes (Patient/Secretary/Doctor/Handwriting/Reports/SMS/Files/Idempotency)
        id: workflow_smokes
        run: |
          wp eval-file bin/pilot-smoke.php --path="$WP_DIR" --allow-root 2>&1 | tee /tmp/smoke.log
          NPASS=$(grep -c '^PASS' /tmp/smoke.log || true)
          echo "smoke PASS count: $NPASS/9"
          ! grep -q '^FAIL' /tmp/smoke.log || { echo 'SMOKE FAILURES'; exit 1; }
          [ "$NPASS" -ge 9 ] || { echo 'NOT ALL SCENARIOS RAN'; exit 1; }

      # ---------- REST-level spot checks ----------
      - name: REST public endpoints (health + availability + 401 envelope)
        run: |
          curl -s "$WP_URL/wp-json/clinic/v1/health" -o /tmp/health.json -w 'health: HTTP %{http_code}\n'
          head -c 300 /tmp/health.json; echo
          grep -q '"ok":true' /tmp/health.json || { echo 'HEALTH NOT OK'; exit 1; }
          grep -q '"stale":false' /tmp/health.json || { echo 'HEALTH: QUEUE STALE'; exit 1; }
          FROM=$(date -u +%F); TO=$(date -u -d "+29 days" +%F)
          curl -s "$WP_URL/wp-json/clinic/v1/availability?clinician_id=1&from=$FROM&to=$TO" -o /tmp/avail.json -w 'availability: HTTP %{http_code}\n'
          grep -q '"days"' /tmp/avail.json || { echo 'AVAILABILITY SHAPE WRONG'; head -c 300 /tmp/avail.json; exit 1; }
          curl -s "$WP_URL/wp-json/clinic/v1/queue" -o /tmp/unauth.json -w 'unauth: HTTP %{http_code}\n'
          # طبق api-contract.md/error-codes.md: درخواست بدون Nonce همیشه 403 CLINIC_INVALID_NONCE
          # (Guard استاندارد: Nonce → Capability) — envelope ساختاریافته، نه خطای خام/داده
          grep -q 'CLINIC_INVALID_NONCE' /tmp/unauth.json || { echo 'UNAUTH ENVELOPE WRONG'; cat /tmp/unauth.json; exit 1; }
          grep -q '"status":403' /tmp/unauth.json || { echo 'UNAUTH STATUS WRONG'; cat /tmp/unauth.json; exit 1; }
          echo 'REST envelope checks ✓'

      # ---------- Performance benchmark ----------
      # Phase 17 Slice 0 / Slice 0.5 — MEASUREMENT ONLY (collection ≠ NFR adjudication).
      #   • runs on pull_request, main push, weekly schedule, and workflow_dispatch events
      #     — ordinary engineering activity produces run-bound artifacts
      #   • the fixed endpoint set is unchanged: /health, /availability, /wp-json/
      #   • the pre-existing c=10/50/100 warm measurements are preserved verbatim (same URL,
      #     same -n, same two warm-up requests); c=1 is newly added at every endpoint
      #   • a cold phase runs FIRST, right after a web/PHP process-group restart
      #   • correctness failures stay loud (unparsable `ab` output, Non-2xx responses);
      #     NO latency threshold is asserted here — shared-runner latency is not reference-server
      #     evidence. Reference-environment NFR adjudication remains report-pilot-gate.md §12.3
      #   • raw ab dumps are staged outside the artifact upload glob and moved into the upload
      #     path ONLY after the privacy scan passes; a crash/cancel or scan failure cannot leak
      #     unscanned dumps to the `if: always()` artifact upload
      #   • per-run numbers are persisted as an artifact for this exact run/head SHA and are
      #     deliberately never committed into Git history
      #   • additionally (and only for the five binding keys + numeric measurement fields) the
      #     NEXT step posts a validated ALLOWLIST projection of this same run through the existing
      #     evidence-comment pattern, so the numbers are retrievable via GitHub REST without any
      #     artifact/blob access. That projection is not Git history either, and it is generated
      #     by `bin/pilot-bench-report.py --evidence-prefix` from the post-privacy-scan structured
      #     report — never from raw `ab` bytes and never by shell text extraction
      - name: Performance benchmark — ab (cold + warm, c=1/10/50/100) → JSON/MD artifact
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push' }}
        run: |
          FROM=$(date -u +%F); TO=$(date -u -d "+29 days" +%F)
          BENCH=/tmp/cpms-bench
          RAW_STAGE=/tmp/cpms-bench-raw-stage   # staged OUTSIDE the artifact upload path so a crash/cancel before the privacy scan cannot leak unscanned dumps
          RAW="$BENCH/raw"
          DIAG="$BENCH/diagnostics"
          MANIFEST="$BENCH/manifest.jsonl"
          OUT="$BENCH/cpms-pilot-benchmark"
          rm -rf "$BENCH" "$RAW_STAGE"; mkdir -p "$BENCH" "$RAW_STAGE" "$DIAG"
          : > "$MANIFEST"; : > /tmp/bench.txt

          # ---- cold boundary ------------------------------------------------------------
          # Restarting the web/PHP process group is the ONLY cold primitive this harness can
          # actually guarantee: the next request lands on fresh PHP processes with an empty
          # opcode cache. Readiness is awaited at TCP level, because an HTTP probe would itself
          # warm the stack and void the label. The MySQL InnoDB buffer pool and the OS page
          # cache are NOT flushed and are NOT claimed to be cold — "cold" here means
          # process-level cold only, and the artifact states exactly that.
          sudo service apache2 restart
          TCP_READY=0
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/8080) 2>/dev/null; then TCP_READY=1; break; fi
            sleep 1
          done
          [ "$TCP_READY" = "1" ] || { echo '::error::cold boundary broken — Apache did not resume listening on :8080; refusing to label any measurement as cold'; exit 1; }
          echo 'cold boundary: Apache/mod_php restarted, listener back, zero HTTP requests sent since the restart'

          # ---- bounded static Apache/PHP capacity evidence -------------------------------
          STATIC_RC=0
          python3 bin/pilot-bench-diagnostics.py collect-static --out "$DIAG/static.json" || STATIC_RC=$?
          if [ "$STATIC_RC" != "0" ]; then
            echo '::error::DIAGNOSTIC MEASUREMENT FAILURE — Apache MPM/worker-capacity collection failed; benchmark rows may continue but no safe diagnostic evidence will be published'
          else
            echo 'diagnostic static evidence collected: active MPM, mod_php handler, bounded worker-capacity values, runner CPU count'
          fi

          # ---- one measurement = one raw ab dump + one manifest line ---------------------
          SEQ=0
          measure() {
            local PHASE="$1" LABEL="$2" ENDPOINT="$3" ROUTE="$4" QUERY="$5" N="$6" C="$7" WARM="$8"
            local URL="$WP_URL$ROUTE$QUERY" NAME AB_RC=0
            SEQ=$((SEQ + 1))
            NAME=$(printf '%03d-%s-%s' "$SEQ" "$PHASE" "$ENDPOINT")
            if [ "$WARM" -gt 0 ]; then
              for i in $(seq 1 "$WARM"); do curl -s -o /dev/null "$URL"; done  # pre-existing warm-up (opcache + mysql buffer)
            fi
            DIAG_RC=0
            python3 bin/pilot-bench-diagnostics.py measure \
              --seq "$SEQ" --phase "$PHASE" --concurrency "$C" \
              --raw-out "$RAW_STAGE/$NAME.ab.txt" --out "$DIAG/level-$NAME.json" \
              -- ab -q -n "$N" -c "$C" "$URL" || DIAG_RC=$?
            if [ "$DIAG_RC" != "0" ]; then
              echo '::warning::pilot-benchmark: diagnostic measurement failure — raw dump remains in scan-staging; parser distinguishes this from ab/product correctness'
            fi
            # NOTE: do NOT copy or tail the raw dump here (/tmp/ab.txt removed): raw bytes
            # must not leave the scan-staging directory before the privacy scan succeeds.
            # Diagnostics on failure are carried via structured means (::warning lines above
            # with seq/phase/label/c/n/rc, and the post-scan report from pilot-bench-report.py
            # which emits measurement name/phase/concurrency/failure-reason into cpms-pilot-benchmark.{txt,md,json}
            # and /tmp/bench.txt), never via raw-dump tails.
            printf '{"seq":%d,"phase":"%s","label":"%s","endpoint":"%s","path":"%s","concurrency":%d,"requests":%d,"warmup_requests":%d,"raw":"%s.ab.txt"}\n' \
              "$SEQ" "$PHASE" "$LABEL" "$ENDPOINT" "$ROUTE" "$C" "$N" "$WARM" "$NAME" >> "$MANIFEST"
          }

          # ---- cold phase: first traffic after the restart, no warm-up, c=1 ---------------
          measure cold 'GET /health (عمومی)' health '/wp-json/clinic/v1/health' '' 200 1 0
          measure cold 'GET /availability (تقویم — NFR-PERF-1)' availability '/wp-json/clinic/v1/availability' "?clinician_id=1&from=$FROM&to=$TO" 200 1 0
          measure cold 'GET /wp-json/ (مرجع WP core)' wp-json-root '/wp-json/' '' 200 1 0

          # ---- warm phase: the pre-existing measurements, preserved exactly, plus new c=1 --
          measure warm 'GET /health (عمومی)' health '/wp-json/clinic/v1/health' '' 200 1 2
          for C in 10 50 100; do measure warm 'GET /health (عمومی)' health '/wp-json/clinic/v1/health' '' 3000 "$C" 2; done
          measure warm 'GET /availability (تقویم — NFR-PERF-1)' availability '/wp-json/clinic/v1/availability' "?clinician_id=1&from=$FROM&to=$TO" 200 1 2
          for C in 10 50 100; do measure warm 'GET /availability (تقویم — NFR-PERF-1)' availability '/wp-json/clinic/v1/availability' "?clinician_id=1&from=$FROM&to=$TO" 1500 "$C" 2; done
          measure warm 'GET /wp-json/ (مرجع WP core)' wp-json-root '/wp-json/' '' 200 1 2
          measure warm 'GET /wp-json/ (مرجع WP core)' wp-json-root '/wp-json/' '' 1000 50 2

          # ---- request-level profiling pass (Phase 17 comparative profiling) --------------
          # Additive: the 13-row matrix above is unchanged. This pass arms the server-side
          # opt-in profiler (`CPMS_PROFILE=1` via an Apache conf snippet — a disposable-
          # runner-only flag; no request input can arm it), takes N sequential c=1
          # samples per endpoint from the SAME stack, then removes the flag and restores
          # the server. A missing/invalid sample is a PROFILING MEASUREMENT FAILURE
          # (fail closed; distinct from ab/product correctness).
          sudo a2enmod env >/dev/null   # SetEnv needs mod_env (default-on; be explicit, idempotent)
          echo 'SetEnv CPMS_PROFILE 1' | sudo tee /etc/apache2/conf-available/cpms-profile.conf >/dev/null
          sudo a2enconf cpms-profile >/dev/null
          sudo apache2ctl configtest || { echo '::error::profiling boundary broken — cpms-profile conf failed apache configtest'; exit 1; }
          sudo service apache2 restart || { echo '::error::profiling boundary broken — Apache restart failed after enabling CPMS_PROFILE'; exit 1; }
          TCP_READY=0
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/8080) 2>/dev/null; then TCP_READY=1; break; fi
            sleep 1
          done
          [ "$TCP_READY" = "1" ] || { echo '::error::profiling boundary broken — Apache did not resume listening on :8080 after enabling CPMS_PROFILE'; exit 1; }
          # Arm probe: the flag must be LIVE (visible to PHP) before sampling starts —
          # a disarmed pass would collect 200s with no header and fail late at sample 1.
          ARM_PROBE=$(curl -s -D - -o /dev/null "$WP_URL/wp-json/clinic/v1/health" | grep -ci '^x-cpms-profile:' || true)
          echo '::notice::pilot-benchmark: profiling arm probe executed'
          [ "$ARM_PROBE" = "1" ] || { echo '::error::profiling boundary broken — profiler did not arm (SetEnv CPMS_PROFILE not visible to PHP despite configtest+restart)'; exit 1; }
          PROFILE_N=25
          PROFILE_WARM=5
          : > "$RAW_STAGE/profiling.samples.tsv"
          profile_endpoint() {
            # NOTE: one `local` per line — bash expands every word BEFORE any of the
            # assignments take effect, so `local URL="$WP_URL$ROUTE$QUERY"` on the same
            # line as `ROUTE=...` would freeze URL at the bare host (no route/query).
            local ENDPOINT="$1"
            local ROUTE="$2"
            local QUERY="$3"
            local URL="$WP_URL$ROUTE$QUERY"
            local CODE HDR JSON i
            echo '::notice::pilot-benchmark: profiling endpoint sampling started'
            for i in $(seq 1 "$PROFILE_WARM"); do curl -s -o /dev/null "$URL"; done
            for i in $(seq 1 "$PROFILE_N"); do
              HDR=$(mktemp)
              CODE=$(curl -s -D "$HDR" -o /dev/null -w '%{http_code}' "$URL")
              JSON=$(grep -i '^x-cpms-profile:' "$HDR" | tr -d '\r' | sed 's/^[^:]*:[[:space:]]*//' | head -1 || true)
              rm -f "$HDR"
              if [ "$CODE" != "200" ] || [ -z "$JSON" ]; then
                echo '::error::pilot-benchmark: profiling measurement failure (expected HTTP 200 and X-CPMS-Profile header)'
                return 1
              fi
              printf '%s\t%s\t%s\n' "$ENDPOINT" "$CODE" "$JSON" >> "$RAW_STAGE/profiling.samples.tsv"
            done
            echo '::notice::pilot-benchmark: profiling endpoint sampling completed'
          }
          profile_endpoint health '/wp-json/clinic/v1/health' '' || exit 1
          profile_endpoint availability '/wp-json/clinic/v1/availability' "?clinician_id=1&from=$FROM&to=$TO" || exit 1
          profile_endpoint wp-json-root '/wp-json/' '' || exit 1
          printf '{"samples_per_endpoint":%d,"warmup_per_endpoint":%d,"concurrency":1}\n' "$PROFILE_N" "$PROFILE_WARM" > "$RAW_STAGE/profiling.params.json"
          sudo a2disconf cpms-profile >/dev/null
          sudo rm -f /etc/apache2/conf-available/cpms-profile.conf
          sudo service apache2 restart || { echo '::error::profiling teardown broken — Apache restart failed after disabling CPMS_PROFILE'; exit 1; }
          TCP_READY=0
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/8080) 2>/dev/null; then TCP_READY=1; break; fi
            sleep 1
          done
          [ "$TCP_READY" = "1" ] || { echo '::error::profiling teardown broken — Apache did not resume listening on :8080'; exit 1; }
          echo "profiling collected: 3 endpoints x $PROFILE_N sequential samples (c=1, ${PROFILE_WARM} warm-ups discarded each)"

          # ---- public-page CPMS plugin overhead: ACTIVE vs DEACTIVATED -------------
          # Measures what the previous comparative-profiling slice could NOT: the cost
          # of LOADING CPMS itself. `RequestProfiler` lives inside CPMS, so it cannot
          # run while the plugin is deactivated, and NO profiler data is synthesised for
          # that state — the comparison uses an external/request-level timing
          # (client-timed curl) identical in both states. Page = the WordPress front
          # page of this clean install (fixed allowlist token `home`). Query counts are
          # NOT MEASURED. Deactivation is WordPress-native and confined to this
          # disposable instance; reactivation is guaranteed by the collector's
          # finally-block AND by the shell trap below, and is proven before the step
          # continues. The logic lives in `bin/pilot-page-overhead.py` (stdlib only,
          # deterministic `--test` in the lint step) — GitHub caps a `run:` expression
          # at 21,000 characters and an inline shell version of this pass would push
          # the step over that limit.
          OH_MARKER="$BENCH/overhead-marker"
          cpms_overhead_restore() {
            if [ -f "$OH_MARKER" ]; then
              echo '::error::public-page overhead — failure path: forcing CPMS reactivation'
              wp plugin activate clinic-practice-management --path="$WP_DIR" --allow-root \
                || echo '::error::CPMS REACTIVATION FAILED — this environment is NOT safe for later gate steps'
              rm -f "$OH_MARKER"
            fi
          }
          trap cpms_overhead_restore EXIT
          python3 bin/pilot-page-overhead.py collect \
            --out-dir "$RAW_STAGE/overhead" --marker "$OH_MARKER" \
            --page-url "$WP_URL/" --health-url "$WP_URL/wp-json/clinic/v1/health" \
            --wp-path "$WP_DIR" --db "$DB_MAIN" --db-prefix cpmswp_ \
            --samples 100 --warmup 5 || exit 1

          # ---- raw dumps are scanned BEFORE they are moved into the upload path -----------
          # Staged dumps live OUTSIDE the artifact upload glob, so a partial-run crash/cancel
          # or a scan failure cannot leave unscanned material for `if: always()` to upload.
          # Only a clean scan moves them into $RAW (which IS in the upload glob); a scan
          # failure deletes the stage so there is nothing to upload.
          SCAN_RC=0
          python3 bin/pilot-bench-report.py --scan-dir "$RAW_STAGE" || SCAN_RC=$?
          if [ "$SCAN_RC" != "0" ]; then
            echo '::error::raw benchmark dumps contain forbidden content (cookie/authorization/nonce/credential/PHI) — staged dumps deleted, nothing uploaded'
            rm -rf "$RAW_STAGE"
            exit "$SCAN_RC"
          fi
          mkdir -p "$RAW" "$BENCH/profiling" "$BENCH/overhead"
          mv "$RAW_STAGE"/*.ab.txt "$RAW"/ 2>/dev/null || true
          mv "$RAW_STAGE"/profiling.samples.tsv "$RAW_STAGE"/profiling.params.json "$BENCH/profiling"/ 2>/dev/null || true
          mv "$RAW_STAGE"/overhead/page-overhead.samples.tsv "$RAW_STAGE"/overhead/page-overhead.params.json "$BENCH/overhead"/ 2>/dev/null || true
          rm -rf "$RAW_STAGE"   # stage is now empty; remove it so no later step can confuse it with upload content

          # ---- environment + run binding for the artifact ---------------------------------
          PHP_CLI=$(php -v | head -1)
          APACHE_VER=$(apache2 -v | head -1)
          MYSQL_CLIENT=$(mysql --version | head -1)
          MYSQL_SERVER=$(mysql -h 127.0.0.1 -P 3306 -uroot -proot -N -e 'SELECT VERSION();' 2>/dev/null || echo 'not-retrieved')
          WP_VER=$(wp core version --path="$WP_DIR" --allow-root 2>/dev/null || echo 'not-retrieved')
          APACHE_PHP=$(ls /usr/lib/php/ 2>/dev/null | head -1 || true); [ -n "$APACHE_PHP" ] || APACHE_PHP='not-listed'
          OPCACHE_INI=$(ls /etc/php/*/apache2/conf.d/ 2>/dev/null | grep -i opcache | head -1 || true)
          [ -n "$OPCACHE_INI" ] || OPCACHE_INI='no-opcache-ini-under-apache2-confd (runtime state NOT probed — no PHP probe is written into the webroot)'
          DATASET=$(tail -1 /tmp/seed.json 2>/dev/null | tr -d '\n' || echo 'not-retrieved')

          # Job-start block binding for THIS run: prefer the run-bound autonomous
          # evidence when the fast-wake path produced it, otherwise publish the
          # explicit-tick block measured earlier in this same run. The label is always
          # pinned to the file it came from — a forced-tick aggregate can never be
          # relabelled as autonomous (and vice versa).
          JOB_START_FILE=/tmp/cpms-pilot-job-start.json
          JOB_START_MODE=explicit_tick
          if [ -f /tmp/cpms-pilot-job-start-autonomous.json ]; then
            JOB_START_FILE=/tmp/cpms-pilot-job-start-autonomous.json
            JOB_START_MODE=autonomous
          else
            echo '::warning::autonomous fast-start evidence was not produced for this run — the job-start block is published under its explicit_tick label'
          fi

          RC=0
          python3 bin/pilot-bench-report.py \
            --manifest "$MANIFEST" --raw-dir "$RAW" --diagnostics-dir "$DIAG" --profiling-dir "$BENCH/profiling" --overhead-dir "$BENCH/overhead" --job-start "$JOB_START_FILE" --job-start-mode "$JOB_START_MODE" --out-prefix "$OUT" \
            --evidence-prefix "$OUT.evidence" \
            --meta "run_id=${{ github.run_id }}" \
            --meta "run_attempt=${{ github.run_attempt }}" \
            --meta "head_sha=${{ github.sha }}" \
            --meta "workflow=${{ github.workflow }}" \
            --meta "event_name=${{ github.event_name }}" \
            --meta "ref=${{ github.ref_name }}" \
            --meta "runner=$RUNNER_NAME $RUNNER_OS" \
            --meta "php_cli=$PHP_CLI" \
            --meta "apache=$APACHE_VER" \
            --meta "apache_php_dir=$APACHE_PHP" \
            --meta "opcache_ini=$OPCACHE_INI" \
            --meta "mysql_client=$MYSQL_CLIENT" \
            --meta "mysql_server=$MYSQL_SERVER" \
            --meta "wordpress=$WP_VER" \
            --meta "dataset=$DATASET" \
            --meta "cold_definition=first request after an Apache/mod_php restart in this step; TCP-only readiness wait; DB buffer pool and page cache NOT flushed" \
            --meta "warm_definition=pre-existing measurements on the already-served stack, each preceded by the two pre-existing curl warm-ups" \
            --meta "nfr_adjudication=NOT ADJUDICATED HERE — reference-server benchmark required (report-pilot-gate.md §12.3)" \
            || RC=$?
          cat "$OUT.txt" >> /tmp/bench.txt 2>/dev/null || true

          if [ "$RC" = "0" ]; then
            bench_verdict=PASS
          else
            bench_verdict=FAIL
          fi
          printf 'pilot-benchmark-collection: %s\n' "$bench_verdict" >> "$GITHUB_STEP_SUMMARY"

          [ "$RC" = "0" ] || { echo "BENCHMARK CORRECTNESS FAILURE (rc=$RC) — collection/HTTP-correctness only; no latency threshold exists in this step"; exit "$RC"; }
          echo 'benchmark collected: no NFR verdict claimed (adjudication stays with report-pilot-gate.md §12.3)'

      # ---------- REST-visible safe benchmark evidence (allowlist only) ----------
      - name: Post safe benchmark evidence projection (REST-visible, allowlist only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RAW_PROJECTION=/tmp/cpms-bench/cpms-pilot-benchmark.evidence.md
          if [ ! -f "$RAW_PROJECTION" ]; then
            echo '::warning::safe evidence projection not produced (benchmark step did not run or refused it fail-closed) — nothing posted'
            exit 0
          fi
          python3 bin/pilot-bench-report.py --verify-evidence "$RAW_PROJECTION" >/dev/null 2>&1 \
            || { echo '::error::pilot-benchmark: safe evidence projection failed pre-publication re-validation — NOT posted (fail closed)'; exit 1; }
          bench_status=PASS
          printf 'pilot-benchmark: %s\n' "$bench_status" > /tmp/pilot-benchmark-status.md
          bash "$GITHUB_WORKSPACE/.github/scripts/post-pr-evidence.sh" /tmp/pilot-benchmark-status.md "pilot-benchmark"

      - name: Upload benchmark artifact (per-run numbers never enter Git history)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-benchmark-${{ github.run_id }}
          path: |
            /tmp/cpms-bench/cpms-pilot-benchmark.json
            /tmp/cpms-bench/cpms-pilot-benchmark.md
            /tmp/cpms-bench/cpms-pilot-benchmark.txt
            /tmp/cpms-bench/manifest.jsonl
            /tmp/cpms-bench/diagnostics/
            /tmp/cpms-bench/profiling/
            /tmp/cpms-bench/overhead/
            /tmp/cpms-bench/raw/
          retention-days: 14
          if-no-files-found: ignore

      # ---------- Security configuration review ----------
      - name: Security config review (debug/salts/prefix/headers/perms/PHI-leak)
        run: |
          echo '== wp-config =='
          [ "$(wp config get WP_DEBUG --path="$WP_DIR" --allow-root)" = "" ] || [ "$(wp config get WP_DEBUG --path="$WP_DIR" --allow-root)" = "false" ] || { echo 'WP_DEBUG ON'; exit 1; }
          for K in AUTH_KEY SECURE_AUTH_KEY LOGGED_IN_KEY NONCE_KEY AUTH_SALT SECURE_AUTH_SALT LOGGED_IN_SALT NONCE_SALT; do
            V=$(wp config get "$K" --path="$WP_DIR" --allow-root)
            [ -n "$V" ] && [ "$V" != "put your unique phrase here" ] || { echo "SALT $K EMPTY/DEFAULT"; exit 1; }
          done
          PREFIX=$(wp db prefix --path="$WP_DIR" --allow-root)
          echo "table_prefix: $PREFIX"
          [ "$PREFIX" != "wp_" ] || { echo 'DEFAULT PREFIX'; exit 1; }
          [ ! -f "$WP_DIR/wp-content/debug.log" ] || { echo 'debug.log EXISTS'; exit 1; }
          echo 'wp-config hardening ✓ (DEBUG off, salts unique, prefix non-default)'
          echo '== HTTP headers =='
          curl -sI "$WP_URL/wp-json/clinic/v1/health" | tee /tmp/headers.txt
          ! grep -qi 'x-powered-by' /tmp/headers.txt || { echo 'PHP VERSION EXPOSED'; exit 1; }
          echo 'headers: no X-Powered-By ✓ (ServerTokens Prod / expose_php Off)'
          echo '== file permissions =='
          stat -c '%a %n' "$WP_DIR/wp-config.php" "$WP_DIR/wp-content" "$STORAGE_OUT" | tee /tmp/perms.txt
          echo '== PHI leakage scan در لاگهای فایل =='
          sudo grep -rilE 'SYN-SMOKE-001|09120009999|0912000[0-9]{4}|SYNAP-[0-9]+|بیمار آزمایشی' /var/log/apache2/pilot-error.log /tmp/cpms-tick.log "$WP_DIR/wp-content/debug.log" 2>/dev/null > /tmp/leak.txt || true
          [ -s /tmp/leak.txt ] && { echo 'PHI IN LOGS:'; cat /tmp/leak.txt; exit 1; } || echo 'no PHI in error/tick logs ✓'
          sudo grep -E 'SYN-|0912000' /var/log/apache2/pilot-access.log > /tmp/leak2.txt 2>/dev/null || true
          [ -s /tmp/leak2.txt ] && { echo 'PHI IN ACCESS LOG URLS:'; cat /tmp/leak2.txt; exit 1; } || echo 'no PHI in access-log URLs ✓'

      # ---------- Audit verification ----------
      - name: Audit verification (hash chain + رخدادها)
        run: |
          cd "$WP_DIR/wp-content/plugins/clinic-practice-management"
          WP_HOME="$WP_DIR" php bin/cpms audit verify 100000
          mysql -h127.0.0.1 -P3306 -uroot -proot -N -e "SELECT DISTINCT action FROM ${DB_MAIN}.cpmswp_cpms_audit_logs ORDER BY action;" | tr '\n' ' ' | tee /tmp/audit-actions.txt
          echo
          N=$(mysql -h127.0.0.1 -P3306 -uroot -proot -N -e "SELECT COUNT(*) FROM ${DB_MAIN}.cpmswp_cpms_audit_logs;")
          echo "audit rows: $N"
          [ "$N" -gt 20 ] || { echo 'TOO FEW AUDIT ROWS'; exit 1; }
          case "$N" in
            ''|*[!0-9]*) audit_rows=unavailable ;;
            *)
              if [ "${#N}" -le 9 ]; then
                audit_rows="$N"
              else
                audit_rows=unavailable
              fi
              ;;
          esac
          printf 'audit-verification: PASS chain_verify=OK rows=%s\n' "$audit_rows" >> "$GITHUB_STEP_SUMMARY"

      # ---------- Backup creation ----------
      - name: Backup creation (DB + protected storage + checksums)
        run: |
          export MYSQL_PWD=root
          T0=$(date +%s)
          mysqldump -h127.0.0.1 -P3306 -uroot --single-transaction --routines --triggers --no-tablespaces "$DB_MAIN" | gzip > /tmp/backup-db.sql.gz
          T1=$(date +%s)
          # شمارش تک‌تک جداول «لحظه بکاپ» — مرجع Integrity در Restore Drill
          # (main زنده است و Apache/cron می‌توانند بعد از snapshot در آن بنویسند؛
          # معیار درست DR: restore == backup snapshot، نه restore == mainِ الان)
          mysql -h127.0.0.1 -P3306 -uroot -N -e "SELECT table_name FROM information_schema.tables WHERE table_schema='$DB_MAIN' AND table_name LIKE 'cpmswp_%' ORDER BY table_name;" \
            | while read -r T; do
                C=$(mysql -h127.0.0.1 -P3306 -uroot -N -e "SELECT COUNT(*) FROM \`$DB_MAIN\`.\`$T\`;" 2>/dev/null)
                echo "$T $C"
              done > /tmp/backup-counts.txt
          echo "backup-time table counts recorded: $(wc -l < /tmp/backup-counts.txt) tables" 
          tar -czf /tmp/backup-storage.tar.gz -C /home/runner clinic-storage
          cp "$WP_DIR/wp-config.php" /tmp/backup-wp-config.txt
          T2=$(date +%s)
          sha256sum /tmp/backup-db.sql.gz /tmp/backup-storage.tar.gz | tee /tmp/backup-hashes.txt
          echo 'backup-creation: PASS' >> "$GITHUB_STEP_SUMMARY"

      # ---------- Full Restore Drill ----------
      - name: Restore Drill — محیط جداگانه (DB دوم + WP tree دوم) + Integrity
        run: |
          # همه خروجی step به /tmp/restore.log می‌رود (دیاگ در صورت شکست)
          set -o pipefail
          exec > >(tee -i /tmp/restore.log) 2>&1
          export MYSQL_PWD=root
          T0=$(date +%s)
          echo 'PHASE 1: DB restore (mysql دوم @3307)'
          mysql -h 127.0.0.1 -P 3307 -uroot -e "CREATE DATABASE $DB_RESTORE CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          gunzip -c /tmp/backup-db.sql.gz | mysql -h127.0.0.1 -P3307 -uroot "$DB_RESTORE"
          T1=$(date +%s)
          echo 'PHASE 3a (بلافاصله بعد از import — قبل از هر بوت): شمارش جداول (restore vs backup-snapshot)'
          # معیار DR: restore باید == snapshot لحظه بکاپ باشد. این چک باید قبل از
          # بوت WordPress روی محیط restore انجام شود — هر بوت ترنزینتهای عملیاتی
          # (مثل _transient_cpms_migrate_lock = ۲ ردیف) در DB بازیابی‌شده می‌نویسد.
          FAIL=0
          NT=0
          while read -r T A; do
            B=$(mysql -h127.0.0.1 -P3307 -uroot -N -e "SELECT COUNT(*) FROM \`$DB_RESTORE\`.\`$T\`;" 2>/dev/null)
            NT=$((NT+1))
            [ "$A" = "$B" ] || { echo "COUNT MISMATCH $T: backup=$A restore=$B"; FAIL=1; }
          done < /tmp/backup-counts.txt
          [ $FAIL -eq 0 ] && echo "همه $NT جدول: restore == backup snapshot ✓" || exit 1
          T1V=$(date +%s)
          echo "integrity-count: $(bc -l <<< "$T1V - $T1")s"
          echo 'PHASE 2: storage + WP tree دوم + config'
          mkdir -p /home/runner/restore-clinic-storage
          tar -xzf /tmp/backup-storage.tar.gz -C /home/runner/restore-clinic-storage --strip-components=1
          cp -R "$WP_DIR" "$WP_RESTORE_DIR"
          rm -f "$WP_RESTORE_DIR/wp-config.php"
          cd "$WP_RESTORE_DIR"
          wp config create --dbname="$DB_RESTORE" --dbuser=root --dbpass=root --dbhost=127.0.0.1:3307 --dbprefix=cpmswp_ --skip-salts --allow-root
          wp config shuffle-salts --allow-root
          wp config set WP_DEBUG false --raw --allow-root
          wp config set DISABLE_WP_CRON true --raw --allow-root
          sudo chmod -R a+rX "$WP_RESTORE_DIR"
          T2=$(date +%s)
          echo 'PHASE 3: integrity checks (پس از بالا آمدن محیط restore)'
          cat > /tmp/restore-config.php <<'PHPEOF'
          <?php
          require getenv('WP_HOME') . '/wp-load.php';
          \ClinicCore\Bootstrap\App::settings()->set('files.storage_path', '/home/runner/restore-clinic-storage');
          echo 'config restore: files.storage_path=/home/runner/restore-clinic-storage', "\n";
          PHPEOF
          WP_HOME="$WP_RESTORE_DIR" php /tmp/restore-config.php
          # گزارش شفاف: drift main بعد از بکاپ (عملیاتی/منتظره — مرجع Integrity همان snapshot است)
          DIFFNOW=0
          while read -r T A; do
            C=$(mysql -h127.0.0.1 -P3306 -uroot -N -e "SELECT COUNT(*) FROM \`$DB_MAIN\`.\`$T\`;" 2>/dev/null)
            [ "$A" = "$C" ] || { echo "post-backup drift در $T (main الان=$C، backup=$A)"; DIFFNOW=$((DIFFNOW+1)); }
          done < /tmp/backup-counts.txt
          echo "main drift بعد از بکاپ در $DIFFNOW جدول (طبیعی؛ مرجع Integrity همان snapshot است)"
          echo 'PHASE 3b: schema + audit chain روی Restore'
          WP_HOME="$WP_RESTORE_DIR" php "$WP_RESTORE_DIR/wp-content/plugins/clinic-practice-management/bin/cpms" status
          WP_HOME="$WP_RESTORE_DIR" php "$WP_RESTORE_DIR/wp-content/plugins/clinic-practice-management/bin/cpms" audit verify 100000
          echo 'PHASE 3c: فایلهای محافظت‌شده (checksum byte-to-byte)'
          (cd "$STORAGE_OUT" && find . -type f -exec sha256sum {} \; | sort) > /tmp/orig-files.txt
          (cd /home/runner/restore-clinic-storage && find . -type f -exec sha256sum {} \; | sort) > /tmp/restored-files.txt
          diff /tmp/orig-files.txt /tmp/restored-files.txt && echo "storage: $(wc -l < /tmp/orig-files.txt) فایل byte-to-byte یکسان ✓" || exit 1
          echo 'PHASE 3d: نمونه کسب‌وکار'
          cat > /tmp/restore-sample.php <<'PHPEOF'
          <?php
          require getenv('WP_HOME') . '/wp-load.php';
          global $wpdb;
          $db = \ClinicCore\Bootstrap\App::db();
          $checks = [
              'patients' => 'cpms_patients',
              'visits' => 'cpms_visits',
              'invoices' => 'cpms_invoices',
              'payments' => 'cpms_payments',
              'notifications' => 'cpms_notifications',
              'sms_messages' => 'cpms_sms_messages',
              'audit_logs' => 'cpms_audit_logs',
          ];
          foreach ($checks as $label => $t) {
              echo $label . '=' . (int) $wpdb->get_var('SELECT COUNT(*) FROM ' . $db->table($t)) . ' ';
          }
          echo "\n";
          $attach = $wpdb->get_row('SELECT storage_path FROM ' . $db->table('cpms_medical_attachments') . ' LIMIT 1', ARRAY_A);
          if ($attach) {
              $abs = \ClinicCore\Bootstrap\App::localFileStorage()->absolutePath((string) $attach['storage_path']);
              echo 'sample attachment: ' . ($abs && is_file($abs) ? "readable ($abs)" : 'MISSING!') . "\n";
              exit($abs && is_file($abs) ? 0 : 1);
          }
          PHPEOF
          WP_HOME="$WP_RESTORE_DIR" php /tmp/restore-sample.php
          T3=$(date +%s)
          restore_total_s=$((T3 - T0))
          printf 'restore-drill: PASS total_seconds=%s\n' "$restore_total_s" >> "$GITHUB_STEP_SUMMARY"

      - name: جمع‌بندی Gate
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.workflow_smokes.outcome }}
        run: |
          case "${SMOKE_OUTCOME:-}" in
            success) smoke_verdict=PASS ;;
            failure) smoke_verdict=FAIL ;;
            *) smoke_verdict=NOT_RUN ;;
          esac
          printf 'workflow-smokes: %s\n' "$smoke_verdict" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-logs
          path: |
            /tmp/seed.json
            /tmp/smoke.log
            /tmp/bench.txt
            /tmp/headers.txt
            /tmp/perms.txt
            /tmp/backup-hashes.txt
            /tmp/audit-actions.txt
            /tmp/jobs-queued.txt
            /tmp/jobs-success.txt
            /tmp/tick-1.log
            /tmp/tick-2.log
            /tmp/restore.log
            /tmp/orig-files.txt
            /tmp/restored-files.txt
            /tmp/backup-counts.txt
          retention-days: 14
          if-no-files-found: ignore

  # ============================================================
  # 3) Upgrade path — pinned pre-#191 main snapshot → current candidate
  # ============================================================
  upgrade-test:
    name: Upgrade path (pinned pre-#191 source → candidate)
    runs-on: ubuntu-latest
    needs: release-artifact
    # Measured across 48 completed runs: max 1.9m, median 0.9m. 10m is ~5x the
    # worst observed. The upgrade path is a release-acceptance contract and must
    # never be reported as failed merely because it was slow.
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      WP_DIR: /home/runner/www
      WP_URL: http://localhost:8080
      DB_MAIN: cpms_main
      # Immutable first parent of merge commit 8088c455 (PR #191): the
      # immediately preceding main CPMS source for Phase 18 Slice 18-2.
      PREVIOUS_CPMS_REF: 053c1ea3e2f27f1f6def25d487b8916a12bc4fa4
      UPGRADE_FIXTURE_PATH: /tmp/cpms-upgrade-baseline.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', extensions: 'mysqli, curl, mbstring, xml', coverage: none }
      # Apt package list unchanged (`mysql-client` only) + pinned, verified WP-CLI.
      - name: Tooling
        uses: ./.github/actions/wp-stack-tooling
        with:
          apt-packages: mysql-client
          apt-log-dir: /tmp
      - name: WordPress + pinned previous CPMS source
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -proot -e "CREATE DATABASE $DB_MAIN;"
          curl -sS https://wordpress.org/wordpress-7.1.3.tar.gz -o /tmp/wp.tar.gz
          tar -xzf /tmp/wp.tar.gz -C /tmp && mv /tmp/wordpress "$WP_DIR"
          cd "$WP_DIR"
          wp config create --dbname="$DB_MAIN" --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --dbprefix=cpmswp_ --skip-salts --allow-root
          wp config shuffle-salts --allow-root
          wp core install --url="$WP_URL" --title="Upgrade Test" --admin_user=up_admin --admin_password='Up-2026!' --admin_email=up@local.test --skip-email --allow-root

          # Fail closed: never fall back to a mutable origin/main or current code.
          git -C "$GITHUB_WORKSPACE" cat-file -e "${PREVIOUS_CPMS_REF}^{commit}"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse 8088c455c4735eb62413c56b107f1d52d9060ac4^1)" = "$PREVIOUS_CPMS_REF"
          git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$PREVIOUS_CPMS_REF" "${GITHUB_SHA:?}"
          mkdir -p /tmp/upgrade-previous-source "$WP_DIR/wp-content/plugins"
          git -C "$GITHUB_WORKSPACE" archive "$PREVIOUS_CPMS_REF" clinic-practice-management | tar -x -C /tmp/upgrade-previous-source
          mv /tmp/upgrade-previous-source/clinic-practice-management "$WP_DIR/wp-content/plugins/"
          wp plugin activate clinic-practice-management --path="$WP_DIR" --allow-root

          # Seed through the pinned previous app; this is an old-code install,
          # not a downgrade/rollback of current migrations.
          WP_HOME="$WP_DIR" php "$GITHUB_WORKSPACE/clinic-practice-management/tests/bin/upgrade-path-fixture.php" seed
      - name: Replace plugin files and migrate forward without resetting the database
        run: |
          gh run download "${{ github.run_id }}" -n release-zip -D /tmp/release --repo "$GITHUB_REPOSITORY"
          rm -rf "$WP_DIR/wp-content/plugins/clinic-practice-management"
          unzip -q /tmp/release/clinic-practice-management-1.0.0.zip -d "$WP_DIR/wp-content/plugins/"
          cd "$WP_DIR/wp-content/plugins/clinic-practice-management"
          WP_HOME="$WP_DIR" php bin/cpms migrate
          WP_HOME="$WP_DIR" php "$GITHUB_WORKSPACE/clinic-practice-management/tests/bin/upgrade-path-fixture.php" verify
          echo 'UPGRADE PATH OK ✓'
          echo 'upgrade-compatibility: PASS' >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # 4) Responsive smoke — Chromium واقعی × 4 viewport × 4 صفحه
  # ============================================================
  responsive:
    name: Responsive smoke (Chromium ×4 viewport)
    # EXPIRY 2026-12-15: temporary Ubuntu pin, see
    # docs/decisions/2026-11-06-ci-environment-repair.md.
    # This is the lane that asks the shared Playwright action for ALL THREE
    # browsers (chromium firefox webkit). On the ubuntu-latest image that moved
    # to Ubuntu 26.04 it failed closed with "cached browser binaries did not
    # launch on this runner" and then "browsers still do not launch after one
    # bounded dependency provisioning". Two changes address the cause: the
    # browser cache key now includes the runner OS *release*, so a cache written
    # on another Ubuntu release cannot be restored, and the dependency proof
    # now runs for the whole requested browser set before the launch. The pin
    # keeps the lane on the release where the three-browser set was last proven
    # until the new-key/deps evidence is green. Job name and steps unchanged.
    runs-on: ubuntu-24.04
    needs: release-artifact
    # Measured across 48 completed runs: max 12.8m, median 5.3m — the second
    # heaviest job in the repository and the one whose spread is widest (real
    # Chromium, four viewports). 25m is ~2.0x the worst observed. This is the
    # tightest margin applied in this change, so it is stated explicitly: the
    # limit is set above every duration this job has ever recorded, but a future
    # runner-image regression could approach it.
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      WP_DIR: /home/runner/www
      WP_URL: http://localhost:8080
      DB_MAIN: cpms_main
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', extensions: 'mysqli, curl, mbstring, xml', coverage: none }
      # Apt package list unchanged (shared action only adds bounded retries and a
      # fail-closed verification). The responsive smoke keeps ALL THREE browsers:
      # the acceptance contract for this lane is Chromium + Firefox + WebKit, and
      # the browser step below installs exactly that set.
      - name: Tooling (wp-cli + apache + playwright)
        uses: ./.github/actions/wp-stack-tooling
        with:
          apt-packages: >-
            mysql-client apache2 libapache2-mod-php
            php-mysql php-mbstring php-xml php-curl faketime
          apt-log-dir: /tmp

      - name: Playwright chromium + firefox + webkit (pinned + cached)
        uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium firefox webkit
      - name: WP + Plugin از Artifact + داده حداقلی Synthetic
        id: resp_fixture
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -proot -e "CREATE DATABASE $DB_MAIN;"
          curl -sS https://wordpress.org/wordpress-7.1.3.tar.gz -o /tmp/wp.tar.gz && tar -xzf /tmp/wp.tar.gz -C /tmp && mv /tmp/wordpress "$WP_DIR"
          cd "$WP_DIR"
          wp config create --dbname="$DB_MAIN" --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --dbprefix=cpmswp_ --skip-salts --allow-root
          wp config shuffle-salts --allow-root
          wp config set WP_DEBUG false --raw --allow-root
          wp core install --url="$WP_URL" --title="Responsive" --admin_user=pilot_admin --admin_password='Pilot-Gate-2026!' --admin_email=a@b.local --skip-email --allow-root
          wp rewrite structure '/%postname%/' --allow-root

          # wp-cli --hard گاهی htaccess نمی‌نویسد؛ قواعد استاندارد WP مستقیم (معادل Save Permalinks)
          cat > "$WP_DIR/.htaccess" <<'HT'
          # BEGIN WordPress
          <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
          RewriteBase /
          RewriteRule ^index\.php$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.php [L]
          </IfModule>
          # END WordPress
          HT
          echo "run_id=${{ github.run_id }} run_head_sha=${{ github.sha }}"
          gh run download "${{ github.run_id }}" -n release-zip -D /tmp/release --repo "$GITHUB_REPOSITORY"
          unzip -q /tmp/release/clinic-practice-management-1.0.0.zip -d "$WP_DIR/wp-content/plugins/"
          wp plugin activate clinic-practice-management --path="$WP_DIR" --allow-root
          wp user create pilot_secretary 'sec@r.local' --user_pass='Pilot-Gate-2026!' --role=cpms_secretary --path="$WP_DIR" --allow-root
          wp user create pilot_doctor 'doc@r.local' --user_pass='Pilot-Gate-2026!' --role=cpms_doctor --path="$WP_DIR" --allow-root
          cat > /tmp/resp-fixture.php <<'PHPEOF'
          <?php
          require getenv('WP_HOME') . '/wp-load.php';
          global $wpdb;
          $db = \ClinicCore\Bootstrap\App::db();
          $now = $db->nowUtcSql();
          $uid = (int) get_user_by('login', 'pilot_doctor')->ID;
          $wpdb->query($wpdb->prepare('INSERT INTO ' . $db->table('cpms_clinicians') . ' (clinic_id, full_name, wp_user_id, is_active, created_at, updated_at) VALUES (1, %s, %d, 1, %s, %s)', 'دکتر ریسپانسیو (Synthetic)', $uid, $now, $now));
          $wpdb->query($wpdb->prepare('INSERT INTO ' . $db->table('cpms_patients') . ' (clinic_id, mrn, first_name, last_name, mobile, status, created_at, updated_at) VALUES (1, %s, %s, %s, %s, %s, %s, %s)', 'SYN-RESP-001', 'بیمار', 'ریسپانسیو (Synthetic)', '09120008888', 'active', $now, $now));
          $pid = (int) $wpdb->insert_id;
          $wpdb->query($wpdb->prepare('INSERT INTO ' . $db->table('cpms_visits') . ' (clinic_id, location_id, clinician_id, patient_id, source, status, visit_date, check_in_at, waiting_since, active, created_at, updated_at) VALUES (1, (SELECT id FROM ' . $db->table('cpms_locations') . ' WHERE clinic_id = 1 AND is_primary = 1 LIMIT 1), 1, %d, %s, %s, %s, %s, %s, 1, %s, %s)', $pid, 'walk_in', 'waiting', gmdate('Y-m-d'), $now, $now, $now, $now));
          echo "fixture: clinician+patient+waiting visit ready\n";
          // --- Phase 8 Slice 1: صفحهٔ عمومیِ shortcode برای Responsive smoke ---
          // Clinic/Location/پزشک از ردیف‌های **پایدارِ** خودِ نصب خوانده می‌شوند
          // (derived، نه literal): سطح عمومی به یک Clinicِ صریح پیوند می‌خورد و
          // fixture همان idِ واقعی را به shortcode می‌دهد تا هارنس بتواند
          // «پیوندِ صریح و درست» را روی مرورگرِ واقعی بررسی کند.
          $respClinician = $wpdb->get_row($wpdb->prepare('SELECT id, clinic_id FROM ' . $db->table('cpms_clinicians') . ' WHERE wp_user_id = %d ORDER BY id DESC LIMIT 1', $uid), ARRAY_A);
          if (!is_array($respClinician)) { echo "RESP_FIXTURE_ERROR: synthetic clinician row not found\n"; exit(1); }
          $respClinicianId = (int) $respClinician['id'];
          $respClinicId = (int) $respClinician['clinic_id'];
          $respLocation = $wpdb->get_row($wpdb->prepare('SELECT id, timezone FROM ' . $db->table('cpms_locations') . ' WHERE clinic_id = %d AND is_active = 1 ORDER BY is_primary DESC, id ASC LIMIT 1', $respClinicId), ARRAY_A);
          if (!is_array($respLocation)) { echo "RESP_FIXTURE_ERROR: no active Location\n"; exit(1); }
          $respLocationId = (int) $respLocation['id'];
          $respTzName = (is_string($respLocation['timezone']) && $respLocation['timezone'] !== '') ? $respLocation['timezone'] : 'UTC';
          $respTz = new DateTimeZone($respTzName);
          // برنامهٔ فعالِ پزشک — A1 پنجرهٔ پیش‌فرضِ مرور را فقط از Locationِ
          // دارای برنامهٔ فعالِ همان پزشک می‌سازد؛ بدون این ردیف پاسخ {days:[]}
          // می‌شود و گذارِ وضعیتِ مرور قابل مشاهده نیست.
          $wpdb->query($wpdb->prepare('INSERT INTO ' . $db->table('cpms_schedule') . ' (clinic_id, clinician_id, day_of_week, start_time, end_time, appointment_duration_min, slot_capacity, is_active, location_id, created_at, updated_at) VALUES (%d, %d, %d, %s, %s, %d, %d, 1, %d, %s, %s)', $respClinicId, $respClinicianId, 6, '09:00:00', '13:00:00', 20, 2, $respLocationId, $now, $now));
          // نوبت‌های آزاد — wall-clock محلیِ همان Location (قرارداد ذخیرهٔ
          // slot_date/slot_time)، ۲ و ۳ روز بعد: خارج از min-lead و داخلِ
          // پنجرهٔ پیش‌فرضِ A1. دو روز ⇒ گریدِ روزها هم exercised می‌شود.
          $respSlotCount = 0;
          foreach ([[2, '10:00:00'], [2, '10:20:00'], [3, '09:30:00']] as $respSpec) {
            $respDate = (new DateTimeImmutable('now', $respTz))->modify('+' . $respSpec[0] . ' days')->format('Y-m-d');
            $wpdb->query($wpdb->prepare('INSERT INTO ' . $db->table('cpms_schedule_slots') . ' (clinic_id, location_id, clinician_id, slot_date, slot_time, duration_min, capacity, booked_count, held_count, is_open, generated_from, created_at, updated_at) VALUES (%d, %d, %d, %s, %s, %d, %d, 0, 0, 1, %s, %s, %s)', $respClinicId, $respLocationId, $respClinicianId, $respDate, $respSpec[1], 20, 2, 'manual', $now, $now));
            $respSlotCount++;
          }
          // صفحهٔ عمومیِ published با خودِ shortcode — همان مسیری که اپراتور
          // استفاده می‌کند (محتوای Page)، پس انکیوِ شرطیِ head هم exercised
          // می‌شود، نه فقط مسیرِ رندر.
          $respPageId = wp_insert_post(['post_title' => 'Public Booking Responsive Fixture', 'post_name' => 'cpms-public-booking-responsive', 'post_content' => '[cpms_public_booking clinic_id="' . $respClinicId . '"]', 'post_status' => 'publish', 'post_type' => 'page'], true);
          if (is_wp_error($respPageId)) { echo "RESP_FIXTURE_ERROR: booking page seed failed\n"; exit(1); }
          $respPermalink = (string) get_permalink($respPageId);
          echo "fixture: public booking page ready\n";
          // فایلِ env (نه pipeline) — تا خروجِ غیرصفرِ php توسط `tee` پنهان
          // نشود و `bash -e` همان‌جا گیت را متوقف کند.
          file_put_contents('/tmp/resp-public-page.env', 'RESP_PUBLIC_PAGE=' . $respPermalink . '|' . $respClinicId . '|' . $respClinicianId . "\n");
          PHPEOF
          WP_HOME="$WP_DIR" php /tmp/resp-fixture.php
          test -s /tmp/resp-public-page.env
          cat /tmp/resp-public-page.env >> "$GITHUB_ENV"
          echo 'Responsive public-page fixture environment loaded; values withheld.'

      # Phase 8 Slice 2 — Fixtureِ سفرِ OTP: یک Clinicِ دومِ کاملاً Synthetic
      # (id>1، هرگز clinic_id=1 به‌عنوان authority). مسیرِ مرورگرِ واقعی باید
      # Clinicِ چالش/Hold/Patient/Appointment را از انتخابِ واقعیِ کاربر بگیرد؛
      # تک-Clinic بودنِ نصب، defctهایِ tenant را mask می‌کند. دو نوبتِ ظرفیت ۱
      # (یکی برای Viewportِ موبایل، یکی برای لپ‌تاپ) + یک نوبتِ ظرفیت ۲.
      - name: OTP journey fixture — Clinic دوم + صفحهٔ عمومیِ مسیر رزرو
        id: otp_journey_fixture
        run: |
          cat > /tmp/otp-journey-fixture.php <<'PHPEOF'
          <?php
          require getenv('WP_HOME') . '/wp-load.php';
          global $wpdb;
          $db = \ClinicCore\Bootstrap\App::db();
          $now = $db->nowUtcSql();
          $uniq = substr(bin2hex(random_bytes(4)), 0, 8);
          // ADR-0031: هر Clinic حتماً داخل یک Organization واقعی است
          // (clinics.organization_id NOT NULL + FK) — سازمانِ دومِ Synthetic.
          $wpdb->query($wpdb->prepare('INSERT INTO ' . $db->table('cpms_organizations') . ' (name, slug, status, created_at, updated_at) VALUES (%s, %s, %s, %s, %s)', 'سازمان سفر OTP (Synthetic)', 'otp-journey-org-' . $uniq, 'active', $now, $now));
          $orgId = (int) $wpdb->insert_id;
          if ($orgId <= 1) { echo "JOURNEY_FIXTURE_ERROR: organization seed invalid\n"; exit(1); }
          $wpdb->query($wpdb->prepare('INSERT INTO ' . $db->table('cpms_clinics') . ' (name, slug, timezone, organization_id, address, phone, created_at, updated_at) VALUES (%s, %s, %s, %d, NULL, NULL, %s, %s)', 'کلینیک سفر OTP (Synthetic)', 'otp-journey-' . $uniq, 'Asia/Tehran', $orgId, $now, $now));
          $clinicId = (int) $wpdb->insert_id;
          if ($clinicId <= 1) { echo "JOURNEY_FIXTURE_ERROR: clinic seed invalid\n"; exit(1); }
