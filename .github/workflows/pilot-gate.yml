            sudo service apache2 status 2>&1 | tail -3
            sudo ss -tlnp 2>/dev/null | grep -E ':(80|8080)\b' || echo '(no listener on 80/8080)'
            sudo tail -15 /var/log/apache2/pilot-error.log 2>/dev/null || sudo tail -15 /var/log/apache2/error.log 2>/dev/null || true
            ls -la /etc/php/*/apache2/php.ini 2>/dev/null || echo '(no mod_php ini!)'
            curl -s -o /dev/null -w 'curl /wp-json/: %{http_code}\n' http://localhost:8080/wp-json/ 2>&1 || true
            curl -s http://localhost:8080/ 2>&1 | head -c 300; echo
            curl -s "http://localhost:8080/?rest_route=/" 2>&1 | head -c 300; echo
            sudo cat /etc/apache2/sites-available/pilot.conf 2>/dev/null || true
            cat "$WP_DIR/.htaccess" 2>/dev/null || echo '(no .htaccess)'
            echo '```'
          } > /tmp/debug.md
          PR=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number' 2>/dev/null || true)
