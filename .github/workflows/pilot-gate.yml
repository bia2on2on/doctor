      - name: Day-2 Operational Workflows fixture — Subscriber personas + 4 portals
        id: day2_workflows_fixture
        run: |
          WP_HOME="$WP_DIR" php tests/fixtures/pilot-day2-workflows-fixture.php 2>&1 | tee /tmp/day2-workflows-fixture.log
          FIX_EXIT="${PIPESTATUS[0]}"
          if [ "${FIX_EXIT}" != "0" ] || [ ! -s /tmp/day2-workflows.env ]; then
            echo '::error::day2-workflows-fixture: Day-2 Operational Workflows fixture failed; fixture values and raw diagnostics withheld'
          fi
          test "${FIX_EXIT}" -eq 0
          test -s /tmp/day2-workflows.env
          cat /tmp/day2-workflows.env >> "$GITHUB_ENV"
          grep -q '^DAY2_PUBLIC_URL=' /tmp/day2-workflows.env
          echo 'Day-2 Operational Workflows fixture environment loaded; values withheld.'

      - name: Day-2 Operational Workflows — real browser (Patient, Receptionist, Doctor, Accountant + 390/320)
        id: day2_workflows_browser
        env:
          BASE: http://localhost:8080
        run: |
          python3 -m py_compile bin/pilot-day2-workflows.py
          python3 bin/pilot-day2-workflows.py --test
          python3 bin/acceptance-isolation-check.py bin/pilot-day2-workflows.py
          python3 bin/pilot-day2-workflows.py | tee /tmp/day2-workflows-browser.log
          BROWSER_EXIT="${PIPESTATUS[0]}"
          if [ "${BROWSER_EXIT}" != "0" ]; then
            echo '::error::day2-workflows-browser: Day-2 Operational Workflows browser acceptance failed; dynamic diagnostics withheld'
          fi
          test "${BROWSER_EXIT}" -eq 0

      - name: Post responsive evidence to PR (لاگ Blob از Sandbox در دسترس نیست)
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_OUTCOME: ${{ steps.resp_fixture.outcome }}
          CHROMIUM_OUTCOME: ${{ steps.resp_smoke.outcome }}
          NARROW_OUTCOME: ${{ steps.admin_narrow.outcome }}
          COMPAT_OUTCOME: ${{ steps.compat_smoke.outcome }}
        run: |
          case "${FIXTURE_OUTCOME:-}" in
            success) fixture_status=PASS ;;
            failure) fixture_status=FAIL ;;
            *) fixture_status=NOT_RUN ;;
          esac
          case "${CHROMIUM_OUTCOME:-}" in
            success) chromium_status=PASS ;;
            failure) chromium_status=FAIL ;;
            *) chromium_status=NOT_RUN ;;
          esac
          case "${NARROW_OUTCOME:-}" in
            success) narrow_status=PASS ;;
            failure) narrow_status=FAIL ;;
