      # ONE closed-vocabulary line about the Day-2 browser log, published on the
      # run summary. PR #346 closed every dynamic text surface: this adds the
      # diagnostic back in a form that can only ever carry frozen tokens and
      # canonical bounded integers. The raw log stays where it already was (the
      # job log via the pre-existing `tee`, and the artifact set); nothing from
      # it is copied here. Token fields are enumerated to literals by a shell
      # `case`; the two integer fields are copied only inside a digits-only arm,
      # behind a length bound, exactly like the existing `bytes` projection.
      - name: Day-2 Operational Workflows — closed-vocabulary failure projection
        if: always() && !cancelled()
        run: |
          day2_journey="$(python3 bin/pilot-day2-failure-report.py --log /tmp/day2-workflows-browser.log --field journey)"
          case "$day2_journey" in
            journey-A1-public) day2_journey_token=journey-A1-public ;;
            journey-A2-reschedule) day2_journey_token=journey-A2-reschedule ;;
            journey-B-reception) day2_journey_token=journey-B-reception ;;
            journey-C-doctors) day2_journey_token=journey-C-doctors ;;
            journey-D-accountant) day2_journey_token=journey-D-accountant ;;
            *) day2_journey_token=unrecognised ;;
          esac
          day2_stage="$(python3 bin/pilot-day2-failure-report.py --log /tmp/day2-workflows-browser.log --field stage)"
          case "$day2_stage" in
            otp-mobile) day2_stage_token=otp-mobile ;;
            otp-code) day2_stage_token=otp-code ;;
            hold-countdown) day2_stage_token=hold-countdown ;;
            hold-request) day2_stage_token=hold-request ;;
            confirm-btn) day2_stage_token=confirm-btn ;;
            names-form) day2_stage_token=names-form ;;
            receipt) day2_stage_token=receipt ;;
            none) day2_stage_token=none ;;
            *) day2_stage_token=unrecognised ;;
          esac
          day2_http="$(python3 bin/pilot-day2-failure-report.py --log /tmp/day2-workflows-browser.log --field http)"
          case "$day2_http" in
            ''|*[!0-9]*)
              safe_day2_http=unrecognised
              ;;
            *)
              if [ "${#day2_http}" -le 3 ]; then
                safe_day2_http="$day2_http"
              else
                safe_day2_http=unrecognised
              fi
              ;;
          esac
          day2_code="$(python3 bin/pilot-day2-failure-report.py --log /tmp/day2-workflows-browser.log --field code)"
          case "$day2_code" in
            CLINIC_BOOKING_BUSY) day2_code_token=CLINIC_BOOKING_BUSY ;;
            other) day2_code_token=other ;;
            none) day2_code_token=none ;;
            *) day2_code_token=unrecognised ;;
          esac
          day2_read="$(python3 bin/pilot-day2-failure-report.py --log /tmp/day2-workflows-browser.log --field read)"
          case "$day2_read" in
            cancel_appointment) safe_day2_read=cancel_appointment ;;
            clinic) safe_day2_read=clinic ;;
            confirm_hold) safe_day2_read=confirm_hold ;;
            confirm_slot) safe_day2_read=confirm_slot ;;
            location) safe_day2_read=location ;;
            location_active) safe_day2_read=location_active ;;
            location_timezone) safe_day2_read=location_timezone ;;
            no_show_appointment) safe_day2_read=no_show_appointment ;;
            organization) safe_day2_read=organization ;;
            organization_active) safe_day2_read=organization_active ;;
            persisted_slot) safe_day2_read=persisted_slot ;;
            reschedule_appointment) safe_day2_read=reschedule_appointment ;;
            reschedule_first_slot) safe_day2_read=reschedule_first_slot ;;
            reschedule_second_slot) safe_day2_read=reschedule_second_slot ;;
            slot) safe_day2_read=slot ;;
            staff_create_slot) safe_day2_read=staff_create_slot ;;
            none) safe_day2_read=none ;;
            *) safe_day2_read=unrecognised ;;
          esac
          day2_errno="$(python3 bin/pilot-day2-failure-report.py --log /tmp/day2-workflows-browser.log --field errno)"
          case "$day2_errno" in
            ''|*[!0-9]*)
              safe_day2_errno=unrecognised
              day2_errno_class=unknown
              ;;
            *)
              if [ "${#day2_errno}" -le 5 ]; then
                safe_day2_errno="$day2_errno"
                if [ "$day2_errno" = "1213" ]; then
                  day2_errno_class=deadlock
                elif [ "$day2_errno" = "1205" ]; then
                  day2_errno_class=lock_wait_timeout
                else
                  day2_errno_class=other
                fi
              else
                safe_day2_errno=unrecognised
                day2_errno_class=unknown
              fi
              ;;
          esac
          day2_elapsed="$(python3 bin/pilot-day2-failure-report.py --log /tmp/day2-workflows-browser.log --field elapsed_s)"
          case "$day2_elapsed" in
            ''|*[!0-9]*)
              safe_day2_elapsed=unrecognised
              ;;
            *)
              if [ "${#day2_elapsed}" -le 5 ]; then
                safe_day2_elapsed="$day2_elapsed"
              else
                safe_day2_elapsed=unrecognised
              fi
              ;;
          esac
          printf 'day2-browser-failure: journey=%s stage=%s http=%s code=%s read=%s errno=%s errno_class=%s elapsed_s=%s\n' \
            "$day2_journey_token" "$day2_stage_token" "$safe_day2_http" "$day2_code_token" \
            "$safe_day2_read" "$safe_day2_errno" "$day2_errno_class" "$safe_day2_elapsed" \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: responsive-screenshots
          path: clinic-practice-management/pilot-screenshots/
          retention-days: 14
          if-no-files-found: ignore
