                     /tmp/leak.txt /tmp/leak2.txt /tmp/cpms-tick.log /tmp/tick-manual.log /tmp/health-check.log /tmp/pw.log /tmp/resp.log; do
              if [ -f "$f" ]; then echo "--- $f (tail 50) ---"; tail -50 "$f"; fi
            done
            echo '--- apache diagnostics ---'
