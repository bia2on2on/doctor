          test -s /tmp/reports.env
          cat /tmp/reports.env >> "$GITHUB_ENV"
          grep -q '^REPORTS_URL=' /tmp/reports.env
          echo 'Reports fixture environment loaded; values withheld.'

      - name: Staff Portal Reports — real browser (390×844, 768×1024, 1366×768)
        env:
          BASE: http://localhost:8080
        run: |
          python3 -m py_compile bin/pilot-reports.py
          python3 bin/pilot-reports.py | tee /tmp/reports-browser.log
          BROWSER_EXIT="${PIPESTATUS[0]}"
          if [ "${BROWSER_EXIT}" != "0" ]; then
            echo '::error::reports-browser: Staff Portal Reports browser acceptance failed; dynamic diagnostics withheld'
          fi
