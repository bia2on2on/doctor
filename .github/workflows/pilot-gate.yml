          $notifications = \ClinicCore\Bootstrap\App::notificationService();
          $notifVars = ['doctor_name' => 'دکتر پورتال (Synthetic)', 'appointment_date' => \ClinicCore\Domain\Time\Jalali::formatYmd($specs['ok390'][0]->format('Y-m-d')), 'appointment_time' => '10:00', 'patient_name' => 'بیمار گرامی', 'clinic_name' => 'کلینیک پورتال (Synthetic)'];
          $notifEvents = [\ClinicCore\Domain\Notifications\NotificationEvents::APPT_CONFIRMED, \ClinicCore\Domain\Notifications\NotificationEvents::APPT_CHANGED, \ClinicCore\Domain\Notifications\NotificationEvents::APPT_REMINDER, \ClinicCore\Domain\Notifications\NotificationEvents::FOLLOWUP_REMINDER];
          $notifIds = [];
          foreach ($notifEvents as $i => $event) {
            $nid = $notifications->publishToPatient($clinicId, $patientId, $event, $notifVars, 'p9s2:' . $uniq . ':' . $i);
            if ($nid === null || (int) $nid <= 0) { echo "PORTAL_FIXTURE_ERROR: notification seed failed\n"; exit(1); }
            $notifIds[] = (int) $nid;
          }
          // The LAST seeded notification is already read → unread (3) ≠ rows (4): the badge cannot be a row count.
          $readNotifId = array_pop($notifIds);
          if ($wpdb->query($wpdb->prepare('UPDATE ' . $db->table('cpms_notifications') . ' SET read_at = %s WHERE id = %d AND recipient_patient_id = %d', $now, $readNotifId, $patientId)) !== 1) { echo "PORTAL_FIXTURE_ERROR: notification read-state seed failed\n"; exit(1); }
          // Verify the portal data path (G6 inbox — recipient resolved server-side from the link) sees exactly these rows.
          $inbox = $notifications->inbox((int) $userId, false, 50);
          $inboxIds = array_map(fn($n) => (int) $n['id'], (array) $inbox['notifications']);
          sort($inboxIds);
          $expectedNotif = array_merge($notifIds, [$readNotifId]);
          sort($expectedNotif);
          if ($inboxIds !== $expectedNotif || (int) $inbox['unread_count'] !== count($notifIds)) { echo "PORTAL_FIXTURE_ERROR: inbox seed verification failed\n"; exit(1); }
          echo 'fixture: portal-cancel ready; appointment_scenarios=5 notifications=4' . "\n";
          // parts 10/11 (Slice 2): comma-separated unread notification ids | the already-read notification id
          file_put_contents('/tmp/portal-cancel.env', 'PORTAL_CANCEL=' . $login . '|' . $pass . '|' . $clinicId . '|' . $patientId . '|' . $ids['ok390'] . '|' . $ids['ok1366'] . '|' . $ids['fail'] . '|' . $ids['pending'] . '|' . $ids['history'] . '|' . implode(',', $notifIds) . '|' . $readNotifId . "\n");
          PHPEOF
          WP_HOME="$WP_DIR" php /tmp/portal-cancel-fixture.php 2>&1 | tee /tmp/portal-cancel-fixture.log
          test "${PIPESTATUS[0]}" -eq 0
          test -s /tmp/portal-cancel.env
          cat /tmp/portal-cancel.env >> "$GITHUB_ENV"
          echo 'Portal-cancel fixture environment loaded; credential and identifier values withheld.'
      - name: Apache up
        run: |
          sudo tee /etc/apache2/sites-available/pilot.conf >/dev/null <<CONF
          <VirtualHost *:8080>
            DocumentRoot $WP_DIR
            <Directory $WP_DIR>
              AllowOverride All
              Require all granted
            </Directory>
          </VirtualHost>
          CONF
          sudo sed -i 's/^Listen 80$/Listen 8080/' /etc/apache2/ports.conf
          sudo a2dissite 000-default >/dev/null; sudo a2ensite pilot >/dev/null
          sudo a2enmod rewrite >/dev/null
          sudo chmod a+rx /home/runner
          sudo chmod -R a+rX "$WP_DIR"
          sudo apache2ctl configtest && sudo service apache2 start && sleep 2
          ls -la "$WP_DIR/.htaccess" 2>&1 || true
          apache2ctl -M 2>/dev/null | grep rewrite || sudo apache2ctl -M 2>&1 | grep rewrite || echo 'NO REWRITE MODULE'
          curl -s -o /dev/null -w 'pretty: %{http_code}\n' "$WP_URL/wp-json/"
          curl -s -o /dev/null -w 'rest_route: %{http_code}\n' "$WP_URL/?rest_route=/"
          curl -s -o /dev/null -w '%{http_code}\n' "$WP_URL/wp-json/" | grep -q 200
      - name: Responsive smoke (4 viewport × 4 صفحه — بدون overflow افقی)
        id: resp_smoke
        env:
          BASE: http://localhost:8080
          RESP_PASS: 'Pilot-Gate-2026!'
          RESP_DOCTOR_PASS: 'Pilot-Gate-2026!'
        run: |
          python3 bin/pilot-responsive.py | tee /tmp/resp.log
          grep -qE '^(PASS|FAIL)' /tmp/resp.log
          echo 'responsive-chromium: PASS' >> "$GITHUB_STEP_SUMMARY"

      # B-3 — پذیرشِ واقعیِ 320px/390px برای ده اسلاگِ مدیریتی: RTL فارسی،
      # سایدبارِ قابلِ‌استفاده، نبودِ overflow افقی، جدول/فرم در viewport،
      # دسترسی با کیبورد، و ردِ URLِ مستقیم برای نقشِ نامجاز. همان نصبِ WP و
      # همان کاربرانِ fixture؛ فقط Chromium و فقط دو عرض (بودجهٔ گیت).
      - name: Admin narrow RTL acceptance (Chromium — 320/390 × 10 slugs)
        id: admin_narrow
        env:
          BASE: http://localhost:8080
          ARESP_ADMIN_PASS: 'Pilot-Gate-2026!'
          ARESP_SECRETARY_PASS: 'Pilot-Gate-2026!'
          ARESP_DOCTOR_PASS: 'Pilot-Gate-2026!'
        run: |
          # یک لاگ برای هر دو گام: اگر کامپایل شکست بخورد، شواهدِ PR باید همان
          # شکست را نشان دهد (پیش‌تر لاگ ساخته نمی‌شد و علت نامعلوم می‌ماند).
          set +e
          python3 -m py_compile bin/pilot-admin-narrow.py > /tmp/admin-narrow-compile.log 2>&1
          compile_rc=$?
          if [ "${compile_rc}" -ne 0 ]; then
            { echo "INFO py_compile_rc=${compile_rc}"; cat /tmp/admin-narrow-compile.log; } > /tmp/admin-narrow.log
            cat /tmp/admin-narrow.log
            exit 1
          fi
          python3 bin/pilot-admin-narrow.py | tee /tmp/admin-narrow.log
          test "${PIPESTATUS[0]}" -eq 0
          narrow_rc=$?
          if [ "${narrow_rc}" -eq 0 ]; then
            narrow_verdict=PASS
          else
            narrow_verdict=FAIL
          fi
          printf 'admin-narrow-rtl: %s\n' "$narrow_verdict" >> "$GITHUB_STEP_SUMMARY"
          # `set +e` بالاتر یعنی کدِ خروجِ `test` خطا نمی‌سازد و آخرین فرمانِ این
          # گام (بلوکِ step-summary، که همیشه موفق است) وضعیتِ گام را تعیین می‌کرد:
          # پذیرشِ باریک حتی وقتی در همان صفحهٔ نخست متوقف شده بود «سبز» گزارش
          # می‌شد. اکنون کدِ خروجِ پذیرش صریحاً fail-closed است.
          if [ "${narrow_rc}" -ne 0 ]; then
            echo '::error::admin-narrow-rtl: Admin narrow RTL acceptance failed'
            exit "${narrow_rc}"
          fi


      # Reuse the same authenticated admin/public-booking smoke on Firefox and
      # WebKit, bounded to phone + tablet widths; no extra copy or product setup.
      - name: Firefox/WebKit compatibility smoke (390×844 + 768×1024)
        id: compat_smoke
        env:
          BASE: http://localhost:8080
          RESP_PASS: 'Pilot-Gate-2026!'
          RESP_DOCTOR_PASS: 'Pilot-Gate-2026!'
        run: |
          COMPAT_FAILED=0
          firefox_verdict=PASS
          webkit_verdict=PASS
          for engine in firefox webkit; do
            log="/tmp/resp-${engine}.log"
            set +e
            RESP_BROWSER="$engine" python3 bin/pilot-responsive.py > "$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            if [ "$rc" -ne 0 ]; then
              if [ "$engine" = "firefox" ]; then
                echo '::error::firefox-compat-smoke: compatibility smoke failed'
                firefox_verdict=FAIL
              else
                echo '::error::webkit-compat-smoke: compatibility smoke failed'
                webkit_verdict=FAIL
              fi
              COMPAT_FAILED=1
            fi
          done
          printf 'compat-smoke: firefox=%s webkit=%s\n' "$firefox_verdict" "$webkit_verdict" >> "$GITHUB_STEP_SUMMARY"
          test "$COMPAT_FAILED" -eq 0

      # Phase 8 Slice 2 — سفرِ کاملِ بیمار روی مرورگرِ واقعی (scoping از انتخاب).
      # OTP از مسیرِ فقط-تست (پتچِ code_hash در DB با همان الگوی Integration)
      # خوانده می‌شود؛ service واقعیِ OtpService بدون bypass. شواهد فقط
      # boolean/شناسه/تعداد-transition هستند — OTP/موبایل/نام/cookie/nonce
      # هرگز در لاگ print نمی‌شوند.
      - name: Slice-2 OTP journey — سفرِ کامل بیمار در مرورگر واقعی
        id: otp_journey_browser
        env:
          BASE: http://localhost:8080
        run: |
          python3 -m py_compile bin/pilot-otp-journey.py
          python3 bin/pilot-otp-journey.py | tee /tmp/journey.log
          # gate fail-closed: tee هرگز کد خطای سفر را نمی‌بلعد
          test "${PIPESTATUS[0]}" -eq 0

      # Phase 8 Slice 3 — N>1 Chooser: اثباتِ مرورگرِ واقعی در دو viewport
      # (390×844 و 1366×768) روی Clinicِ سومِ Synthetic با دو بیمارِ فعالِ هم‌پیوند
      # و سه decoy (unlinked/inactive/cross). ۱) anon بی‌chooser، ۲) auth دقیقاً
      # A/B بدون decoy، ۳) select B با aria-pressed، ۴) B1 patient_id=B روی نگهداشتِ
      # واقعی، ۵) B2 Appointment patient_id=B بدون ایجاد بیمار/پیوندِ تازه، ۶) بدون
      # overflow/console/failed. شواهد فقط boolean/تعداد/شناسه‌های غیرحساس.
      - name: Slice-3 N>1 chooser — اثبات مرورگر واقعی (390×844 + 1366×768)
        env:
          BASE: http://localhost:8080
        run: |
          python3 -m py_compile bin/pilot-slice3-chooser.py
          python3 bin/pilot-slice3-chooser.py | tee /tmp/slice3.log
          test "${PIPESTATUS[0]}" -eq 0

      # Phase 9 Slice 1 — پورتال بیمار: لغو نوبت توسط خود بیمار روی مرورگر واقعی
      # (390×844 + 1366×768) از طریق همان B4 موجود. ۱) ورود + رندرِ احرازشده: config
      # فقط rest_root/cancel_path/nonce، کنترل فقط روی ردیف‌های confirmed؛ ۲) کیبورد:
      # Enter ⇒ دیالوگ تأیید، Escape ⇒ بدون درخواست؛ ۳) مسیرِ خطا: 409 سیاستِ مهلت ⇒
      # alert فارسی + کنترل در حین درخواست disabled/aria-busy و بعد دوباره فعال؛
      # ۴) مسیرِ موفق: 200 ⇒ reload ⇒ ردیف در تاریخچه، DB=cancelled_by_patient،
      # ظرفیت آزاد، Audit؛ ۵) بدون overflow/console/failed. شواهد فقط boolean/شناسه.
      # Phase 9 Slice 2 — همان سفر، مرحلهٔ «اعلان‌ها» (بین ۱ و ۲): بخشِ اعلان‌های داخلی +
      # نشانِ خوانده‌نشدهٔ دقیقاً برابر با DB + ردیف‌ها/وضعیتِ خوانده‌شده برابر با DB؛
      # «خواندنِ همه» با همان POST clinic/v1/notifications/read موجود و بدنهٔ دقیقاً
      # {"all":true} (بدون clinic_id/patient_id): مسیرِ خطا (403 nonce ⇒ alert فارسی،
      # دکمه دوباره فعال و focus، DB بدون تغییر) و مسیرِ موفق (200 ⇒ reload ⇒ نشان و
      # دکمه حذف، همهٔ ردیف‌ها خوانده‌شده و هنوز قابل‌مشاهده، DB unread=0).
      - name: Slice-1/Slice-2 portal — اثبات مرورگر واقعی (390×844 + 1366×768)
        env:
          BASE: http://localhost:8080
        run: |
          python3 -m py_compile bin/pilot-slice-portal-cancel.py
          python3 bin/pilot-slice-portal-cancel.py | tee /tmp/portal-cancel.log
          test "${PIPESTATUS[0]}" -eq 0

      # Phase 9 Slice 4 — همان پورتال، همان Chromium. بیمارِ synthetic با یک پیوند
      # و بیمارِ synthetic با دو پیوندِ فعال + پیوندِ بیگانه/بایگانی. بدون فریم‌ورک
      # جدید. شواهد فقط boolean/شناسه. رمز/موبایل/کدملی/nonce در لاگ نیست.
      - name: Slice-4 profile fixture — one record + two-clinic selector + decoys
        id: portal_profile_fixture
        run: |
          WP_HOME="$WP_DIR" php tests/fixtures/pilot-slice4-profile-fixture.php 2>&1 | tee /tmp/portal-profile-fixture.log
          test "${PIPESTATUS[0]}" -eq 0
          test -s /tmp/portal-profile.env
          cat /tmp/portal-profile.env >> "$GITHUB_ENV"
          grep -q '^PROFILE_FIXTURE_OK ' /tmp/portal-profile-fixture.log
          echo 'Slice-4 profile fixture environment loaded; values withheld.'

      - name: Slice-4 Patient Profile — real browser (390×844, 768×1024, 1366×768)
        id: portal_profile_browser
        env:
          BASE: http://localhost:8080
        run: |
          python3 -m py_compile bin/pilot-slice4-profile.py
          python3 bin/pilot-slice4-profile.py | tee /tmp/portal-profile.log
          test "${PIPESTATUS[0]}" -eq 0

      # Phase 10 — همان Chromium و همان وردپرس. صفحهٔ واقعی پورتال پزشک، نشست
