name: Third-Party Compatibility Baseline (Phase 18 Lane A)

# Phase 18 — third-party compatibility MEASUREMENT baseline.
#
# CURRENT CAMPAIGN TARGET (owner-directed, frozen at implementation time)
#   WordPress 7.1.3  ·  PHP 8.3  ·  MySQL 8.4.11  ·  Apache + real Chromium
#   19 independently isolated plugin subjects, one WooCommerce dependency-only
#   control, and one clean fa_IR WordPress baseline.  21 jobs.
#
# This workflow measures how 19 frozen third-party products behave on a clean,
# CPMS-free WordPress.  One additional leg measures a clean Persian (fa_IR)
# WordPress environment with no plugin at all.  It installs no CPMS code, changes
# no CPMS code and makes no CPMS claim: taxonomy category A and B are unreachable
# here.
#
# WHY THE LANE MOVED OFF 6.7.2 / 8.2
#   The pins were re-frozen against the current stable ecosystem, and the pins
#   themselves forced the move rather than preference: Contact Form 7 6.2
#   declares `Requires at least: 7.1` and `Requires PHP: 8.3`, and WooCommerce
#   11.2.0 declares `Requires at least: 7.0`. Neither can activate on the
#   previous 6.7.2 / 8.2 lane at all. The historical WP 6.7.2 / PHP 8.2 campaign
#   is NOT re-run here; its evidence is preserved in the existing GitHub runs of
#   this workflow on `main` and is not modified, re-adjudicated or superseded by
#   anything in this file.
#
# THE PERSIAN BASELINE LEG IS NOT A PRODUCT LEG
#   `locale-baseline-fa-ir` installs nothing. Its subject under test is the
#   Persian WordPress environment itself: WordPress 7.1.3 / PHP 8.3 / MySQL
#   8.4.11 / Apache with locale fa_IR and an explicit Asia/Tehran site timezone.
#   That timezone is a property of THIS TEST FIXTURE only; it is not a statement
#   about any production site, and it carries no Location-level authority because
#   CPMS — which owns Location timezones — is absent.
#
#   It measures locale loading, RTL admin, administrator login/session, public
#   page, REST, admin-ajax, UTF-8 Persian text round trip, PHP and browser errors,
#   unexpected redirects and exact environment identity. It deliberately does NOT
#   measure CPMS Jalali/Shamsi calendars, patients, bookings, Location-timezone
#   authority, authorization or Clinic A/B isolation — each of those needs CPMS
#   and belongs to a later coexistence slice. The probe records that boundary
#   inside the artifact itself so the absence of those claims cannot be read as
#   coverage.
#
# ISOLATION INVARIANT (the whole point of the architecture)
#   one subject  ==  one matrix leg  ==  one GitHub Actions job
#   every job therefore gets, from GitHub itself and not from us:
#     - a fresh runner            (no process, file or port state from another subject)
#     - a fresh `services: mysql` container and a fresh database
#     - a fresh WordPress filesystem, extracted from the official 7.1.3 tarball
#   CPMS is never installed, and its absence is asserted in the filesystem, the
#   plugin set, the option table and the database BEFORE and AFTER activation.
#   There is deliberately no aggregate "activate one, deactivate, test the next"
#   baseline anywhere in this file — that pattern cannot attribute a failure.
#
# REPEAT-ONCE PATH
#   Any material FAIL must be repeated once in a fresh environment before causal
#   attribution. A `workflow_dispatch` run of this workflow is that path: one
#   subject is one job, so every subject already gets a fresh runner, container
#   and WordPress. Per-subject dispatch filtering was deliberately NOT added —
#   it would need a planning job plus `fromJSON` matrix indirection to save
#   runner minutes, and the per-subject pins, SHA-256 and environment already
#   recorded in each result are the deterministic rerun evidence.
#
# LANE SCOPE
#   Implemented now : one lane — WordPress 7.1.3 / PHP 8.3 / MySQL 8.4.11 /
#                     Apache + real Chromium, mirroring the proven Real WordPress
#                     Acceptance harness.
#   NOT implemented : a second concurrent lane (the historical 6.7.2 / 8.2
#                     campaign stays closed, with its evidence in the existing
#                     runs) and any CPMS coexistence run. The lane's WordPress,
#                     PHP, MySQL and server pins are single workflow-level
#                     constants below; widening to a second lane later means
#                     widening those constants and the matrix, not rewriting the
#                     per-subject job body, the probes or the result contract.
#
# COMMERCIAL SUBJECTS ARE OUT OF THE ACTIVE MATRIX — AND DID NOT FAIL
#   WP Rocket 3.23.5.1 and Gravity Forms 3.1.0 were carried in the historical
#   WP 6.7.2 / PHP 8.2 campaign and reported **NOT RUN — OWNER-SUPPLIED LICENSED
#   PACKAGE/CREDENTIAL REQUIRED**. That is what their result was: no lawful
#   owner-provisioned material existed, so nothing was ever retrieved, installed
#   or measured. It is emphatically NOT a compatibility failure, and nothing in
#   this file may be read as one.
#
#   Their historical NOT RUN evidence is preserved untouched in the existing
#   GitHub runs of this workflow on `main` (per-subject `tpb-wp-rocket` and
#   `tpb-gravityforms` artifacts and the aggregated `tpb-summary`). They are
#   simply not re-run here, so this campaign's 21 legs are all executable and no
#   leg can report NOT RUN.
#
#   The lawful path is unchanged and still the only accepted one, for whenever the
#   owner chooses to re-add either subject: a repository secret holding a
#   short-lived owner-provisioned presigned URL plus its SHA-256 for WP Rocket
#   (`TPB_WPROCKET_LICENSED_PACKAGE_URL` / `_SHA256`), or an owner-provisioned
#   license key consumed only by the official Gravity Forms CLI add-on
#   (`TPB_GRAVITYFORMS_LICENSE_KEY`). No nulled or unofficial source is ever
#   used, no commercial package is ever committed, and no credential is ever
#   printed, logged or uploaded. No credential is required for this workflow to
#   be valid.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Same shape as the repository's other gates: PR runs keyed by PR number, main
  # runs keyed by the unique run id so post-merge evidence is never superseded.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && format('main-run-{0}', github.run_id) || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  # Narrowest set this workflow needs.
  contents: read # reads the probe tooling in .github/third-party-baseline/
  actions: read # required by actions/download-artifact@v4 to aggregate evidence across jobs

env:
  LANE: A
  WP_VERSION: '7.1.3'
  PHP_VERSION: '8.3'
  # The campaign's frozen database pin, expressed as the major.minor the probe
  # asserts the RUNNING server actually reports. `services:` is resolved before
  # the workflow-level `env` context exists, so the image reference itself has to
  # be written literally in the job below; this constant is the matching
  # assertion, and the two are deliberately kept adjacent so they cannot drift.
  MYSQL_EXPECT: '8.4'
  WP_DIR: /home/runner/tpb/wp
  WP_URL: http://localhost:8080
  PROBE_DIR: /var/www/tpb-probe
  EVIDENCE_DIR: /tmp/tpb
  # Ephemeral local-only credentials for a throwaway WordPress on an ephemeral
  # runner. They are not secrets, they protect nothing, they hold no PHI and they
  # die with the job — the same convention the Real WordPress Acceptance harness
  # already uses.
  TPB_ADMIN_USER: tpb_admin
  TPB_ADMIN_PASS: Tpb-Baseline-2026!

jobs:
  subject-baseline:
    name: "Baseline ${{ matrix.id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      # One subject failing must never cancel another subject's evidence.
      fail-fast: false
      matrix:
        include:
          # ---- 19 frozen subjects (current-ecosystem lane) ----
          #
          # Every pin below was verified against the live WordPress.org plugins
          # API (api.wordpress.org/plugins/info/1.2) at freeze time, and every
          # `version` equals that API's `version` exactly. The trailing comment
          # on each leg records the package's own declared `Requires at least`
          # and `Requires PHP` headers, so a reader can see the pin satisfies
          # the 7.1.3 / 8.3 lane without re-querying anything. No version here
          # was substituted, rounded or approximated: `probe.py install` fails
          # closed if the retrieved package is not byte-exactly this pin.
          #
          # `contact-form-7` 6.2 is the pin that forced this lane's PHP: it
          # declares `Requires PHP: 8.3` and `Requires at least: 7.1`, so it
          # cannot activate on the historical 8.2 / 6.7.2 lane at all.
          - id: litespeed-cache
            name: LiteSpeed Cache
            slug: litespeed-cache
            version: '7.9.1'  # requires WP 6.0, PHP 7.4
            source: wordpress_org
            kind: subject
            deps: '-'
            unavailable_feature: 'server-level page caching (LSCache)'
            unavailable_reason: >-
              LSCache page caching needs a LiteSpeed web server; this lane runs Apache/mod_php, so that single feature cannot execute here
          - id: wordpress-seo
            name: Yoast SEO
            slug: wordpress-seo
            version: '28.6'  # requires WP 6.9, PHP 7.4
            source: wordpress_org
            kind: subject
            deps: '-'
            unavailable_feature: ''
            unavailable_reason: ''
          - id: seo-by-rank-math
            name: Rank Math SEO
            slug: seo-by-rank-math
            version: '1.0.280'  # requires WP 6.7, PHP 7.4
            source: wordpress_org
            kind: subject
            deps: '-'
            unavailable_feature: ''
            unavailable_reason: ''
          - id: persian-woocommerce
            name: Persian WooCommerce
            slug: persian-woocommerce
            version: '10.0.5'  # requires WP 6.8, PHP 7.4
            source: wordpress_org
            kind: subject
            deps: 'woocommerce=11.2.0'
            unavailable_feature: ''
            unavailable_reason: ''
          - id: woocommerce
            name: WooCommerce
            slug: woocommerce
            version: '11.2.0'  # requires WP 7.0, PHP 7.4 — also the dependency-control subject below
            source: wordpress_org
            kind: subject
            deps: '-'
            unavailable_feature: ''
            unavailable_reason: ''
          - id: elementor
            name: Elementor
            slug: elementor
            version: '4.3.4'  # requires WP 6.8, PHP 7.4
            source: wordpress_org
            kind: subject
            deps: '-'
            unavailable_feature: ''
            unavailable_reason: ''
          - id: persian-elementor
            name: Persian Elementor
            slug: persian-elementor
            version: '2.8.4'  # requires WP 5.0, PHP 7.4
            source: wordpress_org
            kind: subject
            deps: '-'
            unavailable_feature: ''
            unavailable_reason: ''
          - id: wp-parsidate
            name: WP Parsi Date
            slug: wp-parsidate
            version: '6.4'  # requires WP 5.3, PHP 7.4
            source: wordpress_org
            kind: subject
            deps: '-'
            unavailable_feature: ''
            unavailable_reason: ''
          - id: persian-woocommerce-sms
            name: Persian WooCommerce SMS
            slug: persian-woocommerce-sms
            version: '7.2.3'  # requires WP 6.8, PHP 7.4
            source: wordpress_org
            kind: subject
            deps: 'woocommerce=11.2.0'
            unavailable_feature: ''
            unavailable_reason: ''
          - id: contact-form-7
            name: Contact Form 7
            slug: contact-form-7
            version: '6.2'  # requires WP 7.1, PHP 8.3 — the pin that fixed this lane at PHP 8.3
            source: wordpress_org
            kind: subject
            deps: '-'
            unavailable_feature: ''
            unavailable_reason: ''
          - id: wordfence
            name: Wordfence Security
            slug: wordfence
            version: '9.0.2'  # requires WP 4.7, PHP 7.0
            source: wordpress_org
            kind: subject
            deps: '-'
            unavailable_feature: ''
            unavailable_reason: ''
          - id: really-simple-ssl
            name: Really Simple SSL
            slug: really-simple-ssl
            version: '9.8.3'  # requires WP 6.6, PHP 7.4
            source: wordpress_org
            kind: subject
            deps: '-'
            unavailable_feature: ''
            unavailable_reason: ''
          - id: redirection
            name: Redirection
            slug: redirection
            version: '5.10.1'  # requires WP 6.7, PHP 7.4
            source: wordpress_org
            kind: subject
            deps: '-'
            unavailable_feature: ''
            unavailable_reason: ''
          - id: polylang
            name: Polylang
            slug: polylang
            version: '3.8.10'  # requires WP 6.5, PHP 7.4
            source: wordpress_org
            kind: subject
            deps: '-'
            unavailable_feature: ''
            unavailable_reason: ''
          - id: user-role-editor
            name: User Role Editor
            slug: user-role-editor
            version: '4.66.2'  # requires WP 4.7, PHP 7.4
            source: wordpress_org
            kind: subject
            deps: '-'
            unavailable_feature: ''
            unavailable_reason: ''
          - id: autoptimize
            name: Autoptimize
            slug: autoptimize
            version: '3.1.16'  # requires WP 5.3, PHP 7.4
            source: wordpress_org
            kind: subject
            deps: '-'
            unavailable_feature: ''
            unavailable_reason: ''
          - id: advanced-custom-fields
            name: Advanced Custom Fields
            slug: advanced-custom-fields
            version: '6.8.10'  # requires WP 6.2, PHP 7.4
            source: wordpress_org
            kind: subject
            deps: '-'
            unavailable_feature: ''
            unavailable_reason: ''
          - id: wp-crontrol
            name: WP Crontrol
            slug: wp-crontrol
            version: '1.21.2'  # requires WP 6.6, PHP 7.4
            source: wordpress_org
            kind: subject
            deps: '-'
            unavailable_feature: ''
            unavailable_reason: ''
          - id: loco-translate
            name: Loco Translate
            slug: loco-translate
            version: '2.8.9'  # requires WP 6.6, PHP 7.4
            source: wordpress_org
            kind: subject
            deps: '-'
            unavailable_feature: ''
            unavailable_reason: ''

          # ---- independent Persian WordPress baseline (NO plugin installed) ----
          # `kind: locale-baseline` is the single discriminator the job body uses.
          # It skips the install step, swaps the post-phase "subject still active"
          # check for "the plugin set is still empty", and adds the locale/RTL/
          # UTF-8/timezone probes. Every other leg keeps `kind: subject` or
          # `dependency-control`.
          #
          # `source: wordpress_org` is kept so this leg reuses the exact same
          # provisioning path as the product legs — the official WordPress.org
          # core distribution, the same PHP 8.3 module, the same Apache vhosts,
          # the same out-of-tree runtime probe. `slug`/`version` are `-` because
          # there is no package: the fixture is the locale and the timezone.
          #
          # `site_timezone: Asia/Tehran` is explicit and applies to THIS fixture
          # only. `admin_dir: rtl` is passed to the browser probe, which asserts
          # the direction of the document a real Chromium instance rendered.
          - id: locale-baseline-fa-ir
            name: 'Persian WordPress baseline (fa_IR, Asia/Tehran) — no plugin'
            slug: '-'
            version: '-'
            source: wordpress_org
            kind: locale-baseline
            deps: '-'
            unavailable_feature: ''
            unavailable_reason: ''
            locale: fa_IR
            site_timezone: Asia/Tehran
            admin_dir: rtl

          # ---- dependency-only control ----
          # A subject that declares a dependency is only attributable once the
          # dependency ALONE is proven healthy in an equally clean environment.
          # One shared control leg for the one distinct pinned dependency in this
          # matrix (WooCommerce 11.2.0), covering both persian-woocommerce and
          # persian-woocommerce-sms. No combination legs are created.
          #
          # This leg is mandatory even though the historical campaign found
          # elementor and persian-woocommerce failing: a failing baseline is the
          # finding, not a reason to drop the subject.
          - id: dep-control-woocommerce
            name: 'Dependency-only control: WooCommerce (no subject)'
            slug: woocommerce
            version: '11.2.0'  # requires WP 7.0, PHP 7.4
            source: wordpress_org
            kind: dependency-control
            deps: '-'
            unavailable_feature: ''
            unavailable_reason: ''
    services:
      # A fresh MySQL container per job — this is what makes the database half of
      # the isolation invariant true without any cleanup step of our own.
      #
      # WHY THIS EXACT REFERENCE, AND WHY IT CHANGES NO AUTHENTICATION SEMANTICS
      #   The historical campaign used the floating tag `mysql:8`. Verified
      #   against the Docker Hub registry API before freezing: `mysql:8` and
      #   `mysql:8.4.11` resolve to the SAME image index digest
      #   sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242.
      #   Pinning 8.4.11 therefore freezes byte-for-byte the image the earlier
      #   baseline already ran on — it removes the float, it does not migrate
      #   anything, and it cannot silently alter the authentication mechanism.
      #
      #   The mechanism on that image is recorded as evidence, not assumed: MySQL
      #   8.4 removed `default_authentication_plugin` and ships
      #   `mysql_native_password` DISABLED by default, so the server authenticates
      #   with `caching_sha2_password`. `probe.py` asserts the plugin the root
      #   account actually uses on every leg, so a future image change that moved
      #   the mechanism would fail loudly instead of passing quietly. Enabling the
      #   deprecated `--mysql-native-password=ON` to dodge that would be reaching
      #   for legacy auth and is deliberately NOT done.
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Record subject identity
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          # /var/www needs root; the probe lives outside the WordPress tree
          # under measurement either way, which is the actual invariant.
          sudo mkdir -p "$PROBE_DIR"
          python3 .github/third-party-baseline/probe.py subject \
            --store "$EVIDENCE_DIR/evidence.json" \
            --id "${{ matrix.id }}" \
            --name "${{ matrix.name }}" \
            --slug "${{ matrix.slug }}" \
            --version "${{ matrix.version }}" \
            --source "${{ matrix.source }}" \
            --kind "${{ matrix.kind }}" \
            --deps "${{ matrix.deps }}" \
            --unavailable-feature "${{ matrix.unavailable_feature }}" \
            --unavailable-reason "${{ matrix.unavailable_reason }}" \
            --locale "${{ matrix.locale }}" \
            --site-timezone "${{ matrix.site_timezone }}"

      # ------------------------------------------------------------------ #
# NO COMMERCIAL SUBJECT STEPS HERE — BY OWNER DECISION, NOT BY OMISSION
#   WP Rocket and Gravity Forms are no longer legs of this matrix, so the three
#   `NOT RUN` steps that served them are gone with them: a step whose `if:` can
#   never be true is dead weight, and leaving it would imply a subject this
#   campaign still intends to run.
#
#   Their historical result was **NOT RUN — OWNER-SUPPLIED LICENSED PACKAGE /
#   CREDENTIAL REQUIRED**, which means nothing was ever retrieved, installed or
#   measured. That is NOT a compatibility failure and must never be reported as
#   one. The evidence stands untouched in the existing GitHub runs of this
#   workflow on `main` (artifacts `tpb-wp-rocket`, `tpb-gravityforms`,
#   `tpb-summary`). The only accepted mechanism for re-adding either subject is
#   documented in the COMMERCIAL SUBJECTS block at the top of this file.
#
#   Consequence, stated plainly: every one of the 21 legs in this campaign is
#   executable, so no leg can report NOT RUN and the aggregate summary carries no
#   unadjudicated subject.
      # ------------------------------------------------------------------ #
      # ------------------------------------------------------------------ #
      # Everything below runs only for WordPress.org packages.
      # ------------------------------------------------------------------ #
      - uses: shivammathur/setup-php@v2
        if: matrix.source == 'wordpress_org'
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mysqli, curl, mbstring, xml, zip, gd, sodium, intl
          coverage: none

      - name: Tooling (apache2 + mod_php pinned to the lane PHP + wp-cli + chromium)
        if: matrix.source == 'wordpress_org'
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq

          # The lane pins PHP 8.3, so the module Apache loads must be 8.3 too —
          # whatever mod_php the distro happens to enable is not acceptable
          # evidence for a pinned lane, and the exact versioned packages are
          # installed by name rather than by metapackage.
          #
          # The PPA is still added, and deliberately so. On ubuntu-latest (24.04)
          # 8.3 IS the distro default, so unlike the previous 8.2 lane the PPA is
          # no longer strictly required to obtain `libapache2-mod-php8.3`. It is
          # kept anyway because it is what guarantees the *versioned* php8.3-*
          # packages resolve identically across runner image revisions, instead of
          # depending on which metapackages the image happens to carry. Adding it
          # is idempotent and does not change which PHP module is loaded: the
          # `php${PHP_VERSION}.load` assertion below is what actually enforces the
          # pin, and it fails closed.
          # `| tee` keeps the command's own exit status because `set -o pipefail`
          # is active, and avoids redirecting a root command's output as the
          # invoking user.
          apt_diag() { tail -25 "$1" | tr '\n\r' '  ' | sed 's/%/%25/g' | cut -c1-1600; }

          if ! command -v add-apt-repository > /dev/null 2>&1; then
            if ! sudo apt-get install -y -qq software-properties-common 2>&1 \
                 | tee /tmp/apt-ppa.log > /dev/null; then
              echo "::error::Class C environment failure: software-properties-common is not installable. apt diagnostic: $(apt_diag /tmp/apt-ppa.log)"
              exit 1
            fi
          fi
          if ! sudo add-apt-repository -y ppa:ondrej/php 2>&1 \
               | tee /tmp/apt-ppa.log > /dev/null; then
            echo "::error::Class C environment failure: ppa:ondrej/php could not be added, so PHP ${PHP_VERSION} cannot be provisioned for Apache. apt diagnostic: $(apt_diag /tmp/apt-ppa.log)"
            exit 1
          fi
          sudo apt-get update -qq

          if ! sudo apt-get install -y -qq \
               "libapache2-mod-php${PHP_VERSION}" \
               "php${PHP_VERSION}-mysql" "php${PHP_VERSION}-mbstring" \
               "php${PHP_VERSION}-xml" "php${PHP_VERSION}-curl" \
               "php${PHP_VERSION}-zip" "php${PHP_VERSION}-gd" \
               "php${PHP_VERSION}-intl" "php${PHP_VERSION}-opcache" \
               apache2 mysql-client 2>&1 | tee /tmp/apt.log > /dev/null; then
            # The apt tail is emitted as an annotation on purpose: raw job-log
            # blobs live on *.blob.core.windows.net, which is not retrievable
            # from the review sandbox, whereas check-run annotations are. That
            # keeps the first causal error recoverable without the blob.
            echo "::error::Class C environment failure: PHP ${PHP_VERSION} Apache module is not installable on this runner. Refusing to measure a lane on the wrong PHP. apt diagnostic: $(apt_diag /tmp/apt.log)"
            exit 1
          fi
          # Prove the exact module is present before Apache is ever configured.
          test -e "/etc/apache2/mods-available/php${PHP_VERSION}.load" || {
            echo "::error::Class C environment failure: php${PHP_VERSION}.load is absent after installation, so the lane PHP cannot be served by Apache."
            exit 1; }
          curl -sS https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp && sudo chmod +x /usr/local/bin/wp
          wp --allow-root --version
          (pip install --quiet playwright 2>/dev/null || pip install --quiet --break-system-packages playwright)
          python3 -m playwright install --with-deps chromium > /tmp/pw.log 2>&1 || { tail -10 /tmp/pw.log; exit 1; }

      - name: Clean WordPress on this job's own database
        if: matrix.source == 'wordpress_org'
        run: |
          set -Eeuo pipefail
          # Per-subject database name: defence in depth on top of the fact that
          # the MySQL container itself is fresh for this job.
          DB_NAME="tpb_${LANE}_$(printf '%s' "${{ matrix.id }}" | tr -c 'a-z0-9' '_' | tr '[:upper:]' '[:lower:]')"
          echo "DB_NAME=$DB_NAME" >> "$GITHUB_ENV"

          # Every failure point below emits an annotation on purpose: raw job-log
          # blobs are served from *.blob.core.windows.net, which is not
          # retrievable from the review sandbox, whereas check-run annotations
          # are. Without them a provisioning failure here is undiagnosable.
          ann() { tail -20 "$1" | tr '\n\r' '  ' | sed 's/%/%25/g' | cut -c1-1600; }

          if ! curl -sSfL "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" -o /tmp/wp.tar.gz; then
            echo "::error::Class C environment failure: the official WordPress ${WP_VERSION} tarball could not be retrieved. Failing closed; no substitute source and no other version is used."
            exit 1
          fi
          echo "wp_tarball_sha256=$(sha256sum /tmp/wp.tar.gz | cut -d' ' -f1)"
          tar -xzf /tmp/wp.tar.gz -C /tmp
          test -f /tmp/wordpress/wp-settings.php || {
            echo "::error::Class C environment failure: the retrieved tarball did not contain WordPress core files."
            exit 1; }
          # WP_DIR is two levels below the runner home, so its parent must exist
          # before the extracted tree can be moved into place.
          mkdir -p "$(dirname "$WP_DIR")"
          mv /tmp/wordpress "$WP_DIR"
          rm -f /tmp/wp.tar.gz

          if ! mysql -h 127.0.0.1 -P 3306 -uroot -proot \
               -e "CREATE DATABASE $DB_NAME CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;" \
               > /tmp/mysql.log 2>&1; then
            echo "::error::Class C environment failure: could not create database $DB_NAME on this job's fresh MySQL container. mysql diagnostic: $(ann /tmp/mysql.log)"
            exit 1
          fi

          cd "$WP_DIR"
          if ! wp config create --dbname="$DB_NAME" --dbuser=root --dbpass=root \
               --dbhost=127.0.0.1:3306 --dbprefix='wp_' --skip-salts --allow-root \
               > /tmp/wp-config.log 2>&1; then
            echo "::error::Provisioning failure (class C environment unless the diagnostic shows a harness defect): wp config create failed. diagnostic: $(ann /tmp/wp-config.log)"
            exit 1
          fi
          wp config shuffle-salts --allow-root
          # Production-sane and log-driven, like the proven acceptance harness.
          wp config set WP_DEBUG true --raw --allow-root
          wp config set WP_DEBUG_LOG true --raw --allow-root
          wp config set WP_DEBUG_DISPLAY false --raw --allow-root
          wp config set DISALLOW_FILE_EDIT true --raw --allow-root
          if ! wp core install --url="$WP_URL" --title="Phase 18 Third-Party Baseline" \
               --admin_user="$TPB_ADMIN_USER" --admin_password="$TPB_ADMIN_PASS" \
               --admin_email=tpb@baseline.local --skip-email --allow-root \
               > /tmp/wp-install.log 2>&1; then
            echo "::error::Provisioning failure (class C environment unless the diagnostic shows a harness defect): wp core install failed. diagnostic: $(ann /tmp/wp-install.log)"
            exit 1
          fi
          echo "installed wordpress $(wp core version --allow-root) into $WP_DIR on database $DB_NAME"

      - name: Apache + mod_php + out-of-tree runtime probe
        if: matrix.source == 'wordpress_org'
        run: |
          set -Eeuo pipefail
          # Load exactly the lane's PHP module and no other.
          for MOD in /etc/apache2/mods-enabled/php*.load; do
            [ -e "$MOD" ] || continue
            sudo a2dismod "$(basename "$MOD" .load)" >/dev/null || true
          done
          sudo a2enmod "php${PHP_VERSION}" >/dev/null
          sudo a2enmod rewrite >/dev/null

          # The runtime probe lives OUTSIDE the WordPress filesystem (an Apache
          # alias into /tmp), so proving the serving PHP version never writes a
          # single file into the tree under measurement. It exposes only the PHP
          # version, the SAPI and the server banner — never phpinfo().
          sudo tee "$PROBE_DIR/php-probe.php" > /dev/null <<'PHPEOF'
          <?php
          header('Content-Type: application/json');
          echo json_encode([
              'php_version'     => PHP_VERSION,
              'php_sapi'        => PHP_SAPI,
              'server_software' => isset($_SERVER['SERVER_SOFTWARE']) ? $_SERVER['SERVER_SOFTWARE'] : '',
          ]);
          PHPEOF
          sudo chown -R www-data:www-data "$PROBE_DIR"
          sudo chmod 755 "$PROBE_DIR" && sudo chmod 644 "$PROBE_DIR/php-probe.php"

          # The runtime probe is served from its OWN virtual host with its own
          # DocumentRoot, not from an Alias inside the WordPress vhost.
          #
          # Why: two exact-head runs (ebc253b and c60d75f) returned HTTP 403 for
          # the aliased probe path on EVERY leg of EVERY subject, while the
          # WordPress front page served 200 from the same vhost - so the vhost was
          # active and only the Alias + <Directory> interaction refused access.
          # A vhost whose DocumentRoot IS the probe directory is the canonical
          # Apache pattern (it is the shape of the shipped 000-default site) and
          # removes that interaction entirely.
          #
          # The probe directory lives under /var/www, not /tmp. Run f069d7f proved
          # the /tmp location was not a filesystem problem at all: the directory
          # was drwxr-xr-x and the probe -rw-r--r--, both vhosts were bound, and
          # Apache still answered with its authorization 403 page. Ubuntu's
          # apache2.conf denies / by default ("Require all denied") and explicitly
          # grants /var/www/ ("Require all granted"), so /var/www is the location
          # the distribution already trusts - it is still outside the WordPress
          # filesystem under measurement, which is the only invariant that matters
          # here.
          #
          # The probe exposes only the PHP version, the SAPI and the server
          # banner - never phpinfo() and never any site data.
          cat > /tmp/tpb-vhost.conf <<CONF
          <VirtualHost *:8080>
            DocumentRoot $WP_DIR
            <Directory $WP_DIR>
              AllowOverride All
              Require all granted
            </Directory>
            ErrorLog \${APACHE_LOG_DIR}/tpb-error.log
            CustomLog \${APACHE_LOG_DIR}/tpb-access.log combined
          </VirtualHost>
          <VirtualHost *:8081>
            DocumentRoot $PROBE_DIR
            <Directory $PROBE_DIR>
              Options -Indexes
              AllowOverride None
              Require all granted
            </Directory>
            ErrorLog \${APACHE_LOG_DIR}/tpb-probe-error.log
            CustomLog \${APACHE_LOG_DIR}/tpb-probe-access.log combined
          </VirtualHost>
          CONF
          sudo cp /tmp/tpb-vhost.conf /etc/apache2/sites-available/tpb.conf
          sudo sed -i 's/^Listen 80$/Listen 8080/' /etc/apache2/ports.conf
          grep -qx 'Listen 8081' /etc/apache2/ports.conf || echo 'Listen 8081' \
            | sudo tee -a /etc/apache2/ports.conf > /dev/null
          sudo a2dissite 000-default >/dev/null && sudo a2ensite tpb >/dev/null
          for INI in /etc/php/*/apache2/php.ini; do
            sudo sed -i 's/^display_errors = .*/display_errors = Off/' "$INI"
          done

          # Documented deviation from the Real WordPress Acceptance harness, which
          # deliberately keeps wp-content read-only for PHP. Several subjects
          # legitimately write their own runtime directories there (Wordfence
          # wflogs, LiteSpeed cache, uploads). A read-only wp-content would turn
          # ordinary product behaviour into class C environment noise, so the web
          # user gets write access and the actual state is recorded as evidence.
          #
          # Shared-host layout, and the reason it is not a plain `chown
          # www-data`: `wp plugin install` later runs as the CLI user, so the
          # runner must keep ownership while Apache gets group write access, with
          # setgid so anything a plugin creates stays group-owned too.
          sudo chmod a+rx /home/runner
          sudo chmod -R a+rX "$WP_DIR"
          sudo chown -R "$(id -un)":www-data "$WP_DIR/wp-content"
          sudo chmod -R g+w "$WP_DIR/wp-content"
          sudo find "$WP_DIR/wp-content" -type d -exec chmod g+s {} +
          if ! sudo apache2ctl configtest 2>&1 \
               | tee /tmp/apache-configtest.log > /dev/null; then
            echo "::error::Class C environment failure: Apache configuration is invalid. configtest diagnostic: $(tail -20 /tmp/apache-configtest.log | tr '\n\r' '  ' | sed 's/%/%25/g' | cut -c1-1600)"
            exit 1
          fi
          sudo service apache2 start
          sleep 2
          if ! curl -sS -o /dev/null -w '' "$WP_URL/"; then
            echo "::error::Class C environment failure: Apache is not answering on $WP_URL after start."
            exit 1
          fi

          TPB_PROBE_URL="http://localhost:8081/php-probe.php"
          echo "TPB_PROBE_URL=$TPB_PROBE_URL" >> "$GITHUB_ENV"
          # Prove the probe actually answers before any evidence depends on it.
          # This step used to print the probe body to stdout and move on, so a
          # campaign-wide HTTP 403 cost two full CI cycles to diagnose from
          # outside the runner. Now it fails closed with the real reason.
          PROBE_STATUS="$(curl -sS -o /tmp/probe-body.txt -w '%{http_code}' "$TPB_PROBE_URL" || true)"
          if [ "$PROBE_STATUS" != "200" ]; then
            # One annotation per section, each written to its own file. A single
            # annotation is capped, and run f069d7f lost the Apache error log -
            # the one section that names the refusing rule - to that cap.
            DIAG=/tmp/probe-diag
            rm -rf "$DIAG" && mkdir -p "$DIAG"
            { echo "HTTP $PROBE_STATUS for $TPB_PROBE_URL"; head -c 300 /tmp/probe-body.txt; } \
              > "$DIAG/01-response.log" 2>&1 || true
            find /var /var/www "$PROBE_DIR" "$PROBE_DIR/php-probe.php" \
              -maxdepth 0 -printf '%M %u:%g %p\n' 2>&1 \
              | tee "$DIAG/02-permissions.log" > /dev/null || true
            # Can the web user actually read the probe? Separates authz from DAC.
            sudo -u www-data head -1 "$PROBE_DIR/php-probe.php" 2>&1 \
              | tee "$DIAG/03-wwwdata-can-read.log" > /dev/null || true
            id www-data 2>&1 | tee "$DIAG/04-wwwdata-id.log" > /dev/null || true
            sudo apache2ctl -M 2>&1 | grep -iE 'authz|alias|php' \
              | tee "$DIAG/05-modules.log" > /dev/null || true
            sudo apache2ctl -S 2>&1 | tee "$DIAG/06-vhosts.log" > /dev/null || true
            sudo cat /etc/apache2/sites-enabled/tpb.conf 2>&1 \
              | tee "$DIAG/07-vhost-conf.log" > /dev/null || true
            grep -nE 'Require|<Directory' /etc/apache2/apache2.conf 2>&1 \
              | tee "$DIAG/08-global-access-rules.log" > /dev/null || true
            sudo tail -30 /var/log/apache2/tpb-probe-error.log 2>&1 \
              | tee "$DIAG/09-probe-error-log.log" > /dev/null || true
            sudo tail -10 /var/log/apache2/tpb-probe-access.log 2>&1 \
              | tee "$DIAG/10-probe-access-log.log" > /dev/null || true
            echo "::error::Class D harness failure: the out-of-tree PHP runtime probe did not answer with HTTP 200 (got $PROBE_STATUS) at $TPB_PROBE_URL. Refusing to measure the lane PHP on a probe that cannot speak."
            for SECTION in "$DIAG"/*.log; do
              [ -e "$SECTION" ] || continue
              echo "::error::probe diagnostic $(basename "$SECTION"): $(tr '\n\r' '  ' < "$SECTION" | sed 's/%/%25/g' | cut -c1-1400)"
            done
            exit 1
          fi
          echo "runtime probe answers 200: $(cat /tmp/probe-body.txt)"
          if sudo -u www-data test -w "$WP_DIR/wp-content"; then
            echo 'wp-content writable by the web user (recorded as an environment fact)'
          else
            echo 'wp-content NOT writable by the web user (recorded as an environment fact)'
          fi

      - name: 'Baseline probes BEFORE activation (CPMS must be absent)'
        if: matrix.source == 'wordpress_org'
        run: |
          set -Eeuo pipefail
          # Hard structural guard first, so the evidence probe is never the only
          # thing standing between CPMS and this baseline.
          test ! -e "$WP_DIR/wp-content/plugins/clinic-practice-management" \
            || { echo '::error::CPMS plugin directory present in a baseline job — aborting (class D).'; exit 1; }
          python3 .github/third-party-baseline/probe.py wp \
            --store "$EVIDENCE_DIR/evidence.json" --phase pre \
            --wp-dir "$WP_DIR" --wp-url "$WP_URL" --probe-url "$TPB_PROBE_URL" \
            --db-name "$DB_NAME" \
            --expect-wp-version "$WP_VERSION" --expect-php "$PHP_VERSION" \
            --expect-mysql "$MYSQL_EXPECT"

      # The Persian baseline leg's "subject" enters the environment here, in the
      # same position the install step occupies for a product leg. That is why the
      # pre-phase probes above are the BEFORE evidence and the post-phase probes
      # below are the AFTER evidence for this leg too: the existing two-phase
      # structure is reused rather than a third phase being invented.
      - name: 'Apply the fa_IR / Asia/Tehran locale fixture (locale-baseline leg only)'
        if: matrix.kind == 'locale-baseline'
        run: |
          set -Eeuo pipefail
          LOCALE="${{ matrix.locale }}"
          SITE_TZ="${{ matrix.site_timezone }}"
          ann() { tail -20 "$1" | tr '\n\r' '  ' | sed 's/%/%25/g' | cut -c1-1400; }

          # Fail closed on an under-specified fixture: a locale leg without an
          # explicit locale AND an explicit timezone is not the fixture this
          # slice claims to measure.
          if [ -z "$LOCALE" ] || [ -z "$SITE_TZ" ]; then
            echo "::error::Class D harness failure: a locale-baseline leg must pin both a locale and an explicit site timezone (got locale='$LOCALE' timezone='$SITE_TZ')."
            exit 1
          fi

          cd "$WP_DIR"
          # Official WordPress.org translation distribution, exact locale, no
          # substitute. A retrieval failure is an environment failure, never a
          # reason to fall back to another language pack or to English.
          if ! wp language core install "$LOCALE" --allow-root > /tmp/wp-lang.log 2>&1; then
            echo "::error::Class C environment failure: the official $LOCALE core translation package could not be installed from translate.wordpress.org. diagnostic: $(ann /tmp/wp-lang.log)"
            exit 1
          fi
          if ! wp language core activate "$LOCALE" --allow-root >> /tmp/wp-lang.log 2>&1; then
            echo "::error::Class C environment failure: the $LOCALE core translation package installed but could not be activated. diagnostic: $(ann /tmp/wp-lang.log)"
            exit 1
          fi

          # gmt_offset is DERIVED from the pinned IANA zone by PHP itself, never
          # written as a guessed literal. Iran abolished DST in 2022, so the
          # current offset is fixed — but the harness records what PHP actually
          # returns instead of trusting that fact.
          #
          # The snippet goes through a quoted heredoc into a file rather than
          # `php -r '...'`: inside single quotes the shell would leave `$argv` and
          # `$tz` alone (they are PHP variables), but that is indistinguishable
          # from a quoting mistake to both a reader and a linter, so it is not
          # written that way.
          cat > /tmp/tpb-tz-offset.php <<'PHPEOF'
          <?php
          $tz = new DateTimeZone($argv[1]);
          printf('%.2f', (new DateTime('now', $tz))->getOffset() / 3600);
          PHPEOF
          TZ_OFFSET="$(php /tmp/tpb-tz-offset.php "$SITE_TZ")"
          echo "derived gmt_offset for $SITE_TZ from PHP: $TZ_OFFSET"
          wp option update timezone_string "$SITE_TZ" --allow-root > /tmp/wp-tz.log 2>&1
          wp option update gmt_offset "$TZ_OFFSET" --allow-root >> /tmp/wp-tz.log 2>&1

          # Prove the catalogues are on disk before any probe depends on them; the
          # probe re-asserts this independently so a fixture that silently half-
          # applied cannot pass on the strength of this step alone.
          for MO in "$LOCALE.mo" "admin-$LOCALE.mo"; do
            test -s "$WP_DIR/wp-content/languages/$MO" || {
              echo "::error::Class C environment failure: wp-content/languages/$MO is missing or empty after activating $LOCALE."
              exit 1; }
          done
          echo "locale fixture applied: WPLANG=$(wp option get WPLANG --allow-root) timezone_string=$(wp option get timezone_string --allow-root) gmt_offset=$(wp option get gmt_offset --allow-root)"

      - name: Install the exact pinned package(s) — fail closed, never substitute
        # The Persian baseline leg installs no package at all. Gated on `kind`
        # rather than on the presence of a locale field so the condition cannot
        # depend on how GitHub evaluates an unset matrix key.
        if: matrix.source == 'wordpress_org' && matrix.kind != 'locale-baseline'
        run: |
          set -Eeuo pipefail
          python3 .github/third-party-baseline/probe.py install \
            --store "$EVIDENCE_DIR/evidence.json" \
            --wp-dir "$WP_DIR" --package-dir "$EVIDENCE_DIR" \
            --subject-slug "${{ matrix.slug }}" \
            --subject-version "${{ matrix.version }}" \
            --deps "${{ matrix.deps }}"

      # INTERPRETATION BOUNDARY, recorded here so it is not a silent judgement
      # call: this lane serves the site over plain http://localhost:8080, which is
      # the environment the Real WordPress Acceptance harness already uses. A
      # subject that forces HTTP -> HTTPS on the front page therefore makes
      # `front_page_http_200_post` fail. That is recorded as product behaviour with
      # the full redirect chain as evidence; the harness never disables the
      # product's own HTTPS setting to obtain green, and a reviewer who judges the
      # missing TLS to be environmental reclassifies it to C from that recorded
      # chain rather than from a guess.
      - name: 'Baseline probes AFTER activation'
        if: matrix.source == 'wordpress_org'
        # "Activation" is the subject entering the environment: a pinned plugin
        # for a product leg, the fa_IR/Asia/Tehran locale fixture for the
        # locale-baseline leg. The probe set is identical either way.
        run: |
          set -Eeuo pipefail
          python3 .github/third-party-baseline/probe.py wp \
            --store "$EVIDENCE_DIR/evidence.json" --phase post \
            --wp-dir "$WP_DIR" --wp-url "$WP_URL" --probe-url "$TPB_PROBE_URL" \
            --db-name "$DB_NAME" \
            --expect-wp-version "$WP_VERSION" --expect-php "$PHP_VERSION" \
            --expect-mysql "$MYSQL_EXPECT"
          python3 .github/third-party-baseline/probe.py browser \
            --store "$EVIDENCE_DIR/evidence.json" --phase post \
            --wp-url "$WP_URL" --out-dir "$EVIDENCE_DIR" \
            --expect-dir "${{ matrix.admin_dir }}"

      - name: 'Persian locale / RTL / UTF-8 / timezone probes (locale-baseline leg only)'
        if: matrix.kind == 'locale-baseline'
        run: |
          set -Eeuo pipefail
          python3 .github/third-party-baseline/probe.py locale \
            --store "$EVIDENCE_DIR/evidence.json" --phase post \
            --wp-dir "$WP_DIR" --wp-url "$WP_URL" --probe-url "$TPB_PROBE_URL" \
            --db-name "$DB_NAME" \
            --expect-locale "${{ matrix.locale }}" \
            --expect-timezone "${{ matrix.site_timezone }}" \
            --expect-wp-version "$WP_VERSION" --expect-php "$PHP_VERSION" \
            --expect-mysql-major "${MYSQL_EXPECT%%.*}"

      - name: Finalize the machine-readable subject result
        if: always() && matrix.source == 'wordpress_org'
        run: |
          set -Eeuo pipefail
          python3 .github/third-party-baseline/probe.py finalize \
            --store "$EVIDENCE_DIR/evidence.json" \
            --out "$EVIDENCE_DIR/subject-result.json" \
            --subject-id "${{ matrix.id }}" \
            --deps "${{ matrix.deps }}" \
            --expect-wp-version "$WP_VERSION" --expect-php "$PHP_VERSION" \
            --mysql-image 'mysql:8.4.11'
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("STATE:", d["state"]); print("counts:", d["counts"]); print("taxonomy:", d["taxonomy"])' "$EVIDENCE_DIR/subject-result.json"

      - name: Per-subject evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpb-${{ matrix.id }}
          # Explicit allowlist: evidence and screenshots only. No package ZIP, no
          # wp-config.php, no cookie jar, no credential, no PHI (none exists).
          path: |
            ${{ env.EVIDENCE_DIR }}/subject-result.json
            ${{ env.EVIDENCE_DIR }}/evidence.json
            ${{ env.EVIDENCE_DIR }}/provenance.json
            ${{ env.EVIDENCE_DIR }}/front.png
            ${{ env.EVIDENCE_DIR }}/wp-admin.png
          if-no-files-found: warn
          retention-days: 14

  summary:
    name: Aggregate evidence summary
    needs: subject-baseline
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download per-subject evidence
        uses: actions/download-artifact@v4
        with:
          path: /tmp/tpb-results
          pattern: tpb-*

      - name: Build the human-readable summary
        run: |
          set -Eeuo pipefail
          python3 .github/third-party-baseline/report.py \
            --results-dir /tmp/tpb-results \
            --out-dir /tmp/tpb-summary \
            --lane "$LANE" \
            --head-sha "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat /tmp/tpb-summary/summary.md

      - name: Summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: tpb-summary
          path: /tmp/tpb-summary/
          retention-days: 14
