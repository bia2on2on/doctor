name: Phase 2 quiet-hours RED (temporary)

on:
  workflow_dispatch:
  push:
    branches: ['arena/**']

permissions:
  contents: read

defaults:
  run:
    working-directory: clinic-practice-management

env:
  WP_TESTS_DIR: /tmp/wordpress-test-lib
  WP_CORE_DIR: /tmp/wordpress

jobs:
  focused-red:
    name: Focused reminder Location-timezone RED
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, mysqli, pcntl, curl
          coverage: none

      - name: Install dependencies (ephemeral PHPUnit 9.6 for WP test lib)
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          composer require --dev phpunit/phpunit:^9.6 --no-interaction --no-progress --with-all-dependencies

      - name: Prepare WordPress test suite
        run: bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 6.7.2

      - name: Run one focused RED test in a fresh process
        run: |
          set -o pipefail
          php -d memory_limit=1G vendor/bin/phpunit --no-configuration \
            --bootstrap tests/integration-bootstrap.php \
            --filter ReminderLocationQuietHoursRedTest \
            tests/Integration/ReminderLocationQuietHoursRedTest.php \
            2>&1 | tee /tmp/quiet-hours-red.log

      - name: Upload RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-quiet-hours-red-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/quiet-hours-red.log
          if-no-files-found: error
          retention-days: 14
