name: First-Practice Browser Acceptance (MariaDB 11.4.13)

# Real administrator ZIP installation, personal-practice completion and
# interrupted-setup recovery on both MySQL 8 and exact MariaDB 11.4.13.
# The existing Real WP Acceptance / 47-check contract stays unchanged.
# This lane provisions WordPress + PHP + MariaDB 11.4.13 and drives the
# repository-native Playwright harness (bin/rwp-first-practice.py).
# Synthetic data only. Official ZIP built from the exact tested SHA.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && format('main-run-{0}', github.run_id) || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read
  pull-requests: write

env:
  WP_VERSION: '7.1.3'
  PHP_VERSION: '8.2'
  WP_DIR: /home/runner/rwp-fp
  WP_URL: http://localhost:8080
  DB_NAME: cpms_fp
  ADMIN_USER: acc_admin
  ADMIN_PASS: Acceptance-2026!
  SUBSCRIBER_USER: acc_subscriber
  SUBSCRIBER_PASS: Acceptance-2026!
  SECOND_ADMIN_USER: acc_admin2
  SECOND_ADMIN_PASS: Acceptance-2026!

jobs:
  first-practice:
    name: First-practice browser (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mariadb
            image: mariadb:11.4.13
          - database: mysql
            image: mysql:8

    services:
      database:
        image: ${{ matrix.image }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot || mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mysqli, curl, mbstring, xml, zip, gd, sodium
          coverage: none

      - name: Tooling (apache + wp-cli + playwright/chromium)
        run: |
          mkdir -p /tmp/fp
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client apache2 libapache2-mod-php php-mysql php-mbstring php-xml php-curl php-zip php-gd > /tmp/fp/apt.log 2>&1 || { tail -20 /tmp/fp/apt.log; exit 1; }
          curl -sS https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp && sudo chmod +x /usr/local/bin/wp
          wp --allow-root --version
          (pip install --quiet playwright 2>/dev/null || pip install --quiet --break-system-packages playwright)
          python3 -m playwright install --with-deps chromium > /tmp/fp/pw.log 2>&1 || { tail -10 /tmp/fp/pw.log; exit 1; }

      - name: Lint first-practice harness
        run: |
          python3 -m py_compile clinic-practice-management/bin/rwp-first-practice.py clinic-practice-management/bin/rwp-install-zip.py clinic-practice-management/bin/rwp-recovery.py clinic-practice-management/bin/rwp_personal.py
          python3 clinic-practice-management/bin/acceptance-isolation-check.py clinic-practice-management/bin/rwp-first-practice.py
          bash -n clinic-practice-management/bin/build-release.sh

      - name: Pin and record database server
        run: |
          set -euo pipefail
          server_version="$(mysql --protocol=TCP --host=127.0.0.1 --port=3306 --user=root --password=root --batch --skip-column-names --execute='SELECT VERSION()')"
          echo "${{ matrix.database }} server VERSION(): ${server_version}"
          case "${{ matrix.database }}:$server_version" in
            mariadb:11.4.13-MariaDB*|mysql:8.*) ;;
            *) echo "Unexpected database server: ${server_version}" >&2; exit 1 ;;
          esac
          printf '%s\n' "$server_version" > /tmp/fp/database-version.txt

      - name: Clean WordPress (isolated DB)
        run: |
          set -euo pipefail
          curl -sS "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" -o /tmp/wp.tar.gz
          tar -xzf /tmp/wp.tar.gz -C /tmp && mv /tmp/wordpress "$WP_DIR"
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot -proot -e "CREATE DATABASE $DB_NAME CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          cd "$WP_DIR"
          wp config create --dbname="$DB_NAME" --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --dbprefix='wp_' --skip-salts --allow-root
          wp config shuffle-salts --allow-root
          wp config set WP_DEBUG true --raw --allow-root
          wp config set WP_DEBUG_LOG true --raw --allow-root
          wp config set WP_DEBUG_DISPLAY false --raw --allow-root
          wp config set DISALLOW_FILE_EDIT true --raw --allow-root
          wp config set FS_METHOD direct --allow-root
          # Freeze background jobs while constructing/comparing synthetic
          # interrupted history. Cron is exercised by the existing other lanes.
          wp config set DISABLE_WP_CRON true --raw --allow-root
          wp core install --url="$WP_URL" --title="CPMS First-Practice Acceptance" --admin_user="$ADMIN_USER" --admin_password="$ADMIN_PASS" --admin_email=admin@acc.local --skip-email --allow-root
          wp core version --allow-root | tee /tmp/fp/wp-version.txt

      - name: Apache + mod_php
        run: |
          sudo tee /etc/apache2/sites-available/fp.conf >/dev/null <<CONF
          <VirtualHost *:8080>
            DocumentRoot $WP_DIR
            <Directory $WP_DIR>
              AllowOverride All
              Require all granted
            </Directory>
            ErrorLog \${APACHE_LOG_DIR}/fp-error.log
            CustomLog \${APACHE_LOG_DIR}/fp-access.log combined
          </VirtualHost>
          CONF
          sudo sed -i 's/^Listen 80$/Listen 8080/' /etc/apache2/ports.conf
          sudo a2dissite 000-default >/dev/null && sudo a2ensite fp >/dev/null
          sudo a2enmod rewrite >/dev/null
          sudo mkdir -p "$WP_DIR/wp-content"
          sudo touch "$WP_DIR/wp-content/debug.log"
          sudo chmod 777 "$WP_DIR/wp-content"
          sudo chmod 666 "$WP_DIR/wp-content/debug.log"
          for INI in /etc/php/*/apache2/php.ini; do
            sudo sed -i 's/^display_errors = .*/display_errors = Off/' "$INI"
            # The official ZIP includes the locked runtime SDK; a browser
            # upload must not inherit PHP's small default request limit.
            sudo sed -i 's/^upload_max_filesize = .*/upload_max_filesize = 64M/' "$INI"
            sudo sed -i 's/^post_max_size = .*/post_max_size = 72M/' "$INI"
            # Persist fatals even before WordPress sets WP_DEBUG_LOG.
            sudo sed -i "s#^error_log = .*#error_log = $WP_DIR/wp-content/debug.log#" "$INI"
            grep -q "^error_log = $WP_DIR/wp-content/debug.log" "$INI" \
              || echo "error_log = $WP_DIR/wp-content/debug.log" | sudo tee -a "$INI" >/dev/null
          done
          sudo chmod a+rx /home/runner
          sudo chmod -R a+rX "$WP_DIR"
          sudo chmod 777 "$WP_DIR/wp-content"
          sudo chmod 666 "$WP_DIR/wp-content/debug.log"
          sudo apache2ctl configtest && sudo service apache2 start
          curl -s -o /dev/null -w 'home HTTP %{http_code}\n' "$WP_URL/"
          echo '<?php echo PHP_VERSION;' > "$WP_DIR/fp-phpver.php"
          curl -sS "$WP_URL/fp-phpver.php" | tee /tmp/fp/apache-php-version.txt
          rm -f "$WP_DIR/fp-phpver.php"
          php -r 'echo PHP_VERSION, PHP_EOL;' | tee /tmp/fp/cli-php-version.txt
          # Prove Apache/PHP can persist diagnostics (wp-load so WP_DEBUG_LOG applies).
          printf '%s\n' '<?php require __DIR__ . "/wp-load.php"; throw new Exception("CPMS_DIAG_PROBE");' > "$WP_DIR/cpms-diag-probe.php"
          curl -sS "$WP_URL/cpms-diag-probe.php" >/dev/null || true
          rm -f "$WP_DIR/cpms-diag-probe.php"
          if ! grep -q 'CPMS_DIAG_PROBE' "$WP_DIR/wp-content/debug.log"; then
            echo 'DIAG: wp-content/debug.log missing probe; apache error log follows' >&2
            sudo tail -30 /var/log/apache2/fp-error.log >&2 || true
            ls -la "$WP_DIR/wp-content" >&2 || true
            cat "$WP_DIR/wp-content/debug.log" >&2 || true
            exit 1
          fi
          : > "$WP_DIR/wp-content/debug.log"
          echo 'DIAG: Apache/PHP debug.log writable'

      - name: Build official release ZIP from this SHA
        env:
          PRODUCING_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          echo "PRODUCING_SHA=${PRODUCING_SHA}" | tee /tmp/fp/producing-sha.txt
          echo "PRODUCING_SHA=${PRODUCING_SHA}" >> "$GITHUB_ENV"
          bash clinic-practice-management/bin/build-release.sh
          ZIP=$(ls clinic-practice-management/dist/clinic-practice-management-*.zip | head -1)
          [ -f "$ZIP" ] || { echo 'ZIP NOT BUILT'; exit 1; }
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"
          sha256sum "$ZIP" | tee /tmp/fp/zip.sha256
          ls -la clinic-practice-management/dist/

      - name: Administrator browser uploads ZIP and activates plugin
        id: cpms_install
        run: |
          set -euo pipefail
          sudo chown -R www-data:www-data "$WP_DIR/wp-content"
          set -o pipefail
          ZIP_PATH="$GITHUB_WORKSPACE/$ZIP_PATH" OUT=/tmp/fp python3 clinic-practice-management/bin/rwp-install-zip.py | tee /tmp/fp/plugin-install.log
          wp plugin is-active clinic-practice-management --path="$WP_DIR" --allow-root || { echo 'PLUGIN NOT ACTIVE'; exit 1; }
          echo "installed from official ZIP built at ${PRODUCING_SHA:-$GITHUB_SHA} (not a source mount)"

      - name: Verify migration 0029 + no PHP fatal + admin reachable
        id: migrations
        run: |
          set -euo pipefail
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot -proot "$DB_NAME" -e "SELECT version, applied_at FROM wp_cpms_schema_migrations ORDER BY version;" | tee /tmp/fp/schema-migrations.txt
          grep -q '2026_10_18_0029' /tmp/fp/schema-migrations.txt || { echo 'migration 0029 missing'; exit 1; }
          cat > /tmp/fp/check-schema.php <<'PHPEOF'
          <?php
          $v = \ClinicCore\Bootstrap\App::migrations()->currentVersion();
          echo "schema: $v\n";
          exit($v === '2026_10_18_0029' ? 0 : 1);
          PHPEOF
          wp eval-file /tmp/fp/check-schema.php --path="$WP_DIR" --allow-root
          if [ -f "$WP_DIR/wp-content/debug.log" ]; then
            if grep -qE 'PHP Fatal error|PHP Parse error|Uncaught|There has been a critical error' "$WP_DIR/wp-content/debug.log"; then
              echo 'PHP fatal during install/activation'
              grep -nE 'PHP Fatal error|PHP Parse error|Uncaught|There has been a critical error' "$WP_DIR/wp-content/debug.log" | tail -20
              exit 1
            fi
          fi
          curl -s -o /dev/null -w 'login HTTP %{http_code}\n' "$WP_URL/wp-login.php" | tee /tmp/fp/admin-reachable.txt
          curl -s -o /dev/null -w 'admin HTTP %{http_code}\n' "$WP_URL/wp-admin/" >> /tmp/fp/admin-reachable.txt
          grep -q 'login HTTP 200' /tmp/fp/admin-reachable.txt
          echo 'WordPress admin login reachable; plugin active; schema 0028 applied'

      - name: Isolated actors (no Clinic memberships)
        run: |
          set -euo pipefail
          wp user create "$SUBSCRIBER_USER" 'sub@acc.local' --user_pass="$SUBSCRIBER_PASS" --role=subscriber --path="$WP_DIR" --allow-root
          wp user create "$SECOND_ADMIN_USER" 'admin2@acc.local' --user_pass="$SECOND_ADMIN_PASS" --role=administrator --path="$WP_DIR" --allow-root
          MEMBERS=$(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot -proot -N -e "SELECT COUNT(*) FROM $DB_NAME.wp_cpms_clinic_memberships;")
          echo "pre-browser membership rows: $MEMBERS"
          wp db export /tmp/fp/pristine.sql --path="$WP_DIR" --allow-root
          [ "$MEMBERS" = "0" ] || { echo 'FAIL: memberships must be zero before first-practice browser'; exit 1; }

      - name: Browser first-practice onboarding
        id: browser
        run: |
          BASE="$WP_URL" \
          ADMIN_USER="$ADMIN_USER" ADMIN_PASS="$ADMIN_PASS" \
          SUBSCRIBER_USER="$SUBSCRIBER_USER" SUBSCRIBER_PASS="$SUBSCRIBER_PASS" \
          SECOND_ADMIN_USER="$SECOND_ADMIN_USER" SECOND_ADMIN_PASS="$SECOND_ADMIN_PASS" \
          WP_DIR="$WP_DIR" \
          OUT=/tmp/fp \
          python3 clinic-practice-management/bin/rwp-first-practice.py > /tmp/fp/first-practice.log 2>&1
          RC=$?
          cat /tmp/fp/first-practice.log
          if [ "$RC" -ne 0 ]; then echo "FIRST-PRACTICE BROWSER FAILED (rc=$RC)"; exit "$RC"; fi

      - name: Interrupted installation browser fixtures A–G
        if: always() && steps.cpms_install.outcome == 'success' && steps.migrations.outcome == 'success'
        run: |
          set -o pipefail
          OUT=/tmp/fp python3 clinic-practice-management/bin/rwp-recovery.py | tee /tmp/fp/recovery.log

      - name: Capture debug log + versions
        if: always()
        run: |
          mkdir -p /tmp/fp/logs
          {
            echo "producing_sha=${PRODUCING_SHA:-$GITHUB_SHA}"
            echo "wordpress=$(cat /tmp/fp/wp-version.txt 2>/dev/null || echo unknown)"
            echo "php_cli=$(cat /tmp/fp/cli-php-version.txt 2>/dev/null || echo unknown)"
            echo "php_apache=$(cat /tmp/fp/apache-php-version.txt 2>/dev/null || echo unknown)"
            echo "database=${{ matrix.database }} $(cat /tmp/fp/database-version.txt 2>/dev/null || echo unknown)"
            echo "zip_sha256=$(cut -d' ' -f1 /tmp/fp/zip.sha256 2>/dev/null || echo unknown)"
          } | tee /tmp/fp/versions.txt
          if [ -f "$WP_DIR/wp-content/debug.log" ]; then
            cp "$WP_DIR/wp-content/debug.log" /tmp/fp/logs/debug.log
          else
            : > /tmp/fp/logs/debug.log
          fi
          sudo cp /var/log/apache2/fp-error.log /tmp/fp/logs/apache-error.log 2>/dev/null || :
          if grep -qE 'PHP Fatal error|Uncaught|There has been a critical error' /tmp/fp/logs/debug.log; then
            echo 'LOG GATE: FAIL — fatal/uncaught/critical in debug.log'
            grep -nE 'PHP Fatal error|Uncaught|There has been a critical error' /tmp/fp/logs/debug.log | tail -20
            exit 1
          fi
          echo 'LOG GATE: clean'

      - name: Upload first-practice evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwp-first-practice-${{ matrix.database }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/fp/
            !/tmp/fp/**/*.zip
            !/tmp/fp/**/*.sql
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo '## First-practice browser acceptance — ${{ matrix.database }}'
            echo
            echo "- producing SHA: \`${GITHUB_SHA}\`"
            echo "- WordPress: \`$(cat /tmp/fp/wp-version.txt 2>/dev/null || echo unknown)\`"
            echo "- PHP CLI: \`$(cat /tmp/fp/cli-php-version.txt 2>/dev/null || echo unknown)\`"
            echo "- PHP Apache: \`$(cat /tmp/fp/apache-php-version.txt 2>/dev/null || echo unknown)\`"
            echo "- Database: \`$(cat /tmp/fp/database-version.txt 2>/dev/null || echo unknown)\`"
            echo "- ZIP sha256: \`$(cat /tmp/fp/zip.sha256 2>/dev/null || echo unknown)\`"
            echo
            echo '```'
            cat /tmp/fp/plugin-install.log /tmp/fp/recovery.log 2>/dev/null || true
            tail -80 /tmp/fp/first-practice.log 2>/dev/null || echo '(browser step did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish first-practice log to PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### First-practice browser (${{ matrix.database }}) — job ${{ job.status }}"
            echo
            echo "- producing SHA: \`${GITHUB_SHA}\`"
            echo "- versions:"
            echo '```'
            cat /tmp/fp/versions.txt 2>/dev/null || echo '(versions not captured)'
            echo '```'
            echo "- browser log (secrets redacted by the harness; passwords are not copied here):"
            echo '```'
            cat /tmp/fp/plugin-install.log 2>/dev/null || true
            cat /tmp/fp/first-practice.log 2>/dev/null || echo '(browser step did not produce a log)'
            cat /tmp/fp/recovery.log 2>/dev/null || echo '(recovery browser did not produce a log)'
            echo '```'
          } > /tmp/fp/pr-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/fp/pr-comment.md

      - name: Mirror bounded mobile visual evidence for restricted reviewers
        if: always() && github.event_name == 'pull_request' && matrix.database == 'mariadb'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PYCODE'
          import base64, os, pathlib, subprocess
          images = [pathlib.Path('/tmp/fp/personal-mobile-viewport.jpg'), pathlib.Path('/tmp/fp/recovery/legacy_same_admin-viewport.jpg')]
          for kind in ('host_zero', 'host_null'):
              for suffix in ('viewport', 'after-viewport'):
                  images.append(pathlib.Path(f'/tmp/fp/recovery/{kind}_same_admin-{suffix}.jpg'))
          for image in images:
              if not image.exists() or image.stat().st_size > 40000:
                  print('Visual mirror unavailable or exceeds bound: ' + image.name)
                  continue
              # Synthetic viewport only; no cookies, nonces, HTML, or SQL dump.
              body = ('### Bounded mobile viewport: ' + image.name + '\n'
                      + 'Run ${{ github.run_id }}; head ${{ github.event.pull_request.head.sha }}. '
                      + 'JPEG base64 for reviewers unable to reach Actions artifact storage. Full PNG remains in the artifact.\n'
                      + '<details><summary>Synthetic screenshot bytes</summary>\n\n```text\n'
                      + base64.b64encode(image.read_bytes()).decode() + '\n```\n</details>\n')
              path = pathlib.Path('/tmp/fp/mobile-mirror.md')
              path.write_text(body)
              subprocess.run(['gh', 'pr', 'comment', os.environ['PR_NUMBER'], '--body-file', str(path)], check=True)
          PYCODE
