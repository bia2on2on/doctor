name: UnitTestDebug
on: pull_request
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "PR number is ${{ github.event.pull_request.number }}"
          gh pr comment "${{ github.event.pull_request.number }}" --body "DEBUG_COMMENT_FROM_WORKFLOW" || echo "comment failed"
        env:
          GH_TOKEN: ${{ github.token }}
