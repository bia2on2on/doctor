name: UnitTestDebug
on: pull_request
permissions:
  pull-requests: write
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml
      - run: |
          cd clinic-practice-management
          composer install --prefer-dist --no-progress --no-interaction
          set +e
          php -d memory_limit=512M vendor/bin/phpunit --filter 'SystemHealth' --testsuite Unit > /tmp/unit.log 2>&1
          rc=$?
          echo "exit code $rc"
          if [ $rc -ne 0 ]; then
            # emit first 40 lines of log as annotations
            head -n 40 /tmp/unit.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          tail -20 /tmp/unit.log
          exit $rc
