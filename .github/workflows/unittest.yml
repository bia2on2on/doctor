name: UnitTestDebug
on: pull_request
permissions:
  pull-requests: write
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "hello" && gh pr comment ${{ github.event.pull_request.number }} --body "HELLO_DEBUG" || echo "comment failed"
        env:
          GH_TOKEN: ${{ github.token }}
