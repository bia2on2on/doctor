name: UnitTestDebug
on: pull_request
permissions:
  pull-requests: write
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::notice::PR_NUMBER=${{ github.event.pull_request.number }}"
          gh pr comment "${{ github.event.pull_request.number }}" --body "HELLO_DEBUG_2" && echo "::notice::comment posted" || echo "::error::comment failed"
        env:
          GH_TOKEN: ${{ github.token }}
