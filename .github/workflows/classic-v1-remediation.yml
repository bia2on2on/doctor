name: Classic V1 remediation evidence

on:
  push:
    branches: [arena/9b3bd6a4-doctor]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'clinic-practice-management/**'
      - '.github/workflows/classic-v1-remediation.yml'
      - 'standalone-demo/**'

permissions:
  contents: read

concurrency:
  group: classic-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    name: Regressions (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql
            image: mysql:8
            port: 3306
          - database: mariadb
            image: mariadb:11.4.13
            port: 3307
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=10s --health-timeout=5s --health-retries=20
      mariadb:
        image: mariadb:11.4.13
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ['3307:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: clinic-practice-management
    env:
      WP_TESTS_DIR: /tmp/wordpress-test-lib
      WP_CORE_DIR: /tmp/wordpress
      BASELINE_SHA: 9bf84304b2b143138c638fa1ca1d71869aa1e244
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, mysqli, curl, sodium
          coverage: none
      - name: Record exact server and source versions
        run: |
          set -euo pipefail
          mkdir -p /tmp/classic-v1
          mysql --protocol=TCP -h 127.0.0.1 -P ${{ matrix.port }} -uroot -proot -NBe 'SELECT VERSION()' | tee /tmp/classic-v1/db-version.txt
          if [ "${{ matrix.database }}" = mariadb ]; then grep -q '^11\.4\.13-MariaDB' /tmp/classic-v1/db-version.txt; else grep -q '^8\.' /tmp/classic-v1/db-version.txt; fi
          git rev-parse HEAD > /tmp/classic-v1/candidate-sha.txt
          php -v | head -1 > /tmp/classic-v1/php-version.txt
      - name: Install locked test dependencies and WordPress
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          composer require --dev phpunit/phpunit:^9.6 --no-interaction --no-progress --with-all-dependencies
          bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 7.1.3 ${{ matrix.port }}
      - name: Prepare archived baseline with identical regression tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/classic-v1/baseline/clinic-practice-management
          git -C "$GITHUB_WORKSPACE" archive "$BASELINE_SHA" clinic-practice-management | tar -x --strip-components=1 -C /tmp/classic-v1/baseline/clinic-practice-management
          cp -a tests/. /tmp/classic-v1/baseline/clinic-practice-management/tests/
          mkdir -p /tmp/classic-v1/baseline/clinic-practice-management/vendor
          cp -a vendor/. /tmp/classic-v1/baseline/clinic-practice-management/vendor/
          # Regenerate Composer paths against the archived production source;
          # never load candidate src through a copied autoload map.
          cd /tmp/classic-v1/baseline/clinic-practice-management
          composer dump-autoload --no-interaction 2>&1 | tee /tmp/classic-v1/baseline-prepare.log
      - name: Expose baseline preparation failure
        if: failure()
        run: |
          { echo '### Baseline preparation failed'; echo '```'; tail -60 /tmp/classic-v1/baseline-prepare.log 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Execute baseline regressions (failures are evidence, not a pass)
        run: |
          set -o pipefail
          cd /tmp/classic-v1/baseline/clinic-practice-management
          rc=0
          python3 - <<'PY'
          import os
          files=[os.path.join(os.getcwd(),'tests/Integration/ClassicV1CriticalRemediationTest.php'),os.path.join(os.getcwd(),'tests/Integration/ClassicV1PerformanceProbeTest.php')]
          open('/tmp/classic-v1/baseline-suite.xml','w').write('<phpunit><testsuites><testsuite name="classic">'+''.join('<file>'+f+'</file>' for f in files)+'</testsuite></testsuites></phpunit>')
          PY
          CPMS_PERF_OUTPUT=/tmp/classic-v1/baseline-${{ matrix.database }}.json php -d memory_limit=1G vendor/bin/phpunit --configuration /tmp/classic-v1/baseline-suite.xml --log-junit /tmp/classic-v1/baseline-${{ matrix.database }}.xml --bootstrap tests/integration-bootstrap.php 2>&1 | tee /tmp/classic-v1/baseline-${{ matrix.database }}.log || rc=$?
          echo "$rc" > /tmp/classic-v1/baseline-exit.txt
          grep -E '^(OK|Tests:|FAILURES|ERRORS)' /tmp/classic-v1/baseline-${{ matrix.database }}.log || true
          python3 - /tmp/classic-v1/baseline-${{ matrix.database }}.xml <<'PY' || true
          import os, sys, xml.etree.ElementTree as ET
          p=sys.argv[1]
          if os.path.isfile(p):
              root=ET.parse(p).getroot()
              for case in root.iter('testcase'):
                  for tag in ('failure','error'):
                      node=case.find(tag)
                      if node is not None:
                          text=(node.get('message') or node.text or '').replace('%','%25').replace('\r','%0D').replace('\n','%0A')[:900]
                          print('::notice::BASELINE '+case.get('name','test')+' '+text)
          PY
      - name: Reset database before candidate on the same runner
        run: |
          mysql --protocol=TCP -h 127.0.0.1 -P ${{ matrix.port }} -uroot -proot -e 'DROP DATABASE wordpress_test; CREATE DATABASE wordpress_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
      - name: Execute candidate regressions and adjacent workflow coverage
        run: |
          set -o pipefail
          python3 - <<'PY'
          import os
          files=[os.path.join(os.getcwd(),'tests/Integration/'+f) for f in ['ClassicV1CriticalRemediationTest.php','ClassicV1PerformanceProbeTest.php','SmsOtpDispatchTest.php','OtpSecurityTest.php','SmsClinicAuthorizationTest.php','ClinicalFlowTest.php','Phase11ReceptionAppointmentCancelRedTest.php']]
          open('/tmp/classic-v1/candidate-suite.xml','w').write('<phpunit><testsuites><testsuite name="classic">'+''.join('<file>'+f+'</file>' for f in files)+'</testsuite></testsuites></phpunit>')
          PY
          CPMS_PERF_OUTPUT=/tmp/classic-v1/candidate-${{ matrix.database }}.json php -d memory_limit=1G vendor/bin/phpunit --configuration /tmp/classic-v1/candidate-suite.xml --log-junit /tmp/classic-v1/candidate-${{ matrix.database }}.xml --bootstrap tests/integration-bootstrap.php 2>&1 | tee /tmp/classic-v1/candidate-${{ matrix.database }}.log
      - name: Expose candidate regression failures
        if: failure()
        run: |
          tail -25 /tmp/classic-v1/candidate-${{ matrix.database }}.log 2>/dev/null | while IFS= read -r line; do echo "::error::CANDIDATE LOG ${line}"; done
          python3 - /tmp/classic-v1/candidate-${{ matrix.database }}.xml <<'PY' || true
          import os, sys, xml.etree.ElementTree as ET
          p=sys.argv[1]
          if os.path.isfile(p):
              root=ET.parse(p).getroot()
              for case in root.iter('testcase'):
                  for tag in ('failure','error'):
                      node=case.find(tag)
                      if node is not None:
                          text=(node.get('message') or node.text or '').replace('%','%25').replace('\r','%0D').replace('\n','%0A')[:900]
                          print('::error::CANDIDATE '+case.get('name','test')+' '+text)
          PY
      - name: Evidence summary
        if: always()
        run: |
          {
            echo '### Classic V1 remediation — ${{ matrix.database }}'
            echo "Baseline: $BASELINE_SHA; candidate: $(git rev-parse HEAD)"
            echo "DB: $(cat /tmp/classic-v1/db-version.txt 2>/dev/null || echo unavailable)"
            echo 'Baseline exit:' "$(cat /tmp/classic-v1/baseline-exit.txt 2>/dev/null || echo not-run)"
            grep -E '^(OK|Tests:|FAILURES|ERRORS)' /tmp/classic-v1/*-${{ matrix.database }}.log 2>/dev/null || true
            echo 'In-process REST measurements are not HTTP page timings. Artifacts retain every sample.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          python3 - "${{ matrix.database }}" <<'PY' || true
          import json,sys
          for label in ('baseline','candidate'):
              try:
                  d=json.load(open('/tmp/classic-v1/'+label+'-'+sys.argv[1]+'.json'))
                  import statistics
                  summary=d.get('summary') or {k:{'n':len(v),'median_ms':round(statistics.median(x['ms'] for x in v),3),'median_queries':statistics.median(x['queries'] for x in v)} for k,v in d['samples'].items()}
                  print('::notice::PERF '+label+' '+json.dumps(summary,sort_keys=True))
              except Exception as e: print('::notice::PERF '+label+' unavailable '+str(e))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classic-v1-${{ matrix.database }}
          path: |
            /tmp/classic-v1/*.json
            /tmp/classic-v1/*.xml
            /tmp/classic-v1/*.log
            /tmp/classic-v1/*.txt
          include-hidden-files: false
          retention-days: 14

  http-profile:
    name: Real HTTP profile (MySQL 8, same runner)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8
        env: {MYSQL_ROOT_PASSWORD: root}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      WP_DIR: /home/runner/www
      WP_URL: http://localhost:8080
      BASELINE_SHA: 9bf84304b2b143138c638fa1ca1d71869aa1e244
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, curl, mbstring, xml, zip, gd, sodium
          tools: composer:v2
      - name: Apache and WP-CLI
        uses: ./.github/actions/wp-stack-tooling
        with:
          apt-packages: mysql-client apache2 libapache2-mod-php php-mysql php-mbstring php-xml php-curl php-zip php-gd
          apt-log-dir: /tmp/classic-http
      - name: Install WordPress and Apache
        run: |
          set -euo pipefail
          mkdir -p /tmp/classic-http
          mysql --protocol=TCP -h127.0.0.1 -uroot -proot -NBe 'SELECT VERSION()' | tee /tmp/classic-http/db-version.txt
          grep -q '^8\.' /tmp/classic-http/db-version.txt
          curl -fsSL https://wordpress.org/wordpress-7.1.3.tar.gz | tar -xz -C /home/runner
          mv /home/runner/wordpress "$WP_DIR"
          mysql --protocol=TCP -h127.0.0.1 -uroot -proot -e 'CREATE DATABASE cpms_http CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          cd "$WP_DIR"
          wp config create --dbname=cpms_http --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp config set DISABLE_WP_CRON true --raw --allow-root
          wp config set CPMS_CI_HTTP_PROFILER true --raw --allow-root
          wp core install --url="$WP_URL" --title='Synthetic Classic V1' --admin_user=ci_admin --admin_password='Synthetic-Only-2026!' --admin_email=ci@example.invalid --skip-email --allow-root
          wp rewrite structure '/%postname%/' --allow-root
          sudo tee /etc/apache2/sites-available/cpms.conf >/dev/null <<CONF
          <VirtualHost *:8080>
            DocumentRoot $WP_DIR
            <Directory $WP_DIR>
              AllowOverride All
              Require all granted
            </Directory>
          </VirtualHost>
          CONF
          sudo sed -i 's/^Listen 80$/Listen 8080/' /etc/apache2/ports.conf
          sudo a2dissite 000-default && sudo a2ensite cpms && sudo a2enmod rewrite
          sudo chmod a+rx /home/runner
          sudo mkdir -p "$WP_DIR/wp-content/upgrade" "$WP_DIR/wp-content/mu-plugins"
          sudo chown -R www-data:www-data "$WP_DIR/wp-content"
          sudo chmod -R a+rwX "$WP_DIR/wp-content"
          sudo apache2ctl configtest && sudo service apache2 start
      - name: Build baseline and candidate official ZIPs
        run: |
          set -euo pipefail
          mkdir -p /tmp/classic-http/baseline/clinic-practice-management
          git archive "$BASELINE_SHA" clinic-practice-management | tar -x --strip-components=1 -C /tmp/classic-http/baseline/clinic-practice-management
          (cd /tmp/classic-http/baseline/clinic-practice-management && bash bin/build-release.sh)
          (cd clinic-practice-management && bash bin/build-release.sh)
      - name: Install baseline and CI profiler
        run: |
          set -euo pipefail
          zip=$(find /tmp/classic-http/baseline/clinic-practice-management/dist -name '*.zip' | head -1)
          wp plugin install "$zip" --force --activate --path="$WP_DIR" --allow-root
          sudo mkdir -p "$WP_DIR/wp-content/mu-plugins"
          sudo cp clinic-practice-management/tests/fixtures/classic-v1-http-profiler-mu.php "$WP_DIR/wp-content/mu-plugins/classic-v1-profiler.php"
          sudo service apache2 restart
      - name: Seed synthetic authenticated HTTP workload
        run: |
          set -euo pipefail
          if ! WP_HOME="$WP_DIR" php clinic-practice-management/tests/fixtures/pilot-doctor-portal-fixture.php > /tmp/classic-http/fixture.log 2>&1; then
            tail -25 /tmp/classic-http/fixture.log | while IFS= read -r line; do echo "::error::FIXTURE $line"; done
            exit 1
          fi
          echo "::notice::HTTP seed fixture-ok"
          cat /tmp/doctor-portal.env >> "$GITHUB_ENV"
          python3 - <<'PY'
          import shlex
          with open('/tmp/classic-http/fixture-env.sh','w') as out:
              for line in open('/tmp/doctor-portal.env'):
                  if '=' in line:
                      k,v=line.rstrip('\n').split('=',1)
                      out.write('export '+k+'='+shlex.quote(v)+'\n')
          PY
          echo "::notice::HTTP seed env-ok"
          source /tmp/classic-http/fixture-env.sh
          echo "::notice::HTTP seed source-ok"
          if ! WP_HOME="$WP_DIR" php clinic-practice-management/tests/fixtures/classic-v1-http-profile-seed.php > /tmp/classic-http/seed.log 2>&1; then
            tail -25 /tmp/classic-http/seed.log | while IFS= read -r line; do echo "::error::SEED $line"; done
            exit 1
          fi
      - name: Profile baseline over real HTTP
        run: |
          set -euo pipefail
          source /tmp/classic-http/fixture-env.sh
          ids=$(python3 -c 'import json; print(json.dumps(json.load(open("/tmp/classic-v1-http-visit-ids.json"))[:12]))')
          if ! PROFILE_LABEL=baseline PROFILE_VISIT_IDS="$ids" PROFILE_OUTPUT=/tmp/classic-http/baseline.json python3 clinic-practice-management/bin/classic-v1-http-profile.py > /tmp/classic-http/profile-baseline.log 2>&1; then
            tail -25 /tmp/classic-http/profile-baseline.log | while IFS= read -r line; do echo "::error::PROFILE baseline $line"; done
            exit 1
          fi
          cat /tmp/classic-http/profile-baseline.log
      - name: Install candidate over the same database
        run: |
          set -euo pipefail
          zip=$(find clinic-practice-management/dist -name '*.zip' | head -1)
          wp plugin install "$zip" --force --activate --path="$WP_DIR" --allow-root
          sudo service apache2 restart
      - name: Profile candidate over real HTTP
        run: |
          set -euo pipefail
          source /tmp/classic-http/fixture-env.sh
          ids=$(python3 -c 'import json; print(json.dumps(json.load(open("/tmp/classic-v1-http-visit-ids.json"))[12:24]))')
          if ! PROFILE_LABEL=candidate PROFILE_VISIT_IDS="$ids" PROFILE_OUTPUT=/tmp/classic-http/candidate.json python3 clinic-practice-management/bin/classic-v1-http-profile.py > /tmp/classic-http/profile-candidate.log 2>&1; then
            tail -25 /tmp/classic-http/profile-candidate.log | while IFS= read -r line; do echo "::error::PROFILE candidate $line"; done
            exit 1
          fi
          cat /tmp/classic-http/profile-candidate.log
      - name: HTTP comparison summary
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          try:
              a=json.load(open('/tmp/classic-http/baseline.json'))['summary']
              b=json.load(open('/tmp/classic-http/candidate.json'))['summary']
          except Exception as e:
              print('::error::HTTP comparison unavailable '+str(e)); raise SystemExit(0)
          print('### Real authenticated HTTP, MySQL 8, sequential on one runner/DB')
          print('| Operation | Baseline ms / queries | Candidate ms / queries |')
          print('|---|---|---|')
          for k in a: print(f"| {k} | {a[k]['median_ms']} / {a[k]['median_queries']} | {b[k]['median_ms']} / {b[k]['median_queries']} |")
          print('Synthetic data; medians of 12. POSTs use distinct equivalent pre-seeded visits. No real SMS provider.')
          print('::notice::HTTP_SUMMARY '+json.dumps({'baseline':a,'candidate':b},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classic-v1-http
          path: |
            /tmp/classic-http/*.json
            /tmp/classic-http/*.log
          retention-days: 14
