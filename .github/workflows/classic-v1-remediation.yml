      - name: Evidence summary
        if: always()
        run: |
          python3 - /tmp/classic-v1 "${{ matrix.database }}" "/tmp/classic-v1/summary-${{ matrix.database }}.txt" <<'PY'
          # cpms-fixed-schema-projection
          import json, os, sys, xml.etree.ElementTree as ET
          import xml.parsers.expat as expat
          MAX_COUNT = 1000000
          MAX_SUITES = 10000
          MAX_BYTES = 8388608
