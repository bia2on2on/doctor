                  return 'PASS'
              return 'FAIL'
          def tests_result(path, label):
              unavailable = ('TESTS label=' + label + ' tests=0 failures=0 errors=0 skipped=0 verdict=UNAVAILABLE', 'UNAVAILABLE')
              blob = read_bounded(path)
              if blob is None:
                  return unavailable
              root = parse_junit(blob)
              if root is None:
