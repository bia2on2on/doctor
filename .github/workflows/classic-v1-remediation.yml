              else:
                  return unavailable
              totals = suites_consistent(root, outer)
              if totals is None:
                  return unavailable
              verdict = pass_verdict(totals)
              return ('TESTS label=' + label + ' tests=%d failures=%d errors=%d skipped=%d verdict=%s' % (totals['tests'], totals['failures'], totals['errors'], totals['skipped'], verdict), verdict)
          def finite_number(value):
              return not isinstance(value, bool) and isinstance(value, (int, float)) and value == value and abs(value) <= 1000000000
          def perf_result(path, label):
              unavailable = ('PERF label=' + label + ' samples=0 verdict=UNAVAILABLE', 'UNAVAILABLE')
              blob = read_bounded(path)
              if blob is None:
                  return unavailable
              try:
                  data = json.loads(blob.decode('utf-8'))
              except Exception:
                  return unavailable
              if not isinstance(data, dict):
                  return unavailable
              samples = data.get('samples')
              if not isinstance(samples, dict) or not samples:
                  return unavailable
              total = 0
              for value in samples.values():
                  if not isinstance(value, list):
                      return unavailable
                  for item in value:
                      if not isinstance(item, dict) or not finite_number(item.get('ms')) or not finite_number(item.get('queries')):
                          return unavailable
                  total += len(value)
                  if total > MAX_COUNT:
                      return unavailable
              return ('PERF label=' + label + ' samples=%d verdict=OK' % total, 'OK')
          def exit_result(path):
              unavailable = ('EXIT label=BASELINE verdict=UNAVAILABLE', 'UNAVAILABLE')
              blob = read_bounded(path)
              if blob is None or len(blob) > 64:
                  return unavailable
              try:
                  raw = blob.decode('ascii')
              except Exception:
                  return unavailable
              if raw.endswith('\n'):
                  raw = raw[:-1]
              code = canon_count(raw)
              if code is None or code > 255:
                  return unavailable
              return ('EXIT label=BASELINE code=%d verdict=%s' % (code, 'PASS' if code == 0 else 'FAIL'), 'OK')
          def main():
              base, db, summary_out = sys.argv[1], sys.argv[2], sys.argv[3]
              baseline_tests = tests_result(os.path.join(base, 'baseline-' + db + '.xml'), 'BASELINE')
              candidate_tests = tests_result(os.path.join(base, 'candidate-' + db + '.xml'), 'CANDIDATE')
              lines = [
                  '### Classic V1 remediation evidence (fixed schema)',
                  baseline_tests[0],
                  candidate_tests[0],
                  perf_result(os.path.join(base, 'baseline-' + db + '.json'), 'BASELINE')[0],
                  perf_result(os.path.join(base, 'candidate-' + db + '.json'), 'CANDIDATE')[0],
                  exit_result(os.path.join(base, 'baseline-exit.txt'))[0],
              ]
              for line in lines:
                  print(line if line.startswith('###') else '::notice::' + line)
              with open(summary_out, 'w') as handle:
                  handle.write('\n'.join(lines) + '\n')
              step_summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if step_summary:
                  with open(step_summary, 'a') as handle:
                      handle.write('\n'.join(lines) + '\n')
              return 1 if candidate_tests[1] == 'UNAVAILABLE' else 0
          try:
              sys.exit(main())
          except SystemExit:
              raise
          except Exception:
              fallback = [
                  '### Classic V1 remediation evidence (fixed schema)',
                  'TESTS label=BASELINE tests=0 failures=0 errors=0 skipped=0 verdict=UNAVAILABLE',
                  'TESTS label=CANDIDATE tests=0 failures=0 errors=0 skipped=0 verdict=UNAVAILABLE',
                  'PERF label=BASELINE samples=0 verdict=UNAVAILABLE',
                  'PERF label=CANDIDATE samples=0 verdict=UNAVAILABLE',
                  'EXIT label=BASELINE verdict=UNAVAILABLE',
              ]
              for line in fallback:
                  print(line if line.startswith('###') else '::notice::' + line)
              try:
                  with open(sys.argv[3], 'w') as handle:
                      handle.write('\n'.join(fallback) + '\n')
              except Exception:
                  pass
              sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classic-v1-${{ matrix.database }}
          path: |
            /tmp/classic-v1/summary-*.txt
          include-hidden-files: false
          retention-days: 14

  http-profile:
    name: Real HTTP profile (MySQL 8, same runner)
    # EXPIRY 2026-12-15: temporary Ubuntu pin, see
    # docs/decisions/2026-11-06-ci-environment-repair.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8
        env: {MYSQL_ROOT_PASSWORD: root}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      WP_DIR: /home/runner/www
      WP_URL: http://localhost:8080
      # Archived Classic V1 baseline = 9bf84304 + ONE build-only commit (E2)
      # that changes only clinic-practice-management/composer.lock to main's
      # blob 440c8446. The original commit's locked symfony/filesystem v6.4.45 is
      # inside an advisory range, so bin/build-release.sh's fail-closed
      # `composer audit` refused to build the baseline ZIP (both the regression
      # baseline and the Real HTTP profile baseline). E2 changes no source or
      # test file, so the archived test selection and the business logic under
      # measurement are unchanged. See
      # docs/decisions/2026-11-06-ci-environment-repair.md.
      BASELINE_SHA: a17a8d7a70598c959d8d726c664ff48f8a27a882
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, curl, mbstring, xml, zip, gd, sodium
          tools: composer:v2
      - name: Apache and WP-CLI
        uses: ./.github/actions/wp-stack-tooling
        with:
          apt-packages: mysql-client apache2 libapache2-mod-php php-mysql php-mbstring php-xml php-curl php-zip php-gd
          apt-log-dir: /tmp/classic-http
      - name: Install WordPress and Apache
        run: |
          set -euo pipefail
          mkdir -p /tmp/classic-http
          mysql --protocol=TCP -h127.0.0.1 -uroot -proot -NBe 'SELECT VERSION()' > /tmp/classic-http/db-version.txt
          grep -q '^8\.' /tmp/classic-http/db-version.txt
          curl -fsSL https://wordpress.org/wordpress-7.1.3.tar.gz | tar -xz -C /home/runner
          mv /home/runner/wordpress "$WP_DIR"
          mysql --protocol=TCP -h127.0.0.1 -uroot -proot -e 'CREATE DATABASE cpms_http CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          cd "$WP_DIR"
          wp config create --dbname=cpms_http --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp config set DISABLE_WP_CRON true --raw --allow-root
          wp config set CPMS_CI_HTTP_PROFILER true --raw --allow-root
          wp core install --url="$WP_URL" --title='Synthetic Classic V1' --admin_user=ci_admin --admin_password='Synthetic-Only-2026!' --admin_email=ci@example.invalid --skip-email --allow-root
          wp rewrite structure '' --hard --allow-root
          sudo tee /etc/apache2/sites-available/cpms.conf >/dev/null <<CONF
          <VirtualHost *:8080>
            DocumentRoot $WP_DIR
            <Directory $WP_DIR>
              AllowOverride All
              Require all granted
            </Directory>
          </VirtualHost>
          CONF
          sudo sed -i 's/^Listen 80$/Listen 8080/' /etc/apache2/ports.conf
          sudo a2dissite 000-default && sudo a2ensite cpms && sudo a2enmod rewrite
          sudo chmod a+rx /home/runner
          sudo mkdir -p "$WP_DIR/wp-content/upgrade" "$WP_DIR/wp-content/mu-plugins"
          sudo chown -R www-data:www-data "$WP_DIR/wp-content"
          sudo chmod -R a+rwX "$WP_DIR/wp-content"
          sudo apache2ctl configtest && sudo service apache2 start
      - name: Build baseline and candidate official ZIPs
        run: |
          set -euo pipefail
          mkdir -p /tmp/classic-http/baseline/clinic-practice-management
          git archive "$BASELINE_SHA" clinic-practice-management | tar -x --strip-components=1 -C /tmp/classic-http/baseline/clinic-practice-management
          (cd /tmp/classic-http/baseline/clinic-practice-management && bash bin/build-release.sh)
          (cd clinic-practice-management && bash bin/build-release.sh)
      - name: Install baseline and CI profiler
        run: |
          set -euo pipefail
          zip=$(find /tmp/classic-http/baseline/clinic-practice-management/dist -name '*.zip' | head -1)
          wp plugin install "$zip" --force --activate --path="$WP_DIR" --allow-root
          wp rewrite flush --hard --path="$WP_DIR" --allow-root
          sudo mkdir -p "$WP_DIR/wp-content/mu-plugins"
          sudo cp clinic-practice-management/tests/fixtures/classic-v1-http-profiler-mu.php "$WP_DIR/wp-content/mu-plugins/classic-v1-profiler.php"
          sudo service apache2 restart
      - name: Seed synthetic authenticated HTTP workload
        run: |
          set -euo pipefail
          if ! WP_HOME="$WP_DIR" php clinic-practice-management/tests/fixtures/pilot-doctor-portal-fixture.php > /tmp/classic-http/fixture.log 2>&1; then
            echo '::error::FIXTURE verdict=FAIL'
            exit 1
          fi
          echo "::notice::HTTP seed fixture-ok"
          cat /tmp/doctor-portal.env >> "$GITHUB_ENV"
          python3 - <<'PY'
          import shlex
          with open('/tmp/classic-http/fixture-env.sh','w') as out:
              for line in open('/tmp/doctor-portal.env'):
                  if '=' in line:
                      k,v=line.rstrip('\n').split('=',1)
                      out.write('export '+k+'='+shlex.quote(v)+'\n')
          PY
          echo "::notice::HTTP seed env-ok"
          source /tmp/classic-http/fixture-env.sh
          echo "::notice::HTTP seed source-ok"
          wp rewrite flush --hard --path="$WP_DIR" --allow-root
          if ! WP_HOME="$WP_DIR" php clinic-practice-management/tests/fixtures/classic-v1-http-profile-seed.php > /tmp/classic-http/seed.log 2>&1; then
            echo '::error::SEED verdict=FAIL'
            exit 1
          fi
      - name: Profile baseline over real HTTP
        run: |
          set -euo pipefail
          source /tmp/classic-http/fixture-env.sh
          ids=$(python3 -c 'import json; print(json.dumps(json.load(open("/tmp/classic-v1-http-visit-ids.json"))[:12]))')
          if ! PROFILE_LABEL=baseline PROFILE_VISIT_IDS="$ids" PROFILE_OUTPUT=/tmp/classic-http/baseline.json python3 clinic-practice-management/bin/classic-v1-http-profile.py > /tmp/classic-http/profile-baseline.log 2>&1; then
            echo '::error::PROFILE label=BASELINE verdict=FAIL'
            exit 1
          fi
      - name: Install candidate over the same database
        run: |
          set -euo pipefail
          zip=$(find clinic-practice-management/dist -name '*.zip' | head -1)
          wp plugin install "$zip" --force --activate --path="$WP_DIR" --allow-root
          wp rewrite flush --hard --path="$WP_DIR" --allow-root
          sudo service apache2 restart
      - name: Profile candidate over real HTTP
        run: |
          set -euo pipefail
          source /tmp/classic-http/fixture-env.sh
          ids=$(python3 -c 'import json; print(json.dumps(json.load(open("/tmp/classic-v1-http-visit-ids.json"))[12:24]))')
          if ! PROFILE_LABEL=candidate PROFILE_VISIT_IDS="$ids" PROFILE_OUTPUT=/tmp/classic-http/candidate.json python3 clinic-practice-management/bin/classic-v1-http-profile.py > /tmp/classic-http/profile-candidate.log 2>&1; then
            echo '::error::PROFILE label=CANDIDATE verdict=FAIL'
            exit 1
          fi
      - name: HTTP comparison summary
        if: always()
        run: |
          python3 - /tmp/classic-http/baseline.json /tmp/classic-http/candidate.json /tmp/classic-http/summary.txt <<'PY'
          # cpms-fixed-schema-projection
          import json, os, sys
          MAX_COUNT = 1000000
          MAX_BYTES = 8388608
          MAX_OPERATIONS = 64
          def profile_result(path, label):
              unavailable = 'HTTP_PROFILE label=' + label + ' operations=0 verdict=UNAVAILABLE'
              try:
                  with open(path, 'rb') as handle:
                      blob = handle.read(MAX_BYTES + 1)
                  if len(blob) > MAX_BYTES:
                      return unavailable
                  data = json.loads(blob.decode('utf-8'))
              except Exception:
                  return unavailable
              if not isinstance(data, dict) or data.get('kind') != 'authenticated_real_http':
                  return unavailable
              schema = data.get('schema')
              if isinstance(schema, bool) or schema != 1:
                  return unavailable
              summary = data.get('summary')
              if not isinstance(summary, dict) or not summary or len(summary) > MAX_OPERATIONS:
                  return unavailable
              for entry in summary.values():
                  if not isinstance(entry, dict):
                      return unavailable
                  n = entry.get('n')
                  if isinstance(n, bool) or not isinstance(n, int) or n < 0 or n > MAX_COUNT:
                      return unavailable
                  for key in ('median_ms', 'median_queries'):
                      value = entry.get(key)
                      if isinstance(value, bool) or not isinstance(value, (int, float)) or value != value or abs(value) > 1000000000:
                          return unavailable
              return 'HTTP_PROFILE label=' + label + ' operations=%d verdict=OK' % len(summary)
          def main():
              lines = [
                  '### Real authenticated HTTP profile (fixed schema)',
                  profile_result(sys.argv[1], 'BASELINE'),
                  profile_result(sys.argv[2], 'CANDIDATE'),
              ]
              for line in lines:
                  print(line if line.startswith('###') else '::notice::' + line)
              with open(sys.argv[3], 'w') as handle:
                  handle.write('\n'.join(lines) + '\n')
              step_summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if step_summary:
                  with open(step_summary, 'a') as handle:
                      handle.write('\n'.join(lines) + '\n')
          try:
              main()
          except Exception:
              fallback = [
                  '### Real authenticated HTTP profile (fixed schema)',
                  'HTTP_PROFILE label=BASELINE operations=0 verdict=UNAVAILABLE',
                  'HTTP_PROFILE label=CANDIDATE operations=0 verdict=UNAVAILABLE',
              ]
              for line in fallback:
                  print(line if line.startswith('###') else '::notice::' + line)
              try:
                  with open(sys.argv[3], 'w') as handle:
                      handle.write('\n'.join(fallback) + '\n')
              except Exception:
                  pass
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classic-v1-http
          path: |
            /tmp/classic-http/summary.txt
          retention-days: 14
