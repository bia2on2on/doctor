name: Classic V1 remediation evidence

on:
  push:
    branches: [arena/9b3bd6a4-doctor]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'clinic-practice-management/**'
      - '.github/workflows/classic-v1-remediation.yml'
      - 'standalone-demo/**'

permissions:
  contents: read

concurrency:
  group: classic-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    name: Regressions (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql
            image: mysql:8
            port: 3306
          - database: mariadb
            image: mariadb:11.4.13
            port: 3307
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=10s --health-timeout=5s --health-retries=20
      mariadb:
        image: mariadb:11.4.13
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ['3307:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: clinic-practice-management
    env:
      WP_TESTS_DIR: /tmp/wordpress-test-lib
      WP_CORE_DIR: /tmp/wordpress
      # Archived Classic V1 baseline = 9bf84304 + ONE build-only commit (E2)
      # that changes only clinic-practice-management/composer.lock to main's
      # blob 440c8446. The original commit's locked symfony/filesystem v6.4.45 is
      # inside an advisory range, so bin/build-release.sh's fail-closed
      # `composer audit` refused to build the baseline ZIP (both the regression
      # baseline and the Real HTTP profile baseline). E2 changes no source or
      # test file, so the archived test selection and the business logic under
      # measurement are unchanged. See
      # docs/decisions/2026-11-06-ci-environment-repair.md.
      BASELINE_SHA: a17a8d7a70598c959d8d726c664ff48f8a27a882
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, mysqli, curl, sodium
          coverage: none
      - name: Record exact server and source versions
        run: |
          set -euo pipefail
          mkdir -p /tmp/classic-v1
          mysql --protocol=TCP -h 127.0.0.1 -P ${{ matrix.port }} -uroot -proot -NBe 'SELECT VERSION()' > /tmp/classic-v1/db-version.txt
          if [ "${{ matrix.database }}" = mariadb ]; then grep -q '^11\.4\.13-MariaDB' /tmp/classic-v1/db-version.txt; else grep -q '^8\.' /tmp/classic-v1/db-version.txt; fi
          git rev-parse HEAD > /tmp/classic-v1/candidate-sha.txt
          php -v | head -1 > /tmp/classic-v1/php-version.txt
      - name: Install locked test dependencies and WordPress
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          composer require --dev phpunit/phpunit:^9.6 --no-interaction --no-progress --with-all-dependencies
          bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 7.1.3 ${{ matrix.port }}
      - name: Prepare archived baseline with identical regression tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/classic-v1/baseline/clinic-practice-management
          git -C "$GITHUB_WORKSPACE" archive "$BASELINE_SHA" clinic-practice-management | tar -x --strip-components=1 -C /tmp/classic-v1/baseline/clinic-practice-management
          cp -a tests/. /tmp/classic-v1/baseline/clinic-practice-management/tests/
          mkdir -p /tmp/classic-v1/baseline/clinic-practice-management/vendor
          cp -a vendor/. /tmp/classic-v1/baseline/clinic-practice-management/vendor/
          # Regenerate Composer paths against the archived production source;
          # never load candidate src through a copied autoload map.
          cd /tmp/classic-v1/baseline/clinic-practice-management
          composer dump-autoload --no-interaction > /tmp/classic-v1/baseline-prepare.log 2>&1
      - name: Expose baseline preparation failure
        if: failure()
        run: |
          { echo '### Baseline preparation failed'; echo 'verdict=FAIL'; } >> "$GITHUB_STEP_SUMMARY"
          echo '::error::BASELINE_PREPARE verdict=FAIL'
      - name: Execute baseline regressions (failures are evidence, not a pass)
        run: |
          set -o pipefail
          cd /tmp/classic-v1/baseline/clinic-practice-management
          rc=0
          python3 - <<'PY'
          import os
          files=[os.path.join(os.getcwd(),'tests/Integration/ClassicV1CriticalRemediationTest.php'),os.path.join(os.getcwd(),'tests/Integration/ClassicV1PerformanceProbeTest.php')]
          open('/tmp/classic-v1/baseline-suite.xml','w').write('<phpunit><testsuites><testsuite name="classic">'+''.join('<file>'+f+'</file>' for f in files)+'</testsuite></testsuites></phpunit>')
          PY
          CPMS_PERF_OUTPUT=/tmp/classic-v1/baseline-${{ matrix.database }}.json php -d memory_limit=1G vendor/bin/phpunit --configuration /tmp/classic-v1/baseline-suite.xml --log-junit /tmp/classic-v1/baseline-${{ matrix.database }}.xml --bootstrap tests/integration-bootstrap.php > /tmp/classic-v1/baseline-${{ matrix.database }}.log 2>&1 || rc=$?
          echo "$rc" > /tmp/classic-v1/baseline-exit.txt
          python3 - /tmp/classic-v1/baseline-${{ matrix.database }}.xml BASELINE <<'PY' || true
          # cpms-fixed-schema-projection
          import re, sys, xml.etree.ElementTree as ET
          def strict_int(value):
              return int(value) if value is not None and re.fullmatch(r'[0-9]+', value.strip()) else None
          def project(path, label):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  print('::notice::TESTS label=' + label + ' tests=0 failures=0 errors=0 skipped=0 verdict=UNAVAILABLE')
                  return
              suites = root.findall('testsuite') or [root]
              totals = {}
              for key in ('tests', 'failures', 'errors', 'skipped'):
                  values = [strict_int(suite.get(key)) for suite in suites]
                  if any(value is None for value in values):
                      print('::notice::TESTS label=' + label + ' tests=0 failures=0 errors=0 skipped=0 verdict=UNAVAILABLE')
                      return
                  totals[key] = sum(values)
              verdict = 'PASS' if totals['failures'] == 0 and totals['errors'] == 0 else 'FAIL'
              print('::notice::TESTS label=' + label + ' tests=%d failures=%d errors=%d skipped=%d verdict=%s' % (totals['tests'], totals['failures'], totals['errors'], totals['skipped'], verdict))
          project(sys.argv[1], sys.argv[2])
          PY
      - name: Reset database before candidate on the same runner
        run: |
          mysql --protocol=TCP -h 127.0.0.1 -P ${{ matrix.port }} -uroot -proot -e 'DROP DATABASE wordpress_test; CREATE DATABASE wordpress_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
      - name: Execute candidate regressions and adjacent workflow coverage
        run: |
          set -o pipefail
          python3 - <<'PY'
          import os
          files=[os.path.join(os.getcwd(),'tests/Integration/'+f) for f in ['ClassicV1CriticalRemediationTest.php','ClassicV1PerformanceProbeTest.php','SmsOtpDispatchTest.php','OtpSecurityTest.php','SmsClinicAuthorizationTest.php','ClinicalFlowTest.php','Phase11ReceptionAppointmentCancelRedTest.php','Phase2JobScopeRedFoundationTest.php','MigrationTest.php','OtpFlowTest.php','OtpAuditAtomicityTest.php']]
          open('/tmp/classic-v1/candidate-suite.xml','w').write('<phpunit><testsuites><testsuite name="classic">'+''.join('<file>'+f+'</file>' for f in files)+'</testsuite></testsuites></phpunit>')
          PY
          CPMS_PERF_OUTPUT=/tmp/classic-v1/candidate-${{ matrix.database }}.json php -d memory_limit=1G vendor/bin/phpunit --configuration /tmp/classic-v1/candidate-suite.xml --log-junit /tmp/classic-v1/candidate-${{ matrix.database }}.xml --bootstrap tests/integration-bootstrap.php > /tmp/classic-v1/candidate-${{ matrix.database }}.log 2>&1
      - name: Report candidate regression counts (fixed schema)
        if: failure()
        run: |
          python3 - /tmp/classic-v1/candidate-${{ matrix.database }}.xml CANDIDATE <<'PY' || true
          # cpms-fixed-schema-projection
          import re, sys, xml.etree.ElementTree as ET
          def strict_int(value):
              return int(value) if value is not None and re.fullmatch(r'[0-9]+', value.strip()) else None
          def project(path, label):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  print('::error::TESTS label=' + label + ' tests=0 failures=0 errors=0 skipped=0 verdict=UNAVAILABLE')
                  return
              suites = root.findall('testsuite') or [root]
              totals = {}
              for key in ('tests', 'failures', 'errors', 'skipped'):
                  values = [strict_int(suite.get(key)) for suite in suites]
                  if any(value is None for value in values):
                      print('::error::TESTS label=' + label + ' tests=0 failures=0 errors=0 skipped=0 verdict=UNAVAILABLE')
                      return
                  totals[key] = sum(values)
              verdict = 'PASS' if totals['failures'] == 0 and totals['errors'] == 0 else 'FAIL'
              print('::error::TESTS label=' + label + ' tests=%d failures=%d errors=%d skipped=%d verdict=%s' % (totals['tests'], totals['failures'], totals['errors'], totals['skipped'], verdict))
          project(sys.argv[1], sys.argv[2])
          PY
      - name: Evidence summary
        if: always()
        run: |
          python3 - /tmp/classic-v1 "${{ matrix.database }}" "/tmp/classic-v1/summary-${{ matrix.database }}.txt" <<'PY' || true
          # cpms-fixed-schema-projection
          import json, os, re, sys, xml.etree.ElementTree as ET
          def strict_int(value):
              return int(value) if value is not None and re.fullmatch(r'[0-9]+', value.strip()) else None
          def tests_line(path, label):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  return 'TESTS label=' + label + ' tests=0 failures=0 errors=0 skipped=0 verdict=UNAVAILABLE'
              suites = root.findall('testsuite') or [root]
              totals = {}
              for key in ('tests', 'failures', 'errors', 'skipped'):
                  values = [strict_int(suite.get(key)) for suite in suites]
                  if any(value is None for value in values):
                      return 'TESTS label=' + label + ' tests=0 failures=0 errors=0 skipped=0 verdict=UNAVAILABLE'
                  totals[key] = sum(values)
              verdict = 'PASS' if totals['failures'] == 0 and totals['errors'] == 0 else 'FAIL'
              return 'TESTS label=' + label + ' tests=%d failures=%d errors=%d skipped=%d verdict=%s' % (totals['tests'], totals['failures'], totals['errors'], totals['skipped'], verdict)
          def perf_line(path, label):
              try:
                  data = json.load(open(path))
                  samples = data.get('samples') or {}
                  count = sum(len(v) for v in samples.values())
                  return 'PERF label=' + label + ' samples=%d verdict=%s' % (count, 'OK' if count > 0 else 'UNAVAILABLE')
              except Exception:
                  return 'PERF label=' + label + ' samples=0 verdict=UNAVAILABLE'
          def exit_line(path):
              try:
                  code = strict_int(open(path).read().strip())
              except Exception:
                  code = None
              if code is None:
                  return 'EXIT label=BASELINE verdict=UNAVAILABLE'
              return 'EXIT label=BASELINE code=%d verdict=%s' % (code, 'PASS' if code == 0 else 'FAIL')
          base, db, summary_out = sys.argv[1], sys.argv[2], sys.argv[3]
          lines = [
              '### Classic V1 remediation evidence (fixed schema)',
              tests_line(os.path.join(base, 'baseline-' + db + '.xml'), 'BASELINE'),
              tests_line(os.path.join(base, 'candidate-' + db + '.xml'), 'CANDIDATE'),
              perf_line(os.path.join(base, 'baseline-' + db + '.json'), 'BASELINE'),
              perf_line(os.path.join(base, 'candidate-' + db + '.json'), 'CANDIDATE'),
              exit_line(os.path.join(base, 'baseline-exit.txt')),
          ]
          for line in lines:
              print(line if line.startswith('###') else '::notice::' + line)
          with open(summary_out, 'w') as handle:
              handle.write('\n'.join(lines) + '\n')
          step_summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if step_summary:
              with open(step_summary, 'a') as handle:
                  handle.write('\n'.join(lines) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classic-v1-${{ matrix.database }}
          path: |
            /tmp/classic-v1/summary-*.txt
          include-hidden-files: false
          retention-days: 14

  http-profile:
    name: Real HTTP profile (MySQL 8, same runner)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8
        env: {MYSQL_ROOT_PASSWORD: root}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      WP_DIR: /home/runner/www
      WP_URL: http://localhost:8080
      # Archived Classic V1 baseline = 9bf84304 + ONE build-only commit (E2)
      # that changes only clinic-practice-management/composer.lock to main's
      # blob 440c8446. The original commit's locked symfony/filesystem v6.4.45 is
      # inside an advisory range, so bin/build-release.sh's fail-closed
      # `composer audit` refused to build the baseline ZIP (both the regression
      # baseline and the Real HTTP profile baseline). E2 changes no source or
      # test file, so the archived test selection and the business logic under
      # measurement are unchanged. See
      # docs/decisions/2026-11-06-ci-environment-repair.md.
      BASELINE_SHA: a17a8d7a70598c959d8d726c664ff48f8a27a882
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, curl, mbstring, xml, zip, gd, sodium
          tools: composer:v2
      - name: Apache and WP-CLI
        uses: ./.github/actions/wp-stack-tooling
        with:
          apt-packages: mysql-client apache2 libapache2-mod-php php-mysql php-mbstring php-xml php-curl php-zip php-gd
          apt-log-dir: /tmp/classic-http
      - name: Install WordPress and Apache
        run: |
          set -euo pipefail
          mkdir -p /tmp/classic-http
          mysql --protocol=TCP -h127.0.0.1 -uroot -proot -NBe 'SELECT VERSION()' > /tmp/classic-http/db-version.txt
          grep -q '^8\.' /tmp/classic-http/db-version.txt
          curl -fsSL https://wordpress.org/wordpress-7.1.3.tar.gz | tar -xz -C /home/runner
          mv /home/runner/wordpress "$WP_DIR"
          mysql --protocol=TCP -h127.0.0.1 -uroot -proot -e 'CREATE DATABASE cpms_http CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          cd "$WP_DIR"
          wp config create --dbname=cpms_http --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp config set DISABLE_WP_CRON true --raw --allow-root
          wp config set CPMS_CI_HTTP_PROFILER true --raw --allow-root
          wp core install --url="$WP_URL" --title='Synthetic Classic V1' --admin_user=ci_admin --admin_password='Synthetic-Only-2026!' --admin_email=ci@example.invalid --skip-email --allow-root
          wp rewrite structure '' --hard --allow-root
          sudo tee /etc/apache2/sites-available/cpms.conf >/dev/null <<CONF
          <VirtualHost *:8080>
            DocumentRoot $WP_DIR
            <Directory $WP_DIR>
              AllowOverride All
              Require all granted
            </Directory>
          </VirtualHost>
          CONF
          sudo sed -i 's/^Listen 80$/Listen 8080/' /etc/apache2/ports.conf
          sudo a2dissite 000-default && sudo a2ensite cpms && sudo a2enmod rewrite
          sudo chmod a+rx /home/runner
          sudo mkdir -p "$WP_DIR/wp-content/upgrade" "$WP_DIR/wp-content/mu-plugins"
          sudo chown -R www-data:www-data "$WP_DIR/wp-content"
          sudo chmod -R a+rwX "$WP_DIR/wp-content"
          sudo apache2ctl configtest && sudo service apache2 start
      - name: Build baseline and candidate official ZIPs
        run: |
          set -euo pipefail
          mkdir -p /tmp/classic-http/baseline/clinic-practice-management
          git archive "$BASELINE_SHA" clinic-practice-management | tar -x --strip-components=1 -C /tmp/classic-http/baseline/clinic-practice-management
          (cd /tmp/classic-http/baseline/clinic-practice-management && bash bin/build-release.sh)
          (cd clinic-practice-management && bash bin/build-release.sh)
      - name: Install baseline and CI profiler
        run: |
          set -euo pipefail
          zip=$(find /tmp/classic-http/baseline/clinic-practice-management/dist -name '*.zip' | head -1)
          wp plugin install "$zip" --force --activate --path="$WP_DIR" --allow-root
          wp rewrite flush --hard --path="$WP_DIR" --allow-root
          sudo mkdir -p "$WP_DIR/wp-content/mu-plugins"
          sudo cp clinic-practice-management/tests/fixtures/classic-v1-http-profiler-mu.php "$WP_DIR/wp-content/mu-plugins/classic-v1-profiler.php"
          sudo service apache2 restart
      - name: Seed synthetic authenticated HTTP workload
        run: |
          set -euo pipefail
          if ! WP_HOME="$WP_DIR" php clinic-practice-management/tests/fixtures/pilot-doctor-portal-fixture.php > /tmp/classic-http/fixture.log 2>&1; then
            echo '::error::FIXTURE verdict=FAIL'
            exit 1
          fi
          echo "::notice::HTTP seed fixture-ok"
          cat /tmp/doctor-portal.env >> "$GITHUB_ENV"
          python3 - <<'PY'
          import shlex
          with open('/tmp/classic-http/fixture-env.sh','w') as out:
              for line in open('/tmp/doctor-portal.env'):
                  if '=' in line:
                      k,v=line.rstrip('\n').split('=',1)
                      out.write('export '+k+'='+shlex.quote(v)+'\n')
          PY
          echo "::notice::HTTP seed env-ok"
          source /tmp/classic-http/fixture-env.sh
          echo "::notice::HTTP seed source-ok"
          wp rewrite flush --hard --path="$WP_DIR" --allow-root
          if ! WP_HOME="$WP_DIR" php clinic-practice-management/tests/fixtures/classic-v1-http-profile-seed.php > /tmp/classic-http/seed.log 2>&1; then
            echo '::error::SEED verdict=FAIL'
            exit 1
          fi
      - name: Profile baseline over real HTTP
        run: |
          set -euo pipefail
          source /tmp/classic-http/fixture-env.sh
          ids=$(python3 -c 'import json; print(json.dumps(json.load(open("/tmp/classic-v1-http-visit-ids.json"))[:12]))')
          if ! PROFILE_LABEL=baseline PROFILE_VISIT_IDS="$ids" PROFILE_OUTPUT=/tmp/classic-http/baseline.json python3 clinic-practice-management/bin/classic-v1-http-profile.py > /tmp/classic-http/profile-baseline.log 2>&1; then
            echo '::error::PROFILE label=BASELINE verdict=FAIL'
            exit 1
          fi
      - name: Install candidate over the same database
        run: |
          set -euo pipefail
          zip=$(find clinic-practice-management/dist -name '*.zip' | head -1)
          wp plugin install "$zip" --force --activate --path="$WP_DIR" --allow-root
          wp rewrite flush --hard --path="$WP_DIR" --allow-root
          sudo service apache2 restart
      - name: Profile candidate over real HTTP
        run: |
          set -euo pipefail
          source /tmp/classic-http/fixture-env.sh
          ids=$(python3 -c 'import json; print(json.dumps(json.load(open("/tmp/classic-v1-http-visit-ids.json"))[12:24]))')
          if ! PROFILE_LABEL=candidate PROFILE_VISIT_IDS="$ids" PROFILE_OUTPUT=/tmp/classic-http/candidate.json python3 clinic-practice-management/bin/classic-v1-http-profile.py > /tmp/classic-http/profile-candidate.log 2>&1; then
            echo '::error::PROFILE label=CANDIDATE verdict=FAIL'
            exit 1
          fi
      - name: HTTP comparison summary
        if: always()
        run: |
          python3 - /tmp/classic-http/baseline.json /tmp/classic-http/candidate.json /tmp/classic-http/summary.txt <<'PY'
          # cpms-fixed-schema-projection
          import json, os, sys
          def profile_line(path, label):
              try:
                  data = json.load(open(path))
                  count = len(data['summary'])
                  return 'HTTP_PROFILE label=' + label + ' operations=%d verdict=OK' % count
              except Exception:
                  return 'HTTP_PROFILE label=' + label + ' operations=0 verdict=UNAVAILABLE'
          lines = [
              '### Real authenticated HTTP profile (fixed schema)',
              profile_line(sys.argv[1], 'BASELINE'),
              profile_line(sys.argv[2], 'CANDIDATE'),
          ]
          for line in lines:
              print(line if line.startswith('###') else '::notice::' + line)
          with open(sys.argv[3], 'w') as handle:
              handle.write('\n'.join(lines) + '\n')
          step_summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if step_summary:
              with open(step_summary, 'a') as handle:
                  handle.write('\n'.join(lines) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classic-v1-http
          path: |
            /tmp/classic-http/summary.txt
          retention-days: 14
