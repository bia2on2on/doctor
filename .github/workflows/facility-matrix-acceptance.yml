name: Facility Onboarding Matrix (12 types · MySQL 8 + MariaDB 11.4.13)

# Real-browser, real-HTTP onboarding matrix for ALL twelve approved facility
# types (plus the independent medical-building STRUCTURE).
#
# Why a dedicated lane: the first-practice lane already proves installation,
# recovery and the four original flows. This lane exists to turn "all 12 types
# are supported" from a catalogue/Integration claim into per-type browser
# evidence on BOTH supported database engines. It is isolated so its runtime can
# never starve the established acceptance lanes.
#
# Business users only: the Organization Manager and the designated Clinic
# Managers are WordPress Subscribers driving the frontend Management Portal.
# No wp-admin page is opened by the harness. Synthetic data only.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && format('main-run-{0}', github.run_id) || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref) }}
  # A newer main push must not cancel required post-merge matrix evidence.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read

env:
  WP_VERSION: '7.1.3'
  PHP_VERSION: '8.2'
  WP_DIR: /home/runner/mtx
  WP_URL: http://localhost:8080
  DB_NAME: cpms_mtx
  ADMIN_USER: mtx_admin
  ADMIN_PASS: Acceptance-2026!
  ORG_MANAGER_USER: mtx_orgmgr
  ORG_MANAGER_PASS: Acceptance-2026!
  MATRIX_MANAGER_PASS: Acceptance-2026!

jobs:
  facility-matrix:
    name: Facility matrix (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mariadb
            image: mariadb:11.4.13
          - database: mysql
            image: mysql:8

    services:
      database:
        image: ${{ matrix.image }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot || mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mysqli, curl, mbstring, xml, zip, gd, sodium
          coverage: none

      # Apt package list unchanged (shared action only adds bounded retries and a
      # fail-closed verification); browsers are a pinned, cache-backed step.
      - name: Tooling (apache + wp-cli + playwright/chromium)
        uses: ./.github/actions/wp-stack-tooling
        with:
          apt-packages: >-
            mysql-client apache2 libapache2-mod-php
            php-mysql php-mbstring php-xml php-curl php-zip php-gd
          apt-log-dir: /tmp/mtx

      - name: Playwright chromium (pinned + cached)
        uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium

      - name: Lint the matrix harness
        run: |
          set -euo pipefail
          python3 -m py_compile clinic-practice-management/bin/rwp-facility-matrix-journey.py
          python3 clinic-practice-management/bin/acceptance-isolation-check.py clinic-practice-management/bin/rwp-facility-matrix-journey.py
          python3 -m unittest discover -s clinic-practice-management/tests/bin -p 'test_safe_php_fatal_report.py' -v
          bash -n clinic-practice-management/bin/build-release.sh

      - name: Pin and record database server
        run: |
          set -euo pipefail
          server_version="$(mysql --protocol=TCP --host=127.0.0.1 --port=3306 --user=root --password=root --batch --skip-column-names --execute='SELECT VERSION()')"
          echo "${{ matrix.database }} server VERSION(): ${server_version}"
          echo "::notice title=CPMS database version::${{ matrix.database }} ${server_version}"
          case "${{ matrix.database }}:$server_version" in
            mariadb:11.4.13-MariaDB*|mysql:8.*) ;;
            *) echo "Unexpected database server: ${server_version}" >&2; exit 1 ;;
          esac
          printf '%s\n' "$server_version" > /tmp/mtx/database-version.txt

      - name: Clean WordPress (isolated DB)
        run: |
          set -euo pipefail
          curl -sS "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" -o /tmp/wp.tar.gz
          tar -xzf /tmp/wp.tar.gz -C /tmp && mv /tmp/wordpress "$WP_DIR"
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot -proot -e "CREATE DATABASE $DB_NAME CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          cd "$WP_DIR"
          wp config create --dbname="$DB_NAME" --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --dbprefix='wp_' --skip-salts --allow-root
          wp config shuffle-salts --allow-root
          wp config set WP_DEBUG true --raw --allow-root
          wp config set WP_DEBUG_LOG true --raw --allow-root
          wp config set WP_DEBUG_DISPLAY false --raw --allow-root
          wp config set DISALLOW_FILE_EDIT true --raw --allow-root
          wp config set FS_METHOD direct --allow-root
          wp config set DISABLE_WP_CRON true --raw --allow-root
          wp core install --url="$WP_URL" --title="CPMS Facility Matrix" --admin_user="$ADMIN_USER" --admin_password="$ADMIN_PASS" --admin_email=admin@acc.local --skip-email --allow-root
          wp core version --allow-root | tee /tmp/mtx/wp-version.txt

      - name: Apache + mod_php
        run: |
          sudo tee /etc/apache2/sites-available/mtx.conf >/dev/null <<CONF
          <VirtualHost *:8080>
            DocumentRoot $WP_DIR
            <Directory $WP_DIR>
              AllowOverride All
              Require all granted
            </Directory>
            ErrorLog \${APACHE_LOG_DIR}/mtx-error.log
            CustomLog \${APACHE_LOG_DIR}/mtx-access.log combined
          </VirtualHost>
          CONF
          sudo sed -i 's/^Listen 80$/Listen 8080/' /etc/apache2/ports.conf
          sudo a2dissite 000-default >/dev/null && sudo a2ensite mtx >/dev/null
          sudo a2enmod rewrite >/dev/null
          sudo mkdir -p "$WP_DIR/wp-content"
          sudo touch "$WP_DIR/wp-content/debug.log"
          # Ownership stays with the runner user: this lane installs the ZIP with
          # wp-cli (the first-practice lane installs through the browser as
          # www-data instead). wp-content stays world-writable so Apache/PHP can
          # write uploads and debug.log.
          sudo chmod 777 "$WP_DIR/wp-content"
          sudo chmod 666 "$WP_DIR/wp-content/debug.log"
          for INI in /etc/php/*/apache2/php.ini; do
            sudo sed -i 's/^display_errors = .*/display_errors = Off/' "$INI"
            sudo sed -i 's/^upload_max_filesize = .*/upload_max_filesize = 64M/' "$INI"
            sudo sed -i 's/^post_max_size = .*/post_max_size = 72M/' "$INI"
            sudo sed -i "s#^error_log = .*#error_log = $WP_DIR/wp-content/debug.log#" "$INI"
          done
          sudo chmod a+rx /home/runner
          sudo chmod -R a+rX "$WP_DIR"
          sudo apache2ctl configtest && sudo service apache2 start
          curl -s -o /dev/null -w 'home HTTP %{http_code}\n' "$WP_URL/" | tee /tmp/mtx/apache.txt

      # Granular steps on purpose: the sandbox that authored this lane cannot
      # read Actions logs, so each failure must be attributable from the step
      # name alone.
      - name: Build official release ZIP
        run: |
          set -euo pipefail
          bash clinic-practice-management/bin/build-release.sh
          ZIP=$(ls clinic-practice-management/dist/clinic-practice-management-*.zip | head -1)
          [ -f "$ZIP" ] || { echo 'ZIP NOT BUILT'; exit 1; }
          sha256sum "$ZIP" | tee /tmp/mtx/zip.sha256
          echo "matrix ZIP: $ZIP"

      - name: Install the release ZIP and activate
        run: |
          set -euo pipefail
          ZIP=$(ls "$PWD"/clinic-practice-management/dist/clinic-practice-management-*.zip | head -1)
          # WP-CLI/PHP output can contain request values and credentials. Keep it
          # outside the uploaded evidence directory and publish only a bounded,
          # allowlisted diagnostic; preserve the failing command's actual status.
          : > /tmp/mtx-plugin-install.raw
          run_install_check() {
            local status=0
            "$@" >> /tmp/mtx-plugin-install.raw 2>&1 || status=$?
            if [ "$status" -ne 0 ]; then
              python3 clinic-practice-management/tests/bin/safe-php-fatal-report.py \
                /tmp/mtx-plugin-install.raw "$WP_DIR/wp-content/debug.log" --summary "$GITHUB_STEP_SUMMARY"
              echo "::error title=CPMS plugin activation::Install/activation check failed (exit $status)"
              return "$status"
            fi
          }
          run_install_check wp plugin install "$ZIP" --activate --path="$WP_DIR" --allow-root
          run_install_check wp plugin is-active clinic-practice-management --path="$WP_DIR" --allow-root
          echo 'Plugin ZIP installed and active.'
          # Apache (www-data) must be able to read the installed tree and write logs.
          sudo chmod -R a+rX "$WP_DIR/wp-content"
          sudo chmod 666 "$WP_DIR/wp-content/debug.log"

      - name: Verify fresh install and repeat activation
        run: |
          set -euo pipefail
          PROOF="$GITHUB_WORKSPACE/clinic-practice-management/tests/bin/wp-activation-schema-proof.php"
          : > /tmp/mtx-activation-proof.raw
          run_proof() {
            local status=0
            "$@" >> /tmp/mtx-activation-proof.raw 2>&1 || status=$?
            if [ "$status" -ne 0 ]; then
              python3 clinic-practice-management/tests/bin/safe-php-fatal-report.py \
                /tmp/mtx-activation-proof.raw "$WP_DIR/wp-content/debug.log" --summary "$GITHUB_STEP_SUMMARY"
              while IFS= read -r code; do echo "::error title=CPMS fresh activation proof::$code"; done \
                < <(grep -oE 'activation proof failed: [a-z0-9-]+' /tmp/mtx-activation-proof.raw || true)
              echo "::error title=CPMS fresh activation proof::Check failed (exit $status)"
              return "$status"
            fi
          }
          run_proof wp eval-file "$PROOF" fresh --path="$WP_DIR" --allow-root
          run_proof wp plugin deactivate clinic-practice-management --path="$WP_DIR" --allow-root
          run_proof wp plugin activate clinic-practice-management --path="$WP_DIR" --allow-root
          run_proof wp plugin is-active clinic-practice-management --path="$WP_DIR" --allow-root
          run_proof wp eval-file "$PROOF" fresh-repeat --path="$WP_DIR" --allow-root
          grep '^ACTIVATION_PROOF ' /tmp/mtx-activation-proof.raw | tee /tmp/mtx/fresh-activation-proof.txt
          while IFS= read -r line; do echo "::notice title=CPMS activation proof::$line"; done < /tmp/mtx/fresh-activation-proof.txt

      - name: Verify upgrade from schema 0030 and repeat activation
        run: |
          set -euo pipefail
          BASE_SHA=d2c9f779df47f45137b5ffe9c8bc2dce2451f404
          UPGRADE_DIR=/home/runner/mtx-upgrade
          PROOF="$GITHUB_WORKSPACE/clinic-practice-management/tests/bin/wp-activation-schema-proof.php"
          ZIP=$(ls "$GITHUB_WORKSPACE"/clinic-practice-management/dist/clinic-practice-management-*.zip | head -1)
          : > /tmp/mtx-upgrade-proof.raw
          run_proof() {
            local status=0
            "$@" >> /tmp/mtx-upgrade-proof.raw 2>&1 || status=$?
            if [ "$status" -ne 0 ]; then
              python3 clinic-practice-management/tests/bin/safe-php-fatal-report.py \
                /tmp/mtx-upgrade-proof.raw "$UPGRADE_DIR/wp-content/debug.log" --summary "$GITHUB_STEP_SUMMARY"
              while IFS= read -r code; do echo "::error title=CPMS upgrade proof::$code"; done \
                < <(grep -oE 'activation proof failed: [a-z0-9-]+' /tmp/mtx-upgrade-proof.raw || true)
              echo "::error title=CPMS upgrade proof::Check failed (exit $status)"
              return "$status"
            fi
          }
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE_SHA"
          mkdir -p /tmp/mtx-0030 "$UPGRADE_DIR"
          git archive "$BASE_SHA" clinic-practice-management | tar -x -C /tmp/mtx-0030
          if ! (cd /tmp/mtx-0030/clinic-practice-management && bash bin/build-release.sh) > /tmp/mtx-0030-build.raw 2>&1; then
            echo '::error title=CPMS upgrade proof::Could not build the pinned schema-0030 ZIP'
            exit 1
          fi
          BASE_ZIP=$(find /tmp/mtx-0030/clinic-practice-management/dist -name 'clinic-practice-management-*.zip' -print -quit)
          test -n "$BASE_ZIP"
          tar -xzf /tmp/wp.tar.gz --strip-components=1 -C "$UPGRADE_DIR"
          run_proof mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot -proot -e 'CREATE DATABASE cpms_mtx_upgrade CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          run_proof wp config create --dbname=cpms_mtx_upgrade --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --dbprefix=wp_ --skip-salts --path="$UPGRADE_DIR" --allow-root
          run_proof wp config shuffle-salts --path="$UPGRADE_DIR" --allow-root
          run_proof wp config set WP_DEBUG true --raw --path="$UPGRADE_DIR" --allow-root
          run_proof wp config set WP_DEBUG_LOG true --raw --path="$UPGRADE_DIR" --allow-root
          run_proof wp config set WP_DEBUG_DISPLAY false --raw --path="$UPGRADE_DIR" --allow-root
          run_proof wp config set DISABLE_WP_CRON true --raw --path="$UPGRADE_DIR" --allow-root
          run_proof wp core install --url='http://localhost:8080/upgrade-only' --title='Synthetic upgrade proof' --admin_user="$ADMIN_USER" --admin_password="$ADMIN_PASS" --admin_email=admin@acc.local --skip-email --path="$UPGRADE_DIR" --allow-root
          run_proof wp plugin install "$BASE_ZIP" --activate --path="$UPGRADE_DIR" --allow-root
          run_proof wp eval-file "$PROOF" baseline --path="$UPGRADE_DIR" --allow-root
          run_proof wp plugin deactivate clinic-practice-management --path="$UPGRADE_DIR" --allow-root
          run_proof wp plugin install "$ZIP" --force --activate --path="$UPGRADE_DIR" --allow-root
          run_proof wp plugin is-active clinic-practice-management --path="$UPGRADE_DIR" --allow-root
          run_proof wp eval-file "$PROOF" candidate --path="$UPGRADE_DIR" --allow-root
          run_proof wp plugin deactivate clinic-practice-management --path="$UPGRADE_DIR" --allow-root
          run_proof wp plugin activate clinic-practice-management --path="$UPGRADE_DIR" --allow-root
          run_proof wp eval-file "$PROOF" candidate-repeat --path="$UPGRADE_DIR" --allow-root
          # Stream the complete consistent snapshot directly to the independent
          # Python verifier: never retain or print rows, identifiers or hashes.
          if ! wp eval-file "$GITHUB_WORKSPACE/clinic-practice-management/tests/audit-chain/export.php" --path="$UPGRADE_DIR" --allow-root \
              2>/tmp/mtx-audit-export.raw | python3 clinic-practice-management/tests/audit-chain/verify.py \
              > /tmp/mtx-independent-audit.json 2>/tmp/mtx-audit-verify.raw; then
            echo '::error title=CPMS independent audit::Snapshot/export verification failed or was incomplete'
            exit 1
          fi
          python3 - <<'PY'
          import json
          with open('/tmp/mtx-independent-audit.json', encoding='utf-8') as stream:
              result = json.load(stream)
          if result.get('ok') is not True or result.get('checked', 0) < 2:
              raise SystemExit('::error title=CPMS independent audit::Insufficient or broken chain')
          print('::notice title=CPMS independent audit::full snapshot verified; rows=' + str(result['checked']))
          PY
          grep '^ACTIVATION_PROOF ' /tmp/mtx-upgrade-proof.raw | tee /tmp/mtx/upgrade-proof.txt
          while IFS= read -r line; do echo "::notice title=CPMS upgrade proof::$line"; done < /tmp/mtx/upgrade-proof.txt

      - name: Verify schema + no PHP fatal
        run: |
          set -euo pipefail
          wp eval 'echo "schema=" . \ClinicCore\Bootstrap\App::migrations()->currentVersion() . PHP_EOL;' --path="$WP_DIR" --allow-root | tee /tmp/mtx/schema.txt
          python3 clinic-practice-management/tests/bin/safe-php-fatal-report.py \
            "$WP_DIR/wp-content/debug.log" --summary "$GITHUB_STEP_SUMMARY" --check

      # Split from the pristine checks on purpose (no log access in the authoring
      # sandbox): a failure must be attributable from the step name alone.
      - name: Create the isolated organization-manager identity
        run: |
          set -euo pipefail
          if wp user get "$ORG_MANAGER_USER" --path="$WP_DIR" --allow-root >/dev/null 2>&1; then
            echo "organization manager already present"
          else
            wp user create "$ORG_MANAGER_USER" 'orgmgr@acc.local' --user_pass="$ORG_MANAGER_PASS" --role=subscriber --path="$WP_DIR" --allow-root
          fi
          wp user get "$ORG_MANAGER_USER" --field=roles --path="$WP_DIR" --allow-root | tee /tmp/mtx/org-manager-role.txt

      - name: Assert pristine tenant tables before the browser matrix
        run: |
          set -euo pipefail
          MEMBERS=$(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot -proot -N -e "SELECT COUNT(*) FROM $DB_NAME.wp_cpms_clinic_memberships;")
          echo "pre-browser membership rows: $MEMBERS"
          [ "$MEMBERS" = "0" ] || { echo 'FAIL: memberships must be zero before the matrix (no pre-seeded Clinic authority)'; exit 1; }
          # Migration 0001 intentionally seeds the legacy default Clinic, so the
          # baseline clinic count is RECORDED, not required to be zero (the
          # established first-practice lane makes the same distinction). The
          # harness asserts per-Organization Clinic counts against live rows.
          CLINICS=$(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot -proot -N -e "SELECT COUNT(*) FROM $DB_NAME.wp_cpms_clinics;")
          echo "pre-browser clinic rows (migration baseline): $CLINICS" | tee /tmp/mtx/baseline-clinics.txt
          ORGS=$(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot -proot -N -e "SELECT COUNT(*) FROM $DB_NAME.wp_cpms_organizations;")
          echo "pre-browser organization rows: $ORGS" | tee -a /tmp/mtx/baseline-clinics.txt
          # No Clinic AUTHORITY may pre-exist: zero memberships is the contract.
          [ "$MEMBERS" = "0" ] || { echo 'FAIL: memberships must be zero before the matrix'; exit 1; }

      - name: Browser matrix — all 12 types + medical-building structure
        run: |
          set -o pipefail
          BASE="$WP_URL" \
          ORG_MANAGER_USER="$ORG_MANAGER_USER" ORG_MANAGER_PASS="$ORG_MANAGER_PASS" \
          MATRIX_MANAGER_PASS="$MATRIX_MANAGER_PASS" \
          WP_DIR="$WP_DIR" OUT=/tmp/mtx \
          python3 clinic-practice-management/bin/rwp-facility-matrix-journey.py | tee /tmp/mtx/facility-matrix.log

      - name: Capture debug log + versions
        if: always()
        run: |
          mkdir -p /tmp/mtx/logs
          {
            echo "head_sha=${GITHUB_SHA}"
            echo "wordpress=$(cat /tmp/mtx/wp-version.txt 2>/dev/null || echo unknown)"
            echo "php=$(php -r 'echo PHP_VERSION;' 2>/dev/null || echo unknown)"
            echo "database=${{ matrix.database }} $(cat /tmp/mtx/database-version.txt 2>/dev/null || echo unknown)"
            echo "zip_sha256=$(cut -d' ' -f1 /tmp/mtx/zip.sha256 2>/dev/null || echo unknown)"
          } | tee /tmp/mtx/versions.txt
          # Scan raw files in place: never archive or echo their exception text,
          # stack arguments or request data. A fatal still fails the log gate.
          python3 clinic-practice-management/tests/bin/safe-php-fatal-report.py \
            /tmp/mtx-plugin-install.raw "$WP_DIR/wp-content/debug.log" \
            --summary "$GITHUB_STEP_SUMMARY" --check
          echo 'LOG GATE: clean'

      - name: Upload matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facility-matrix-${{ matrix.database }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/mtx/
            !/tmp/mtx/**/*.zip
            !/tmp/mtx/**/*.sql
          retention-days: 14

      - name: Summary (per-type PASS/FAIL)
        if: always()
        run: |
          {
            echo "## Facility onboarding matrix — ${{ matrix.database }}"
            echo
            echo "- head SHA: \`${GITHUB_SHA}\`"
            echo "- database: \`$(cat /tmp/mtx/database-version.txt 2>/dev/null || echo unknown)\`"
            echo "- WordPress: \`$(cat /tmp/mtx/wp-version.txt 2>/dev/null || echo unknown)\`"
            echo
            echo '```'
            tail -40 /tmp/mtx/facility-matrix.log 2>/dev/null || echo '(browser step did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
