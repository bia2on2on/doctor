name: WordPress Compatibility (previous supported majors)

# بازهٔ پشتیبانی‌شده = سه نسخهٔ اصلیِ پایدارِ آخر: ۷.۱ / ۷.۰ / ۶.۹.
#
# لِینِ اصلی روی آخرین نسخهٔ پایدار (۷.۱.x) اجرا می‌شود: CI (Integration)،
# Real WP Acceptance (مرورگر)، First-Practice Acceptance، Pilot/Upgrade و
# Closure. این workflow دو نسخهٔ اصلیِ *پیشین* (۷.۰ و ۶.۹ روی PHP 8.2) را
# می‌سنجد و یک لِینِ زمان‌اجرا روی آخرین نسخهٔ پایدار WP (۷.۱.x) با جدیدترین
# شاخهٔ پایدار PHP (8.5؛ انتشار ۸.۵.۰ در ۲۰۲۵-۱۱-۲۰ طبق php.net) اضافه می‌کند.
# لِینِ 8.5 شواهد سازگاریِ زمان‌اجرای واقعی (boot/migration/probe روی WP رسمی)
# می‌دهد؛ تست‌لیبِ PHPUnit روی 8.5 به‌دلیل محدودیت PHPUnit 9.6 در اینجا اجرا
# نمی‌شود و پوشش تستیِ 8.5 از Unit matrix در ci.yml می‌آید.
#
# چرا زمان‌بندی‌شده و نه per-PR:
#   افزودنِ این دو نسخه به هر PR تعداد چک‌ها را سه‌برابر می‌کند (هزینه/زمان/نویز)
#   بدون آن‌که چیزی به شواهدِ دقیقِ همان SHA اضافه شود؛ ماتریس کامل (۷.۰/۶.۹/۷.۱)
#   روی `schedule` و `workflow_dispatch` می‌ماند.
#
# D7 (ممیزی مستقل): لِینِ زمان‌اجرای WP 7.1 روی PHP 8.5 نباید فقط schedule-only
# بماند، پس یک تریگر `pull_request` اضافه شده که در آن **فقط همان یک لِین** اجرا
# می‌شود (ماتریس پایین به‌صورت شرطی تک‌عضوی می‌شود). این کوچک‌ترین تغییر پایدار
# است: دقیقاً +۱ چک per-PR (نام: `WP 7.1 on PHP 8.5`)، بدون انفجار ماتریس و
# بدون حذف لِین‌های ۸.۱–۸.۴ در ci.yml. شواهد تست‌لیبِ PHPUnit روی 8.5 همچنان از
# Unit matrix در ci.yml می‌آید؛ این لِین boot/install/migration/probe واقعی روی
# WP رسمی را پوشش می‌دهد (محدودیت PHPUnit 9.6 در بالای همین فایل مستند است).
#
# آنچه سنجیده می‌شود (کفِ اعلام‌شده = ۶.۹):
#   ۱. آخرین وصلهٔ همان نسخهٔ اصلی از منبعِ رسمی WordPress.org حل می‌شود
#      (`api.wordpress.org/core/stable-check/1.0/`) — نسخهٔ حدس‌زده pin نمی‌شود.
#   ۲. وردپرسِ تمیز + MySQL 8 ساخته می‌شود و افزونه از **همان ZIP ریلیزِ رسمی**
#      (`bin/build-release.sh`) نصب و فعال می‌شود.
#   ۳. Migration روی همان نسخه اجرا می‌شود.
#   ۴. probe: افزونه بوت می‌شود، مسیر REST حیات ثبت شده است، هیچ
#      deprecation/notice از فایل‌های افزونه نیامده، و کفِ اعلام‌شدهٔ WP روی این
#      نسخه PASS است (یعنی واقعاً داخلِ بازهٔ پشتیبانی است).
#
# این workflow هیچ گیتِ مجوزمانند و هیچ محدودیتِ دسترسیِ داده اضافه نمی‌کند؛
# فقط سازگاریِ زمان‌اجرا را می‌سنجد.

on:
  schedule:
    # هفتگی: دوشنبه ۰۳:۱۷ UTC (کم‌ازدحام)
    - cron: '17 3 * * 1'
  workflow_dispatch:
  # D7: لِینِ زمان‌اجرا (WP 7.1 + PHP 8.5) باید روی همان SHA هر PR واقعاً اجرا
  # شود، نه فقط به‌صورت هفتگی. فیلتر path تمرکز را روی کد افزونه و خود workflow
  # نگه می‌دارد؛ تغییرات صرفاً مستندسازی این لِین را بیدار نمی‌کند.
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/wp-compat.yml'
      - 'clinic-practice-management/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # D7: the runtime probe mirrors its full output into a PR comment so a
  # failure is diagnosable from the PR alone (job logs may be unreachable in
  # restricted networks). Only this workflow's own evidence is posted.
  pull-requests: write

defaults:
  run:
    working-directory: clinic-practice-management

jobs:
  compat:
    name: WP ${{ matrix.wp_major }} on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # schedule/dispatch → هر سه لِین (7.0/8.2، 6.9/8.2، 7.1/8.5).
        # pull_request → فقط لِین زمان‌اجرای WP 7.1 روی PHP 8.5 (+۱ چک per-PR).
        include: ${{ github.event_name == 'pull_request' && fromJSON('[{"wp_major":"7.1","php":"8.5"}]') || fromJSON('[{"wp_major":"7.0","php":"8.2"},{"wp_major":"6.9","php":"8.2"},{"wp_major":"7.1","php":"8.5"}]') }}
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      WP_DIR: /home/runner/wpcompat
      STORAGE_OUT: /home/runner/wpcompat-storage
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, xml, curl, zip
          coverage: none

      - name: Tooling (mysql-client + wp-cli)
        uses: ./.github/actions/cpms-tooling
        with:
          apt-packages: mysql-client
          log-dir: /tmp/wp-compat-tooling

      - name: Build release ZIP (whitelist-only)
        run: |
          set -euo pipefail
          bash bin/build-release.sh
          cat dist/clinic-practice-management-1.0.0.zip.sha256

      - name: Install WordPress ${{ matrix.wp_major }}.x (latest patch, official source)
        run: |
          set -euo pipefail
          MAJ='${{ matrix.wp_major }}'
          VER=$(curl -fsSL https://api.wordpress.org/core/stable-check/1.0/ \
            | python3 -c "import json,sys;d=json.load(sys.stdin);vs=[v for v in d if v.startswith('${MAJ}.') and d[v]!='development'];print(max(vs,key=lambda x:tuple(int(p) for p in x.split('.'))))")
          test -n "$VER"
          echo "Resolved WP ${VER} (branch ${MAJ})"
          echo "WP_VER=${VER}" >> "$GITHUB_ENV"
          # fail-closed: بدون منبع جانشین و بدون نسخهٔ دیگر
          curl -fsSL "https://wordpress.org/wordpress-${VER}.tar.gz" -o /tmp/wp.tar.gz
          rm -rf "$WP_DIR" /home/runner/wordpress
          tar -xzf /tmp/wp.tar.gz -C /home/runner
          mv /home/runner/wordpress "$WP_DIR"
          DB="cpms_compat${MAJ//./}"
          mysql -h127.0.0.1 -P3306 -uroot -proot \
            -e "CREATE DATABASE \`$DB\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          cd "$WP_DIR"
          wp config create --dbname="$DB" --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 \
            --dbprefix=cpmswp_ --skip-salts --allow-root
          wp config shuffle-salts --allow-root
          wp core install --url="http://wpcompat.test" --title="CPMS compat ${VER}" \
            --admin_user=cl_admin --admin_password='Compat-2026!' --admin_email=cl@compat.test \
            --skip-email --allow-root
          wp core version --allow-root

      - name: Install + activate plugin from the official release ZIP
        run: |
          set -euo pipefail
          cd "$WP_DIR"
          wp plugin install "$GITHUB_WORKSPACE/clinic-practice-management/dist/clinic-practice-management-1.0.0.zip" \
            --activate --path="$WP_DIR" --allow-root
          wp plugin list --allow-root

      - name: Migrate on WordPress ${{ matrix.wp_major }}.x
        run: |
          set -euo pipefail
          WP_HOME="$WP_DIR" php "$WP_DIR/wp-content/plugins/clinic-practice-management/bin/cpms" migrate

      - name: Runtime compatibility probe
        run: |
          set -euo pipefail
          mkdir -p "$STORAGE_OUT"
          cat > /tmp/compat-probe.php <<'PHPEOF'
          <?php
          error_reporting( E_ALL );
          $home = (string) getenv( 'WP_HOME' );
          if ( ! is_file( rtrim( $home, '/' ) . '/wp-load.php' ) ) { fwrite( STDERR, "WP_HOME invalid\n" ); exit( 3 ); }
          require rtrim( $home, '/' ) . '/wp-load.php';

          use ClinicCore\Application\System\SystemHealthService;

          $errors = array();
          set_error_handler( static function ( int $sev, string $msg, string $file = '', int $line = 0 ) use ( &$errors ): bool {
              $errors[] = array( 'sev' => $sev, 'msg' => $msg, 'file' => $file, 'line' => $line );
              return false;
          } );

          $pluginDir = defined( 'CPMS_PLUGIN_DIR' ) ? rtrim( (string) CPMS_PLUGIN_DIR, '/' ) : '';
          $fail      = static function ( string $msg ): void { fwrite( STDERR, "FAIL {$msg}\n" ); exit( 1 ); };

          // ۱. افزونه بوت شده است
          defined( 'CPMS_VERSION' ) || $fail( 'CPMS_VERSION is not defined — plugin did not boot' );
          echo 'CPMS_VERSION=' . CPMS_VERSION . "\n";

          // ۲. کفِ اعلام‌شدهٔ WP باید روی این نسخه PASS باشد (یعنی واقعاً پشتیبانی‌شده)
          $floor = SystemHealthService::MIN_WORDPRESS_VERSION;
          $wp    = (string) get_bloginfo( 'version' );
          $row   = SystemHealthService::wordpress_version_check( $wp );
          echo 'declared_floor=' . $floor . ' running_wp=' . $wp . ' status=' . $row['status'] . "\n";
          if ( $row['status'] !== SystemHealthService::PASS ) {
              $fail( 'declared WP floor is NOT satisfied on this release: ' . $row['detail'] );
          }

          // ۳. مسیر REST حیات ثبت شده است (بدون تماس شبکه‌ای) — همان الگوی probe موجود در Closure Gate
          if ( ! function_exists( 'rest_get_server' ) ) { require_once ABSPATH . 'wp-includes/rest-api.php'; }
          if ( ! did_action( 'rest_api_init' ) ) { do_action( 'rest_api_init' ); }
          $routes = rest_get_server()->get_routes();
          isset( $routes['/clinic/v1/health'] ) || $fail( 'REST route /clinic/v1/health not registered' );
          echo "rest_route=/clinic/v1/health OK\n";

          // ۴. هیچ deprecation/notice از فایل‌های افزونه نیامده است
          $bad = array();
          foreach ( $errors as $e ) {
              $sev = (int) $e['sev'];
              if ( ! in_array( $sev, array( E_DEPRECATED, E_USER_DEPRECATED, E_NOTICE, E_USER_NOTICE, E_WARNING, E_USER_WARNING ), true ) ) {
                  continue;
              }
              if ( $pluginDir !== '' && str_starts_with( (string) $e['file'], $pluginDir ) ) {
                  $bad[] = $e['msg'] . ' @ ' . basename( (string) $e['file'] ) . ':' . $e['line'];
              }
          }
          if ( $bad !== array() ) {
              $fail( 'plugin-level PHP diagnostics: ' . implode( ' | ', $bad ) );
          }

          echo "COMPAT PROBE OK\n";
          PHPEOF
          php -l /tmp/compat-probe.php | tee /tmp/compat-probe-lint.log
          # D7: keep full probe output outside the job log path as well, so the
          # always-on evidence step below can post it even when this step fails.
          WP_HOME="$WP_DIR" STORAGE_OUT="$STORAGE_OUT" php /tmp/compat-probe.php 2>&1 | tee /tmp/compat-probe.log

      - name: Mirror runtime probe evidence onto the PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          {
            echo "### WP compat runtime probe — WP ${{ matrix.wp_major }}.x on PHP ${{ matrix.php }} (run ${{ github.run_id }}, head ${GITHUB_SHA::8})"
            echo '```'
            echo "resolved: ${WP_VER:-unknown} · outcome: ${{ job.status }}"
            echo '--- php -l ---'
            cat /tmp/compat-probe-lint.log 2>/dev/null || echo '(lint log missing)'
            echo '--- probe ---'
            cat /tmp/compat-probe.log 2>/dev/null || echo '(probe log missing)'
            echo '```'
          } > /tmp/wp-compat-pr.md
          gh pr comment "$PR_NUM" --body-file /tmp/wp-compat-pr.md || echo '::notice::probe evidence comment failed'

      - name: Summary
        if: always()
        run: |
          {
            echo "### WordPress Compatibility — ${{ matrix.wp_major }}.x (resolved ${WP_VER:-unknown})"
            echo ''
            echo "- artifact: release ZIP from \`bin/build-release.sh\`"
            echo "- PHP: ${{ matrix.php }} · DB: MySQL 8"
            echo "- probe outcome: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
