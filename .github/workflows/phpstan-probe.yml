name: PHPStan Level Probe (temporary — F1-3 level discovery)

# موقت: تعیین «سطح هم‌تراز وضعیت واقعی کد» برای F1-3. بعد از ثبت سطح در
# phpstan.neon و ci.yml این فایل حذف می‌شود. لاگ job از API مسدود است →
# نتیجه (شمار خطا + نمونه) در کامنت PR منتشر می‌شود (الگوی ci.yml).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: clinic-practice-management

jobs:
  probe:
    name: Probe levels 0..8 (sequential)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan levels 0..8
        run: |
          set +e
          rm -f /tmp/summary.txt
          for L in 0 1 2 3 4 5 6 7 8; do
            vendor/bin/phpstan analyse --level=$L --no-progress --error-format=raw > /tmp/lvl-$L.log 2>&1
            RC=$?
            ERRS=$(grep -cv '^$' /tmp/lvl-$L.log || true)
            echo "level=$L exit=$RC lines=$ERRS" >> /tmp/summary.txt
          done
          cat /tmp/summary.txt

      - name: Post probe results to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### PHPStan level probe (run ${{ github.run_id }})"
            echo '```'
            cat /tmp/summary.txt
            echo '```'
            for L in 0 1 2 3 4 5 6 7 8; do
              echo "--- level $L (head 12 + tail 3) ---"
              echo '```'
              head -n 12 /tmp/lvl-$L.log
              echo '…'
              tail -n 3 /tmp/lvl-$L.log
              echo '```'
            done
          } > /tmp/pr-body.md
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/pr-body.md || echo "::notice::PR comment failed"
          fi
