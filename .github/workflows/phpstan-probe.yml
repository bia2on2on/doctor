name: PHPStan Level Probe (temporary — F1-3 scope src+bin)

# موقت: تعیین سطح برای scope جدید (src + bin طبق مشخصات کارفرما) + تولید
# phpstan-baseline.neon در سطح 3. بعد از ثبت پیکربندی نهایی حذف می‌شود.
# لاگ job از API مسدود است → نتیجه در کامنت PR (الگوی ci.yml).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: clinic-practice-management

jobs:
  probe:
    name: Probe src+bin levels 0..8 + baseline@3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Probe levels (src bin)
        run: |
          set +e
          : > /tmp/summary.txt
          for L in 0 1 2 3 4 5 6 7 8; do
            php -d memory_limit=1G vendor/bin/phpstan analyse src bin --level=$L --no-progress --error-format=raw > /tmp/lvl-$L.log 2>&1
            C=$(grep -cE ':[0-9]+:' /tmp/lvl-$L.log || true)
            echo "level=$L errorLines=$C" >> /tmp/summary.txt
          done
          php -d memory_limit=1G vendor/bin/phpstan analyse src bin --level=3 --generate-baseline --no-progress > /tmp/gen.log 2>&1 || true
          if [ -f phpstan-baseline.neon ]; then wc -c phpstan-baseline.neon >> /tmp/summary.txt; else echo "baseline: NOT generated" >> /tmp/summary.txt; fi
          cat /tmp/summary.txt

      - name: Post probe to PR (part 1 — summary + level3 errors)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### PHPStan probe src+bin (run ${{ github.run_id }})"
            echo '```'
            cat /tmp/summary.txt
            echo '```'
            echo "--- level 3 FULL (first 250 lines) ---"
            echo '```'
            grep -v '^Note: Using configuration' /tmp/lvl-3.log | head -n 250
            echo '```'
          } > /tmp/c1.md
          if [ -n "$PR_NUMBER" ]; then gh pr comment "$PR_NUMBER" --body-file /tmp/c1.md || echo "::notice::comment1 failed"; fi

      - name: Post probe to PR (part 2 — generated baseline file)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f phpstan-baseline.neon ]; then
            {
              echo "### phpstan-baseline.neon (generated @level3 src+bin — run ${{ github.run_id }})"
              echo '```'
              head -c 48000 phpstan-baseline.neon
              echo '```'
            } > /tmp/c2.md
            if [ -n "$PR_NUMBER" ]; then gh pr comment "$PR_NUMBER" --body-file /tmp/c2.md || echo "::notice::comment2 failed"; fi
          fi
