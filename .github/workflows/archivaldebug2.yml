name: ArchivalDebug2
on: pull_request
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1','8.2','8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml
      - run: |
          cd clinic-practice-management
          composer install --prefer-dist --no-progress --no-interaction
          set +e
          php -d memory_limit=512M vendor/bin/phpunit --filter 'testWorkerDescriptorInventoryIsStdioAndDevNullOnly' tests/Unit/ArchivalRaceWorkerFailurePathsTest.php > /tmp/a.log 2>&1
          rc=$?
          echo "php=${{ matrix.php }} exit=$rc"
          grep -n -i -E "Tests:|Failed asserting|worker_socket_count" /tmp/a.log | head -n 5 | while IFS= read -r line; do echo "::error::php=${{ matrix.php }} $line"; done
          exit 0
