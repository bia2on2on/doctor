name: backup.run GREEN evidence (temporary)

on:
  push:
    branches:
      - arena/01a0a126-doctor
      - arena/*
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: clinic-practice-management

jobs:
  green-evidence:
    name: GREEN evidence fresh-process
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      WP_TESTS_DIR: /tmp/wordpress-test-lib
      WP_CORE_DIR: /tmp/wordpress

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, mysqli, pcntl, curl
          coverage: none

      - name: Install dependencies (PHPUnit 9.6 for WP test lib)
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          composer require --dev phpunit/phpunit:^9.6 --no-interaction --no-progress --with-all-dependencies

      - name: Prepare WordPress test suite
        run: bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 6.7.2

      - name: Run ONLY BackupRunM2WiringRedTest in fresh process (GREEN)
        run: |
          set -o pipefail
          echo "=== Running focused GREEN test in fresh process ==="
          php -d memory_limit=1G vendor/bin/phpunit --no-configuration             --bootstrap tests/integration-bootstrap.php             --filter testBackupRunGreenInstallationLevelControls             tests/Integration/BackupRunM2WiringRedTest.php 2>&1 | tee /tmp/green-evidence.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "=== Exit code: $EXIT_CODE ==="
          cat /tmp/green-evidence.log
          echo "=== Guards ==="
          if ! grep -qE "Tests: 1,|OK \(1 test" /tmp/green-evidence.log; then
            echo "::error::Expected exactly one selected test, not found"
            exit 1
          fi
          if grep -qE "ParseError|syntax error, unexpected" /tmp/green-evidence.log; then
            echo "::error::Syntax/parse error detected"
            exit 1
          fi
          if grep -qE "^There were .* errors:" /tmp/green-evidence.log; then
            echo "::error::PHPUnit ERROR detected"
            exit 1
          fi
          if ! grep -q "GREEN_SIGNATURE=installation_level_backup_run" /tmp/green-evidence.log; then
            echo "::error::Missing GREEN_SIGNATURE"
            exit 1
          fi
          if ! grep -q "no_first_clinic_fallback=true" /tmp/green-evidence.log; then
            echo "::error::Missing no_first_clinic_fallback proof"
            exit 1
          fi
          if ! grep -q "legacy_ignored=true" /tmp/green-evidence.log; then
            echo "::error::Missing legacy_ignored proof"
            exit 1
          fi
          if ! grep -q "scope_context=none" /tmp/green-evidence.log; then
            echo "::error::Missing scope_context=none"
            exit 1
          fi
          if ! grep -q "payload_empty=true" /tmp/green-evidence.log; then
            echo "::error::Missing payload_empty marker"
            exit 1
          fi
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::Focused GREEN test should PASS, but exit=$EXIT_CODE"
            exit 1
          fi
          echo "=== GREEN evidence guards PASSED ==="

      - name: Upload GREEN evidence log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-run-green-evidence-${{ github.run_id }}
          path: /tmp/green-evidence.log
          if-no-files-found: warn
          retention-days: 14
