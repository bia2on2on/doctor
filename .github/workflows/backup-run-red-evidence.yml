name: backup.run RED evidence (temporary)

on:
  push:
    branches:
      - arena/01a0a126-doctor
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: clinic-practice-management

jobs:
  red-evidence:
    name: RED evidence fresh-process
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      WP_TESTS_DIR: /tmp/wordpress-test-lib
      WP_CORE_DIR: /tmp/wordpress

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, mysqli, pcntl, curl
          coverage: none

      - name: Install dependencies (PHPUnit 9.6 for WP test lib)
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          composer require --dev phpunit/phpunit:^9.6 --no-interaction --no-progress --with-all-dependencies

      - name: Prepare WordPress test suite
        run: bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 6.7.2

      - name: Run ONLY BackupRunM2WiringRedTest in fresh process
        run: |
          set -o pipefail
          echo "=== Running focused RED test in fresh process ==="
          php -d memory_limit=1G vendor/bin/phpunit --no-configuration \
            --bootstrap tests/integration-bootstrap.php \
            --filter testBackupRunMustBeExecutableWithoutClinicScope \
            tests/Integration/BackupRunM2WiringRedTest.php 2>&1 | tee /tmp/red-evidence.log
          echo "=== Exit code: $? ==="
          cat /tmp/red-evidence.log

      - name: Upload RED evidence log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-run-red-evidence-${{ github.run_id }}
          path: /tmp/red-evidence.log
          if-no-files-found: warn
          retention-days: 14
