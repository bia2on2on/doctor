name: Focused Backup (multi-clinic + zero + enum-fail)

on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    working-directory: clinic-practice-management

jobs:
  focused:
    name: Focused Backup Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      WP_TESTS_DIR: /tmp/wordpress-test-lib
      WP_CORE_DIR: /tmp/wordpress
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, mysqli, pcntl, curl
          coverage: none

      - name: Install dependencies (PHPUnit 9.6)
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          composer require --dev phpunit/phpunit:^9.6 --no-interaction --no-progress --with-all-dependencies

      - name: Prepare WP test suite
        run: bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 6.7.2

      - name: Run focused backup tests (fresh process, selected count)
        run: |
          set -o pipefail
          echo "=== FOCUSED BACKUP TESTS (zero + enum-fail) ==="
          FILTER="BackupMultiClinicFilesRedTest|BackupMultiClinicFilesRestoreGreenTest|BackupAmbiguousRestoreFailsClosedTest|BackupZeroClinicAndEnumerationFailureTest|BackupEngineTest"
          php -d memory_limit=1G vendor/bin/phpunit --no-configuration \
            --bootstrap tests/integration-bootstrap.php \
            --filter "$FILTER" \
            tests/Integration 2>&1 | tee /tmp/focused-backup.log
          RC=${PIPESTATUS[0]}
          echo "=== LOG TAIL ==="
          tail -n 150 /tmp/focused-backup.log
          echo "=== GREEN MARKERS ==="
          grep -E "GREEN_|Tests:|OK \(" /tmp/focused-backup.log | tail -n 30
          if [ "$RC" -ne 0 ]; then
            echo "FOCUSED FAILED rc=$RC"
            exit $RC
          fi
          if grep -qE "FAILURES|ERRORS" /tmp/focused-backup.log; then
            echo "FAILURES detected"
            exit 1
          fi
          echo "FOCUSED GREEN"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-backup-log-${{ github.run_id }}
          path: /tmp/focused-backup.log
          retention-days: 7
