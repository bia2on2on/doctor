name: Lint
on: pull_request
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: |
          for f in clinic-practice-management/src/Admin/SystemPage.php clinic-practice-management/src/Application/System/SystemHealthService.php clinic-practice-management/tests/Unit/SystemHealthHostClassificationTest.php; do
            php -l "$f" || echo "::error file=$f::php -l failed"
          done
