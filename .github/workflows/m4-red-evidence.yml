name: M-4 RED evidence (temporary)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0a115-doctor

permissions:
  contents: read

defaults:
  run:
    working-directory: clinic-practice-management

jobs:
  m4-red:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      WP_TESTS_DIR: /tmp/wordpress-test-lib
      WP_CORE_DIR: /tmp/wordpress
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, mysqli, pcntl, curl
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Prepare WordPress test suite
        run: bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 6.7.2
      - name: Run exactly one M-4 RED test
        run: |
          set -o pipefail
          php -d memory_limit=1G vendor/bin/phpunit --no-configuration \
            --bootstrap tests/integration-bootstrap.php \
            --filter testTypedInvalidPayloadIsTerminalOnFirstAttempt \
            tests/Integration/JobQueueM4DeterministicFailureTest.php 2>&1 | tee /tmp/m4-red.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-red-evidence-${{ github.run_id }}
          path: /tmp/m4-red.log
          retention-days: 14
