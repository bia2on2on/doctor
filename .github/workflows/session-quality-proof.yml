# Temporary session-only runner. It exercises the unmodified CI jobs on the
# session branch without changing PR #291 or its historical branch. Remove after
# collecting exact-tested-commit evidence; never treat it as a PR check.
name: Session quality proof

on:
  push:
    branches: [arena/c9c7a855-doctor]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  quality:
    if: contains(github.event.head_commit.message, '[quality-proof]')
    uses: ./.github/workflows/ci.yml
