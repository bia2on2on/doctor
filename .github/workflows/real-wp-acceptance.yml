name: Real WordPress Acceptance (ZIP → clean WP → browser)

# گیت پذیرش واقعی: پاسخ مستقیم به نقص‌های گزارش‌شدهٔ نصب روی WordPress واقعی —
#   D1) Tools → CPMS (سیستم)/Health نباید Critical Error شود
#   D2) شمارش جداول در UI == شمارش واقعی DB (با هر prefix)
#   D3) Migration شکست‌خورده هرگز «موفق» ثبت نشود
#   + Administrator فنی (P-3)، منوهای واقعی Doctor/Secretary، بررسی لاگ‌ها.
# هر چیزی که اینجا اجرا می‌شود واقعی است: Apache/mod_php + MySQL 8 +
# Chromium (نه شبیه‌سازی) + ZIP رسمی bin/build-release.sh (نه source mount).

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # PR runs are keyed by PR number; non-PR runs by their full ref. Event names
  # keep pull_request and push evidence in separate cancellation domains.
  # Main refs add the unique run ID so even a pending main run is never replaced.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && format('main-run-{0}', github.run_id) || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref) }}
  # Preserve every main-ref run as post-merge evidence; superseded non-main work may stop.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  # contents: write فقط برای انتشار Evidence به‌صورت Commit Comment
  # (لاگ خام Job در برخی محیط‌ها خوانده نمی‌شود — الگوی مستند ریپو).
  contents: write
  actions: read

env:
  WP_DIR: /home/runner/rwp
  WP_URL: http://localhost:8080
  DB_NAME: cpms_acc
  ADMIN_USER: acc_admin
  ADMIN_PASS: Acceptance-2026!
  DOCTOR_USER: acc_doctor
  DOCTOR_PASS: Acceptance-2026!
  SECRETARY_USER: acc_secretary
  SECRETARY_PASS: Acceptance-2026!
  MANAGER_USER: acc_manager
  MANAGER_PASS: Acceptance-2026!
  ACCOUNTANT_USER: acc_accountant
  ACCOUNTANT_PASS: Acceptance-2026!
  SHELLPROOF_USER: acc_shellproof
  SHELLPROOF_PASS: Acceptance-2026!

jobs:
  acceptance:
    name: "Real WP Acceptance (prefix ${{ matrix.prefix }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prefix: ['wp_', 'clinic_']

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, curl, mbstring, xml, zip, gd, sodium
          coverage: none

      - name: Tooling (apache + wp-cli + playwright/chromium)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client apache2 libapache2-mod-php php-mysql php-mbstring php-xml php-curl php-zip php-gd > /tmp/apt.log 2>&1 || { tail -20 /tmp/apt.log; exit 1; }
          curl -sS https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp && sudo chmod +x /usr/local/bin/wp
          wp --allow-root --version
          (pip install --quiet playwright 2>/dev/null || pip install --quiet --break-system-packages playwright)
          python3 -m playwright install --with-deps chromium > /tmp/pw.log 2>&1 || { tail -10 /tmp/pw.log; exit 1; }

      - name: Lint ابزار Acceptance
        run: |
          php -l clinic-practice-management/bin/cpms
          python3 -m py_compile clinic-practice-management/bin/rwp-acceptance.py
          python3 -m py_compile clinic-practice-management/bin/rwp-shell-proof.py
          python3 -m py_compile clinic-practice-management/bin/acceptance-isolation-check.py
          bash -n clinic-practice-management/bin/build-release.sh
          # قرارداد ایزولاسیون: هر پرسونا کانتکست/کوکی مستقل خودش را دارد
          # (اگر یک کانتکست به چند پرسونا سرو کند، این Step قرمز می‌شود).
          python3 clinic-practice-management/bin/acceptance-isolation-check.py
          python3 clinic-practice-management/bin/acceptance-isolation-check.py clinic-practice-management/bin/rwp-shell-proof.py

      # ---------- 1) ZIP رسمی ریلیز ----------
      - name: Build official release ZIP (bin/build-release.sh)
        run: |
          bash clinic-practice-management/bin/build-release.sh
          ls -la clinic-practice-management/dist/
          ZIP=$(ls clinic-practice-management/dist/clinic-practice-management-*.zip | head -1)
          [ -f "$ZIP" ] || { echo 'ZIP NOT BUILT'; exit 1; }
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"
          mkdir -p /tmp/acc

      # ---------- 2) WordPress تمیز ----------
      - name: Clean WordPress 6.7.2 (prefix=${{ matrix.prefix }})
        run: |
          curl -sS https://wordpress.org/wordpress-6.7.2.tar.gz -o /tmp/wp.tar.gz
          tar -xzf /tmp/wp.tar.gz -C /tmp && mv /tmp/wordpress "$WP_DIR"
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "CREATE DATABASE $DB_NAME CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          cd "$WP_DIR"
          wp config create --dbname="$DB_NAME" --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --dbprefix='${{ matrix.prefix }}' --skip-salts --allow-root
          wp config shuffle-salts --allow-root
          # لاگ‌محور مثل Production-sane: خطاها در debug.log (نمایش خاموش)
          wp config set WP_DEBUG true --raw --allow-root
          wp config set WP_DEBUG_LOG true --raw --allow-root
          wp config set WP_DEBUG_DISPLAY false --raw --allow-root
          wp config set DISALLOW_FILE_EDIT true --raw --allow-root
          wp core install --url="$WP_URL" --title="CPMS Acceptance" --admin_user="$ADMIN_USER" --admin_password="$ADMIN_PASS" --admin_email=admin@acc.local --skip-email --allow-root

      # ---------- 3) نصب از ZIP + فعال‌سازی (Migration خودکار) ----------
      - name: Install ZIP → activate (migration runs in activation hook)
        run: |
          wp plugin install "$GITHUB_WORKSPACE/$ZIP_PATH" --activate --path="$WP_DIR" --allow-root 2>&1 | tee /tmp/acc/plugin-install.log
          wp plugin is-active clinic-practice-management --path="$WP_DIR" --allow-root || { echo 'PLUGIN NOT ACTIVE'; exit 1; }
          echo 'installed from official ZIP (نه source mount)'

      # ---------- 4) تأیید مستقیم DB ----------
      - name: Direct DB verification (tables + schema version)
        run: |
          PREFIX='${{ matrix.prefix }}'
          ACTUAL=$(mysql -h 127.0.0.1 -P 3306 -uroot -proot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='$DB_NAME' AND table_name LIKE '${PREFIX}cpms_%';")
          echo "ACTUAL_TABLE_COUNT=$ACTUAL"
          echo "$ACTUAL" > /tmp/acc/actual_count.txt
          [ "$ACTUAL" -ge 30 ] || { echo "TOO FEW TABLES ($ACTUAL) — migration ناقص است"; exit 1; }
          mysql -h 127.0.0.1 -P 3306 -uroot -proot "$DB_NAME" -e "SELECT version, applied_at FROM ${PREFIX}cpms_schema_migrations ORDER BY version;" | tee /tmp/acc/schema-migrations.txt
          cat > /tmp/acc/check-schema.php <<'PHPEOF'
          <?php
          $v = \ClinicCore\Bootstrap\App::migrations()->currentVersion();
          echo "schema: $v\n";
          exit($v === '2026_09_26_0023' ? 0 : 1);
          PHPEOF
          wp eval-file /tmp/acc/check-schema.php --path="$WP_DIR" --allow-root
          wp role list --path="$WP_DIR" --allow-root | grep -E 'cpms_(doctor|secretary|patient|accountant|manager)' || { echo 'ROLES MISSING'; exit 1; }

      # ---------- 5) تست منفی Migration (D3 — fail-loud) ----------
      - name: Migration failure must NOT be recorded as success (D3)
        run: |
          PREFIX='${{ matrix.prefix }}'
          MDIR="$WP_DIR/wp-content/plugins/clinic-practice-management/src/Migrations"
          # فایل‌های افزونه متعلق به root‌اند (wp-cli allow-root نصب کرده) → sudo
          sudo tee "$MDIR/2999_01_01_9999_acceptance_broken.php" >/dev/null <<'PHPEOF'
          <?php
          // تزریق موقت در runner برای اثبات Fail-loud (در artifact رسمی وجود ندارد).
          return [
              'version' => '2999_01_01_9999',
              'description' => 'acceptance probe: intentionally broken SQL',
              'up' => function (\ClinicCore\Infrastructure\Db\CpmsDb $db): void {
                  $db->query('CREATE TABLE syntax broken (((');
              },
              'down' => function (\ClinicCore\Infrastructure\Db\CpmsDb $db): void {
              },
          ];
          PHPEOF
          sudo chmod a+r "$MDIR/2999_01_01_9999_acceptance_broken.php"
          cat > /tmp/acc/probe-broken.php <<'PHPEOF'
          <?php
          $mig = \ClinicCore\Bootstrap\App::migrations();
          $thrown = null;
          try {
              $mig->migrate();
          } catch (\Throwable $e) {
              $thrown = $e::class . ': ' . $e->getMessage();
          }
          if ($thrown === null) {
              fwrite(STDERR, "FAIL: migration خراب بدون استثنا «موفق» شد\n");
              exit(1);
          }
          echo "fail-loud OK → " . substr($thrown, 0, 160) . "\n";
          $db = \ClinicCore\Bootstrap\App::db();
          $rec = (int) $db->fetchValue('SELECT COUNT(*) FROM ' . $db->table('cpms_schema_migrations') . ' WHERE version = %s', ['2999_01_01_9999']);
          if ($rec !== 0) {
              fwrite(STDERR, "FAIL: version migration خراب ثبت شده ({$rec})\n");
              exit(1);
          }
          echo "not-recorded OK (schema_migrations بدون 2999_01_01_9999)\n";
          PHPEOF
          # بدون pipe-masking: وضعیت خروجی واقعی probe تعیین‌کننده است
          wp eval-file /tmp/acc/probe-broken.php --path="$WP_DIR" --allow-root > /tmp/acc/migration-failure-probe.txt 2>&1
          RC=$?
          cat /tmp/acc/migration-failure-probe.txt
          if [ "$RC" -ne 0 ]; then echo 'D3 PROBE FAILED'; exit "$RC"; fi
          # پاک‌سازی probe و اثبات idempotency پس از آن
          sudo rm -f "$MDIR/2999_01_01_9999_acceptance_broken.php"
          wp eval '\ClinicCore\Bootstrap\App::migrations()->migrate();' --path="$WP_DIR" --allow-root
          echo 're-migrate after probe removal: OK (no-op idempotent)'

      # ---------- کاربران نقش‌محور + دادهٔ پایه ----------
      - name: Role users + storage خارج webroot
        run: |
          wp user create "$DOCTOR_USER" 'doc@acc.local' --user_pass="$DOCTOR_PASS" --role=cpms_doctor --path="$WP_DIR" --allow-root
          wp user create "$SECRETARY_USER" 'sec@acc.local' --user_pass="$SECRETARY_PASS" --role=cpms_secretary --path="$WP_DIR" --allow-root
          wp user create "$MANAGER_USER" 'mgr@acc.local' --user_pass="$MANAGER_PASS" --role=cpms_manager --path="$WP_DIR" --allow-root
          wp user create "$ACCOUNTANT_USER" 'acc@acc.local' --user_pass="$ACCOUNTANT_PASS" --role=cpms_accountant --path="$WP_DIR" --allow-root
          STORAGE=/home/runner/rwp-storage
          mkdir -p "$STORAGE" && sudo chmod -R 777 "$STORAGE"
          cat > /tmp/acc/setup-roles.php <<'PHPEOF'
          <?php
          global $wpdb;
          $db = \ClinicCore\Bootstrap\App::db();
          $now = $db->nowUtcSql();
          // نمایش واقعیِ فارسی برای رابط کاربری (نه شناسه‌های فنی) — این فقط data seeding است؛
          // هیچ تغییر Production/sanitize ایجاد نمی‌شود.
          $names = [
              getenv('DOCTOR_USER') => 'دکتر آزمایشی',
              getenv('MANAGER_USER') => 'مدیر کلینیک آزمایشی',
              getenv('SECRETARY_USER') => 'منشی آزمایشی',
              getenv('ACCOUNTANT_USER') => 'حسابدار آزمایشی',
          ];
          foreach ($names as $login => $display) {
              $u = get_user_by('login', $login);
              if ($u !== false) { wp_update_user(['ID' => (int) $u->ID, 'display_name' => $display]); }
          }
          $uid = (int) get_user_by('login', getenv('DOCTOR_USER'))->ID;
          // The acceptance fixture resolves its explicit Clinic by durable slug,
          // never by first-row order or a literal clinic_id.
          $clinicRow = $db->fetchRow(
              'SELECT id FROM ' . $db->table('cpms_clinics') . ' WHERE slug = %s LIMIT 1',
              ['default']
          );
          if ($clinicRow === null) {
              fwrite(STDERR, "FAIL: explicit default Clinic fixture not found\n");
              exit(1);
          }
          $accClinicId = (int) $clinicRow['id'];
          if ($accClinicId <= 0) {
              fwrite(STDERR, "FAIL: explicit Clinic fixture is invalid\n");
              exit(1);
          }
          file_put_contents('/tmp/acc/manager_clinic_id.txt', (string) $accClinicId);
          $wpdb->query($wpdb->prepare(
              'INSERT INTO ' . $db->table('cpms_clinicians') . ' (clinic_id, full_name, wp_user_id, is_active, created_at, updated_at) VALUES (%d, %s, %d, 1, %s, %s)',
              $accClinicId, 'پزشک آزمایشی', $uid, $now, $now
          ));
          $cid = (int) $wpdb->insert_id;
          // یک برنامهٔ هفتگی «پُر» برای پزشک تجربی — تا اسکرین‌شات Schedule خالی نباشد.
          // C7-S5: create برنامه حالا نیازمند Scope معتبر صریح است (معادل مرز
          // تولیدی) — resolver تک‌کلینیکیِ نصب؛ در نصب مبهم fail-closed.
          \ClinicCore\Bootstrap\App::replaceExplicitScope(\ClinicCore\Bootstrap\App::scope());
          try {
              \ClinicCore\Bootstrap\App::scheduleService()->create($uid, [
                  'clinician_id' => $cid, 'day_of_week' => 0, // شنبه
                  'start_time' => '09:00', 'end_time' => '13:00',
                  'break_start' => '12:00', 'break_end' => '12:30',
                  'appointment_duration_min' => 20, 'slot_capacity' => 1, 'is_active' => 1,
              ]);
              \ClinicCore\Bootstrap\App::scheduleService()->create($uid, [
                  'clinician_id' => $cid, 'day_of_week' => 2, // دوشنبه
                  'start_time' => '16:00', 'end_time' => '20:00',
                  'break_start' => '', 'break_end' => '',
                  'appointment_duration_min' => 30, 'slot_capacity' => 1, 'is_active' => 1,
              ]);
          } catch (\Throwable $e) { echo "(schedule seed: {$e->getMessage()})\n"; }
          finally { \ClinicCore\Bootstrap\App::resetScope(); }
          \ClinicCore\Bootstrap\App::settings()->set('files.storage_path', '/home/runner/rwp-storage');
          echo "doctor linked (wp_user_id=$uid); clinician_id=$cid; files.storage_path set\n";
          // ── Fixture عضویت (TEST INFRASTRUCTURE — نه provisioning محصول) ──
          // C6: هر actorِ staff که در محیط acceptance قرار است داخل Clinic کار کند
          // باید عضویت «فعال» روی همان Clinic داشته باشد؛ نقش سراسری WP رابطهٔ
          // tenant را تعریف نمی‌کند و Production عمداً هیچ provisioning خودکاری
          // (user_register/set_user_role/exact‑one) ندارد. شناسهٔ Clinic از خودِ
          // محیط حل می‌شود — هیچ فرضِ id=1 یا «اولین Clinic» در کار نیست.
          $svc = \ClinicCore\Bootstrap\App::membership_service();
          $roleKeys = [
              'DOCTOR_USER' => 'cpms_doctor',
              'SECRETARY_USER' => 'cpms_secretary',
              'MANAGER_USER' => 'cpms_manager',
              'ACCOUNTANT_USER' => 'cpms_accountant',
          ];
          $seeded = [];
          foreach ($roleKeys as $envKey => $roleKey) {
              $login = (string) getenv($envKey);
              if (1 !== preg_match('/^[A-Za-z0-9_.-]{1,60}$/', $login)) {
                  fwrite(STDERR, "FAIL: login acceptance نامعتبر ({$envKey})\n");
                  exit(1);
              }
              $u = get_user_by('login', $login);
              if ($u === false) {
                  fwrite(STDERR, "FAIL: کاربر {$login} وجود ندارد — مرحلهٔ wp user create اجرا نشده\n");
                  exit(1);
              }
              $userId = (int) $u->ID;
              $existing = $svc->membership_for($accClinicId, $userId);
              // idempotent — اجرای دوبارهٔ fixture خطای duplicate نمی‌دهد.
              $seeded[$login] = $existing !== null
                  ? (int) $existing['id']
                  : $svc->create_membership($accClinicId, $userId, $roleKey);
          }
          // administrator (technical owner) عمداً عضویت staff نمی‌گیرد؛ کاربر
          // patient هم در این مرحله ساخته نمی‌شود و در صورت افزودن، نباید
          // عضویت staff بگیرد.
          \ClinicCore\Bootstrap\App::replaceExplicitScope(null);
          echo 'memberships seeded on clinic ' . $accClinicId . ': '
              . implode(', ', array_map(
                  static fn (string $k, int $v): string => $k . '=' . $v,
                  array_keys($seeded),
                  $seeded
              )) . "\n";
          PHPEOF
          wp eval-file /tmp/acc/setup-roles.php --path="$WP_DIR" --allow-root
          # شواهد Fixture (برای تفکیک A/C/D اگر ورود شکست بخورد) — بدون رمز/هش:
          # وجود کاربران نقش‌محور، نقش‌شان و تعداد عضویت‌های Clinic.
          PREFIX='${{ matrix.prefix }}'
          wp user list --fields=user_login,roles --path="$WP_DIR" --allow-root > /tmp/acc/fixture-users.txt
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -N \
            -e "SELECT COUNT(*) FROM $DB_NAME.${PREFIX}cpms_clinic_memberships;" > /tmp/acc/fixture-memberships.txt
          echo "fixture membership rows: $(cat /tmp/acc/fixture-memberships.txt)"
          MANAGER_CLINIC_ID=$(cat /tmp/acc/manager_clinic_id.txt)
          case "$MANAGER_CLINIC_ID" in
            ''|*[!0-9]*) echo 'FAIL: manager Clinic fixture id is not numeric'; exit 1 ;;
          esac
          [ "$MANAGER_CLINIC_ID" -gt 0 ] || { echo 'FAIL: manager Clinic fixture id is invalid'; exit 1; }
          echo "MANAGER_CLINIC_ID=$MANAGER_CLINIC_ID" >> "$GITHUB_ENV"
          echo "explicit manager Clinic context exported: $MANAGER_CLINIC_ID"

      # ---------- Apache + mod_php (وب واقعی) ----------
      - name: Apache + mod_php
        run: |
          sudo tee /etc/apache2/sites-available/acc.conf >/dev/null <<CONF
          <VirtualHost *:8080>
            DocumentRoot $WP_DIR
            <Directory $WP_DIR>
              AllowOverride All
              Require all granted
            </Directory>
            ErrorLog \${APACHE_LOG_DIR}/acc-error.log
            CustomLog \${APACHE_LOG_DIR}/acc-access.log combined
          </VirtualHost>
          CONF
          sudo sed -i 's/^Listen 80$/Listen 8080/' /etc/apache2/ports.conf
          sudo a2dissite 000-default >/dev/null && sudo a2ensite acc >/dev/null
          sudo a2enmod rewrite >/dev/null
          for INI in /etc/php/*/apache2/php.ini; do
            sudo sed -i 's/^display_errors = .*/display_errors = Off/' "$INI"
          done
          # دقیقاً مثل میزبان واقعی: PHP تحت www-data و wp-content owned-by-runner (غیرقابل‌نوشتن برای PHP)
          sudo chmod a+rx /home/runner
          sudo chmod -R a+rX "$WP_DIR"
          sudo apache2ctl configtest && sudo service apache2 start
          sleep 2
          curl -s -o /dev/null -w 'home HTTP %{http_code}\n' "$WP_URL/"
          curl -s -o /dev/null -w 'rest HTTP %{http_code}\n' "$WP_URL/?rest_route=/"
          # فایل wp-content برای PHP قابل‌نوشتن نیست (اثبات شرایط میزبان واقعی)
          sudo -u www-data test -w "$WP_DIR/wp-content" && echo 'wp-content writable by php' || echo 'wp-content NOT writable by php (میزبان واقعی)'

      # ---------- 5b) Fixture سطح عمومی shortcode — شاهدِ Plain-permalink برای A1 ----------
      # این job عمداً هیچ `wp rewrite structure` اجرا نمی‌کند، پس
      # `permalink_structure` خالی می‌ماند و طبق `get_rest_url()` وردپرس،
      # `rest_url('clinic/v1')` شکلِ `index.php?rest_route=/clinic/v1` می‌گیرد.
      # بدون این fixture، سطح عمومیِ آنونیم در Real-WP Acceptance اصلاً exercised
      # نمی‌شد و defectِ ساختِ URLِ A1 در Plain permalinks دیده نمی‌شد.
      - name: Public booking page fixture (Plain permalinks)
        run: |
          PL="$(wp option get permalink_structure --path="$WP_DIR" --allow-root 2>/dev/null || true)"
          echo "permalink_structure='${PL}'  $( [ -z "$PL" ] && echo '=> PLAIN permalinks (rest_url => index.php?rest_route=...)' || echo '=> NOT plain' )"
          cat > /tmp/acc/public-page.php <<'PHPEOF'
          <?php
          global $wpdb;
          $db = \ClinicCore\Bootstrap\App::db();
          $now = $db->nowUtcSql();
          // Clinicِ صریح از همان fixtureِ موجود (که آن هم از slug پایدارِ
          // 'default' حل شده) — هیچ literal id و هیچ «اولین Clinic» در کار نیست.
          $accClinicId = (int) trim((string) file_get_contents('/tmp/acc/manager_clinic_id.txt'));
          if ($accClinicId <= 0) { fwrite(STDERR, "FAIL: explicit Clinic fixture id is invalid\n"); exit(1); }
          $doc = get_user_by('login', getenv('DOCTOR_USER'));
          if ($doc === false) { fwrite(STDERR, "FAIL: doctor fixture user not found\n"); exit(1); }
          $row = $wpdb->get_row($wpdb->prepare(
              'SELECT id, clinic_id, is_active FROM ' . $db->table('cpms_clinicians') . ' WHERE wp_user_id = %d ORDER BY id DESC LIMIT 1',
              (int) $doc->ID
          ), ARRAY_A);
          if (!is_array($row) || (int) $row['clinic_id'] !== $accClinicId || (int) $row['is_active'] !== 1) {
              fwrite(STDERR, "FAIL: no ACTIVE clinician row on the explicit Clinic\n"); exit(1);
          }
          $clinicianId = (int) $row['id'];
          $loc = $wpdb->get_row($wpdb->prepare(
              'SELECT id, timezone FROM ' . $db->table('cpms_locations') . ' WHERE clinic_id = %d AND is_active = 1 ORDER BY is_primary DESC, id ASC LIMIT 1',
              $accClinicId
          ), ARRAY_A);
          if (!is_array($loc)) { fwrite(STDERR, "FAIL: no active Location for clinic {$accClinicId}\n"); exit(1); }
          $locationId = (int) $loc['id'];
          $tzName = (is_string($loc['timezone']) && $loc['timezone'] !== '') ? $loc['timezone'] : 'UTC';
          $tz = new DateTimeZone($tzName);
          // برنامهٔ فعال — A1 پنجرهٔ پیش‌فرضِ مرور را فقط از Locationِ دارای
          // برنامهٔ فعالِ همان پزشک می‌سازد.
          $wpdb->query($wpdb->prepare(
              'INSERT INTO ' . $db->table('cpms_schedule') . ' (clinic_id, clinician_id, day_of_week, start_time, end_time, appointment_duration_min, slot_capacity, is_active, location_id, created_at, updated_at) VALUES (%d, %d, %d, %s, %s, %d, %d, 1, %d, %s, %s)',
              $accClinicId, $clinicianId, 6, '09:00:00', '13:00:00', 20, 2, $locationId, $now, $now
          ));
          // نوبت‌های آزاد — wall-clock محلیِ همان Location (قراردادِ ذخیرهٔ
          // slot_date/slot_time)، ۲ و ۳ روز بعد: خارج از min-lead و داخلِ پنجرهٔ A1.
          $slotCount = 0;
          foreach ([[2, '10:00:00'], [2, '10:20:00'], [3, '09:30:00']] as $spec) {
              $date = (new DateTimeImmutable('now', $tz))->modify('+' . $spec[0] . ' days')->format('Y-m-d');
              $wpdb->query($wpdb->prepare(
                  'INSERT INTO ' . $db->table('cpms_schedule_slots') . ' (clinic_id, location_id, clinician_id, slot_date, slot_time, duration_min, capacity, booked_count, held_count, is_open, generated_from, created_at, updated_at) VALUES (%d, %d, %d, %s, %s, %d, %d, 0, 0, 1, %s, %s, %s)',
                  $accClinicId, $locationId, $clinicianId, $date, $spec[1], 20, 2, 'manual', $now, $now
              ));
              $slotCount++;
          }
          // صفحهٔ عمومیِ published با خودِ shortcode — همان مسیری که اپراتور
          // استفاده می‌کند، پس انکیوِ شرطیِ asset هم exercised می‌شود.
          $pageId = wp_insert_post([
              'post_title' => 'Public Booking Acceptance Fixture',
              'post_name' => 'cpms-public-booking-acceptance',
              'post_content' => '[cpms_public_booking clinic_id="' . $accClinicId . '"]',
              'post_status' => 'publish',
              'post_type' => 'page',
          ], true);
          if (is_wp_error($pageId)) { fwrite(STDERR, 'FAIL: ' . $pageId->get_error_message() . "\n"); exit(1); }
          $permalink = (string) get_permalink($pageId);
          echo 'public booking page #' . (int) $pageId . ' clinic=' . $accClinicId
              . ' clinician=' . $clinicianId . ' location=' . $locationId
              . ' tz=' . $tzName . ' slots=' . $slotCount . ' url=' . $permalink . "\n";
          // فایلِ env (نه pipeline) — تا خروجِ غیرصفرِ php پنهان نشود و همان‌جا گیت بایستد.
          file_put_contents('/tmp/acc/public-page.env', 'ACC_PUBLIC_PAGE=' . $permalink . '|' . $accClinicId . '|' . $clinicianId . "\n");
          PHPEOF
          wp eval-file /tmp/acc/public-page.php --path="$WP_DIR" --allow-root
          test -s /tmp/acc/public-page.env
          cat /tmp/acc/public-page.env >> "$GITHUB_ENV"
          cat /tmp/acc/public-page.env

      # ---------- 6) پذیرش مرورگری ----------
      - name: Browser acceptance — all 5 roles (Admin/Manager/Doctor/Secretary/Accountant) menus + denial
        run: |
          # بدون pipe-masking: وضعیت خروجی واقعی اسکریپت تعیین‌کننده است
          BASE="$WP_URL" \
          ADMIN_USER="$ADMIN_USER" ADMIN_PASS="$ADMIN_PASS" \
          DOCTOR_USER="$DOCTOR_USER" DOCTOR_PASS="$DOCTOR_PASS" \
          SECRETARY_USER="$SECRETARY_USER" SECRETARY_PASS="$SECRETARY_PASS" \
          MANAGER_USER="$MANAGER_USER" MANAGER_PASS="$MANAGER_PASS" \
          MANAGER_CLINIC_ID="$MANAGER_CLINIC_ID" \
          ACCOUNTANT_USER="$ACCOUNTANT_USER" ACCOUNTANT_PASS="$ACCOUNTANT_PASS" \
          ACTUAL_COUNT_FILE=/tmp/acc/actual_count.txt \
          OUT=/tmp/acc \
          python3 clinic-practice-management/bin/rwp-acceptance.py > /tmp/acc/acceptance.log 2>&1
          RC=$?
          cat /tmp/acc/acceptance.log
          if [ "$RC" -ne 0 ]; then echo "ACCEPTANCE FAILED (rc=$RC)"; exit "$RC"; fi

      # ---------- 6.5) اثبات فنی: پوستهٔ مستقلِ CPMS (Phase 9 Slice 3 — فقط proof) ----------
      # NON-PRODUCTION: فیکسچرها (mu-plugin رهگیرِ template_include + دو تمِ کنترلیِ
      # متفاوت) از tests/Fixtures کپی می‌شوند و هرگز داخل release ZIP نیستند
      # (whitelist سیاست bin/build-release.sh). ماتریس: {Plain, Pretty} × {alpha, beta}
      # با positive-control و REST/نشستِ وردپرس + logout واقعی — خروجی در
      # /tmp/acc/shell-proof.log و shell-proof-results.json (artifact + commit comment).
      - name: "Technical proof — standalone CPMS shell (theme independence + Plain/Pretty)"
        run: |
          set -o pipefail
          sudo mkdir -p "$WP_DIR/wp-content/mu-plugins" "$WP_DIR/wp-content/mu-plugins/cpms-shell-proof-fixture"
          # فقط رهگیر در ریشهٔ mu-plugins (خودکاربارگذاری می‌شود)؛ قالبِ proof عمداً
          # داخلِ زیرپوشه است — بارگذارِ mu-plugins زیرپوشه‌ها را اجرا نمی‌کند و قالب
          # هرگز «افزونهٔ must-use» تلقی نمی‌شود (درسِ گیتِ اول — خطای کلاس D).
          sudo cp clinic-practice-management/tests/Fixtures/standalone-shell/cpms-standalone-shell-proof.php \
                  "$WP_DIR/wp-content/mu-plugins/"
          sudo cp clinic-practice-management/tests/Fixtures/standalone-shell/cpms-standalone-shell-proof-template.php \
                  "$WP_DIR/wp-content/mu-plugins/cpms-shell-proof-fixture/"
          sudo cp -R clinic-practice-management/tests/Fixtures/standalone-shell/themes/cpms-proof-theme-alpha \
                     clinic-practice-management/tests/Fixtures/standalone-shell/themes/cpms-proof-theme-beta \
                     "$WP_DIR/wp-content/themes/"
          wp user create "$SHELLPROOF_USER" 'shellproof@acc.local' --user_pass="$SHELLPROOF_PASS" --role=cpms_patient --path="$WP_DIR" --allow-root
          wp theme list --status=active --path="$WP_DIR" --allow-root | tee /tmp/acc/shell-proof-themes.txt
          # بدون pipe-masking: وضعیت خروجی واقعی اسکریپت تعیین‌کننده است؛ خودِ
          # اسکریپت بین سناریوها `wp rewrite structure` / `wp theme activate` می‌زند
          # و در پایان وضعیت اولیه (تم + permalink structure) را restore می‌کند.
          BASE="$WP_URL" WP_DIR="$WP_DIR" OUT=/tmp/acc \
          SHELLPROOF_USER="$SHELLPROOF_USER" SHELLPROOF_PASS="$SHELLPROOF_PASS" \
            python3 clinic-practice-management/bin/rwp-shell-proof.py > /tmp/acc/shell-proof.log 2>&1
          RC=$?
          cat /tmp/acc/shell-proof.log
          if [ "$RC" -ne 0 ]; then echo "SHELL PROOF FAILED (rc=$RC)"; exit "$RC"; fi

      # ---------- 7) بررسی لاگ‌ها (همیشه — حتی در شکست) ----------
      - name: PHP/WP/Apache logs review
        if: always()
        run: |
          cp "$WP_DIR/wp-content/debug.log" /tmp/acc/logs/ 2>/dev/null || echo '(no debug.log)' > /tmp/acc/logs/debug.log.missing
          sudo cp /var/log/apache2/acc-error.log /tmp/acc/logs/apache-error.log 2>/dev/null || true
          sudo cp /var/log/apache2/acc-access.log /tmp/acc/logs/apache-access.log 2>/dev/null || true
          sudo chmod -R a+r /tmp/acc/logs/ || true
          echo '===== debug.log (tail) ====='
          tail -40 /tmp/acc/logs/debug.log 2>/dev/null || echo '(debug.log موجود نشد — یعنی هیچ خطای PHP ثبت نشده)'
          echo '===== apache error (tail) ====='
          tail -20 /tmp/acc/logs/apache-error.log 2>/dev/null || true

      - name: Log gate — بدون Fatal/Critical در لاگ PHP/WP
        if: always()
        run: |
          if [ -f /tmp/acc/logs/debug.log ]; then
            if grep -qE 'PHP Fatal error|Uncaught|There has been a critical error' /tmp/acc/logs/debug.log; then
              echo 'FATAL/CRITICAL IN debug.log:'; grep -nE 'PHP Fatal error|Uncaught|critical error' /tmp/acc/logs/debug.log | tail -10; exit 1
            fi
          fi
          if [ -f /tmp/acc/logs/apache-error.log ]; then
            if grep -qE 'PHP Fatal error|Uncaught' /tmp/acc/logs/apache-error.log; then
              echo 'FATAL IN apache error log:'; grep -nE 'PHP Fatal error|Uncaught' /tmp/acc/logs/apache-error.log | tail -10; exit 1
            fi
          fi
          echo 'LOG GATE: clean (بدون Fatal/Uncaught/Critical)'

      # ---------- Artifacts ----------
      - name: Upload screenshots/logs/results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwp-acceptance-${{ matrix.prefix }}
          path: /tmp/acc/
          retention-days: 14

      - name: Acceptance summary
        if: always()
        run: |
          {
            echo '## Real WordPress Acceptance — prefix `${{ matrix.prefix }}`'
            echo
            echo '- ZIP: `bin/build-release.sh` (official artifact)، نصب با `wp plugin install --activate`'
            echo "- DB prefix: \`${{ matrix.prefix }}\` — شمارش واقعی جداول: $(cat /tmp/acc/actual_count.txt 2>/dev/null || echo '?') — شمارش UI: $(cat /tmp/acc/ui_count.txt 2>/dev/null || echo '?')"
            echo '- Migration failure probe: `(fail-loud + not-recorded)` در لاگ Step «D3»'
            echo
            echo '```'
            tail -30 /tmp/acc/acceptance.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Evidence به‌صورت Commit Comment (لاگ خام Job در این محیط خوانده نمی‌شود —
      # الگوی «Post failures to PR» ریپو، این‌بار روی Commit تا در push-events هم کار کند)
      - name: Publish evidence as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Real WP Acceptance — prefix \`${{ matrix.prefix }}\` (job: ${{ job.status }})"
            echo
            echo "- actual_table_count: \`$(cat /tmp/acc/actual_count.txt 2>/dev/null || echo '?')\` / ui_table_count: \`$(cat /tmp/acc/ui_count.txt 2>/dev/null || echo '?')\`"
            echo "- migration failure probe:"
            echo '```'
            cat /tmp/acc/migration-failure-probe.txt 2>/dev/null || echo '(probe اجرا نشد)'
            echo '```'
            echo '- browser acceptance:'
            echo '```'
            cat /tmp/acc/acceptance.log 2>/dev/null || echo '(مرحلهٔ مرورگر اجرا نشد)'
            echo '```'
            echo '- standalone shell technical proof (Phase 9 Slice 3 — NON-PRODUCTION fixture):'
            echo '```'
            cat /tmp/acc/shell-proof.log 2>/dev/null || echo '(shell proof اجرا نشد)'
            echo '```'
            echo "- fixture users (login/roles) + membership rows: \`$(cat /tmp/acc/fixture-memberships.txt 2>/dev/null || echo '?')\`"
            echo '```'
            cat /tmp/acc/fixture-users.txt 2>/dev/null || echo '(fixture users ثبت نشد)'
            echo '```'
            echo '- login failures (structured evidence):'
            echo '```'
            cat /tmp/acc/logs/*-login.json 2>/dev/null || echo '(no login failure)'
            echo '```'
            echo '- PHP fatal lines in debug.log:'
            echo '```'
            grep -E 'Fatal|Uncaught' /tmp/acc/logs/debug.log 2>/dev/null | tail -8 || echo '(none)'
            echo '```'
            echo '- debug.log tail:'
            echo '```'
            tail -15 /tmp/acc/logs/debug.log 2>/dev/null || echo '(بدون debug.log)'
            echo '```'
            echo "artifacts: rwp-acceptance-${{ matrix.prefix }} (screenshots/logs/results.json)"
          } > /tmp/acc/evidence-comment.md
          gh api "repos/{owner}/{repo}/commits/$GITHUB_SHA/comments" -X POST -F body=@/tmp/acc/evidence-comment.md --jq '.id'
