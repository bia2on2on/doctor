name: Real WordPress Acceptance (ZIP → clean WP → browser)

# گیت پذیرش واقعی: پاسخ مستقیم به نقص‌های گزارش‌شدهٔ نصب روی WordPress واقعی —
#   D1) Tools → CPMS (سیستم)/Health نباید Critical Error شود
#   D2) شمارش جداول در UI == شمارش واقعی DB (با هر prefix)
#   D3) Migration شکست‌خورده هرگز «موفق» ثبت نشود
#   + Administrator فنی (P-3)، منوهای واقعی Doctor/Secretary، بررسی لاگ‌ها.
# هر چیزی که اینجا اجرا می‌شود واقعی است: Apache/mod_php + MySQL 8 +
# Chromium (نه شبیه‌سازی) + ZIP رسمی bin/build-release.sh (نه source mount).

on:
  workflow_call:
    inputs:
      persian_coexistence:
        description: Run only the bounded fa_IR five-plugin A/B slice
        type: boolean
        default: false
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # PR runs are keyed by PR number; non-PR runs by their full ref. Event names
  # keep pull_request and push evidence in separate cancellation domains.
  # Main refs add the unique run ID so even a pending main run is never replaced.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && format('main-run-{0}', github.run_id) || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref) }}
  # Preserve every main-ref run as post-merge evidence; superseded non-main work may stop.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  # contents: write for the existing acceptance evidence comments.
  contents: write
  actions: read

env:
  PERSIAN_COEXISTENCE: ${{ inputs.persian_coexistence && 'true' || 'false' }}
  WP_VERSION: ${{ inputs.persian_coexistence && '7.1.3' || '6.7.2' }}
  APACHE_PHP_SUFFIX: ${{ inputs.persian_coexistence && '8.3' || '' }}
  PHP_VERSION: ${{ inputs.persian_coexistence && '8.3' || '8.2' }}
  WP_DIR: /home/runner/rwp
  WP_URL: http://localhost:8080
  DB_NAME: cpms_acc
  ADMIN_USER: acc_admin
  ADMIN_PASS: Acceptance-2026!
  DOCTOR_USER: acc_doctor
  DOCTOR_PASS: Acceptance-2026!
  SECRETARY_USER: acc_secretary
  SECRETARY_PASS: Acceptance-2026!
  MANAGER_USER: acc_manager
  MANAGER_PASS: Acceptance-2026!
  ACCOUNTANT_USER: acc_accountant
  ACCOUNTANT_PASS: Acceptance-2026!
  SHELLPROOF_USER: acc_shellproof
  SHELLPROOF_PASS: Acceptance-2026!

jobs:
  acceptance:
    name: "Real WP Acceptance (prefix ${{ matrix.prefix }})"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        prefix: ${{ fromJSON(inputs.persian_coexistence && '["wp_"]' || '["wp_","clinic_"]') }}

    services:
      mysql:
        image: ${{ inputs.persian_coexistence && 'mysql:8.4.11' || 'mysql:8' }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Initialize bounded A/B evidence
        if: inputs.persian_coexistence
        env:
          COEX_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COEX_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/persian-coexistence/run.py init

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mysqli, curl, mbstring, xml, zip, gd, sodium
          coverage: none

      - name: Tooling (apache + wp-cli + playwright/chromium)
        run: |
          mkdir -p /tmp/acc
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client apache2 "libapache2-mod-php${APACHE_PHP_SUFFIX}" "php${APACHE_PHP_SUFFIX}-mysql" "php${APACHE_PHP_SUFFIX}-mbstring" "php${APACHE_PHP_SUFFIX}-xml" "php${APACHE_PHP_SUFFIX}-curl" "php${APACHE_PHP_SUFFIX}-zip" "php${APACHE_PHP_SUFFIX}-gd" > /tmp/apt.log 2>&1 || { tail -20 /tmp/apt.log; exit 1; }
          curl -sS https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp && sudo chmod +x /usr/local/bin/wp
          wp --allow-root --version
          (pip install --quiet playwright 2>/dev/null || pip install --quiet --break-system-packages playwright)
          python3 -m playwright install --with-deps chromium > /tmp/pw.log 2>&1 || { tail -10 /tmp/pw.log; exit 1; }

      - name: Lint ابزار Acceptance
        run: |
          php -l .github/persian-coexistence/runtime.php
          python3 -m unittest discover -s .github/persian-coexistence -p 'test_*.py'
          php -l clinic-practice-management/bin/cpms
          python3 -m py_compile clinic-practice-management/bin/rwp-acceptance.py
          python3 -m py_compile clinic-practice-management/bin/rwp-shell-proof.py
          python3 -m py_compile clinic-practice-management/bin/acceptance-isolation-check.py
          bash -n clinic-practice-management/bin/build-release.sh
          # قرارداد ایزولاسیون: هر پرسونا کانتکست/کوکی مستقل خودش را دارد
          # (اگر یک کانتکست به چند پرسونا سرو کند، این Step قرمز می‌شود).
          python3 clinic-practice-management/bin/acceptance-isolation-check.py
          python3 clinic-practice-management/bin/acceptance-isolation-check.py clinic-practice-management/bin/rwp-shell-proof.py

      # ---------- 2) WordPress تمیز ----------
      - name: Clean WordPress (prefix=${{ matrix.prefix }})
        run: |
          curl -sS "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" -o /tmp/wp.tar.gz
          tar -xzf /tmp/wp.tar.gz -C /tmp && mv /tmp/wordpress "$WP_DIR"
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "CREATE DATABASE $DB_NAME CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          cd "$WP_DIR"
          wp config create --dbname="$DB_NAME" --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --dbprefix='${{ matrix.prefix }}' --skip-salts --allow-root
          wp config shuffle-salts --allow-root
          # لاگ‌محور مثل Production-sane: خطاها در debug.log (نمایش خاموش)
          wp config set WP_DEBUG true --raw --allow-root
          wp config set WP_DEBUG_LOG true --raw --allow-root
          wp config set WP_DEBUG_DISPLAY false --raw --allow-root
          wp config set DISALLOW_FILE_EDIT true --raw --allow-root
          wp core install --url="$WP_URL" --title="CPMS Acceptance" --admin_user="$ADMIN_USER" --admin_password="$ADMIN_PASS" --admin_email=admin@acc.local --skip-email --allow-root

      # ---------- Apache + mod_php (وب واقعی) ----------
      - name: Apache + mod_php
        run: |
          sudo tee /etc/apache2/sites-available/acc.conf >/dev/null <<CONF
          <VirtualHost *:8080>
            DocumentRoot $WP_DIR
            <Directory $WP_DIR>
              AllowOverride All
              Require all granted
            </Directory>
            ErrorLog \${APACHE_LOG_DIR}/acc-error.log
            CustomLog \${APACHE_LOG_DIR}/acc-access.log combined
          </VirtualHost>
          CONF
          sudo sed -i 's/^Listen 80$/Listen 8080/' /etc/apache2/ports.conf
          sudo a2dissite 000-default >/dev/null && sudo a2ensite acc >/dev/null
          if [ "$PERSIAN_COEXISTENCE" = true ]; then
            for MOD in /etc/apache2/mods-enabled/php*.load; do
              [ -e "$MOD" ] || continue
              sudo a2dismod "$(basename "$MOD" .load)" >/dev/null
            done
            sudo a2enmod "php${PHP_VERSION}" >/dev/null
          fi
          sudo a2enmod rewrite >/dev/null
          for INI in /etc/php/*/apache2/php.ini; do
            sudo sed -i 's/^display_errors = .*/display_errors = Off/' "$INI"
          done
          # دقیقاً مثل میزبان واقعی: PHP تحت www-data و wp-content owned-by-runner (غیرقابل‌نوشتن برای PHP)
          sudo chmod a+rx /home/runner
          sudo chmod -R a+rX "$WP_DIR"
          if [ "$PERSIAN_COEXISTENCE" = true ]; then
            sudo chown -R "$(id -un)":www-data "$WP_DIR/wp-content"
            sudo chmod -R g+rwX "$WP_DIR/wp-content"
            sudo find "$WP_DIR/wp-content" -type d -exec chmod g+s {} +
            sudo touch "$WP_DIR/wp-content/debug.log"
            sudo chmod 666 "$WP_DIR/wp-content/debug.log"
            sudo mkdir -p /var/www/cpms-runtime
            sudo cp .github/persian-coexistence/runtime.php /var/www/cpms-runtime/index.php
            echo 'Listen 8081' | sudo tee /etc/apache2/conf-enabled/cpms-runtime.conf >/dev/null
            sudo tee -a /etc/apache2/conf-enabled/cpms-runtime.conf >/dev/null <<'CONF'
          <VirtualHost *:8081>
            DocumentRoot /var/www/cpms-runtime
          </VirtualHost>
          CONF
          fi
          sudo apache2ctl configtest && sudo service apache2 start
          curl -s -o /dev/null -w 'home HTTP %{http_code}\n' "$WP_URL/"
          curl -s -o /dev/null -w 'rest HTTP %{http_code}\n' "$WP_URL/?rest_route=/"
          # فایل wp-content برای PHP قابل‌نوشتن نیست (اثبات شرایط میزبان واقعی)
          sudo -u www-data test -w "$WP_DIR/wp-content" && echo 'wp-content writable by php' || echo 'wp-content NOT writable by php (میزبان واقعی)'

      - name: Stage A — five plugins without CPMS (fail closed)
        if: inputs.persian_coexistence
        id: stage_a
        run: python3 .github/persian-coexistence/run.py stage-a

      # Phase 18 Slice 18-4 — bounded coexistence, on one clean-WP prefix only.
      # The other prefix remains the existing no-third-party control. All packages
      # come from the WordPress.org directory through WP-CLI with exact versions;
      # the runner is the supported WP 6.7.2 / PHP 8.2 host used by this workflow.
      # Set rationale: The SEO Framework (SEO/query filters); Contact Form 7
      # (form shortcode/admin + frontend hooks); Autoptimize (asset/output caching);
      # Wordfence (security/auth hooks); WooCommerce (product/order/customer/checkout
      # flows, its own wp-admin menu and admin-access policy). WooCommerce is REQUIRED
      # by the frozen Product Decision (a clinic may sell lawful products alongside
      # clinical operations), so it is the commerce member of this set.
      # PRESERVED CAUSAL EVIDENCE (the reason this run doubles as the coexistence gate): on head
      # a1788f66c14f1d624668cbee10d683b030c887c5, run 37611352785 reproduced the conflict
      # with CPMS + WooCommerce 10.3.8 alone — doctor/secretary wp-admin requests were
      # redirected to the WooCommerce My Account page while woocommerce_prevent_admin_access
      # evaluated to true inside WC_Admin::prevent_admin_access. That was a third-party
      # lock-down policy, not a CPMS security defect. The fix is a CPMS-owned scoped
      # exception (ClinicCore\Admin\Compatibility\WooCommerceAdminAccess) on that public
      # filter: allowlisted CPMS page + authentication + that page's own existing
      # capability, everything else untouched. The earlier Easy Digital Downloads
      # substitution was a temporary workaround and is removed.
      # Claim boundary: this run proves this exact five-plugin set on this WP/PHP host
      # only — no category-wide WooCommerce compatibility claim.
      - name: Download pinned representative plugins from WordPress.org (pre-CPMS)
        if: matrix.prefix == 'wp_' && !inputs.persian_coexistence
        run: |
          set -Eeuo pipefail
          cat > /tmp/acc/coexistence-plugin-pins.tsv <<'EOF'
          autodescription 5.1.4
          contact-form-7 6.1.7
          autoptimize 3.1.16
          wordfence 9.0.2
          woocommerce 10.3.8
          EOF
          while read -r slug version; do
            [ -n "$slug" ] || continue
            package_url="https://downloads.wordpress.org/plugin/${slug}.${version}.zip"
            install_log="/tmp/acc/coexistence-install-${slug}.log"
            if ! wp plugin install "$package_url" --path="$WP_DIR" --allow-root > "$install_log" 2>&1; then
              cat "$install_log"
              diagnostic="$(tail -20 "$install_log" | tr '\n\r' '  ' | sed 's/%/%25/g' | cut -c1-1600)"
              echo "::error::Pinned WordPress.org package retrieval/installation failed for ${slug}@${version} before CPMS was installed; inspect the diagnostic and artifact to classify C (transport/provider) versus D (pin/fixture). This is not CPMS compatibility evidence. WP-CLI: ${diagnostic}"
              exit 1
            fi
            cat "$install_log"
            installed_version="$(wp plugin get "$slug" --field=version --path="$WP_DIR" --allow-root)"
            if [ "$installed_version" != "$version" ]; then
              echo "::error::D-class coexistence fixture verification failure: ${slug} expected ${version}, installed ${installed_version:-unknown}."
              exit 1
            fi
            echo "retrieved ${slug}@${installed_version} from the pinned WordPress.org plugin distribution"
          done < /tmp/acc/coexistence-plugin-pins.tsv
          wp plugin list --format=json --path="$WP_DIR" --allow-root > /tmp/acc/coexistence-installed-plugins.json

          # Inspect the exact source inside the just-verified WooCommerce 10.3.8 package.
          # This avoids treating an adjacent Git tag as evidence for the frozen plugin pin.
          WC_ADMIN_SOURCE="$WP_DIR/wp-content/plugins/woocommerce/includes/admin/class-wc-admin.php"
          test -f "$WC_ADMIN_SOURCE" || { echo '::error::D-class source inspection failed: expected WC_Admin source file is missing from the exact WooCommerce package.'; exit 1; }
          WC_ADMIN_METHOD_LINE="$(grep -n -m1 -E 'function[[:space:]]+prevent_admin_access[[:space:]]*\(' "$WC_ADMIN_SOURCE" | cut -d: -f1)"
          test -n "$WC_ADMIN_METHOD_LINE" || { echo '::error::D-class source inspection failed: WC_Admin::prevent_admin_access was not found in the exact WooCommerce package.'; exit 1; }
          {
            printf 'verified_plugin_version=%s\n' "$(wp plugin get woocommerce --field=version --path="$WP_DIR" --allow-root)"
            printf 'source_path=%s\n' 'wp-content/plugins/woocommerce/includes/admin/class-wc-admin.php'
            printf 'prevent_admin_access_line=%s\n' "$WC_ADMIN_METHOD_LINE"
            echo '--- exact 10.3.8 filter/hook references ---'
            grep -n -C 3 -E 'prevent_admin_access|woocommerce_prevent_admin_access' "$WC_ADMIN_SOURCE" | head -100
            echo '--- exact 10.3.8 method excerpt (bounded to 60 source lines) ---'
            sed -n "${WC_ADMIN_METHOD_LINE},$((WC_ADMIN_METHOD_LINE + 59))p" "$WC_ADMIN_SOURCE"
          } > /tmp/acc/woocommerce-10.3.8-admin-access-source.txt
          grep -q 'woocommerce_prevent_admin_access' /tmp/acc/woocommerce-10.3.8-admin-access-source.txt || { echo '::error::D-class source inspection failed: the exact method excerpt did not contain the public policy filter.'; exit 1; }
          cat /tmp/acc/woocommerce-10.3.8-admin-access-source.txt

      - name: Activate representative plugins and prove the clean baseline (before CPMS)
        if: matrix.prefix == 'wp_' && !inputs.persian_coexistence
        run: |
          set -Eeuo pipefail
          while read -r slug version; do
            [ -n "$slug" ] || continue
            if ! wp plugin activate "$slug" --path="$WP_DIR" --allow-root; then
              echo "::error::Independent pre-CPMS plugin activation failure for ${slug}@${version}; CPMS is absent, so do not attribute this to CPMS or silently replace the plugin."
              exit 1
            fi
          done < /tmp/acc/coexistence-plugin-pins.tsv
          if ! wp eval 'echo "third-party-only WordPress bootstrap: OK";' --path="$WP_DIR" --allow-root; then
            echo '::error::Independent pre-CPMS WordPress/plugin bootstrap failure; CPMS is absent, so this is not CPMS coexistence evidence.'
            exit 1
          fi
          while read -r slug version; do
            [ -n "$slug" ] || continue
            wp plugin is-active "$slug" --path="$WP_DIR" --allow-root
            installed_version="$(wp plugin get "$slug" --field=version --path="$WP_DIR" --allow-root)"
            [ "$installed_version" = "$version" ] || { echo "::error::D-class baseline version mismatch for ${slug}: ${installed_version:-unknown} != ${version}"; exit 1; }
          done < /tmp/acc/coexistence-plugin-pins.tsv
          wp plugin list --status=active --format=json --path="$WP_DIR" --allow-root > /tmp/acc/coexistence-active-before-cpms.json
          if [ -f "$WP_DIR/wp-content/debug.log" ]; then
            cp "$WP_DIR/wp-content/debug.log" /tmp/acc/coexistence-debug-before-cpms.log
            if grep -qE 'PHP Fatal error|PHP Parse error|PHP Error:|Uncaught|There has been a critical error' /tmp/acc/coexistence-debug-before-cpms.log; then
              echo '::error::Independent pre-CPMS PHP fatal/error in the third-party-only baseline; this run cannot attribute it to CPMS.'
              grep -nE 'PHP Fatal error|PHP Parse error|PHP Error:|Uncaught|There has been a critical error' /tmp/acc/coexistence-debug-before-cpms.log | tail -10
              exit 1
            fi
          else
            : > /tmp/acc/coexistence-debug-before-cpms.log
          fi
          echo 'clean WordPress loads successfully with all five pinned third-party plugins active and CPMS not yet installed'

      # ---------- 1) ZIP رسمی ریلیز ----------
      - name: Build official release ZIP (bin/build-release.sh)
        run: |
          bash clinic-practice-management/bin/build-release.sh
          ls -la clinic-practice-management/dist/
          ZIP=$(ls clinic-practice-management/dist/clinic-practice-management-*.zip | head -1)
          [ -f "$ZIP" ] || { echo 'ZIP NOT BUILT'; exit 1; }
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"
          mkdir -p /tmp/acc

      - name: Stage B boundary — preserve logs before CPMS installation/activation
        if: inputs.persian_coexistence
        run: python3 .github/persian-coexistence/run.py begin-b

      # ---------- 3) نصب از ZIP + فعال‌سازی (Migration خودکار) ----------
      - name: Install ZIP → activate (migration runs in activation hook)
        id: cpms_install
        run: |
          set -Eeuo pipefail
          wp plugin install "$GITHUB_WORKSPACE/$ZIP_PATH" --activate --path="$WP_DIR" --allow-root 2>&1 | tee /tmp/acc/plugin-install.log
          wp plugin is-active clinic-practice-management --path="$WP_DIR" --allow-root || { echo 'PLUGIN NOT ACTIVE'; exit 1; }
          echo 'installed from official ZIP (نه source mount)'

      # ---------- 4) تأیید مستقیم DB ----------
      - name: Direct DB verification (tables + schema version)
        id: migrations
        run: |
          PREFIX='${{ matrix.prefix }}'
          ACTUAL=$(mysql -h 127.0.0.1 -P 3306 -uroot -proot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='$DB_NAME' AND table_name LIKE '${PREFIX}cpms_%';")
          echo "ACTUAL_TABLE_COUNT=$ACTUAL"
          echo "$ACTUAL" > /tmp/acc/actual_count.txt
          [ "$ACTUAL" -ge 30 ] || { echo "TOO FEW TABLES ($ACTUAL) — migration ناقص است"; exit 1; }
          mysql -h 127.0.0.1 -P 3306 -uroot -proot "$DB_NAME" -e "SELECT version, applied_at FROM ${PREFIX}cpms_schema_migrations ORDER BY version;" | tee /tmp/acc/schema-migrations.txt
          cat > /tmp/acc/check-schema.php <<'PHPEOF'
          <?php
          $v = \ClinicCore\Bootstrap\App::migrations()->currentVersion();
          echo "schema: $v\n";
          exit($v === '2026_09_26_0023' ? 0 : 1);
          PHPEOF
          wp eval-file /tmp/acc/check-schema.php --path="$WP_DIR" --allow-root
          wp role list --path="$WP_DIR" --allow-root | grep -E 'cpms_(doctor|secretary|patient|accountant|manager)' || { echo 'ROLES MISSING'; exit 1; }

      # ---------- 5) تست منفی Migration (D3 — fail-loud) ----------
      - name: Migration failure must NOT be recorded as success (D3)
        # Synthetic migration injection is outside this bounded measurement slice.
        if: ${{ !inputs.persian_coexistence }}
        run: |
          PREFIX='${{ matrix.prefix }}'
          if [ "$PREFIX" = 'wp_' ]; then
            mkdir -p /tmp/log-gate-phases 2>/dev/null || :
            if [ -f "$WP_DIR/wp-content/debug.log" ]; then
              cp "$WP_DIR/wp-content/debug.log" /tmp/log-gate-phases/debug-before-d3.log 2>/dev/null || :
            else
              : > /tmp/log-gate-phases/debug-before-d3.log 2>/dev/null || :
            fi
          fi
          MDIR="$WP_DIR/wp-content/plugins/clinic-practice-management/src/Migrations"
          # فایل‌های افزونه متعلق به root‌اند (wp-cli allow-root نصب کرده) → sudo
          sudo tee "$MDIR/2999_01_01_9999_acceptance_broken.php" >/dev/null <<'PHPEOF'
          <?php
          // تزریق موقت در runner برای اثبات Fail-loud (در artifact رسمی وجود ندارد).
          return [
              'version' => '2999_01_01_9999',
              'description' => 'acceptance probe: intentionally broken SQL',
              'up' => function (\ClinicCore\Infrastructure\Db\CpmsDb $db): void {
                  $db->query('CREATE TABLE syntax broken (((');
              },
              'down' => function (\ClinicCore\Infrastructure\Db\CpmsDb $db): void {
              },
          ];
          PHPEOF
          sudo chmod a+r "$MDIR/2999_01_01_9999_acceptance_broken.php"
          cat > /tmp/acc/probe-broken.php <<'PHPEOF'
          <?php
          $mig = \ClinicCore\Bootstrap\App::migrations();
          $thrown = null;
          try {
              $mig->migrate();
          } catch (\Throwable $e) {
              $thrown = $e::class . ': ' . $e->getMessage();
          }
          if ($thrown === null) {
              fwrite(STDERR, "FAIL: migration خراب بدون استثنا «موفق» شد\n");
              exit(1);
          }
          echo "fail-loud OK → " . substr($thrown, 0, 160) . "\n";
          $db = \ClinicCore\Bootstrap\App::db();
          $rec = (int) $db->fetchValue('SELECT COUNT(*) FROM ' . $db->table('cpms_schema_migrations') . ' WHERE version = %s', ['2999_01_01_9999']);
          if ($rec !== 0) {
              fwrite(STDERR, "FAIL: version migration خراب ثبت شده ({$rec})\n");
              exit(1);
          }
          echo "not-recorded OK (schema_migrations بدون 2999_01_01_9999)\n";
          PHPEOF
          # Bounded WooCommerce exception / D3 disclosure: WooCommerce 10.3.8's WP-CLI
          # after_wp_load hook fires rest_api_init before eval-file enters the synthetic
          # migration-failure probe's catch boundary, which would mask the probe's own
          # fail-loud result. --skip-plugins=woocommerce is therefore scoped ONLY to this
          # synthetic D3 WP-CLI invocation: it does not change plugin activation state and
          # does not disable WooCommerce for any real HTTP request. WooCommerce is an active,
          # verified member of the final five-plugin coexistence set; the browser smoke and
          # the public health check below run with it (and the other four) fully active.
          # بدون pipe-masking: وضعیت خروجی واقعی probe تعیین‌کننده است
          wp eval-file /tmp/acc/probe-broken.php --skip-plugins=woocommerce --path="$WP_DIR" --allow-root > /tmp/acc/migration-failure-probe.txt 2>&1
          RC=$?
          cat /tmp/acc/migration-failure-probe.txt
          if [ "$RC" -ne 0 ]; then echo 'D3 PROBE FAILED'; exit "$RC"; fi
          # پاک‌سازی probe و اثبات idempotency پس از آن
          sudo rm -f "$MDIR/2999_01_01_9999_acceptance_broken.php"
          wp eval '\ClinicCore\Bootstrap\App::migrations()->migrate();' --path="$WP_DIR" --allow-root
          echo 're-migrate after probe removal: OK (no-op idempotent)'
          if [ "$PREFIX" = 'wp_' ]; then
            if [ -f "$WP_DIR/wp-content/debug.log" ]; then
              cp "$WP_DIR/wp-content/debug.log" /tmp/log-gate-phases/debug-after-d3.log 2>/dev/null || :
            else
              : > /tmp/log-gate-phases/debug-after-d3.log 2>/dev/null || :
            fi
          fi

      # ---------- کاربران نقش‌محور + دادهٔ پایه ----------
      - name: Role users + storage خارج webroot
        id: roles
        run: |
          wp user create "$DOCTOR_USER" 'doc@acc.local' --user_pass="$DOCTOR_PASS" --role=cpms_doctor --path="$WP_DIR" --allow-root
          wp user create "$SECRETARY_USER" 'sec@acc.local' --user_pass="$SECRETARY_PASS" --role=cpms_secretary --path="$WP_DIR" --allow-root
          wp user create "$MANAGER_USER" 'mgr@acc.local' --user_pass="$MANAGER_PASS" --role=cpms_manager --path="$WP_DIR" --allow-root
          wp user create "$ACCOUNTANT_USER" 'acc@acc.local' --user_pass="$ACCOUNTANT_PASS" --role=cpms_accountant --path="$WP_DIR" --allow-root
          STORAGE=/home/runner/rwp-storage
          mkdir -p "$STORAGE" && sudo chmod -R 777 "$STORAGE"
          cat > /tmp/acc/setup-roles.php <<'PHPEOF'
          <?php
          global $wpdb;
          $db = \ClinicCore\Bootstrap\App::db();
          $now = $db->nowUtcSql();
          // نمایش واقعیِ فارسی برای رابط کاربری (نه شناسه‌های فنی) — این فقط data seeding است؛
          // هیچ تغییر Production/sanitize ایجاد نمی‌شود.
          $names = [
              getenv('DOCTOR_USER') => 'دکتر آزمایشی',
              getenv('MANAGER_USER') => 'مدیر کلینیک آزمایشی',
              getenv('SECRETARY_USER') => 'منشی آزمایشی',
              getenv('ACCOUNTANT_USER') => 'حسابدار آزمایشی',
          ];
          foreach ($names as $login => $display) {
              $u = get_user_by('login', $login);
              if ($u !== false) { wp_update_user(['ID' => (int) $u->ID, 'display_name' => $display]); }
          }
          $uid = (int) get_user_by('login', getenv('DOCTOR_USER'))->ID;
          // The acceptance fixture resolves its explicit Clinic by durable slug,
          // never by first-row order or a literal clinic_id.
          $clinicRow = $db->fetchRow(
              'SELECT id FROM ' . $db->table('cpms_clinics') . ' WHERE slug = %s LIMIT 1',
              ['default']
          );
          if ($clinicRow === null) {
              fwrite(STDERR, "FAIL: explicit default Clinic fixture not found\n");
              exit(1);
          }
          $accClinicId = (int) $clinicRow['id'];
          if ($accClinicId <= 0) {
              fwrite(STDERR, "FAIL: explicit Clinic fixture is invalid\n");
              exit(1);
          }
          file_put_contents('/tmp/acc/manager_clinic_id.txt', (string) $accClinicId);
          $wpdb->query($wpdb->prepare(
              'INSERT INTO ' . $db->table('cpms_clinicians') . ' (clinic_id, full_name, wp_user_id, is_active, created_at, updated_at) VALUES (%d, %s, %d, 1, %s, %s)',
              $accClinicId, 'پزشک آزمایشی', $uid, $now, $now
          ));
          $cid = (int) $wpdb->insert_id;
          // یک برنامهٔ هفتگی «پُر» برای پزشک تجربی — تا اسکرین‌شات Schedule خالی نباشد.
          // C7-S5: create برنامه حالا نیازمند Scope معتبر صریح است (معادل مرز
          // تولیدی) — resolver تک‌کلینیکیِ نصب؛ در نصب مبهم fail-closed.
          \ClinicCore\Bootstrap\App::replaceExplicitScope(\ClinicCore\Bootstrap\App::scope());
          try {
              \ClinicCore\Bootstrap\App::scheduleService()->create($uid, [
                  'clinician_id' => $cid, 'day_of_week' => 0, // شنبه
                  'start_time' => '09:00', 'end_time' => '13:00',
                  'break_start' => '12:00', 'break_end' => '12:30',
                  'appointment_duration_min' => 20, 'slot_capacity' => 1, 'is_active' => 1,
              ]);
              \ClinicCore\Bootstrap\App::scheduleService()->create($uid, [
                  'clinician_id' => $cid, 'day_of_week' => 2, // دوشنبه
                  'start_time' => '16:00', 'end_time' => '20:00',
                  'break_start' => '', 'break_end' => '',
                  'appointment_duration_min' => 30, 'slot_capacity' => 1, 'is_active' => 1,
              ]);
          } catch (\Throwable $e) { echo "(schedule seed: {$e->getMessage()})\n"; }
          finally { \ClinicCore\Bootstrap\App::resetScope(); }
          \ClinicCore\Bootstrap\App::settings()->set('files.storage_path', '/home/runner/rwp-storage');
          echo "doctor linked (wp_user_id=$uid); clinician_id=$cid; files.storage_path set\n";
          // ── Fixture عضویت (TEST INFRASTRUCTURE — نه provisioning محصول) ──
          // C6: هر actorِ staff که در محیط acceptance قرار است داخل Clinic کار کند
          // باید عضویت «فعال» روی همان Clinic داشته باشد؛ نقش سراسری WP رابطهٔ
          // tenant را تعریف نمی‌کند و Production عمداً هیچ provisioning خودکاری
          // (user_register/set_user_role/exact‑one) ندارد. شناسهٔ Clinic از خودِ
          // محیط حل می‌شود — هیچ فرضِ id=1 یا «اولین Clinic» در کار نیست.
          $svc = \ClinicCore\Bootstrap\App::membership_service();
          $roleKeys = [
              'DOCTOR_USER' => 'cpms_doctor',
              'SECRETARY_USER' => 'cpms_secretary',
              'MANAGER_USER' => 'cpms_manager',
              'ACCOUNTANT_USER' => 'cpms_accountant',
          ];
          $seeded = [];
          foreach ($roleKeys as $envKey => $roleKey) {
              $login = (string) getenv($envKey);
              if (1 !== preg_match('/^[A-Za-z0-9_.-]{1,60}$/', $login)) {
                  fwrite(STDERR, "FAIL: login acceptance نامعتبر ({$envKey})\n");
                  exit(1);
              }
              $u = get_user_by('login', $login);
              if ($u === false) {
                  fwrite(STDERR, "FAIL: کاربر {$login} وجود ندارد — مرحلهٔ wp user create اجرا نشده\n");
                  exit(1);
              }
              $userId = (int) $u->ID;
              $existing = $svc->membership_for($accClinicId, $userId);
              // idempotent — اجرای دوبارهٔ fixture خطای duplicate نمی‌دهد.
              $seeded[$login] = $existing !== null
                  ? (int) $existing['id']
                  : $svc->create_membership($accClinicId, $userId, $roleKey);
          }
          // administrator (technical owner) عمداً عضویت staff نمی‌گیرد؛ کاربر
          // patient هم در این مرحله ساخته نمی‌شود و در صورت افزودن، نباید
          // عضویت staff بگیرد.
          \ClinicCore\Bootstrap\App::replaceExplicitScope(null);
          echo 'memberships seeded on clinic ' . $accClinicId . ': '
              . implode(', ', array_map(
                  static fn (string $k, int $v): string => $k . '=' . $v,
                  array_keys($seeded),
                  $seeded
              )) . "\n";
          PHPEOF
          wp eval-file /tmp/acc/setup-roles.php --path="$WP_DIR" --allow-root
          # شواهد Fixture (برای تفکیک A/C/D اگر ورود شکست بخورد) — بدون رمز/هش:
          # وجود کاربران نقش‌محور، نقش‌شان و تعداد عضویت‌های Clinic.
          PREFIX='${{ matrix.prefix }}'
          wp user list --fields=user_login,roles --path="$WP_DIR" --allow-root > /tmp/acc/fixture-users.txt
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -N \
            -e "SELECT COUNT(*) FROM $DB_NAME.${PREFIX}cpms_clinic_memberships;" > /tmp/acc/fixture-memberships.txt
          echo "fixture membership rows: $(cat /tmp/acc/fixture-memberships.txt)"
          MANAGER_CLINIC_ID=$(cat /tmp/acc/manager_clinic_id.txt)
          case "$MANAGER_CLINIC_ID" in
            ''|*[!0-9]*) echo 'FAIL: manager Clinic fixture id is not numeric'; exit 1 ;;
          esac
          [ "$MANAGER_CLINIC_ID" -gt 0 ] || { echo 'FAIL: manager Clinic fixture id is invalid'; exit 1; }
          echo "MANAGER_CLINIC_ID=$MANAGER_CLINIC_ID" >> "$GITHUB_ENV"
          echo "explicit manager Clinic context exported: $MANAGER_CLINIC_ID"

      # ---------- 5b) Fixture سطح عمومی shortcode — شاهدِ Plain-permalink برای A1 ----------
      # این job عمداً هیچ `wp rewrite structure` اجرا نمی‌کند، پس
      # `permalink_structure` خالی می‌ماند و طبق `get_rest_url()` وردپرس،
      # `rest_url('clinic/v1')` شکلِ `index.php?rest_route=/clinic/v1` می‌گیرد.
      # بدون این fixture، سطح عمومیِ آنونیم در Real-WP Acceptance اصلاً exercised
      # نمی‌شد و defectِ ساختِ URLِ A1 در Plain permalinks دیده نمی‌شد.
      - name: Public booking page fixture (Plain permalinks)
        id: booking
        run: |
          PL="$(wp option get permalink_structure --path="$WP_DIR" --allow-root 2>/dev/null || true)"
          echo "permalink_structure='${PL}'  $( [ -z "$PL" ] && echo '=> PLAIN permalinks (rest_url => index.php?rest_route=...)' || echo '=> NOT plain' )"
          cat > /tmp/acc/public-page.php <<'PHPEOF'
          <?php
          global $wpdb;
          $db = \ClinicCore\Bootstrap\App::db();
          $now = $db->nowUtcSql();
          // Clinicِ صریح از همان fixtureِ موجود (که آن هم از slug پایدارِ
          // 'default' حل شده) — هیچ literal id و هیچ «اولین Clinic» در کار نیست.
          $accClinicId = (int) trim((string) file_get_contents('/tmp/acc/manager_clinic_id.txt'));
          if ($accClinicId <= 0) { fwrite(STDERR, "FAIL: explicit Clinic fixture id is invalid\n"); exit(1); }
          $doc = get_user_by('login', getenv('DOCTOR_USER'));
          if ($doc === false) { fwrite(STDERR, "FAIL: doctor fixture user not found\n"); exit(1); }
          $row = $wpdb->get_row($wpdb->prepare(
              'SELECT id, clinic_id, is_active FROM ' . $db->table('cpms_clinicians') . ' WHERE wp_user_id = %d ORDER BY id DESC LIMIT 1',
              (int) $doc->ID
          ), ARRAY_A);
          if (!is_array($row) || (int) $row['clinic_id'] !== $accClinicId || (int) $row['is_active'] !== 1) {
              fwrite(STDERR, "FAIL: no ACTIVE clinician row on the explicit Clinic\n"); exit(1);
          }
          $clinicianId = (int) $row['id'];
          $loc = $wpdb->get_row($wpdb->prepare(
              'SELECT id, timezone FROM ' . $db->table('cpms_locations') . ' WHERE clinic_id = %d AND is_active = 1 ORDER BY is_primary DESC, id ASC LIMIT 1',
              $accClinicId
          ), ARRAY_A);
          if (!is_array($loc)) { fwrite(STDERR, "FAIL: no active Location for clinic {$accClinicId}\n"); exit(1); }
          $locationId = (int) $loc['id'];
          $tzName = (is_string($loc['timezone']) && $loc['timezone'] !== '') ? $loc['timezone'] : 'UTC';
          $tz = new DateTimeZone($tzName);
          // برنامهٔ فعال — A1 پنجرهٔ پیش‌فرضِ مرور را فقط از Locationِ دارای
          // برنامهٔ فعالِ همان پزشک می‌سازد.
          $wpdb->query($wpdb->prepare(
              'INSERT INTO ' . $db->table('cpms_schedule') . ' (clinic_id, clinician_id, day_of_week, start_time, end_time, appointment_duration_min, slot_capacity, is_active, location_id, created_at, updated_at) VALUES (%d, %d, %d, %s, %s, %d, %d, 1, %d, %s, %s)',
              $accClinicId, $clinicianId, 6, '09:00:00', '13:00:00', 20, 2, $locationId, $now, $now
          ));
          // نوبت‌های آزاد — wall-clock محلیِ همان Location (قراردادِ ذخیرهٔ
          // slot_date/slot_time)، ۲ و ۳ روز بعد: خارج از min-lead و داخلِ پنجرهٔ A1.
          $slotCount = 0;
          foreach ([[2, '10:00:00'], [2, '10:20:00'], [3, '09:30:00']] as $spec) {
              $date = (new DateTimeImmutable('now', $tz))->modify('+' . $spec[0] . ' days')->format('Y-m-d');
              $wpdb->query($wpdb->prepare(
                  'INSERT INTO ' . $db->table('cpms_schedule_slots') . ' (clinic_id, location_id, clinician_id, slot_date, slot_time, duration_min, capacity, booked_count, held_count, is_open, generated_from, created_at, updated_at) VALUES (%d, %d, %d, %s, %s, %d, %d, 0, 0, 1, %s, %s, %s)',
                  $accClinicId, $locationId, $clinicianId, $date, $spec[1], 20, 2, 'manual', $now, $now
              ));
              $slotCount++;
          }
          // صفحهٔ عمومیِ published با خودِ shortcode — همان مسیری که اپراتور
          // استفاده می‌کند، پس انکیوِ شرطیِ asset هم exercised می‌شود.
          $pageId = wp_insert_post([
              'post_title' => 'Public Booking Acceptance Fixture',
              'post_name' => 'cpms-public-booking-acceptance',
              'post_content' => '[cpms_public_booking clinic_id="' . $accClinicId . '"]',
              'post_status' => 'publish',
              'post_type' => 'page',
          ], true);
          if (is_wp_error($pageId)) { fwrite(STDERR, 'FAIL: ' . $pageId->get_error_message() . "\n"); exit(1); }
          $permalink = (string) get_permalink($pageId);
          echo 'public booking page #' . (int) $pageId . ' clinic=' . $accClinicId
              . ' clinician=' . $clinicianId . ' location=' . $locationId
              . ' tz=' . $tzName . ' slots=' . $slotCount . ' url=' . $permalink . "\n";
          // فایلِ env (نه pipeline) — تا خروجِ غیرصفرِ php پنهان نشود و همان‌جا گیت بایستد.
          file_put_contents('/tmp/acc/public-page.env', 'ACC_PUBLIC_PAGE=' . $permalink . '|' . $accClinicId . '|' . $clinicianId . "\n");
          PHPEOF
          wp eval-file /tmp/acc/public-page.php --path="$WP_DIR" --allow-root
          test -s /tmp/acc/public-page.env
          cat /tmp/acc/public-page.env >> "$GITHUB_ENV"
          cat /tmp/acc/public-page.env

      - name: Phase 18 Slice 18-4 — record active coexistence set before existing smoke
        if: matrix.prefix == 'wp_' && !inputs.persian_coexistence
        run: |
          set -Eeuo pipefail
          while read -r slug version; do
            [ -n "$slug" ] || continue
            wp plugin is-active "$slug" --path="$WP_DIR" --allow-root
            installed_version="$(wp plugin get "$slug" --field=version --path="$WP_DIR" --allow-root)"
            [ "$installed_version" = "$version" ] || { echo "::error::D-class pre-smoke plugin drift: ${slug}@${installed_version:-unknown}, expected ${version}."; exit 1; }
            echo "active before smoke: ${slug}@${installed_version}"
          done < /tmp/acc/coexistence-plugin-pins.tsv
          wp plugin is-active clinic-practice-management --path="$WP_DIR" --allow-root
          cpms_version="$(wp plugin get clinic-practice-management --field=version --path="$WP_DIR" --allow-root)"
          test -n "$cpms_version"
          echo "active before smoke: clinic-practice-management@${cpms_version} (current official release ZIP)"
          wp plugin list --status=active --format=json --path="$WP_DIR" --allow-root > /tmp/acc/coexistence-active-before-smoke.json
          mkdir -p /tmp/log-gate-phases 2>/dev/null || :
          if [ -f "$WP_DIR/wp-content/debug.log" ]; then
            cp "$WP_DIR/wp-content/debug.log" /tmp/log-gate-phases/debug-before-http.log 2>/dev/null || :
          else
            : > /tmp/log-gate-phases/debug-before-http.log 2>/dev/null || :
          fi
          sudo cp /var/log/apache2/acc-error.log /tmp/log-gate-phases/apache-before-http.log 2>/dev/null || :

      # ---------- 6) پذیرش مرورگری ----------
      - name: Browser acceptance — all 5 roles (Admin/Manager/Doctor/Secretary/Accountant) menus + denial
        id: browser_acceptance
        run: |
          # بدون pipe-masking: وضعیت خروجی واقعی اسکریپت تعیین‌کننده است
          BASE="$WP_URL" \
          ADMIN_USER="$ADMIN_USER" ADMIN_PASS="$ADMIN_PASS" \
          DOCTOR_USER="$DOCTOR_USER" DOCTOR_PASS="$DOCTOR_PASS" \
          SECRETARY_USER="$SECRETARY_USER" SECRETARY_PASS="$SECRETARY_PASS" \
          MANAGER_USER="$MANAGER_USER" MANAGER_PASS="$MANAGER_PASS" \
          MANAGER_CLINIC_ID="$MANAGER_CLINIC_ID" \
          ACCOUNTANT_USER="$ACCOUNTANT_USER" ACCOUNTANT_PASS="$ACCOUNTANT_PASS" \
          ACTUAL_COUNT_FILE=/tmp/acc/actual_count.txt \
          OUT=/tmp/acc \
          python3 clinic-practice-management/bin/rwp-acceptance.py > /tmp/acc/acceptance.log 2>&1
          RC=$?
          cat /tmp/acc/acceptance.log
          if [ "$RC" -ne 0 ]; then echo "ACCEPTANCE FAILED (rc=$RC)"; exit "$RC"; fi

      - name: Phase 18 Slice 18-4 — coexistence evidence after existing Real WP smoke
        if: matrix.prefix == 'wp_' && !inputs.persian_coexistence
        run: |
          set -Eeuo pipefail
          # These named assertions prove the existing smoke exercised the intended
          # authenticated system, tenant-aware operation, and public booking path.
          for expected in \
            'PASS admin.cpms-system.health_rendered' \
            'PASS secretary.patients.create_success' \
            'PASS secretary.patients.search_results' \
            'PASS public-booking.http200' \
            'PASS public-booking.a1_http200' \
            'PASS public-booking.a1_reached_product_route' \
            'PASS public-booking.a4_http200' \
            'PASS doctor.coexistence.doctor_page.served_on_cpms_admin_screen' \
            'PASS doctor.coexistence.doctor_patients_page.served_on_cpms_admin_screen' \
            'PASS secretary.coexistence.queue_page.served_on_cpms_admin_screen' \
            'PASS secretary.coexistence.patients_page.served_on_cpms_admin_screen' \
            'PASS manager.coexistence.system_page.served_on_cpms_admin_screen' \
            'PASS accountant.coexistence.finance_page.served_on_cpms_admin_screen' \
            'PASS doctor.doctor-denied-woo-admin.not_granted' \
            'PASS secretary.secretary-denied-woo-admin.not_granted' \
            'PASS manager.manager-denied-woo-admin.not_granted' \
            'PASS accountant.accountant-denied-woo-admin.not_granted' \
            'PASS doctor.doctor-denied-core-posts.not_granted' \
            'PASS secretary.secretary-denied-core-settings.not_granted' \
            'PASS doctor.doctor-denied-spoofed-page.not_granted'; do
            grep -Fq "$expected" /tmp/acc/acceptance.log || { echo "::error::Existing Real WP smoke did not prove: $expected"; exit 1; }
          done

          while read -r slug version; do
            [ -n "$slug" ] || continue
            wp plugin is-active "$slug" --path="$WP_DIR" --allow-root
            installed_version="$(wp plugin get "$slug" --field=version --path="$WP_DIR" --allow-root)"
            [ "$installed_version" = "$version" ] || { echo "::error::D-class post-smoke plugin drift: ${slug}@${installed_version:-unknown}, expected ${version}."; exit 1; }
            echo "still active after smoke: ${slug}@${installed_version}"
          done < /tmp/acc/coexistence-plugin-pins.tsv
          wp plugin is-active clinic-practice-management --path="$WP_DIR" --allow-root
          cpms_version="$(wp plugin get clinic-practice-management --field=version --path="$WP_DIR" --allow-root)"
          test -n "$cpms_version"
          echo "still active after smoke: clinic-practice-management@${cpms_version}"
          wp plugin list --status=active --format=json --path="$WP_DIR" --allow-root > /tmp/acc/coexistence-active-after-smoke.json

          # Gate is deliberately unchanged (HTTP 200 AND data.ok=true). The extra records below
          # exist only so a failure is adjudicable from published evidence — exact status,
          # redirect target, content type, sanitized response head and a fatal-error count —
          # because a bare "failed" annotation cannot separate C (transport/provider) from D
          # (fixture) from a real product regression. No secret/PHI is published.
          # This acceptance site deliberately uses plain permalinks, so route REST through
          # WordPress's rest_route query rather than Apache's unavailable /wp-json rewrite.
          HEALTH_META="$(curl -sS -o /tmp/acc/coexistence-health.json -w '%{http_code}|%{content_type}|%{redirect_url}' "$WP_URL/?rest_route=/clinic/v1/health")" || HEALTH_META='000|transport-error|'
          HEALTH_HTTP="${HEALTH_META%%|*}"
          echo "anonymous CPMS health (plain permalink): HTTP ${HEALTH_HTTP}"
          if [ "$HEALTH_HTTP" != '200' ]; then
            FATAL_COUNT="$(grep -cE 'PHP Fatal error|Uncaught|There has been a critical error' "$WP_DIR/wp-content/debug.log" 2>/dev/null || true)"
            {
              printf 'http_status=%s\n' "$HEALTH_HTTP"
              printf 'http_status_content_type_redirect=%s\n' "$HEALTH_META"
              printf 'response_head=%s\n' "$(head -c 400 /tmp/acc/coexistence-health.json 2>/dev/null | tr '\n\r' '  ' | sed -E 's/[A-Za-z0-9+\/=_-]{24,}/[opaque]/g' | cut -c1-240)"
              printf 'debug_log_fatal_count=%s\n' "${FATAL_COUNT:-no-debug-log}"
            } > /tmp/acc/coexistence-health-failure.txt
            cat /tmp/acc/coexistence-health-failure.txt
            echo '::error::Public CPMS health endpoint failed with representative plugins active (bounded diagnostics: coexistence-health-failure.txt in the artifact and the evidence comment).'
            exit 1
          fi
          python3 - /tmp/acc/coexistence-health.json <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding='utf-8') as source:
              payload = json.load(source)
          if payload.get('data', {}).get('ok') is not True:
              raise SystemExit('public CPMS health payload did not report data.ok=true')
          print('anonymous CPMS health payload: data.ok=true')
          PY
          if [ -f "$WP_DIR/wp-content/debug.log" ] && grep -qE 'PHP Fatal error|PHP Parse error|PHP Error:|Uncaught|There has been a critical error' "$WP_DIR/wp-content/debug.log"; then
            echo '::error::PHP fatal/error appeared in debug.log during the active coexistence run.'
            grep -nE 'PHP Fatal error|PHP Parse error|PHP Error:|Uncaught|There has been a critical error' "$WP_DIR/wp-content/debug.log" | tail -10
            exit 1
          fi
          {
            echo '## Phase 18 Slice 18-4 — bounded WordPress plugin coexistence'
            echo '- Existing Real WordPress browser smoke passed with the complete pinned set and CPMS release ZIP active.'
            echo '- Smoke anchors: authenticated CPMS system health; secretary Clinic-scoped patient create/search; anonymous booking page + A1 availability + A4 quote.'
            echo '- WooCommerce 10.3.8 coexistence: every authorized CPMS persona above was served on its own wp-admin screen (no third-party redirect to the store front-end).'
            echo '- Non-widening proof (same run, real browser): doctor/secretary/manager/accountant got NO access to `admin.php?page=wc-admin`; doctor got none of `edit.php`/`users.php`; secretary got none of `options-general.php`; an unknown `page=cpms-*` selector was not exempted. Denial mechanism per check is recorded in `logs/*-denial.json`.'
            echo '- Public `/?rest_route=/clinic/v1/health`: HTTP 200 and `data.ok=true` while all six plugins (five pinned + CPMS) remained active.'
            echo '- No PHP fatal/parse/error, uncaught exception, or WordPress critical-error marker in the exercised run log.'
            echo '- WordPress.org plugin packages (exact pins):'
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r slug version; do
            [ -n "$slug" ] || continue
            echo "  - \`${slug}@${version}\`" >> "$GITHUB_STEP_SUMMARY"
          done < /tmp/acc/coexistence-plugin-pins.tsv
          echo '- Active-state snapshots before/after the smoke are attached to the existing Real WP acceptance artifact.' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p /tmp/log-gate-phases 2>/dev/null || :
          if [ -f "$WP_DIR/wp-content/debug.log" ]; then
            cp "$WP_DIR/wp-content/debug.log" /tmp/log-gate-phases/debug-after-http.log 2>/dev/null || :
          else
            : > /tmp/log-gate-phases/debug-after-http.log 2>/dev/null || :
          fi
          sudo cp /var/log/apache2/acc-error.log /tmp/log-gate-phases/apache-after-http.log 2>/dev/null || :

      # ---------- 6.5) اثبات فنی: پوستهٔ مستقلِ CPMS (Phase 9 Slice 3 — فقط proof) ----------
      # NON-PRODUCTION: فیکسچرهای پوسته/پیوند یکتا فقط روی control با prefix=clinic_ اجرا می‌شوند.
      # شواهد run 37638771326: در wp_، پس از موفقیت HTTP smoke، همین theme-activation proof
      # باعث PHP_FATAL در WooCommerce FileV2 → WP_Filesystem_FTPext → ftp_nlist(FTP\Connection|null)
      # شد؛ summary فازی آن را فقط در پنجرهٔ standalone shell proof ثبت کرد. مسیر commerce/CPMS
      # عوض نمی‌شود: این proof مستقل در control باقی می‌ماند و gate سخت‌گیرانهٔ wp_ فقط روی
      # smoke واقعیِ پنج افزونهٔ فعال اجرا می‌شود (هیچ خطایی allowlist یا نادیده گرفته نمی‌شود).
      # فیکسچرها هرگز داخل release ZIP نیستند (whitelist سیاست bin/build-release.sh).
      - name: "Technical proof — standalone CPMS shell (theme independence + Plain/Pretty)"
        if: matrix.prefix == 'clinic_'
        run: |
          set -o pipefail
          sudo mkdir -p "$WP_DIR/wp-content/mu-plugins" "$WP_DIR/wp-content/mu-plugins/cpms-shell-proof-fixture"
          # فقط رهگیر در ریشهٔ mu-plugins (خودکاربارگذاری می‌شود)؛ قالبِ proof عمداً
          # داخلِ زیرپوشه است — بارگذارِ mu-plugins زیرپوشه‌ها را اجرا نمی‌کند و قالب
          # هرگز «افزونهٔ must-use» تلقی نمی‌شود (درسِ گیتِ اول — خطای کلاس D).
          sudo cp clinic-practice-management/tests/Fixtures/standalone-shell/cpms-standalone-shell-proof.php \
                  "$WP_DIR/wp-content/mu-plugins/"
          sudo cp clinic-practice-management/tests/Fixtures/standalone-shell/cpms-standalone-shell-proof-template.php \
                  "$WP_DIR/wp-content/mu-plugins/cpms-shell-proof-fixture/"
          sudo cp -R clinic-practice-management/tests/Fixtures/standalone-shell/themes/cpms-proof-theme-alpha \
                     clinic-practice-management/tests/Fixtures/standalone-shell/themes/cpms-proof-theme-beta \
                     "$WP_DIR/wp-content/themes/"
          wp user create "$SHELLPROOF_USER" 'shellproof@acc.local' --user_pass="$SHELLPROOF_PASS" --role=cpms_patient --path="$WP_DIR" --allow-root
          wp theme list --status=active --path="$WP_DIR" --allow-root | tee /tmp/acc/shell-proof-themes.txt
          # بدون pipe-masking: وضعیت خروجی واقعی اسکریپت تعیین‌کننده است؛ خودِ
          # اسکریپت بین سناریوها `wp rewrite structure` / `wp theme activate` می‌زند
          # و در پایان وضعیت اولیه (تم + permalink structure) را restore می‌کند.
          BASE="$WP_URL" WP_DIR="$WP_DIR" OUT=/tmp/acc \
          SHELLPROOF_USER="$SHELLPROOF_USER" SHELLPROOF_PASS="$SHELLPROOF_PASS" \
            python3 clinic-practice-management/bin/rwp-shell-proof.py > /tmp/acc/shell-proof.log 2>&1
          RC=$?
          cat /tmp/acc/shell-proof.log
          if [ "$RC" -ne 0 ]; then echo "SHELL PROOF FAILED (rc=$RC)"; exit "$RC"; fi

      # ---------- 7) بررسی لاگ‌ها (همیشه — حتی در شکست) ----------
      - name: PHP/WP/Apache logs review
        if: always()
        run: |
          mkdir -p /tmp/acc/logs
          cp "$WP_DIR/wp-content/debug.log" /tmp/acc/logs/ 2>/dev/null || echo '(no debug.log)' > /tmp/acc/logs/debug.log.missing
          sudo cp /var/log/apache2/acc-error.log /tmp/acc/logs/apache-error.log 2>/dev/null || true
          sudo cp /var/log/apache2/acc-access.log /tmp/acc/logs/apache-access.log 2>/dev/null || true
          sudo chmod -R a+r /tmp/acc/logs/ || true
          DEBUG_BYTES=0
          APACHE_BYTES=0
          [ ! -f /tmp/acc/logs/debug.log ] || DEBUG_BYTES="$(wc -c < /tmp/acc/logs/debug.log)"
          [ ! -f /tmp/acc/logs/apache-error.log ] || APACHE_BYTES="$(wc -c < /tmp/acc/logs/apache-error.log)"
          echo "PHP/WP/Apache log files captured for final gate; raw contents suppressed. debug.log_bytes=${DEBUG_BYTES}; apache_error_bytes=${APACHE_BYTES}"

      - name: Log gate — بدون Fatal/Critical در لاگ PHP/WP
        if: always() && !inputs.persian_coexistence
        run: |
          # Diagnostic only: publish safe signatures and phase counts; keep the existing grep gate authoritative.
          if ! python3 - > /tmp/acc/log-gate-summary.txt 2>/dev/null <<'PY'
          from collections import Counter
          from pathlib import Path
          import re

          root = Path('/tmp/acc')
          phase_dir = Path('/tmp/log-gate-phases')
          debug_gate = re.compile(r'PHP Fatal error|Uncaught|There has been a critical error')
          apache_gate = re.compile(r'PHP Fatal error|Uncaught')

          def source_category_from_path(path):
              lower = path.replace('\\', '/').lower()
              if '/wp-content/plugins/clinic-practice-management/' in lower:
                  return 'CPMS PHP source'
              if '/wp-content/plugins/woocommerce/' in lower:
                  return 'WooCommerce PHP source'
              if '/wp-content/plugins/' in lower:
                  rest = lower.split('/wp-content/plugins/', 1)[1]
                  slug = rest.split('/', 1)[0]
                  return 'third-party plugin:' + (slug if re.fullmatch(r'[a-z0-9_-]{1,80}', slug) else 'redacted')
              if '/wp-content/themes/' in lower:
                  rest = lower.split('/wp-content/themes/', 1)[1]
                  slug = rest.split('/', 1)[0]
                  return 'theme:' + (slug if re.fullmatch(r'[a-z0-9_-]{1,80}', slug) else 'redacted')
              if '/wp-includes/' in lower or '/wp-admin/' in lower:
                  return 'WordPress core PHP source'
              if '/mu-plugins/' in lower or '/tmp/acc/' in lower:
                  return 'acceptance fixture/harness'
              if '/usr/' in lower or '/opt/' in lower:
                  return 'PHP/Apache runtime'
              return 'other PHP source (path redacted)'

          def source_category(line):
              match = re.search(r'\bin\s+((?:/|[A-Za-z]:[\\/])[^\s]+)', line)
              if not match:
                  return 'PHP/WP runtime (source path absent)'
              return source_category_from_path(match.group(1).rstrip(':,.)'))

          frame_re = re.compile(r'#\d+\s+((?:/|[A-Za-z]:[\\/])\S+?)\(\d+\):\s*([A-Za-z_][A-Za-z0-9_\\]*(?:(?:::|->)[A-Za-z_][A-Za-z0-9_]*)?|\{closure\})\s*\(')

          def safe_frames(line, following):
              frames = []
              for candidate in [line, *following]:
                  for match in frame_re.finditer(candidate):
                      item = source_category_from_path(match.group(1)) + '::' + match.group(2)
                      if item not in frames:
                          frames.append(item)
                      if len(frames) == 4:
                          return ' > '.join(frames)
              return ' > '.join(frames) if frames else 'no safe stack frames captured'

          def safe_record(line, following):
              if 'PHP Fatal error' in line:
                  severity = 'PHP_FATAL'
              elif 'Uncaught' in line:
                  severity = 'UNCAUGHT'
              else:
                  severity = 'WP_CRITICAL_MARKER'
              source = source_category(line)
              signature = 'message redacted'
              type_arg = re.search(r'Argument #(\d+)(?:\s+\(\$[A-Za-z_][A-Za-z0-9_]*\))?\s+must be of type ([A-Za-z_][A-Za-z0-9_\\|?&\[\]]*), ([A-Za-z_][A-Za-z0-9_\\]*) given', line)
              callable_match = re.search(r'([A-Za-z_][A-Za-z0-9_\\]*(?:::[A-Za-z_][A-Za-z0-9_]*)?)\(\): Argument #', line)
              if type_arg:
                  owner = callable_match.group(1) if callable_match else 'callable'
                  signature = f'TypeError: {owner} argument #{type_arg.group(1)} expects {type_arg.group(2)}, got {type_arg.group(3)}'
              else:
                  patterns = [
                      (r'Call to undefined function\s+([A-Za-z_][A-Za-z0-9_\\]*)\s*\(', 'undefined function {}()'),
                      (r'Call to undefined method\s+([A-Za-z_][A-Za-z0-9_\\]*)::([A-Za-z_][A-Za-z0-9_]*)', 'undefined method {}::{}()'),
                      (r'Cannot redeclare (?:function )?([A-Za-z_][A-Za-z0-9_\\]*)', 'redeclared function {}'),
                      (r'Too few arguments to function ([A-Za-z_][A-Za-z0-9_\\:]*)', 'too few arguments to {}'),
                      (r'Class ["\']([A-Za-z_][A-Za-z0-9_\\]*)["\'] not found', 'missing class {}'),
                      (r'Call to a member function ([A-Za-z_][A-Za-z0-9_]*)\(\) on null', 'member call on null: {}()'),
                      (r'Cannot access offset of type ([A-Za-z_]+) on ([A-Za-z_]+)', 'invalid offset types: {} on {}'),
                      (r'Unsupported operand types: ([A-Za-z_]+) \+ ([A-Za-z_]+)', 'unsupported operand types: {} + {}'),
                  ]
                  for pattern, template in patterns:
                      match = re.search(pattern, line)
                      if match:
                          signature = template.format(*match.groups())
                          break
                  else:
                      if 'There has been a critical error' in line or 'critical error' in line:
                          signature = 'WordPress critical-error marker'
                      else:
                          uncaught = re.search(r'Uncaught\s+([A-Za-z_][A-Za-z0-9_\\]*)', line)
                          if uncaught:
                              signature = 'uncaught ' + uncaught.group(1) + ' (message redacted)'
                          elif severity == 'PHP_FATAL':
                              signature = 'PHP fatal (message redacted)'
              return severity, source, signature, safe_frames(line, following)
          snapshots = {
              'debug.log': [
                  ('pre-CPMS baseline', root / 'coexistence-debug-before-cpms.log'),
                  ('before D3', phase_dir / 'debug-before-d3.log'),
                  ('after D3', phase_dir / 'debug-after-d3.log'),
                  ('before HTTP smoke', phase_dir / 'debug-before-http.log'),
                  ('after HTTP smoke', phase_dir / 'debug-after-http.log'),
                  ('final', root / 'logs' / 'debug.log'),
              ],
              'apache-error.log': [
                  ('before HTTP smoke', phase_dir / 'apache-before-http.log'),
                  ('after HTTP smoke', phase_dir / 'apache-after-http.log'),
                  ('final', root / 'logs' / 'apache-error.log'),
              ],
          }
          counts = {}
          available = {}
          print('log_gate_diagnostic_version=2; raw messages, absolute paths and request data suppressed')
          for log_name, phases in snapshots.items():
              for phase, path in phases:
                  phase_counts = Counter()
                  present = path.is_file()
                  available[(log_name, phase)] = present
                  if present:
                      try:
                          lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
                          for line_index, line in enumerate(lines):
                              gate = debug_gate if log_name == 'debug.log' else apache_gate
                              if gate.search(line):
                                  following = []
                                  for candidate in lines[line_index + 1:line_index + 12]:
                                      if gate.search(candidate):
                                          break
                                      if frame_re.search(candidate):
                                          following.append(candidate)
                                      elif following and not candidate.strip():
                                          break
                                  phase_counts[safe_record(line, following)] += 1
                      except OSError:
                          available[(log_name, phase)] = False
                  counts[(log_name, phase)] = phase_counts
              final = counts.get((log_name, 'final'), Counter())
              final_status = str(sum(final.values())) if available.get((log_name, 'final')) else 'not-captured'
              snapshot_status = ','.join(f'{phase}={"captured" if available[(log_name, phase)] else "unavailable"}' for phase, _ in phases)
              print(f'log={log_name}; final_gate_matching_lines={final_status}; snapshots={snapshot_status}')
              if not available.get((log_name, 'final')):
                  continue
              for index, (key, total) in enumerate(sorted(final.items()), 1):
                  severity, source, signature, stack = key
                  phase_values = [(phase, counts[(log_name, phase)].get(key, 0)) for phase, _ in phases if available[(log_name, phase)]]
                  first_seen = next((phase for phase, value in phase_values if value > 0), 'not seen in available snapshots')
                  deltas = []
                  transitions = {
                      ('pre-CPMS baseline', 'before D3'): 'CPMS activation/pre-D3 setup',
                      ('before D3', 'after D3'): 'intentional D3 injection window',
                      ('after D3', 'before HTTP smoke'): 'post-D3/pre-HTTP setup',
                      ('before HTTP smoke', 'after HTTP smoke'): 'real HTTP/browser coexistence smoke',
                      ('after HTTP smoke', 'final'): 'post-smoke/final log capture',
                  }
                  for (earlier, later), label in transitions.items():
                      if available.get((log_name, earlier)) and available.get((log_name, later)):
                          delta = counts[(log_name, later)].get(key, 0) - counts[(log_name, earlier)].get(key, 0)
                          if delta > 0:
                              deltas.append(f'{label}=+{delta}')
                  if available.get((log_name, 'pre-CPMS baseline')):
                      pre_cpms = counts[(log_name, 'pre-CPMS baseline')].get(key, 0)
                  else:
                      pre_cpms = 'not-applicable'
                  print(f'match[{index}] log={log_name}; severity={severity}; source={source}; signature={signature}; stack={stack}; count={total}; pre_cpms_count={pre_cpms}; first_seen={first_seen}; new_in={", ".join(deltas) if deltas else "no phase delta proved"}')
          PY
          then
            printf '%s\n' 'diagnostic_status=failed; raw log contents suppressed; unchanged gate remains authoritative' > /tmp/acc/log-gate-summary.txt
          fi
          cat /tmp/acc/log-gate-summary.txt
          if [ -f /tmp/acc/logs/debug.log ] && grep -qE 'PHP Fatal error|Uncaught|There has been a critical error' /tmp/acc/logs/debug.log; then
            echo 'LOG GATE: FAIL — existing fatal/uncaught/critical pattern matched debug.log; see sanitized summary.'
            exit 1
          fi
          if [ -f /tmp/acc/logs/apache-error.log ] && grep -qE 'PHP Fatal error|Uncaught' /tmp/acc/logs/apache-error.log; then
            echo 'LOG GATE: FAIL — existing fatal/uncaught pattern matched apache-error.log; see sanitized summary.'
            exit 1
          fi
          echo 'LOG GATE: clean (بدون Fatal/Uncaught/Critical)'

      - name: Finalize bounded Stage A / Stage B evidence
        if: always() && inputs.persian_coexistence
        env:
          COEX_STEPS: ${{ toJSON(steps) }}
        run: python3 .github/persian-coexistence/run.py finalize

      # ---------- Artifacts ----------
      - name: Upload screenshots/logs/results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.persian_coexistence && 'persian-coexistence' || 'rwp-acceptance' }}-${{ matrix.prefix }}
          path: |
            /tmp/acc/
            !/tmp/acc/**/*.zip
          retention-days: 14

      - name: Acceptance summary
        if: always() && !inputs.persian_coexistence
        run: |
          {
            echo '## Real WordPress Acceptance — prefix `${{ matrix.prefix }}`'
            echo
            echo '- ZIP: `bin/build-release.sh` (official artifact)، نصب با `wp plugin install --activate`'
            echo "- DB prefix: \`${{ matrix.prefix }}\` — شمارش واقعی جداول: $(cat /tmp/acc/actual_count.txt 2>/dev/null || echo '?') — شمارش UI: $(cat /tmp/acc/ui_count.txt 2>/dev/null || echo '?')"
            echo '- Migration failure probe: `(fail-loud + not-recorded)` در لاگ Step «D3»'
            echo
            echo '```'
            tail -30 /tmp/acc/acceptance.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Evidence به‌صورت Commit Comment (لاگ خام Job در این محیط خوانده نمی‌شود —
      # الگوی «Post failures to PR» ریپو، این‌بار روی Commit تا در push-events هم کار کند)
      - name: Publish evidence as commit comment
        if: always() && !inputs.persian_coexistence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Real WP Acceptance — prefix \`${{ matrix.prefix }}\` (job: ${{ job.status }})"
            echo
            echo "- actual_table_count: \`$(cat /tmp/acc/actual_count.txt 2>/dev/null || echo '?')\` / ui_table_count: \`$(cat /tmp/acc/ui_count.txt 2>/dev/null || echo '?')\`"
            echo "- migration failure probe:"
            echo '```'
            cat /tmp/acc/migration-failure-probe.txt 2>/dev/null || echo '(probe اجرا نشد)'
            echo '```'
            echo '- browser acceptance:'
            echo '```'
            cat /tmp/acc/acceptance.log 2>/dev/null || echo '(مرحلهٔ مرورگر اجرا نشد)'
            echo '```'
            echo '- coexistence gate lines (every FAIL plus the named coexistence checks):'
            echo '```'
            grep -E '^FAIL|coexistence\.|\.not_granted|no_woo_redirect' /tmp/acc/acceptance.log 2>/dev/null | head -60 || echo '(no coexistence/FAIL lines)'
            echo '```'
            echo '- public CPMS health failure diagnostics (only present if the gate failed):'
            echo '```'
            cat /tmp/acc/coexistence-health-failure.txt 2>/dev/null || echo '(health gate did not fail)'
            echo '```'
            echo '- standalone shell technical proof (Phase 9 Slice 3 — NON-PRODUCTION fixture):'
            echo '```'
            cat /tmp/acc/shell-proof.log 2>/dev/null || echo '(shell proof اجرا نشد)'
            echo '```'
            echo "- fixture users (login/roles) + membership rows: \`$(cat /tmp/acc/fixture-memberships.txt 2>/dev/null || echo '?')\`"
            echo '```'
            cat /tmp/acc/fixture-users.txt 2>/dev/null || echo '(fixture users ثبت نشد)'
            echo '```'
            echo '- login failures (structured evidence):'
            echo '```'
            cat /tmp/acc/logs/*-login.json 2>/dev/null || echo '(no login failure)'
            echo '```'
            echo '- sanitized PHP/WP/Apache final log-gate summary:'
            echo '```'
            cat /tmp/acc/log-gate-summary.txt 2>/dev/null || echo '(sanitized summary unavailable; gate remains authoritative)'
            echo '```'
            echo '- pinned pre-CPMS WordPress.org package install logs:'
            echo '```'
            for f in /tmp/acc/coexistence-install-*.log; do
              [ -f "$f" ] || continue
              echo "--- $(basename "$f") ---"
              tail -40 "$f"
            done
            echo '```'
            echo '- exact WooCommerce 10.3.8 WC_Admin source evidence (read from the pinned installed package):'
            echo '```'
            cat /tmp/acc/woocommerce-10.3.8-admin-access-source.txt 2>/dev/null || echo '(source inspection not reached)'
            echo '```'
            echo "artifacts: rwp-acceptance-${{ matrix.prefix }} (screenshots/logs/results.json)"
          } > /tmp/acc/evidence-comment.md
          gh api "repos/{owner}/{repo}/commits/$GITHUB_SHA/comments" -X POST -F body=@/tmp/acc/evidence-comment.md --jq '.id'
