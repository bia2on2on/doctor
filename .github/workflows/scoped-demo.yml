name: Scoped demo (static + real WordPress integration)

# Dedicated lane for the separate scoped demo mode on non-empty test sites.
# It does not weaken or replace the strict disposable-demo lane. The lane runs:
#   * static gates + the in-memory unit/security suites,
#   * a seeded NON-EMPTY, multi-Clinic WordPress acceptance run on MySQL 8 and
#     MariaDB 11.4.13 (baseline/audit/anchor/invisibility evidence),
#   * runtime safety drills (tamper, idempotent teardown, interrupted
#     provisioning and teardown, concurrency, cross-Clinic REST isolation,
#     SIGKILL recovery),
#   * Chromium: admin workflow, six independent logins and one real REST journey
#     per persona.
# Anything still not exercised is listed in the browser result `limitations`.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/scoped-demo.yml'
      - '.github/scripts/companion-isolation.py'
      - 'bin/build-demo-installer.sh'
      - 'tools/disposable-demo-installer/**'
      - 'tests/scoped-demo/**'
      - 'docs/scoped-demo/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/scoped-demo.yml'
      - '.github/scripts/companion-isolation.py'
      - 'bin/build-demo-installer.sh'
      - 'tools/disposable-demo-installer/**'
      - 'tests/scoped-demo/**'
      - 'docs/scoped-demo/**'

permissions:
  contents: read
  pull-requests: write

env:
  PHP_VERSION: '8.2'
  WP_VERSION: '7.1.3'
  WP_DIR: /home/runner/cpsd-wp
  WP_URL: http://localhost:8080
  DB_NAME: cpsd_demo
  ADMIN_USER: cpsd_admin
  COMPANION_DIR: tools/disposable-demo-installer

concurrency:
  group: cpsd-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    name: Static gates, unit tests and reproducible companion ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mysqli, curl, mbstring, xml, zip, gd, sodium, intl
          coverage: none

      - name: PHP syntax (every shipped and test file)
        run: |
          set -Eeuo pipefail
          FILES="$(git ls-files "$COMPANION_DIR" 'tests/scoped-demo/**' | grep -E '\.php$')"
          test -n "$FILES"
          for FILE in $FILES; do
            php -l "$FILE" >/dev/null
            echo "LINT_OK $FILE"
          done

      - name: Strict disposable unit/security suite (unchanged behavior)
        run: php "$COMPANION_DIR/tests/run-tests.php"

      - name: Scoped-mode unit/security suite
        run: php "$COMPANION_DIR/tests/scoped-run-tests.php"

      - name: Source ownership and safety contract
        run: python3 -m unittest discover -s tests/scoped-demo -p 'test_*.py' -v

      - name: Companion compatibility gate (schema/table/ownership contract)
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests/companion-compat -p 'test_*.py'
          python3 .github/scripts/companion-compat/evaluate.py --root . --gate compatibility

      - name: Workflow contract tests
        run: python3 -m unittest discover -s .github/workflows -p 'test_workflow_contracts.py' -v

      - name: Companion/production isolation (fail closed on mixed changes)
        run: |
          set -Eeuo pipefail
          BASE="$(git rev-parse "${{ github.event.pull_request.base.sha || 'origin/main' }}")"
          git diff --name-only "$BASE" HEAD > /tmp/cpsd-changed.txt
          python3 "$GITHUB_WORKSPACE/.github/scripts/companion-isolation.py" \
            --changed-files /tmp/cpsd-changed.txt

      - name: Build companion ZIP twice and prove reproducibility + content
        run: |
          set -Eeuo pipefail
          OUT_DIR=/tmp/cpsd-build-1 bash bin/build-demo-installer.sh | tee /tmp/cpsd-build-1.log
          OUT_DIR=/tmp/cpsd-build-2 bash bin/build-demo-installer.sh >/tmp/cpsd-build-2.log
          ZIP1=/tmp/cpsd-build-1/cpms-disposable-demo-1.0.0.zip
          ZIP2=/tmp/cpsd-build-2/cpms-disposable-demo-1.0.0.zip
          SHA1="$(sha256sum "$ZIP1" | cut -d' ' -f1)"
          SHA2="$(sha256sum "$ZIP2" | cut -d' ' -f1)"
          test "$SHA1" = "$SHA2"
          test "$(unzip -Z1 "$ZIP1" | cut -d/ -f1 | sort -u)" = 'cpms-disposable-demo'
          if unzip -Z1 "$ZIP1" | grep -Eq '^(clinic-practice-management/|tests/|docs/|\.github/|bin/)'; then
            echo 'FAIL: repository paths inside companion ZIP' >&2; exit 1
          fi
          unzip -Z1 "$ZIP1" | grep -q 'cpms-disposable-demo/includes/class-cpms-demo-scoped-manifest.php'
          unzip -Z1 "$ZIP1" | grep -q 'cpms-disposable-demo/includes/class-cpms-demo-scoped-admin.php'
          if unzip -Z1 "$ZIP1" | grep -q 'ClinicCore'; then
            echo 'FAIL: production sources packaged' >&2; exit 1
          fi
          unzip -p "$ZIP1" cpms-disposable-demo/cpms-disposable-demo.php | head -20 | grep -q 'Plugin Name:'
          unzip -p "$ZIP1" cpms-disposable-demo/cpms-disposable-demo.php | grep -q 'Requires Plugins:  clinic-practice-management'
          python3 - "$ZIP1" <<'PY'
          import hashlib, json, sys, zipfile
          path = sys.argv[1]
          with zipfile.ZipFile(path) as archive:
              names = archive.namelist()
              bad = archive.testzip()
          proof = {
              "file": path.rsplit('/', 1)[-1],
              "bytes": len(open(path, 'rb').read()),
              "sha256": hashlib.sha256(open(path, 'rb').read()).hexdigest(),
              "entries": len(names),
              "zip_integrity": "ok" if bad is None else f"corrupt:{bad}",
          }
          json.dump(proof, open('/tmp/cpsd-installer-proof.json', 'w'), indent=2)
          print(json.dumps(proof))
          PY
          cp "$ZIP1" /tmp/cpms-disposable-demo-1.0.0.zip

      - uses: actions/upload-artifact@v4
        with:
          name: cpsd-static-evidence
          path: |
            /tmp/cpsd-installer-proof.json
            /tmp/cpsd-build-1.log
            /tmp/cpms-disposable-demo-1.0.0.zip
          if-no-files-found: error
          retention-days: 30

  real-wordpress:
    name: Real WordPress integration (${{ matrix.db_name }})
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - db_name: mysql-8
            db_image: mysql:8
            health_cmd: mysqladmin ping -h 127.0.0.1 -uroot -proot
          - db_name: mariadb-11.4.13
            db_image: mariadb:11.4.13
            health_cmd: healthcheck.sh --connect --innodb_initialized
    services:
      mysql:
        image: ${{ matrix.db_image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health_cmd }}"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mysqli, curl, mbstring, xml, zip, gd, sodium, intl
          coverage: none

      - name: Tooling (checksum-verified WP-CLI + mysql client)
        uses: ./.github/actions/wp-stack-tooling
        with:
          apt-packages: mysql-client
          apt-log-dir: /tmp/cpsd-ci

      - name: Build production CPMS ZIP
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/cpsd-ci
          composer install --no-interaction --no-progress --working-dir=clinic-practice-management --no-dev >/tmp/cpsd-ci/composer.log 2>&1
          bash clinic-practice-management/bin/build-release.sh | tee /tmp/cpsd-ci/release-build.log
          ZIP="$(find clinic-practice-management/dist -maxdepth 1 -name 'clinic-practice-management-*.zip' -print -quit)"
          test -n "$ZIP"
          echo "CPMS_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Clean WordPress + private storage
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/cpsd-ci /tmp/cpsd-private
          curl -fsS "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" -o /tmp/wp.tar.gz
          tar -xzf /tmp/wp.tar.gz -C /tmp
          mv /tmp/wordpress "$WP_DIR"
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "CREATE DATABASE $DB_NAME CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          cd "$WP_DIR"
          wp config create --dbname="$DB_NAME" --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --dbprefix='wp_' --skip-salts --allow-root
          wp config shuffle-salts --allow-root
          wp config set DISABLE_WP_CRON true --raw --allow-root
          wp config set WP_DEBUG true --raw --allow-root
          wp config set WP_DEBUG_LOG true --raw --allow-root
          wp config set WP_DEBUG_DISPLAY false --raw --allow-root
          chmod 0777 /tmp/cpsd-private
          wp config set CPMS_PRIVATE_STORAGE_DIR /tmp/cpsd-private --type=constant --allow-root
          ADMIN_PASS="$(python3 -c 'import secrets; print(secrets.token_hex(24))')"
          wp core install --url="$WP_URL" --title="CPSD Acceptance" --admin_user="$ADMIN_USER" --admin_password="$ADMIN_PASS" --admin_email=admin@cpsd.invalid --skip-email --allow-root
          echo "ADMIN_PASS=$ADMIN_PASS" >> "$GITHUB_ENV"
          echo "WP_ADMIN_CREATED=1"

      - name: Activate CPMS and companion
        run: |
          set -Eeuo pipefail
          wp plugin install "$GITHUB_WORKSPACE/$CPMS_ZIP" --activate --path="$WP_DIR" --allow-root
          wp plugin is-active clinic-practice-management --path="$WP_DIR" --allow-root
          SCHEMA="$(wp eval 'echo \ClinicCore\Bootstrap\App::migrations()->currentVersion();' --path="$WP_DIR" --allow-root)"
          test "$SCHEMA" = '2026_10_27_0030'
          echo "SCHEMA=$SCHEMA"
          OUT_DIR=/tmp/cpsd-ci bash "$GITHUB_WORKSPACE/bin/build-demo-installer.sh" | tee /tmp/cpsd-ci/companion-build.log
          wp plugin install /tmp/cpsd-ci/cpms-disposable-demo-1.0.0.zip --activate --path="$WP_DIR" --allow-root
          wp plugin is-active cpms-disposable-demo --path="$WP_DIR" --allow-root

      - name: Scoped integration on seeded non-empty site
        run: |
          set -Eeuo pipefail
          wp eval-file "$GITHUB_WORKSPACE/$COMPANION_DIR/tests/scoped-integration.php" \
            --use-include --path="$WP_DIR" --allow-root --user="$ADMIN_USER" \
            | tee /tmp/cpsd-ci/scoped-integration.json
          python3 - <<'PY'
          import json, sys
          raw = open('/tmp/cpsd-ci/scoped-integration.json', encoding='utf-8').read().strip().splitlines()[-1]
          data = json.loads(raw)
          print('SCOPED_INTEGRATION_CHECKS=' + str(len(data.get('checks', []))))
          print('SCOPED_INTEGRATION_OK=' + str(bool(data.get('ok'))))
          if not data.get('ok'):
              print(data.get('error', 'unknown error'), file=sys.stderr)
              sys.exit(1)
          PY

      # TEMPORARY DIAGNOSTIC (to be removed): the scoped report is published as
      # a JSON artifact, which is not readable from here, so a failing check
      # would otherwise be undiagnosable. Only failing check labels and the
      # error string are published.
      - name: Diagnostic — publish scoped integration failure (temporary)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          PR="${{ github.event.pull_request.number }}"
          FILE=/tmp/cpsd-ci/scoped-integration.json
          [ -f "$FILE" ] || { echo 'no scoped report'; exit 0; }
          {
            echo '### Scoped integration failure (temporary diagnostic)'
            echo '```'
            tail -1 "$FILE" | jq -r '"ok=\(.ok) error=\(.error // "")", (.checks[]? | select(.ok == false) | tostring)' | head -40 || tail -5 "$FILE"
            echo '```'
          } > /tmp/cpsd-ci/diag.md || true
          if [ -n "$PR" ] && [ -s /tmp/cpsd-ci/diag.md ]; then gh pr comment "$PR" --body-file /tmp/cpsd-ci/diag.md || true; fi

      - name: Scoped runtime safety drills (tamper, interruption, concurrency, isolation)
        run: |
          set -Eeuo pipefail
          wp eval-file "$GITHUB_WORKSPACE/$COMPANION_DIR/tests/scoped-recovery.php" \
            --use-include --path="$WP_DIR" --allow-root --user="$ADMIN_USER" \
            | tee /tmp/cpsd-ci/scoped-recovery.json
          python3 - <<'PY'
          import json, sys
          raw = open('/tmp/cpsd-ci/scoped-recovery.json', encoding='utf-8').read().strip().splitlines()[-1]
          data = json.loads(raw)
          print('SCOPED_RECOVERY_CHECKS=' + str(len(data.get('checks', []))))
          print('SCOPED_RECOVERY_OK=' + str(bool(data.get('ok'))))
          for line in data.get('checks', []):
              print('  ' + line)
          print('SCOPED_RECOVERY_EVIDENCE=' + json.dumps(data.get('evidence', {}), ensure_ascii=False))
          if not data.get('ok'):
              print(data.get('error', 'unknown error'), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Playwright Chromium (pinned)
        uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium

      - name: Start PHP built-in WordPress server
        run: |
          set -Eeuo pipefail
          nohup php -S 0.0.0.0:8080 -t "$WP_DIR" > /tmp/cpsd-ci/php-server.log 2>&1 &
          echo $! > /tmp/cpsd-ci/php-server.pid
          for i in $(seq 1 30); do
            if curl -fsS "$WP_URL/wp-login.php" >/dev/null 2>&1; then
              echo "PHP_SERVER_READY=1"
              exit 0
            fi
            sleep 1
          done
          tail -50 /tmp/cpsd-ci/php-server.log || true
          echo 'FAIL: PHP built-in server did not become ready' >&2
          exit 1

      - name: Chromium scoped admin workflow (provision phase)
        env:
          BASE: ${{ env.WP_URL }}
          ADMIN_USER: ${{ env.ADMIN_USER }}
          ADMIN_PASS: ${{ env.ADMIN_PASS }}
          CPSD_EVIDENCE_DIR: /tmp/cpsd-ci/browser
        run: |
          set -Eeuo pipefail
          python3 tests/scoped-demo/browser_scoped.py provision | tee /tmp/cpsd-ci/browser-provision.log

      - name: Export persona journey identifiers (read-only)
        run: |
          set -Eeuo pipefail
          wp eval-file "$GITHUB_WORKSPACE/tests/scoped-demo/persona-targets.php" \
            --path="$WP_DIR" --allow-root --user="$ADMIN_USER" \
            | tail -1 > /tmp/cpsd-ci/browser/persona-targets.json
          python3 - <<'PY'
          import json, sys
          data = json.loads(open('/tmp/cpsd-ci/browser/persona-targets.json', encoding='utf-8').read())
          print('PERSONA_TARGETS_OK=' + str(bool(data.get('ok'))))
          print('PERSONA_TARGETS=' + json.dumps(data, ensure_ascii=False))
          if not data.get('ok'):
              sys.exit(1)
          PY

      - name: Tamper the sealed manifest out of band (PHP side)
        env:
          CPSD_TAMPER_MODE: tamper
          CPSD_TAMPER_FILE: /tmp/cpsd-ci/manifest-pristine.json
        run: |
          set -Eeuo pipefail
          wp eval-file "$GITHUB_WORKSPACE/tests/scoped-demo/tamper-manifest.php" \
            --path="$WP_DIR" --allow-root --user="$ADMIN_USER" \
            | tee /tmp/cpsd-ci/scoped-tamper.json
          python3 - <<'PY'
          import json, sys
          raw = open('/tmp/cpsd-ci/scoped-tamper.json', encoding='utf-8').read().strip().splitlines()[-1]
          data = json.loads(raw)
          print('SCOPED_TAMPER_OK=' + str(bool(data.get('ok'))))
          print('SCOPED_TAMPER=' + json.dumps(data, ensure_ascii=False))
          if not data.get('ok'):
              print(data.get('error', 'unknown error'), file=sys.stderr)
              sys.exit(1)
          if data.get('load_refused') is not True:
              print('FAIL the tampered manifest was not refused on load', file=sys.stderr)
              sys.exit(1)
          PY

      - name: Chromium scoped admin refuses the tampered manifest (tamper phase)
        env:
          BASE: ${{ env.WP_URL }}
          ADMIN_USER: ${{ env.ADMIN_USER }}
          ADMIN_PASS: ${{ env.ADMIN_PASS }}
          CPSD_EVIDENCE_DIR: /tmp/cpsd-ci/browser
        run: |
          set -Eeuo pipefail
          python3 tests/scoped-demo/browser_scoped.py tamper | tee /tmp/cpsd-ci/browser-tamper.log

      - name: Restore the sealed manifest and re-prove the fixture is intact
        env:
          CPSD_TAMPER_MODE: restore
          CPSD_TAMPER_FILE: /tmp/cpsd-ci/manifest-pristine.json
        run: |
          set -Eeuo pipefail
          wp eval-file "$GITHUB_WORKSPACE/tests/scoped-demo/tamper-manifest.php" \
            --path="$WP_DIR" --allow-root --user="$ADMIN_USER" \
            | tee /tmp/cpsd-ci/scoped-tamper-restore.json
          python3 - <<'PY'
          import json, sys
          raw = open('/tmp/cpsd-ci/scoped-tamper-restore.json', encoding='utf-8').read().strip().splitlines()[-1]
          data = json.loads(raw)
          print('SCOPED_TAMPER_RESTORE_OK=' + str(bool(data.get('ok'))))
          print('SCOPED_TAMPER_RESTORE=' + json.dumps(data, ensure_ascii=False))
          if not data.get('ok') or data.get('preview_ok') is not True or data.get('fixture_clinic_present') is not True:
              print(data.get('error', 'restore did not re-prove the fixture'), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Chromium six persona journeys + authorized teardown (journeys phase)
        env:
          BASE: ${{ env.WP_URL }}
          ADMIN_USER: ${{ env.ADMIN_USER }}
          ADMIN_PASS: ${{ env.ADMIN_PASS }}
          CPSD_EVIDENCE_DIR: /tmp/cpsd-ci/browser
          CPSD_TARGETS_FILE: /tmp/cpsd-ci/browser/persona-targets.json
        run: |
          set -Eeuo pipefail
          python3 tests/scoped-demo/browser_scoped.py journeys | tee /tmp/cpsd-ci/browser.log
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          ok = True
          for phase in ('provision', 'tamper', 'journeys'):
              path = Path(f'/tmp/cpsd-ci/browser/browser-result-{phase}.json')
              if not path.exists():
                  print(f'FAIL missing browser result for phase {phase}', file=sys.stderr)
                  sys.exit(1)
              data = json.loads(path.read_text(encoding='utf-8'))
              print(f'CPSD_BROWSER_{phase.upper()}_CHECKS=' + str(len(data.get('checks', []))))
              print(f'CPSD_BROWSER_{phase.upper()}_OK=' + str(bool(data.get('ok'))))
              for item in data.get('checks', []):
                  print('  ' + ('PASS ' if item.get('ok') else 'FAIL ') + str(item.get('name')) + ' — ' + str(item.get('detail', '')))
              if not data.get('ok'):
                  print(data.get('error', f'phase {phase} failed'), file=sys.stderr)
                  ok = False
          if not ok:
              sys.exit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpsd-integration-${{ matrix.db_name }}-${{ github.run_id }}
          path: |
            /tmp/cpsd-ci/scoped-integration.json
            /tmp/cpsd-ci/scoped-recovery.json
            /tmp/cpsd-ci/scoped-tamper.json
            /tmp/cpsd-ci/scoped-tamper-restore.json
            /tmp/cpsd-ci/browser-tamper.log
            /tmp/cpsd-ci/browser-provision.log
            /tmp/cpsd-ci/browser.log
            /tmp/cpsd-ci/browser/persona-targets.json
            /tmp/cpsd-ci/browser/persona-credentials.json
            /tmp/cpsd-ci/browser/browser-result.json
            /tmp/cpsd-ci/browser/browser-result-*.json
            /tmp/cpsd-ci/browser/*.png
            /tmp/cpsd-ci/browser/no-config-*.html
            /tmp/cpsd-ci/companion-build.log
            /tmp/cpsd-ci/release-build.log
            /tmp/cpsd-ci/php-server.log
          if-no-files-found: warn
          retention-days: 30
