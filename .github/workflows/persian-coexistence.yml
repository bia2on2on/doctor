name: Persian five-plugin coexistence (Phase 18)

# Six independent pinned groups, one workflow. Each job is a separate runner,
# WordPress tree, MySQL service/database, evidence root and artifact; no result
# is a union or substitute for another. The accepted 5-, 2- and 10-plugin jobs
# and pins remain unchanged; three final scenarios are additive.
#   coexistence                         -> accepted persian-five, unchanged
#   coexistence-security-authentication -> accepted Wordfence + Really Simple SSL, unchanged
#   coexistence-combined-ten            -> accepted ten-plugin group, unchanged
#   coexistence-persian-woocommerce-diagnosis -> CPMS-free permission diagnosis
#   coexistence-persian-woocommerce-sms  -> SMS + WooCommerce, then CPMS only after healthy A
#   coexistence-combined-nineteen       -> all 19 authoritative free-plugin pins together

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  coexistence:
    # Same checkout, ZIP builder, clean WP, migrations, role/browser/booking
    # harness. The input narrows the matrix and adds an A-before-B interlock.
    uses: ./.github/workflows/real-wp-acceptance.yml
    permissions:
      contents: write
      actions: read
    with:
      persian_coexistence: true

  coexistence-security-authentication:
    # Same reusable harness; only the pinned group differs (see run.py GROUPS).
    uses: ./.github/workflows/real-wp-acceptance.yml
    permissions:
      contents: write
      actions: read
    with:
      persian_coexistence: true
      coexistence_group: security-authentication

  coexistence-combined-ten:
    # One combined scenario: the ten approved plugins are installed into the same
    # clean fa_IR WordPress and activated together. Stage A measures that group
    # with CPMS absent; the existing Stage A/B interlock decides whether Stage B
    # (CPMS installed after all ten) runs at all. Verdict is not a union of the
    # five-plugin or security-group results, and workflow green is not PASS.
    uses: ./.github/workflows/real-wp-acceptance.yml
    permissions:
      contents: write
      actions: read
    with:
      persian_coexistence: true
      coexistence_group: combined-ten

  coexistence-persian-woocommerce-diagnosis:
    # CPMS is prohibited for this standalone activation/permission diagnosis.
    # The canonical environment is preserved; any permission contrast runs only
    # in a separately cloned disposable WordPress/database.
    uses: ./.github/workflows/real-wp-acceptance.yml
    permissions:
      contents: write
      actions: read
    with:
      persian_coexistence: true
      coexistence_group: persian-woocommerce-diagnosis
      coexistence_stage_b: false

  coexistence-persian-woocommerce-sms:
    # Clean pair baseline first. The existing Stage A/B interlock allows CPMS
    # only when all material Stage A checks are healthy and complete.
    uses: ./.github/workflows/real-wp-acceptance.yml
    permissions:
      contents: write
      actions: read
    with:
      persian_coexistence: true
      coexistence_group: persian-woocommerce-sms
      coexistence_stage_b: true

  coexistence-combined-nineteen:
    # Exact authoritative free-plugin subject set, simultaneously active in one
    # clean environment. Known pre-CPMS failures remain installed and visible;
    # Stage B is reachable only through the reusable fail-closed interlock.
    uses: ./.github/workflows/real-wp-acceptance.yml
    permissions:
      contents: write
      actions: read
    with:
      persian_coexistence: true
      coexistence_group: combined-nineteen
      coexistence_stage_b: true
