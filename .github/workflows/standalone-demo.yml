name: Standalone demo (real WordPress, no production plugin)

# Mission H lane. It answers ONE question no other lane answers:
#
#   can the Product Owner install `cpms-disposable-demo-1.0.0.zip` on a
#   NON-EMPTY test site that does NOT have the production CPMS plugin, run the
#   real product, and remove it again without losing anything?
#
# The other demo lanes install production CPMS and then the companion build.
# This one installs the STANDALONE build only, on a seeded non-empty site, on
# both database engines, and proves:
#
#   * the embedded production core boots (constants, classes, migration head,
#     REST namespace) with no production plugin installed;
#   * a real scoped demo provisions real clinical/financial data through the
#     production services, and every pre-existing user/post/comment/media row is
#     byte-identical afterwards;
#   * activating the production plugin alongside is DETECTED with a Persian
#     fault and never a fatal;
#   * deactivating and deleting the demo destroys nothing (no dropped tables, no
#     deleted users, no deleted content);
#   * the same package passes the real Chromium journeys the scoped lane runs.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/standalone-demo.yml'
      - '.github/scripts/companion-isolation.py'
      - 'bin/build-demo-installer.sh'
      - 'tools/disposable-demo-installer/**'
      - 'tests/scoped-demo/**'
      - 'docs/scoped-demo/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/standalone-demo.yml'
      - '.github/scripts/companion-isolation.py'
      - 'bin/build-demo-installer.sh'
      - 'tools/disposable-demo-installer/**'
      - 'tests/scoped-demo/**'
      - 'docs/scoped-demo/**'

permissions:
  contents: read
  pull-requests: write

env:
  PHP_VERSION: '8.2'
  WP_VERSION: '7.1.3'
  WP_DIR: /home/runner/cpsa-wp
  WP_URL: http://localhost:8080
  DB_NAME: cpsa_demo
  ADMIN_USER: cpsa_admin
  COMPANION_DIR: tools/disposable-demo-installer

concurrency:
  group: cpsa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    name: Standalone package contract and reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mysqli, curl, mbstring, xml, zip, gd, sodium, intl
          coverage: none

      - name: PHP syntax (every shipped file, both builds)
        run: |
          set -Eeuo pipefail
          FILES="$(git ls-files "$COMPANION_DIR" 'tests/scoped-demo/**' | grep -E '\.php$')"
          test -n "$FILES"
          for FILE in $FILES; do
            php -l "$FILE" >/dev/null
            echo "LINT_OK $FILE"
          done

      - name: Standalone package + security-finding contracts
        run: python3 -m unittest tests.scoped-demo.test_standalone_package -v

      - name: Build BOTH packages and prove reproducibility + contents
        run: |
          set -Eeuo pipefail
          OUT_DIR=/tmp/cpsa-1 bash bin/build-demo-installer.sh | tee /tmp/cpsa-build.log
          OUT_DIR=/tmp/cpsa-2 bash bin/build-demo-installer.sh >/dev/null
          ZIP1=/tmp/cpsa-1/cpms-disposable-demo-1.0.0.zip
          ZIP2=/tmp/cpsa-2/cpms-disposable-demo-1.0.0.zip
          test "$(sha256sum "$ZIP1" | cut -d' ' -f1)" = "$(sha256sum "$ZIP2" | cut -d' ' -f1)"
          test "$(unzip -Z1 "$ZIP1" | cut -d/ -f1 | sort -u)" = 'cpms-disposable-demo'
          if unzip -Z1 "$ZIP1" | grep -Eq '(^|/)(tests|docs|\.github|bin|node_modules)/|phpunit|composer\.(json|lock)'; then
            echo 'FAIL: development material inside the standalone ZIP' >&2; exit 1
          fi
          if unzip -p "$ZIP1" cpms-disposable-demo/cpms-disposable-demo.php | grep -q 'Requires Plugins:'; then
            echo 'FAIL: the standalone package must not require the production plugin' >&2; exit 1
          fi
          unzip -Z1 "$ZIP1" | grep -qx 'cpms-disposable-demo/core/clinic-practice-management.php'
          unzip -Z1 "$ZIP1" | grep -q 'cpms-disposable-demo/core/src/Bootstrap/App.php'
          unzip -Z1 "$ZIP1" | grep -q 'cpms-disposable-demo/core/templates/'
          test "$(unzip -Z1 "$ZIP1" | grep -c '^cpms-disposable-demo/core/src/')" -gt 250
          OUT_DIR=/tmp/cpsa-c bash bin/build-demo-installer.sh --companion >/dev/null
          if unzip -Z1 /tmp/cpsa-c/cpms-disposable-demo-companion-1.0.0.zip | grep -q '/core/'; then
            echo 'FAIL: the companion build must not embed the core' >&2; exit 1
          fi
          python3 - "$ZIP1" <<'PY'
          import hashlib, json, sys, zipfile
          path = sys.argv[1]
          data = open(path, 'rb').read()
          with zipfile.ZipFile(path) as archive:
              names = archive.namelist()
              bad = archive.testzip()
          proof = {
              "file": path.rsplit('/', 1)[-1],
              "bytes": len(data),
              "sha256": hashlib.sha256(data).hexdigest(),
              "entries": len(names),
              "zip_integrity": "ok" if bad is None else f"corrupt:{bad}",
          }
          json.dump(proof, open('/tmp/cpsa-installer-proof.json', 'w'), indent=2)
          print("STANDALONE_PACKAGE=" + json.dumps(proof))
          PY
          cp "$ZIP1" /tmp/cpms-disposable-demo-1.0.0.zip

      - uses: actions/upload-artifact@v4
        with:
          name: cpms-disposable-demo-standalone
          path: |
            /tmp/cpms-disposable-demo-1.0.0.zip
            /tmp/cpsa-installer-proof.json
            /tmp/cpsa-build.log
          if-no-files-found: error
          retention-days: 30

  real-wordpress:
    name: Standalone on a non-empty site (${{ matrix.db_name }})
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - db_name: mysql-8
            db_image: mysql:8
            health_cmd: mysqladmin ping -h 127.0.0.1 -uroot -proot
          - db_name: mariadb-11.4.13
            db_image: mariadb:11.4.13
            health_cmd: healthcheck.sh --connect --innodb_initialized
    services:
      mysql:
        image: ${{ matrix.db_image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health_cmd }}"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mysqli, curl, mbstring, xml, zip, gd, sodium, intl
          coverage: none

      - name: Tooling (checksum-verified WP-CLI + mysql client)
        uses: ./.github/actions/wp-stack-tooling
        with:
          apt-packages: mysql-client
          apt-log-dir: /tmp/cpsa-ci

      - name: Clean WordPress (no production CPMS anywhere)
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/cpsa-ci /tmp/cpsa-private
          curl -fsS "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" -o /tmp/wp.tar.gz
          tar -xzf /tmp/wp.tar.gz -C /tmp
          mv /tmp/wordpress "$WP_DIR"
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "CREATE DATABASE $DB_NAME CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          cd "$WP_DIR"
          wp config create --dbname="$DB_NAME" --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --dbprefix='wp_' --skip-salts --allow-root
          wp config shuffle-salts --allow-root
          wp config set DISABLE_WP_CRON true --raw --allow-root
          wp config set WP_DEBUG true --raw --allow-root
          wp config set WP_DEBUG_LOG true --raw --allow-root
          wp config set WP_DEBUG_DISPLAY false --raw --allow-root
          chmod 0777 /tmp/cpsa-private
          wp config set CPMS_PRIVATE_STORAGE_DIR /tmp/cpsa-private --type=constant --allow-root
          ADMIN_PASS="$(python3 -c 'import secrets; print(secrets.token_hex(24))')"
          wp core install --url="$WP_URL" --title="CPSA Standalone" --admin_user="$ADMIN_USER" --admin_password="$ADMIN_PASS" --admin_email=admin@cpsa.invalid --skip-email --allow-root
          echo "ADMIN_PASS=$ADMIN_PASS" >> "$GITHUB_ENV"
          test -z "$(wp plugin list --field=name --path="$WP_DIR" --allow-root | grep -c clinic-practice-management || true)"

      - name: Install ONLY the standalone demo package from a real ZIP
        run: |
          set -Eeuo pipefail
          OUT_DIR=/tmp/cpsa-ci bash "$GITHUB_WORKSPACE/bin/build-demo-installer.sh" | tee /tmp/cpsa-ci/build.log
          wp plugin install /tmp/cpsa-ci/cpms-disposable-demo-1.0.0.zip --activate --path="$WP_DIR" --allow-root
          wp plugin is-active cpms-disposable-demo --path="$WP_DIR" --allow-root
          # The production plugin is absent, and must stay absent.
          if wp plugin list --field=name --path="$WP_DIR" --allow-root | grep -qx 'clinic-practice-management'; then
            echo 'FAIL: production CPMS was installed' >&2; exit 1
          fi
          # Exactly one plugin header was installed, one plugin is active for the demo.
          wp plugin list --status=active --field=name --path="$WP_DIR" --allow-root | sort | tr '\n' ' '
          echo
          # The embedded core booted: real constants, real classes, real schema.
          wp eval 'echo defined("CPMS_VERSION") ? CPMS_VERSION : "MISSING";' --path="$WP_DIR" --allow-root | tee /tmp/cpsa-ci/core-version.txt
          grep -qv MISSING /tmp/cpsa-ci/core-version.txt
          wp eval 'echo \ClinicCore\Bootstrap\App::migrations()->currentVersion();' --path="$WP_DIR" --allow-root | tee /tmp/cpsa-ci/schema.txt
          test -n "$(cat /tmp/cpsa-ci/schema.txt)"

      - name: Seed a genuinely non-empty site and record its digest
        run: |
          set -Eeuo pipefail
          CPSD_SA_MODE=seed CPSD_SA_EVIDENCE=/tmp/cpsa-ci/seed.json \
            wp eval-file "$GITHUB_WORKSPACE/tests/scoped-demo/standalone-acceptance.php" \
            --use-include --path="$WP_DIR" --allow-root --user="$ADMIN_USER" \
            | tee /tmp/cpsa-ci/seed.jsonl
          python3 - <<'PY'
          import json, sys
          data = json.loads(open('/tmp/cpsa-ci/seed.jsonl', encoding='utf-8').read().strip().splitlines()[-1])
          print('SEED_OK=' + str(bool(data.get('ok'))))
          print('SEED=' + json.dumps(data.get('evidence', {}), ensure_ascii=False))
          if not data.get('ok'):
              for line in [c for c in data.get('checks', []) if str(c).startswith('FAIL')] or [str(data.get('error'))]:
                  print('::error title=CPSA_SEED::' + str(line).replace('%', '%25').replace('\n', ' '))
              sys.exit(1)
          import shutil; shutil.copy('/tmp/cpsa-ci/seed.jsonl', '/tmp/cpsa-ci/seed-evidence.jsonl')
          PY

      - name: A compatible third-party plugin stays active throughout
        run: |
          set -Eeuo pipefail
          wp plugin install classic-editor --activate --path="$WP_DIR" --allow-root
          wp plugin is-active classic-editor --path="$WP_DIR" --allow-root
          wp post list --post_type=page --field=ID --path="$WP_DIR" --allow-root | head -3

      - name: Enable and provision the scoped demo through the real services
        run: |
          set -Eeuo pipefail
          wp eval-file "$GITHUB_WORKSPACE/$COMPANION_DIR/tests/scoped-integration.php" \
            --use-include --path="$WP_DIR" --allow-root --user="$ADMIN_USER" \
            | tee /tmp/cpsa-ci/scoped-integration.json
          python3 - <<'PY'
          import json, sys
          data = json.loads(open('/tmp/cpsa-ci/scoped-integration.json', encoding='utf-8').read().strip().splitlines()[-1])
          print('SCOPED_INTEGRATION_OK=' + str(bool(data.get('ok'))))
          if not data.get('ok'):
              for line in [c for c in data.get('checks', []) if str(c).startswith('FAIL')] or [str(data.get('error'))]:
                  print('::error title=CPSA_INTEGRATION::' + str(line).replace('%', '%25').replace('\n', ' '))
              sys.exit(1)
          PY

      - name: Pre-existing WordPress data survives provisioning
        run: |
          set -Eeuo pipefail
          CPSD_SA_MODE=assert CPSD_SA_EVIDENCE=/tmp/cpsa-ci/seed.json \
            wp eval-file "$GITHUB_WORKSPACE/tests/scoped-demo/standalone-acceptance.php" \
            --use-include --path="$WP_DIR" --allow-root --user="$ADMIN_USER" \
            | tee /tmp/cpsa-ci/standalone-assert.json
          python3 - <<'PY'
          import json, sys
          data = json.loads(open('/tmp/cpsa-ci/standalone-assert.json', encoding='utf-8').read().strip().splitlines()[-1])
          print('STANDALONE_ASSERT_OK=' + str(bool(data.get('ok'))))
          for line in data.get('checks', []):
              print(line)
          if not data.get('ok'):
              for line in [c for c in data.get('checks', []) if str(c).startswith('FAIL')] or [str(data.get('error'))]:
                  print('::error title=CPSA_ASSERT::' + str(line).replace('%', '%25').replace('\n', ' '))
              sys.exit(1)
          PY

      - name: Deactivation and deletion destroy nothing
        run: |
          set -Eeuo pipefail
          wp plugin deactivate cpms-disposable-demo --path="$WP_DIR" --allow-root
          wp plugin delete cpms-disposable-demo --path="$WP_DIR" --allow-root
          test ! -d "$WP_DIR/wp-content/plugins/cpms-disposable-demo"
          CPSD_SA_MODE=after_delete CPSD_SA_EVIDENCE=/tmp/cpsa-ci/seed.json \
            wp eval-file "$GITHUB_WORKSPACE/tests/scoped-demo/standalone-acceptance.php" \
            --use-include --path="$WP_DIR" --allow-root --user="$ADMIN_USER" \
            | tee /tmp/cpsa-ci/standalone-after-delete.json
          python3 - <<'PY'
          import json, sys
          data = json.loads(open('/tmp/cpsa-ci/standalone-after-delete.json', encoding='utf-8').read().strip().splitlines()[-1])
          print('AFTER_DELETE_OK=' + str(bool(data.get('ok'))))
          for line in data.get('checks', []):
              print(line)
          if not data.get('ok'):
              for line in [c for c in data.get('checks', []) if str(c).startswith('FAIL')] or [str(data.get('error'))]:
                  print('::error title=CPSA_AFTER_DELETE::' + str(line).replace('%', '%25').replace('\n', ' '))
              sys.exit(1)
          PY

      - name: Reinstall, then prove the production/demo conflict is refused
        run: |
          set -Eeuo pipefail
          wp plugin install /tmp/cpsa-ci/cpms-disposable-demo-1.0.0.zip --activate --path="$WP_DIR" --allow-root
          wp plugin is-active cpms-disposable-demo --path="$WP_DIR" --allow-root
          # Now install the production plugin alongside the standalone demo. This
          # is the two-core state the package must refuse, never fatal.
          composer install --no-interaction --no-progress --working-dir="$GITHUB_WORKSPACE/clinic-practice-management" --no-dev >/tmp/cpsa-ci/composer.log 2>&1
          bash "$GITHUB_WORKSPACE/clinic-practice-management/bin/build-release.sh" | tee /tmp/cpsa-ci/release-build.log
          CPMS_ZIP="$(find "$GITHUB_WORKSPACE/clinic-practice-management/dist" -maxdepth 1 -name 'clinic-practice-management-*.zip' -print -quit)"
          test -n "$CPMS_ZIP"
          wp plugin install "$CPMS_ZIP" --activate --path="$WP_DIR" --allow-root || true
          wp plugin is-active clinic-practice-management --path="$WP_DIR" --allow-root
          CPSD_SA_MODE=conflict CPSD_SA_EVIDENCE=/tmp/cpsa-ci/seed.json \
            wp eval-file "$GITHUB_WORKSPACE/tests/scoped-demo/standalone-acceptance.php" \
            --use-include --path="$WP_DIR" --allow-root --user="$ADMIN_USER" \
            | tee /tmp/cpsa-ci/standalone-conflict.json
          python3 - <<'PY'
          import json, sys
          data = json.loads(open('/tmp/cpsa-ci/standalone-conflict.json', encoding='utf-8').read().strip().splitlines()[-1])
          print('CONFLICT_OK=' + str(bool(data.get('ok'))))
          for line in data.get('checks', []):
              print(line)
          if not data.get('ok'):
              for line in [c for c in data.get('checks', []) if str(c).startswith('FAIL')] or [str(data.get('error'))]:
                  print('::error title=CPSA_CONFLICT::' + str(line).replace('%', '%25').replace('\n', ' '))
              sys.exit(1)
          PY
          # The demo page must still render: a conflict is a refusal, not a fatal.
          wp eval 'echo "ADMIN_PAGE_OK";' --path="$WP_DIR" --allow-root
          if grep -q 'PHP Fatal error' "$WP_DIR/wp-content/debug.log" 2>/dev/null; then
            echo 'FAIL: a PHP fatal error was logged' >&2; tail -40 "$WP_DIR/wp-content/debug.log" >&2; exit 1
          fi

      - name: Remove the production plugin again and re-prove the standalone build
        run: |
          set -Eeuo pipefail
          wp plugin deactivate clinic-practice-management --path="$WP_DIR" --allow-root
          wp plugin delete clinic-practice-management --path="$WP_DIR" --allow-root
          wp plugin is-active cpms-disposable-demo --path="$WP_DIR" --allow-root
          wp eval 'echo \CpmsDemo\Standalone::status()["fault"];' --path="$WP_DIR" --allow-root | tee /tmp/cpsa-ci/fault-after.txt
          test -z "$(cat /tmp/cpsa-ci/fault-after.txt)"
          wp eval 'echo defined("CPMS_VERSION") ? "CORE_OK" : "CORE_MISSING";' --path="$WP_DIR" --allow-root | grep -qx CORE_OK

      - name: Publish sanitized evidence (no credentials, no PHI)
        if: always()
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import glob, json, os
          out = {}
          for path in sorted(glob.glob('/tmp/cpsa-ci/*.json')) + sorted(glob.glob('/tmp/cpsa-ci/*.jsonl')):
              try:
                  text = open(path, encoding='utf-8').read().strip().splitlines()[-1]
                  data = json.loads(text)
              except Exception as exc:  # noqa: BLE001
                  continue
              data.pop('checks', None)
              out[os.path.basename(path)] = data
          json.dump(out, open('/tmp/cpsa-ci/summary.json', 'w'), ensure_ascii=False, indent=2)
          print(json.dumps(out, ensure_ascii=False)[:4000])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpsa-evidence-${{ matrix.db_name }}
          path: |
            /tmp/cpsa-ci/*.json
            /tmp/cpsa-ci/*.jsonl
            /tmp/cpsa-ci/*.txt
            /tmp/cpsa-ci/*.log
          if-no-files-found: warn
          retention-days: 30
