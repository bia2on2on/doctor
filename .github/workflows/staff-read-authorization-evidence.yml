name: Staff read authorization evidence (temporary)

on:
  push:
    branches: ['arena/01a0a629-doctor']

permissions:
  contents: write

defaults:
  run:
    working-directory: clinic-practice-management

jobs:
  focused-integration:
    name: Integration suite after StaffManagementPage correction
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      WP_TESTS_DIR: /tmp/wordpress-test-lib
      WP_CORE_DIR: /tmp/wordpress
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, mysqli, curl
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Run Unit suite
        run: php -d memory_limit=512M vendor/bin/phpunit --testsuite Unit
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress
      - name: Select PHPUnit 9.6 for WordPress test library
        run: composer require --dev phpunit/phpunit:^9.6 --no-interaction --no-progress --with-all-dependencies
      - name: Prepare WordPress test suite
        run: bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 6.7.2
      - name: Run relevant Integration suite
        run: |
          set +e
          set -o pipefail
          php -d memory_limit=1G vendor/bin/phpunit --no-configuration \
            --bootstrap tests/integration-bootstrap.php \
            tests/Integration 2>&1 | tee /tmp/staff-read-evidence.log
          echo "${PIPESTATUS[0]}" > /tmp/staff-read-evidence.rc
          exit 0
      - name: Publish exact output as commit evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Integration suite after StaffManagementPage correction"
            echo
            echo "- exact head: \`$GITHUB_SHA\`"
            echo '```'
            cat /tmp/staff-read-evidence.log
            echo '```'
          } > /tmp/staff-read-evidence.md
          gh api "repos/{owner}/{repo}/commits/$GITHUB_SHA/comments" \
            -X POST -F body=@/tmp/staff-read-evidence.md --jq '.html_url'
      - name: Enforce Integration result
        run: exit "$(cat /tmp/staff-read-evidence.rc)"
      - name: Install WPCS
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --dev wp-coding-standards/wpcs:^3.1 \
            --no-interaction --no-progress --with-all-dependencies
      - name: Run added-line WPCS gate for blocker correction
        env:
          WPCS_BASELINE: 7022aa225f03bc1751c9c15e52ed59a661a2c7f8
        run: |
          set +e
          set -o pipefail
          {
            git -C "$GITHUB_WORKSPACE" diff -U0 "${WPCS_BASELINE}"...HEAD -- \
              clinic-practice-management/src/Admin/StaffManagementPage.php \
              | awk -v f="src/Admin/StaffManagementPage.php" '
                /^@@ / {
                  match($0, /\+[0-9]+(,[0-9]+)?/);
                  s = substr($0, RSTART + 1, RLENGTH - 1);
                  split(s, a, ",");
                  start = a[1] + 0;
                  len = (a[2] == "" ? 1 : a[2] + 0);
                  for (i = 0; i < len; i++) printf "%s:%d\n", f, start + i;
                }
              ' | sort -u > /tmp/wpcs-added.txt
            set +e
            vendor/bin/phpcs --standard=phpcs.xml.dist --report=json \
              src/Admin/StaffManagementPage.php > /tmp/wpcs.json 2>/tmp/wpcs-stderr.log
            phpcs_rc=$?
            set -e
            if [ "$phpcs_rc" -ne 0 ] && [ ! -s /tmp/wpcs.json ]; then
              cat /tmp/wpcs-stderr.log
              exit "$phpcs_rc"
            fi
            python3 - <<'PY'
          import json
          import sys
          added = set(open('/tmp/wpcs-added.txt').read().split())
          raw = open('/tmp/wpcs.json').read()
          start = raw.find('{')
          if start < 0:
              print('WPCS JSON output missing')
              sys.exit(1)
          report = json.loads(raw[start:])
          found = []
          for path, data in report.get('files', {}).items():
              for message in data.get('messages', []):
                  key = f"{path}:{message['line']}"
                  if key in added:
                      found.append(
                          f"{key} [{message['type']}] {message['source']} — {message['message']}"
                      )
          if found:
              print('\n'.join(found))
              sys.exit(1)
          print(f"WPCS added-line gate: PASS ({len(added)} added production lines inspected)")
          PY
          } 2>&1 | tee /tmp/staff-wpcs.log
          echo "${PIPESTATUS[0]}" > /tmp/staff-wpcs.rc
          exit 0
      - name: Publish WPCS output as commit evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### StaffManagementPage WPCS evidence"
            echo
            echo "- exact head: \`$GITHUB_SHA\`"
            echo '```'
            cat /tmp/staff-wpcs.log
            echo '```'
          } > /tmp/staff-wpcs.md
          gh api "repos/{owner}/{repo}/commits/$GITHUB_SHA/comments" \
            -X POST -F body=@/tmp/staff-wpcs.md --jq '.html_url'
      - name: Enforce WPCS result
        run: exit "$(cat /tmp/staff-wpcs.rc)"
