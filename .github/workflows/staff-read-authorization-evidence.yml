name: Staff read authorization evidence (temporary)

on:
  push:
    branches: ['arena/01a0a629-doctor']

permissions:
  contents: write

defaults:
  run:
    working-directory: clinic-practice-management

jobs:
  focused-integration:
    name: Focused StaffManagementPage read authorization
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      WP_TESTS_DIR: /tmp/wordpress-test-lib
      WP_CORE_DIR: /tmp/wordpress
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, mysqli, curl
          coverage: none
      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          composer require --dev phpunit/phpunit:^9.6 --no-interaction --no-progress --with-all-dependencies
      - name: Prepare WordPress test suite
        run: bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 6.7.2
      - name: Run focused render-path coverage
        run: |
          set +e
          set -o pipefail
          php -d memory_limit=1G vendor/bin/phpunit --no-configuration \
            --bootstrap tests/integration-bootstrap.php \
            tests/Integration/StaffManagementAuthorizationTest.php 2>&1 | tee /tmp/staff-read-evidence.log
          echo "${PIPESTATUS[0]}" > /tmp/staff-read-evidence.rc
          exit 0
      - name: Publish exact output as commit evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### StaffManagementPage focused read authorization evidence"
            echo
            echo "- exact head: \`$GITHUB_SHA\`"
            echo '```'
            cat /tmp/staff-read-evidence.log
            echo '```'
          } > /tmp/staff-read-evidence.md
          gh api "repos/{owner}/{repo}/commits/$GITHUB_SHA/comments" \
            -X POST -F body=@/tmp/staff-read-evidence.md --jq '.html_url'
      - name: Enforce focused result
        run: exit "$(cat /tmp/staff-read-evidence.rc)"
