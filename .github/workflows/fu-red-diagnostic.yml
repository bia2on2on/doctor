name: FU Helper Diagnostic (focused RED/GREEN)

# TEST-ONLY evidence workflow — هیچ کد محصولی را اجرا/تغییر نمی‌دهد.
#
# job «focused»   : دو تست تشخیصی helper (انتخاب دقیق)
# job «fu-family» : دو متد محصولی هدف + همهٔ تست‌های مرتبط fu.reminder
#
# گارد: شمارش از روی گزارش JUnit انجام می‌شود (نه از روی متن خروجی)، چون
# PHPUnit در حالت موفقیت هیچ خط «Tests:» چاپ نمی‌کند (اشکال اندازه‌گیری‌شده در
# run 34832987240: تست‌ها «OK (2 tests, 31 assertions)» بودند ولی گارد متن،
# خلاصه را پیدا نکرد). اگر تعداد تست اجراشده دقیقاً برابر انتظار نباشد،
# job سبز نمی‌شود — پس «صفر تست» هرگز سبز دیده نمی‌شود.

on:
  push:
    branches: [arena/01a09f51-doctor]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: clinic-practice-management

jobs:
  focused:
    name: Focused helper diagnostic (2 tests)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      WP_TESTS_DIR: /tmp/wordpress-test-lib
      WP_CORE_DIR: /tmp/wordpress
      FOCUS_FILTER: 'FollowUpReminderLocationCalendarRedTest::testDiagnostic'
      EXPECTED_SELECTED: '2'
      LOG_TAG: 'helper-diagnostic'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, mysqli, pcntl, curl
          coverage: none

      - name: Install dependencies (PHPUnit 9.6 for WP test lib)
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          composer require --dev phpunit/phpunit:^9.6 --no-interaction --no-progress --with-all-dependencies

      - name: Prepare WordPress test suite
        run: bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 6.7.2

      - name: Run focused selection
        run: |
          set +e
          php -d memory_limit=1G vendor/bin/phpunit --no-configuration \
            --bootstrap tests/integration-bootstrap.php \
            --filter "$FOCUS_FILTER" \
            --log-junit /tmp/fu-junit.xml \
            tests/Integration 2>&1 | tee /tmp/fu.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > /tmp/fu.rc
          echo "phpunit_exit=$rc"
          exit 0

      - name: Selection + result guard (JUnit)
        if: always()
        run: |
          echo "--- PHPUnit summary lines ---"
          grep -E "^(Tests:|OK|FAILURES!|ERRORS!|No tests executed)" /tmp/fu.log || true
          if [ ! -s /tmp/fu-junit.xml ]; then
            echo "::error::Selection guard: JUnit report missing or empty — PHPUnit did not complete (empty selection, parse or bootstrap failure); refusing to report green"
            exit 1
          fi
          cat > /tmp/guard.py <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          expected = int(os.environ['EXPECTED_SELECTED'])
          root = ET.parse('/tmp/fu-junit.xml').getroot()
          rows = []
          for c in root.iter('testcase'):
              status = 'PASS'
              for child in c:
                  if child.tag in ('failure', 'error'):
                      status = child.tag.upper()
                  elif child.tag == 'skipped':
                      status = 'SKIPPED'
              rows.append(((c.get('classname') or '') + '::' + (c.get('name') or ''), status))
          rows.sort()
          print('executed_tests=%d (expected %d)' % (len(rows), expected))
          for name, status in rows:
              print('  [%s] %s' % (status, name))
          if len(rows) != expected:
              print('::error::Selection guard: expected exactly %d executed test(s), got %d — refusing to report green on an empty/incorrect selection' % (expected, len(rows)))
              sys.exit(1)
          print('Selection guard OK: exactly %d test(s) executed.' % expected)
          PY
          python3 /tmp/guard.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fu-${{ env.LOG_TAG }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/fu.log
            /tmp/fu.rc
            /tmp/fu-junit.xml
          if-no-files-found: error
          retention-days: 14

      - name: Post evidence to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### fu.reminder ${LOG_TAG} (run ${{ github.run_id }}, sha ${{ github.sha }})"
            echo '```'
            echo "--- SUMMARY ---"
            grep -E "^(Tests:|OK|FAILURES!|ERRORS!)" /tmp/fu.log | tail -n 4 || true
            echo "--- EXECUTED TESTS (from JUnit) ---"
            python3 - <<'PY' || echo '(junit unavailable)'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/fu-junit.xml').getroot()
          for c in sorted(root.iter('testcase'), key=lambda x: (x.get('classname') or '') + (x.get('name') or '')):
              st = 'PASS'
              for ch in c:
                  if ch.tag in ('failure', 'error'):
                      st = ch.tag.upper()
              print('[%s] %s::%s' % (st, c.get('classname'), c.get('name')))
          PY
            echo "--- FAILURE/ERROR DETAILS ---"
            awk '/^There (were|was) /{flag=1} flag' /tmp/fu.log | head -n 160
            echo '```'
          } > /tmp/fu-body.md
          cat /tmp/fu-body.md
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/fu-body.md || echo "::notice::PR comment failed (permissions?)"
          else
            echo "::notice::no pull_request number on this event — evidence kept in artifact only"
          fi

      - name: Propagate PHPUnit result
        if: always()
        run: |
          rc=$(cat /tmp/fu.rc 2>/dev/null || echo 1)
          echo "phpunit_exit=$rc"
          exit "$rc"

  fu-family:
    name: Target product tests + fu.reminder family (8 tests)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      WP_TESTS_DIR: /tmp/wordpress-test-lib
      WP_CORE_DIR: /tmp/wordpress
      # LocationCalendar(4: ۲ تشخیصی + ۲ محصولی) + M2Wiring(1) + Starvation(2)
      # + NotificationFlowTest::testFollowUpReminderJobMarksReminderSentAt(1) = ۸
      FOCUS_FILTER: 'FollowUpReminder'
      EXPECTED_SELECTED: '8'
      LOG_TAG: 'family'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, mysqli, pcntl, curl
          coverage: none

      - name: Install dependencies (PHPUnit 9.6 for WP test lib)
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          composer require --dev phpunit/phpunit:^9.6 --no-interaction --no-progress --with-all-dependencies

      - name: Prepare WordPress test suite
        run: bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 6.7.2

      - name: Run fu.reminder selection
        run: |
          set +e
          php -d memory_limit=1G vendor/bin/phpunit --no-configuration \
            --bootstrap tests/integration-bootstrap.php \
            --filter "$FOCUS_FILTER" \
            --log-junit /tmp/fu-junit.xml \
            tests/Integration 2>&1 | tee /tmp/fu.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > /tmp/fu.rc
          echo "phpunit_exit=$rc"
          exit 0

      - name: Selection + result guard (JUnit)
        if: always()
        run: |
          echo "--- PHPUnit summary lines ---"
          grep -E "^(Tests:|OK|FAILURES!|ERRORS!|No tests executed)" /tmp/fu.log || true
          if [ ! -s /tmp/fu-junit.xml ]; then
            echo "::error::Selection guard: JUnit report missing or empty — PHPUnit did not complete; refusing to report green"
            exit 1
          fi
          cat > /tmp/guard.py <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          expected = int(os.environ['EXPECTED_SELECTED'])
          root = ET.parse('/tmp/fu-junit.xml').getroot()
          rows = []
          for c in root.iter('testcase'):
              status = 'PASS'
              for child in c:
                  if child.tag in ('failure', 'error'):
                      status = child.tag.upper()
                  elif child.tag == 'skipped':
                      status = 'SKIPPED'
              rows.append(((c.get('classname') or '') + '::' + (c.get('name') or ''), status))
          rows.sort()
          print('executed_tests=%d (expected %d)' % (len(rows), expected))
          for name, status in rows:
