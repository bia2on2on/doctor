                  if ch.tag in ('failure', 'error'):
                      st = ch.tag.upper()
              print('[%s] %s::%s' % (st, c.get('classname'), c.get('name')))
          PY
            echo "--- FAILURE/ERROR DETAILS ---"
            awk '/^There (were|was) /{flag=1} flag' /tmp/fu.log | head -n 200
            echo '```'
          } > /tmp/fu-body.md
          cat /tmp/fu-body.md
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/fu-body.md || echo "::notice::PR comment failed (permissions?)"
          else
