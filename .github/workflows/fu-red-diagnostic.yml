          if len(rows) != expected:
              print('::error::Selection guard: expected exactly %d executed test(s), got %d — refusing to report green on an empty/incorrect selection' % (expected, len(rows)))
              sys.exit(1)
          print('Selection guard OK: exactly %d test(s) executed.' % expected)
          PY
          python3 /tmp/guard.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fu-${{ env.LOG_TAG }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/fu.log
            /tmp/fu.rc
            /tmp/fu-junit.xml
          if-no-files-found: error
          retention-days: 14

      - name: Post evidence to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### fu.reminder ${LOG_TAG} (run ${{ github.run_id }}, sha ${{ github.sha }})"
            echo '```'
            echo "--- SUMMARY ---"
            grep -E "^(Tests:|OK|FAILURES!|ERRORS!)" /tmp/fu.log | tail -n 4 || true
            echo "--- EXECUTED TESTS (from JUnit) ---"
            python3 - <<'PY' || echo '(junit unavailable)'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/fu-junit.xml').getroot()
          for c in sorted(root.iter('testcase'), key=lambda x: (x.get('classname') or '') + (x.get('name') or '')):
              st = 'PASS'
