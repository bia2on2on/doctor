name: M4 Focused Evidence (temporary)

# ⚠️ فایلِ موقت — فقط برای ثبتِ شواهدِ اجراییِ دقیقِ اسلایس M-4
# (RED روی head فعلی، و GREEN پس از تغییرِ production).
#
# الزامِ اسلایس: sandbox محلی PHP ندارد، پس زیرساختِ اجرایی از یک workflow
# موقت و متمرکز استفاده می‌کند. این فایل پس از ثبتِ شواهد، در یک commit
# رو‌به‌جلو از diffِ نهایی حذف می‌شود (بدونِ reset/amend).
#
# گاردهای شواهد:
#   - selection متمرکز: `--filter` + `--list-tests` ⇒ دقیقاً ۱ تست (صفر/چند = نامعتبر)
#   - خطای زیرساخت (Errors/bootstrap) هرگز RED معتبر حساب نمی‌شود
#   - شکست باید همان assertion قراردادِ M-4 باشد، نه چیزِ دیگر
#   - کنترل‌های transient در همان اجرا باید GREEN باشند (اثباتِ نبودِ over-reach)
#   - شواهد به‌صورت Commit Comment منتشر می‌شود (لاگِ job از sandbox خواندنی نیست)

on:
  workflow_dispatch:
  push:
    branches: ['arena/01a0a407-doctor']

permissions:
  contents: write

defaults:
  run:
    working-directory: clinic-practice-management

jobs:
  focused:
    name: M-4 focused (deterministic RED/GREEN + transient controls)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      WP_TESTS_DIR: /tmp/wordpress-test-lib
      WP_CORE_DIR: /tmp/wordpress

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, mysqli, pcntl, curl
          coverage: none

      - name: Install dependencies (PHPUnit 9.6 for the WP test lib)
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          composer require --dev phpunit/phpunit:^9.6 --no-interaction --no-progress --with-all-dependencies

      - name: Prepare WordPress test suite
        run: bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 6.7.2

      - name: A) Deterministic contract — focused selection guard (exactly 1 test)
        run: |
          php -d memory_limit=1G vendor/bin/phpunit --no-configuration \
            --bootstrap tests/integration-bootstrap.php \
            tests/Integration/M4DeterministicTerminalFailureRedTest.php \
            --filter 'testDeterministicPayloadFailureIsTerminalOnFirstAttempt' \
            --list-tests 2>&1 | tee /tmp/m4-list.txt
          COUNT=$(grep -c '::test' /tmp/m4-list.txt || true)
          echo "selected_tests=$COUNT"
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::focused selection must be exactly 1 test — got $COUNT"
            exit 1
          fi

      - name: A) Deterministic contract — evidence run (RED expected before the fix)
        run: |
          set +e
          php -d memory_limit=1G vendor/bin/phpunit --no-configuration \
            --bootstrap tests/integration-bootstrap.php \
            tests/Integration/M4DeterministicTerminalFailureRedTest.php \
            --filter 'testDeterministicPayloadFailureIsTerminalOnFirstAttempt' 2>&1 | tee /tmp/m4-a.log
          set -e
          SUMMARY=$(grep -E '^(Tests|OK) ' /tmp/m4-a.log | tail -1)
          echo "summary=$SUMMARY"
          echo "$SUMMARY" | grep -qE '^Tests: 1, ' || { echo "::error::focused selection must be exactly 1 test — got: $SUMMARY"; exit 1; }
          if echo "$SUMMARY" | grep -qE 'Errors: [1-9]'; then
            echo "::error::errors present (bootstrap/infrastructure failure is not a valid RED)"
            exit 1
          fi
          if echo "$SUMMARY" | grep -qE 'Failures: [1-9]'; then
            grep -q 'M-4: a deterministic typed failure' /tmp/m4-a.log \
              || { echo "::error::the failure is not the intended M-4 contract assertion"; exit 1; }
            echo "RED signature: intended M-4 contract assertion failed"
          else
            echo "Contract assertion passed (expected on the fixed head)"
          fi

      - name: B) Transient/retryable controls — exactly 3 tests, must be green
        run: |
          php -d memory_limit=1G vendor/bin/phpunit --no-configuration \
            --bootstrap tests/integration-bootstrap.php \
            tests/Integration/M4TransientRetryControlTest.php \
            --filter 'testGenericRuntimeExceptionStillRetriesWithExistingBackoff|testScopeRequiredFailureOnRealRegisteredPathRemainsRetryable|testMaxAttemptsExhaustionStillTerminalizesAtExistingThreshold' \
            2>&1 | tee /tmp/m4-b.log
          SUMMARY=$(grep -E '^(Tests|OK) ' /tmp/m4-b.log | tail -1)
          echo "summary=$SUMMARY"
          echo "$SUMMARY" | grep -qE '^Tests: 3, ' || { echo "::error::control selection must be exactly 3 tests — got: $SUMMARY"; exit 1; }

      - name: C) Queue/dispatcher regression (JobQueue + stale-lock budget + job-scope foundation)
        run: |
          php -d memory_limit=1G vendor/bin/phpunit --no-configuration \
            --bootstrap tests/integration-bootstrap.php \
            tests/Integration/JobQueueTest.php \
            tests/Integration/JobQueueStaleRetryBudgetTest.php \
            tests/Integration/Phase2JobScopeRedFoundationTest.php 2>&1 | tee /tmp/m4-c.log
          grep -E '^(Tests|OK) ' /tmp/m4-c.log | tail -1

      - name: Post focused evidence (commit comment)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### M-4 focused evidence (temporary workflow — run ${{ github.run_id }})"
            echo ""
            echo "commit: \`${{ github.sha }}\` — event: \`${{ github.event_name }}\`"
            echo ""
            echo "#### A) selection guard (\`--list-tests\` + \`--filter\`)"
            echo '```'
            cat /tmp/m4-list.txt 2>/dev/null || echo "(missing)"
            echo '```'
            for f in /tmp/m4-a.log /tmp/m4-b.log /tmp/m4-c.log; do
              echo "#### $f"
              echo '```'
              if [ -f "$f" ]; then
                grep -E '^(Tests:|OK \(|Time:|There (was|were))' "$f" | tail -3
                awk '/^There (was|were)/{flag=1} flag' "$f" | head -80
              else
                echo "(missing)"
              fi
              echo '```'
            done
          } > /tmp/m4-evidence.md
          head -c 60000 /tmp/m4-evidence.md | iconv -f utf-8 -t utf-8 -c > /tmp/m4-evidence.txt
          jq -Rs '{body: .}' /tmp/m4-evidence.txt > /tmp/m4-evidence.json
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            --input /tmp/m4-evidence.json \
            || echo "::warning::could not post the commit comment"
