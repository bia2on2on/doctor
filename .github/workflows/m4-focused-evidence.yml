name: M4 Focused Evidence (temporary)

# ⚠️ فایلِ موقت — فقط برای ثبتِ شواهدِ اجراییِ دقیقِ اسلایس M-4
# (RED روی head فعلی، و GREEN پس از تغییرِ production).
#
# الزامِ اسلایس: sandbox محلی PHP ندارد، پس زیرساختِ اجرایی از یک workflow
# موقت و متمرکز استفاده می‌کند. این فایل پس از ثبتِ شواهد، در یک commit
# رو‌به‌جلو از diffِ نهایی حذف می‌شود (بدونِ reset/amend).
#
# گاردهای شواهد:
#   - selection متمرکز: `--list-tests` ⇒ دقیقاً ۱ تستِ قرارداد و ۳ تستِ کنترل
#     (صفر/چند = نامعتبر)، به‌همراه شمارشِ واقعیِ تست‌های اجراشده از خودِ log
#   - خطای زیرساخت (ERRORS!/bootstrap) هرگز RED معتبر حساب نمی‌شود
#   - شکستِ RED باید همان assertion قراردادِ M-4 باشد، نه چیزِ دیگر
#   - کنترل‌های transient باید GREEN باشند (اثباتِ نبودِ over-reach)
#   - شواهد به‌صورت Commit Comment منتشر می‌شود (لاگِ job از sandbox خواندنی نیست)

on:
  workflow_dispatch:
  push:
    branches: ['arena/01a0a407-doctor']

permissions:
  contents: write

defaults:
  run:
    working-directory: clinic-practice-management

jobs:
  focused:
    name: M-4 focused (deterministic RED/GREEN + transient controls)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      WP_TESTS_DIR: /tmp/wordpress-test-lib
      WP_CORE_DIR: /tmp/wordpress

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, mysqli, pcntl, curl
          coverage: none

      - name: Install dependencies (PHPUnit 9.6 for the WP test lib)
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          composer require --dev phpunit/phpunit:^9.6 --no-interaction --no-progress --with-all-dependencies

      - name: Prepare WordPress test suite
        run: bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 6.7.2

      # ------------------------------------------------------------------
      # Focal selection guards: zero/multiple selected tests must never
      # count as evidence. `--filter` cannot be combined with `--list-tests`
      # in PHPUnit 9.6, so the count is taken per FILE (the filtered method
      # set of each file is fixed by the test files themselves).
      # ------------------------------------------------------------------
      - name: Selection guard — deterministic file must hold exactly 1 test
        run: |
          php -d memory_limit=1G vendor/bin/phpunit --no-configuration \
            --bootstrap tests/integration-bootstrap.php \
            tests/Integration/M4DeterministicTerminalFailureRedTest.php \
            --list-tests 2>&1 | tee /tmp/m4-list-a.txt
          COUNT=$(grep -c '::test' /tmp/m4-list-a.txt || true)
          echo "deterministic_tests=$COUNT"
          [ "$COUNT" -eq 1 ] || { echo "::error::deterministic selection must be exactly 1 test — got $COUNT"; exit 1; }

      - name: Selection guard — control file must hold exactly 3 tests
        run: |
          php -d memory_limit=1G vendor/bin/phpunit --no-configuration \
            --bootstrap tests/integration-bootstrap.php \
            tests/Integration/M4TransientRetryControlTest.php \
            --list-tests 2>&1 | tee /tmp/m4-list-b.txt
          COUNT=$(grep -c '::test' /tmp/m4-list-b.txt || true)
          echo "control_tests=$COUNT"
          [ "$COUNT" -eq 3 ] || { echo "::error::control selection must be exactly 3 tests — got $COUNT"; exit 1; }

      # ------------------------------------------------------------------
      # A) Deterministic contract — RED before the fix, GREEN after.
      # ------------------------------------------------------------------
      - name: A) Deterministic contract (focused, exactly 1 executed test)
        run: |
          set +e
          php -d memory_limit=1G vendor/bin/phpunit --no-configuration \
            --bootstrap tests/integration-bootstrap.php \
            tests/Integration/M4DeterministicTerminalFailureRedTest.php \
            --filter 'testDeterministicPayloadFailureIsTerminalOnFirstAttempt' 2>&1 | tee /tmp/m4-a.log
          set -e

          EXECUTED=$(sed -nE 's/^Tests: ([0-9]+),.*/\1/p; s/^OK \(([0-9]+) tests?,.*/\1/p' /tmp/m4-a.log | tail -1)
          echo "executed_tests=$EXECUTED"
          [ "$EXECUTED" = "1" ] || { echo "::error::focused run must execute exactly 1 test — got '$EXECUTED'"; exit 1; }

          if grep -qE '^ERRORS!' /tmp/m4-a.log; then
            echo "::error::errors present (bootstrap/infrastructure failure is not a valid RED)"
            exit 1
          fi

          if grep -qE '^FAILURES!' /tmp/m4-a.log; then
            grep -q 'M-4: a deterministic typed failure' /tmp/m4-a.log \
              || { echo "::error::the failure is not the intended M-4 contract assertion"; exit 1; }
            echo "RED signature: the intended M-4 contract assertion failed (observed generic retry path)"
          else
            echo "GREEN signature: the M-4 contract assertion passed"
          fi

      # ------------------------------------------------------------------
      # B) Transient/retryable controls — must be GREEN on every head.
      # ------------------------------------------------------------------
      - name: B) Transient controls (focused, exactly 3 executed tests, must be green)
        run: |
          set +e
          php -d memory_limit=1G vendor/bin/phpunit --no-configuration \
            --bootstrap tests/integration-bootstrap.php \
            tests/Integration/M4TransientRetryControlTest.php \
            --filter 'testGenericRuntimeExceptionStillRetriesWithExistingBackoff|testScopeRequiredFailureOnRealRegisteredPathRemainsRetryable|testMaxAttemptsExhaustionStillTerminalizesAtExistingThreshold' \
            2>&1 | tee /tmp/m4-b.log
          set -e

          EXECUTED=$(sed -nE 's/^Tests: ([0-9]+),.*/\1/p; s/^OK \(([0-9]+) tests?,.*/\1/p' /tmp/m4-b.log | tail -1)
          echo "executed_tests=$EXECUTED"
          [ "$EXECUTED" = "3" ] || { echo "::error::control run must execute exactly 3 tests — got '$EXECUTED'"; exit 1; }
          grep -qE '^FAILURES!|^ERRORS!' /tmp/m4-b.log && { echo "::error::transient controls must be green (over-reach detected)"; exit 1; }
          grep -qE '^OK \(' /tmp/m4-b.log || { echo "::error::transient controls did not report a green summary"; exit 1; }
          echo "transient controls: green"

      # ------------------------------------------------------------------
      # C) Queue/dispatcher regression.
      # ------------------------------------------------------------------
      - name: C) Queue/dispatcher regression (JobQueue + stale-lock budget + job-scope foundation)
        run: |
          # PHPUnit 9.6 accepts ONE positional path (extra arguments are silently
          # ignored), so the three regression files run as three sequential runs.
          : > /tmp/m4-c.log
          for F in JobQueueTest JobQueueStaleRetryBudgetTest Phase2JobScopeRedFoundationTest; do
            php -d memory_limit=1G vendor/bin/phpunit --no-configuration \
              --bootstrap tests/integration-bootstrap.php \
              "tests/Integration/$F.php" 2>&1 | tee "/tmp/m4-c-$F.log"
            grep -qE '^OK \(' "/tmp/m4-c-$F.log" || { echo "::error::$F must report a green summary"; exit 1; }
            grep -qE '^FAILURES!|^ERRORS!' "/tmp/m4-c-$F.log" && { echo "::error::$F reported failures/errors"; exit 1; }
            {
              echo "=== $F ==="
              grep -E '^(Tests: |OK \()' "/tmp/m4-c-$F.log" | tail -1
            } >> /tmp/m4-c.log
            echo "$F: green"
          done
          cat /tmp/m4-c.log

      - name: Post focused evidence (commit comment)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### M-4 focused evidence (temporary workflow — run ${{ github.run_id }})"
            echo ""
            echo "commit: \`${{ github.sha }}\` — event: \`${{ github.event_name }}\`"
            echo ""
            for f in /tmp/m4-list-a.txt /tmp/m4-list-b.txt; do
              echo "#### selection guard — $f"
              echo '```'
              grep -E '::test|Available test' "$f" 2>/dev/null || echo "(missing)"
              echo '```'
            done
            for f in /tmp/m4-a.log /tmp/m4-b.log /tmp/m4-c.log /tmp/m4-c-JobQueueTest.log /tmp/m4-c-JobQueueStaleRetryBudgetTest.log /tmp/m4-c-Phase2JobScopeRedFoundationTest.log; do
              echo "#### $f"
              echo '```'
              if [ -f "$f" ]; then
                grep -E '^(Tests: |OK \(|Time:|There (was|were))' "$f" | tail -3
                awk '/^There (was|were)/{flag=1} flag' "$f" | head -80
              else
                echo "(missing — step did not run)"
              fi
              echo '```'
            done
          } > /tmp/m4-evidence.md
          head -c 60000 /tmp/m4-evidence.md | iconv -f utf-8 -t utf-8 -c > /tmp/m4-evidence.txt
          jq -Rs '{body: .}' /tmp/m4-evidence.txt > /tmp/m4-evidence.json
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            --input /tmp/m4-evidence.json \
            || echo "::warning::could not post the commit comment"
