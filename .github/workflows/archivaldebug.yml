name: ArchivalDebug
on: pull_request
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9820105ee22480c191513ec1136020b8dda251e5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml
      - run: |
          cd clinic-practice-management
          composer install --prefer-dist --no-progress --no-interaction
          set +e
          php -d memory_limit=512M vendor/bin/phpunit --filter 'testWorkerDescriptorInventoryIsStdioAndDevNullOnly' tests/Unit/ArchivalRaceWorkerFailurePathsTest.php > /tmp/a.log 2>&1
          rc=$?
          echo "exit code $rc"
          grep -n -i -E "Tests:|ERRORS!|FAILURES!|Failed asserting|worker_socket" /tmp/a.log | head -n 20 | while IFS= read -r line; do echo "::error::$line"; done
          exit $rc
