name: backup.multi RED evidence (temporary)

on:
  push:
    branches:
      - arena/01a0a126-doctor
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: clinic-practice-management

jobs:
  red-evidence:
    name: RED evidence fresh-process multi-clinic files
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cpms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, curl, zip
          coverage: none
      - name: Install WP test lib
        run: |
          svn co https://develop.svn.wordpress.org/tags/6.7/tests/phpunit/includes/ /tmp/wp-tests-includes || git clone --depth 1 --branch 6.7 https://github.com/WordPress/wordpress-develop.git /tmp/wp-develop && cp -r /tmp/wp-develop/tests/phpunit/includes /tmp/wp-tests-includes
          svn co https://develop.svn.wordpress.org/tags/6.7/tests/phpunit/data/ /tmp/wp-tests-data || cp -r /tmp/wp-develop/tests/phpunit/data /tmp/wp-tests-data
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run focused RED test
        env:
          WP_TESTS_DIR: /tmp/wp-tests-includes
          WP_TESTS_DATA_DIR: /tmp/wp-tests-data
          WP_CORE_DIR: /tmp/wordpress
        run: |
          # Setup WP core for tests
          if [ ! -d /tmp/wordpress ]; then
            svn co https://develop.svn.wordpress.org/tags/6.7/ /tmp/wordpress || git clone --depth 1 --branch 6.7 https://github.com/WordPress/WordPress.git /tmp/wordpress
          fi
          cat <<'PHP' > /tmp/wp-tests-config.php
          <?php
          define('DB_NAME', 'cpms_test');
          define('DB_USER', 'root');
          define('DB_PASSWORD', 'root');
          define('DB_HOST', '127.0.0.1');
          define('DB_CHARSET', 'utf8mb4');
          define('DB_COLLATE', '');
          $table_prefix = 'wptests_';
          define('WP_TESTS_DOMAIN', 'example.org');
          define('WP_TESTS_EMAIL', 'admin@example.org');
          define('WP_TESTS_TITLE', 'Test Blog');
          define('WP_PHP_BINARY', 'php');
          define('WP_TESTS_FORCE_KNOWN_BUGS', true);
          PHP
          vendor/bin/phpunit --filter BackupMultiClinicFilesRedTest --verbose 2>&1 | tee /tmp/red.log
          echo "---- LOG END ----"
          cat /tmp/red.log
          # Expect failure for RED - check if test failed due to missing file (valid RED)
          if grep -q "must include file from Clinic" /tmp/red.log; then
            echo "RED_VALID=true - test failed as expected due to missing file"
            echo "RED_VALID=true" >> $GITHUB_OUTPUT
          else
            echo "RED may be invalid or passed"
          fi
