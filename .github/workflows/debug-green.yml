name: Debug GREEN test
on:
  push:
    branches:
      - arena/01a0a126-doctor
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
defaults:
  run:
    working-directory: clinic-practice-management
jobs:
  debug:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      WP_TESTS_DIR: /tmp/wordpress-test-lib
      WP_CORE_DIR: /tmp/wordpress
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, mysqli, pcntl, curl
          coverage: none
      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          composer require --dev phpunit/phpunit:^9.6 --no-interaction --no-progress --with-all-dependencies
      - name: Prepare WP tests
        run: bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 6.7.2
      - name: Run GREEN test with verbose output
        run: |
          php -d memory_limit=1G vendor/bin/phpunit --no-configuration \
            --bootstrap tests/integration-bootstrap.php \
            --filter testBackupRunGreenInstallationLevelControls \
            --verbose \
            tests/Integration/BackupRunM2WiringRedTest.php 2>&1 | tee /tmp/debug.log
          echo "--- LOG TAIL ---"
          tail -200 /tmp/debug.log
          echo "--- END LOG ---"
          # Also output to summary
          echo "## GREEN test log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -500 /tmp/debug.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Comment log on PR if exists
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('/tmp/debug.log', 'utf8'); } catch(e) { log = 'no log'; }
            log = log.slice(-4000);
            const body = `GREEN test debug log:\n\`\`\`\n${log}\n\`\`\``;
            const prs = await github.rest.pulls.list({owner: context.repo.owner, repo: context.repo.repo, head: `${context.repo.owner}:${context.payload.ref?.replace('refs/heads/','') || 'arena/01a0a126-doctor'}`, state: 'open'});
            if (prs.data.length > 0) {
              const pr = prs.data[0];
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, body});
            }
