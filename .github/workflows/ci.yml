name: CI

# نکته: این فایل باید در ریشه ریپازیتوری بماند — GitHub فقط
# .github/workflows ریشه را اجرا می‌کند (نسخه قبلی داخل
# clinic-practice-management/.github هرگز اجرا نمی‌شد).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # PR runs are keyed by PR number; non-PR runs by their full ref. Event names
  # keep pull_request and push evidence in separate cancellation domains.
  # Main refs add the unique run ID so even a pending main run is never replaced.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && format('main-run-{0}', github.run_id) || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref) }}
  # Preserve every main-ref run as post-merge evidence; superseded non-main work may stop.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: clinic-practice-management

jobs:
  # Tenant-hardcode tripwire — scans production runtime for literal tenant ID 1
  tripwire:
    name: Tenant Tripwire (hardcode scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tripwire self-tests
        run: python3 bin/tenant-tripwire.py --test
        working-directory: ${{ github.workspace }}

      - name: Scan production for tenant hardcodes
        working-directory: ${{ github.workspace }}
        run: |
          python3 bin/tenant-tripwire.py --allowlist bin/tenant-tripwire-allowlist.json
          echo "Tripwire: production runtime clean."

  unit:
    name: Unit Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run unit tests (no WP)
        run: php -d memory_limit=512M vendor/bin/phpunit --testsuite Unit

  integration:
    name: Integration (WP 6.7 + MySQL 8)
    runs-on: ubuntu-latest
    needs: unit

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      WP_TESTS_DIR: /tmp/wordpress-test-lib
      WP_CORE_DIR: /tmp/wordpress

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, mysqli, pcntl, curl
          coverage: none

      # WP 6.7 test lib به PHPUnit\Util\Test::parseTestMethodAnnotations() وابسته است
      # که در PHPUnit 10/11 حذف شده (polyfills این بخش را پوشش نمی‌دهد) → برای
      # Integration نسخه رسمی پشتیبانی‌شده WP یعنی PHPUnit 9.6 نصب می‌شود؛
      # Unit job ها روی PHPUnit 11/10.5 باقی می‌مانند.
      - name: Install dependencies (PHPUnit 9.6 for WP test lib)
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          composer require --dev phpunit/phpunit:^9.6 --no-interaction --no-progress --with-all-dependencies

      - name: Prepare WordPress test suite
        run: bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 6.7.2

      # REST-level + Concurrency (pcntl_fork روی اتصال‌های مستقل واقعی MySQL)؛
      # --no-configuration چون phpunit.xml با schema مخصوص PHPUnit 11 است.
      - name: Run integration tests
        run: |
          set -o pipefail
          php -d memory_limit=1G vendor/bin/phpunit --no-configuration \
            --log-junit /tmp/phpunit-int-junit.xml \
            --bootstrap tests/integration-bootstrap.php tests/Integration 2>&1 | tee /tmp/phpunit-int.log
          # Completion guard (false-green protection): a COMPLETED PHPUnit run always
          # prints a terminal summary (OK / OK-but / FAILURES! / ERRORS! / WARNINGS!).
          # Production exit()/wp_die inside a test can terminate the process with rc=0
          # BEFORE any summary is printed — pipefail cannot distinguish that from a
          # genuine pass (proven: runs 35103474350 / 35105290047, 63/844 tests, rc=0).
          # Premature termination is therefore a hard failure, never a pass. Nonzero
          # PHPUnit exits still fail normally at the pipeline above (pipefail intact).
          if ! grep -qE '^(OK \(|OK, but|FAILURES!|ERRORS!|WARNINGS!)' /tmp/phpunit-int.log; then
            echo '::error::Integration PHPUnit terminated WITHOUT a terminal summary (premature exit with rc=0 — suite did not complete). This is a CI failure, not a pass.'
            exit 1
          fi

      - name: Upload Integration PHPUnit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-phpunit-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/phpunit-int.log
            /tmp/phpunit-int-junit.xml
          if-no-files-found: warn
          retention-days: 7

      # ------------------------------------------------------------------
      # RED 1 (test-only): PROCESS-FRESH multi-Clinic REST bootstrap probe.
      #
      # The only step added by the infrastructure RED. It runs ONE extra PHP
      # process (`php tests/bin/multi-clinic-rest-bootstrap-probe.php`) with
      # its own isolated database; it does not touch the PHPUnit suite, its
      # database, its order, or any existing gate.
      #
      # Why a separate process is objectively necessary: the contract under
      # test is "REST bootstrap must be scope-neutral". The PHPUnit process
      # builds the REST server and the memoized `App::` service singletons
      # once, at a moment when the installation still holds exactly one
      # Clinic — so a long-lived test process structurally CANNOT reproduce
      # a fresh multi-Clinic bootstrap. No amount of in-process test design
      # can substitute for a fresh interpreter.
      #
      # `if: always()` so the probe still runs (and still reports) when the
      # integration suite above has failed — which is the expected RED state.
      # ------------------------------------------------------------------
      - name: Process-fresh multi-Clinic REST bootstrap probe (RED 1)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          set +e
          php -d memory_limit=1G tests/bin/multi-clinic-rest-bootstrap-probe.php > /tmp/red1-probe.log 2>&1
          PROBE_RC=$?
          set -e
          cat /tmp/red1-probe.log
          # The probe's own stdout/stderr IS the RED evidence, and the raw job
          # log is not readable through the API — same reason the repository
          # already mirrors the integration summary onto the PR. Mirroring here
          # never changes the step's verdict: we re-exit with the probe's rc.
          if [ -n "$PR_NUMBER" ]; then
            {
              echo "### RED 1 — process-fresh multi-Clinic REST bootstrap probe (run ${{ github.run_id }}, attempt ${{ github.run_attempt }}, rc=${PROBE_RC})"
              echo '```'
              cat /tmp/red1-probe.log
              echo '```'
            } > /tmp/red1-probe-comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/red1-probe-comment.md \
              || echo '::notice::RED 1 probe evidence comment failed (non-fatal)'
          fi
          exit "${PROBE_RC:-1}"

      # شواهد تکمیل (همان سازوکار گارد): خلاصهٔ پایانی + اجرای کلاس‌ها از JUnit
      # به‌صورت کامنت PR — لاگ‌های job به blob ریدایرکت می‌شوند، اما کامنت PR از
      # طریق API خواندنی است؛ نتیجهٔ سبز بدون این شواهد قابل استنباط نیست.
      - name: Post integration completion evidence to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Integration completion evidence (run ${{ github.run_id }}, attempt ${{ github.run_attempt }})"
            echo '```'
            echo '--- terminal summary (completion-guard authority) ---'
            grep -E '^(OK \(|OK, but|FAILURES!|ERRORS!|WARNINGS!|Tests: |Time: )' /tmp/phpunit-int.log | tail -n 4 || echo '(no terminal summary found — premature exit)'
            if [ -f /tmp/phpunit-int-junit.xml ]; then
              SPLIT="$(mktemp)"
              tr '<' '\n' < /tmp/phpunit-int-junit.xml > "$SPLIT"
              echo '--- junit root suite ---'
              grep -m1 '^testsuite ' "$SPLIT" || true
              echo '--- Phase3 Slice 6 RED-class suites (selection + execution proof) ---'
              grep '^testsuite ' "$SPLIT" | grep -E 'Phase3Slice6AuthorizationRedTest|Phase3Slice6BStaffClinicAuthorizationTest' || echo '(no Phase3 Slice 6 RED class present in junit)'
              echo '--- Phase3 Slice 6 RED-class testcases ---'
              grep '^testcase ' "$SPLIT" | grep -E 'Phase3Slice6AuthorizationRedTest|Phase3Slice6BStaffClinicAuthorizationTest' || true
              echo '--- Phase4 Slice 3 WalkIn suite (execution proof) ---'
              grep '^testsuite ' "$SPLIT" | grep 'Phase4Slice3WalkInSharedProfessionalTest' || echo '(Phase4 Slice 3 suite missing from junit)'
              echo '--- Phase4 Slice 3 WalkIn testcases ---'
              grep '^testcase ' "$SPLIT" | grep 'Phase4Slice3WalkInSharedProfessionalTest' || true
              echo '--- Phase4 Slice 4 Queue suite (execution proof) ---'
              grep '^testsuite ' "$SPLIT" | grep 'Phase4Slice4QueueSharedProfessionalTest' || echo '(Phase4 Slice 4 suite missing from junit)'
              echo '--- Phase4 Slice 4 Queue testcases ---'
              grep '^testcase ' "$SPLIT" | grep 'Phase4Slice4QueueSharedProfessionalTest' || true
              echo '--- Phase4 Location Master Data suite (execution proof) ---'
              grep '^testsuite ' "$SPLIT" | grep 'Phase4LocationMasterDataTest' || echo '(Phase4 Location suite missing from junit)'
              echo '--- Phase4 Location Master Data testcases ---'
              grep '^testcase ' "$SPLIT" | grep 'Phase4LocationMasterDataTest' || true
              echo '--- Phase6 Slice 3 Explicit-Location suite (selection + execution proof) ---'
              grep '^testsuite ' "$SPLIT" | grep 'Phase6ScheduleExplicitLocationTest' || echo '(Phase6 Slice 3 suite missing from junit)'
              echo '--- Phase6 Slice 3 Explicit-Location testcases ---'
              grep '^testcase ' "$SPLIT" | grep 'Phase6ScheduleExplicitLocationTest' || true
              echo '--- Phase6 Slice 3 regression suites (selection + execution proof) ---'
              grep '^testsuite ' "$SPLIT" | grep -E 'RestScheduleTest|Phase4Slice1ProfessionalMultiClinicParticipationTest|ScheduleRegenerationClinicScopeRedTest|SchedulingLocationLocalBoundaryRedTest|SlotsGenerateLocationLocalTemporalRedTest' || echo '(a Phase6 Slice 3 regression suite is missing from junit)'
              echo '--- Phase6 Slice 3 regression testcases ---'
              grep '^testcase ' "$SPLIT" | grep -E 'RestScheduleTest|Phase4Slice1ProfessionalMultiClinicParticipationTest|ScheduleRegenerationClinicScopeRedTest|SchedulingLocationLocalBoundaryRedTest|SlotsGenerateLocationLocalTemporalRedTest' || true
              echo '--- Phase6 Slice 4 Multi-Shift suite (selection + execution proof) ---'
              grep '^testsuite ' "$SPLIT" | grep 'Phase6ScheduleMultiShiftTest' || echo '(Phase6 Slice 4 suite missing from junit)'
              echo '--- Phase6 Slice 4 Multi-Shift testcases ---'
              grep '^testcase ' "$SPLIT" | grep 'Phase6ScheduleMultiShiftTest' || true
              # Slice 5 keeps named-suite evidence explicit (additive; no gate change).
              grep '^testsuite ' "$SPLIT" | grep 'Phase6ScheduleMultiShiftTest' || true
              echo '--- Phase6 Slice 4 regression suites (selection + execution proof) ---'
              grep '^testsuite ' "$SPLIT" | grep -E 'RestScheduleTest|Phase6ScheduleExplicitLocationTest|Phase4Slice1ProfessionalMultiClinicParticipationTest|ScheduleRegenerationClinicScopeRedTest|SchedulingLocationLocalBoundaryRedTest|SlotsGenerateLocationLocalTemporalRedTest|SlotsGenerateM2WiringRedTest' || echo '(a Phase6 Slice 4 regression suite is missing from junit)'
              echo '--- Phase6 Slice 4 regression testcases ---'
              grep '^testcase ' "$SPLIT" | grep -E 'RestScheduleTest|Phase6ScheduleExplicitLocationTest|Phase4Slice1ProfessionalMultiClinicParticipationTest|ScheduleRegenerationClinicScopeRedTest|SchedulingLocationLocalBoundaryRedTest|SlotsGenerateLocationLocalTemporalRedTest|SlotsGenerateM2WiringRedTest' || true
              # Slice 6 keeps named-suite evidence explicit (additive; no gate change).
              echo '--- Phase6 Slice 6 Exception-Location suite (selection + execution proof) ---'
              grep '^testsuite ' "$SPLIT" | grep 'Phase6ScheduleExceptionLocationTest' || echo '(Phase6 Slice 6 suite missing from junit)'
              echo '--- Phase6 Slice 6 Exception-Location testcases ---'
              grep '^testcase ' "$SPLIT" | grep 'Phase6ScheduleExceptionLocationTest' || true
              echo '--- Phase6 Slice 6 regression suites (selection + execution proof) ---'
              grep '^testsuite ' "$SPLIT" | grep -E 'RestScheduleTest|Phase6ScheduleMultiShiftTest|Phase6ScheduleExplicitLocationTest|Phase4Slice1ProfessionalMultiClinicParticipationTest|ScheduleRegenerationClinicScopeRedTest|SchedulingLocationLocalBoundaryRedTest|SlotsGenerateLocationLocalTemporalRedTest|SlotsGenerateM2WiringRedTest|C7PreIntegrationBoundaryTest|C7ScheduleObjectIdIsolationTest' || echo '(a Phase6 Slice 6 regression suite is missing from junit)'
              echo '--- Phase6 Slice 6 regression testcases ---'
              grep '^testcase ' "$SPLIT" | grep -E 'C7PreIntegrationBoundaryTest|C7ScheduleObjectIdIsolationTest' || true
              # Slice 7 keeps named-suite evidence explicit (additive; no gate change).
              echo '--- Phase6 Slice 7 Multi-Shift Concurrency suite (selection + execution proof) ---'
              grep '^testsuite ' "$SPLIT" | grep 'Phase6ScheduleShiftConcurrencyRedTest' || echo '(Phase6 Slice 7 concurrency suite missing from junit)'
              echo '--- Phase6 Slice 7 Multi-Shift Concurrency testcases ---'
              grep '^testcase ' "$SPLIT" | grep 'Phase6ScheduleShiftConcurrencyRedTest' || true
              # C7 hardening keeps named-suite evidence explicit (additive; no gate change).
              echo '--- C7 hardening: Schedule no-scope read suite (selection + execution proof) ---'
              grep '^testsuite ' "$SPLIT" | grep 'C7ScheduleNoScopeReadRedTest' || echo '(C7 hardening no-scope read suite missing from junit)'
              echo '--- C7 hardening: Schedule no-scope read testcases ---'
              grep '^testcase ' "$SPLIT" | grep 'C7ScheduleNoScopeReadRedTest' || true
              # Phase 8 Slice 1 هم مثل بقیهٔ سوئیت‌های RED-class شاهدِ صریحِ
              # «انتخاب + اجرا» دارد (الحاقی؛ هیچ معیارِ گیتی تغییر نکرد).
              echo '--- Phase8 Slice 1 Public Booking Browse suite (selection + execution proof) ---'
              grep '^testsuite ' "$SPLIT" | grep 'Phase8Slice1PublicBookingBrowseRedTest' || echo '(Phase8 Slice 1 public booking suite missing from junit)'
              echo '--- Phase8 Slice 1 Public Booking Browse testcases ---'
              grep '^testcase ' "$SPLIT" | grep 'Phase8Slice1PublicBookingBrowseRedTest' || true
              rm -f "$SPLIT"
            else
              echo '(junit xml missing — run may have terminated prematurely)'
            fi
            echo '```'
          } > /tmp/pr-evidence.md
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/pr-evidence.md || echo "::notice::PR comment failed (permissions?)"
          fi

      # انتقال لاگ شکست‌ها به PR — لاگ‌های job از API به blob ریدایرکت می‌شوند و
      # از محیط sandbox قابل دانلود نیستند؛ کامنت PR از طریق API خواندنی است.
      - name: Post failures to PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Integration test failures (run ${{ github.run_id }})"
            echo '```'
            echo "--- SUMMARY ---"
            grep -E "^(Tests:|OK \()" /tmp/phpunit-int.log | tail -n 2
            echo "--- FAILURE/ERROR DETAILS (test + message + location) ---"
            awk '/^There (were|was)/{flag=1;next}/^--$/{}flag' /tmp/phpunit-int.log \
              | grep -B 1 -A 8 -E '^[0-9]+\) ' | grep -vE '^--$' | head -n 300
            echo "--- TAIL (last 40 lines) ---"
            tail -n 40 /tmp/phpunit-int.log
            echo "--- FK EVIDENCE: verbose wpdb SQL errors ---"
            grep -B 1 -A 3 -iE "foreign key constraint" /tmp/phpunit-int.log | grep -vE '^--$' | head -n 100 || true
            echo "--- FK EVIDENCE: InnoDB LATEST FOREIGN KEY ERROR ---"
            php -r '$m=@mysqli_connect("127.0.0.1","root","root","wordpress_test"); if(!$m){echo "(no mysqli connection)\n"; exit(0);} $r=@mysqli_query($m,"SHOW ENGINE INNODB STATUS"); if(!$r){echo "(innodb status query failed)\n"); exit(0);} $row=mysqli_fetch_assoc($r); $t=(string)($row["Status"] ?? ""); if(preg_match("/LATEST FOREIGN KEY ERROR:.*?(?=\n-----)/s",$t,$mm)){echo $mm[0]."\n";}else{echo "(no FK section in InnoDB status)\n";}' || true
            echo '```'
          } > /tmp/pr-body.md
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/pr-body.md || echo "::notice::PR comment failed (permissions?)"
          fi

      # خروجی PHPUnit به‌صورت annotation هم منتشر می‌شود (سقف GitHub: 10 به‌ازای Step)
      - name: Surface test failures (part 1)
        if: failure()
        run: |
          grep -oE "^[0-9]+\) [A-Za-z\\\\]+Test::[A-Za-z_]+" /tmp/phpunit-int.log | sort -u | head -10 | while IFS= read -r l; do
            echo "::error::${l:0:400}"
          done
          grep -E "^Tests: " /tmp/phpunit-int.log | head -1 | while IFS= read -r l; do
            echo "::notice::${l:0:400}"
          done
      - name: Surface test failures (part 2)
        if: failure()
        run: |
          grep -oE "^[0-9]+\) [A-Za-z\\\\]+Test::[A-Za-z_]+" /tmp/phpunit-int.log | sort -u | sed -n '11,20p' | while IFS= read -r l; do
            echo "::error::${l:0:400}"
          done

  # F1-3 (گروه 4) — PHPStan در CI. سطح و scope در phpstan.neon.dist ثبت است
  # (level=3 — بالاترین سطح سبز روی وضعیت واقعی کد، با اجرای واقعی/probe؛
  # scope: src + bin) و از آن سقف پایین نمی‌آید.
  phpstan:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan (level from phpstan.neon)
        run: vendor/bin/phpstan analyse --no-progress

  # ------------------------------------------------------------------
  # WPCS — گیت رگرسیون استاندارد وردپرس روی «خطوط» تغییرکرده/جدید
  # (drift-register §۸-۱): legacy سنجیده نمی‌شود؛ فقط نقض‌هایی که روی
  # خطوطِ add شده نسبت به baseline واقع شده‌اند گیت را می‌شکنند
  # (فایل کاملاً جدید = تمام خطوطش). bump آن دستی + مستند است.
  #
  # baseline کنونی = 2263ed6… (main، 2026-09-20). دلیلِ این bump و
  # سیاستِ «no-new-violations بدونِ mass-formatِ legacy»: drift-register
  # §۸-۱-۱ — یک‌بار بازگرداندنِ معنایِ documented ratchet پس از آنکه
  # collectorِ خرابِ changed-lines از بدوِ تولد صفر خط جمع می‌کرد.
  wpcs:
    name: WPCS (changed code)
    runs-on: ubuntu-latest
    env:
      # Ratchet anchor (manual + documented bump — drift-register §۸-۱-۱).
      WPCS_BASELINE: 2263ed673a8fdf4ab91e6a7fffae6d82252e4324
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # تاریخچهٔ کامل برای diff نسبت به baseline

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies (WPCS — ephemeral؛ دامنهٔ 3.x + فیلتر امنیتی composer)
        run: |
          # هیچ پکیجی exact-pin نمی‌شود: composer نسخه‌های دارای security
          # advisory را از resolution حذف می‌کند (evidence: runs 34315163722
          # و 34315474820 — phpcs 3.11.x و خود wpcs 3.1.0 هر دو advisory
          # داشتند)؛ نتیجه = جدیدترین نسخهٔ سالمِ سازگار. constraint اصلی
          # پروژه = major 3.x وردپرس-استاندارد.
          # اولین composer plugin در درخت پروژه — allow-plugins الزامی
          # (config اِفیمرال در CI فقط؛ composer.json پروژه دست‌نخورده)
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --dev wp-coding-standards/wpcs:^3.1 \
            --no-interaction --no-progress --with-all-dependencies
          # نسخه‌های resolution فعلی — evidence پایدار برای drift-register
          vendor/bin/phpcs --version
          composer show 2>/dev/null | grep -E 'phpcs|wpcs|dealerdirect' || true

      # ------------------------------------------------------------------
      # Self-test اول: اثباتِ رگرسیونِ قطعی برای منطقِ جمع‌آوریِ خطوطِ add شده
      # (مخزن‌های git مصنوعی در temp؛ بدون PHP، بدون شبکه). خرابی هر self-test
      # ⇒ این step با rc≠0 متوقف می‌شود (fail-loud، نه green).
      # ------------------------------------------------------------------
      - name: Self-test — WPCS added-lines collector (regression proof)
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          python3 bin/wpcs-changed-lines.py --test 2>&1 | tee /tmp/wpcs-selftest.log

      # ------------------------------------------------------------------
      # جمع‌آوریِ scope + متادیتای خطوطِ add شده (سیاستِ WPCS بدون تغییر:
      # همان baseline، همان فایل‌های in-scope، همان فیلترِ added-lines).
      #
      # دو دامنهٔ مسیر که پیش‌تر قاطی می‌شدند، اینجا یک‌بار صریح map می‌شوند:
      #   • git  → مسیرهای نسبی به top-levelِ مخزن
      #   • phpcs → مسیرهای نسبی به working-directoryِ همین job
      # نقصِ قبلی (class D / test-infra): دامنهٔ discovery مسیرها را
      # root-relative گزارش می‌کرد و stepِ added-lines همان مسیر را با پیشوندِ
      # `clinic-practice-management/` از داخلِ همان پوشه به git می‌داد ⇒
      # git چیزی match نمی‌کرد (نامطابق‌بودنِ pathspec خطا نیست: rc=0 و بدونِ
      # خروجی) و در نتیجه added-lines خالی می‌ماند ⇒ نتیجهٔ سبزِ کاذب.
      #
      # Fail-closed: baselineِ غیرقابل‌resolve، pathspecِ بی‌نتیجه، فایلی که
      # اثبات نشود واقعاً inspect شده، یا ناسازگاریِ count با --numstat همه
      # با rc≠0 متوقف می‌شوند و هرگز به «nothing to check» تبدیل نمی‌شوند.
      # تغییراتِ صرفاً حذفی (بدونِ خطِ add شده) مجازند: هر فایل واقعاً inspect
      # می‌شود و --numstat برایش ۰ خطِ add شده اعلام می‌کند.
      # ------------------------------------------------------------------
      - name: Collect changed PHP files and added lines (WPCS scope)
        run: |
          set -o pipefail
          python3 "$GITHUB_WORKSPACE/bin/wpcs-changed-lines.py" \
            --baseline "${WPCS_BASELINE:?baseline not set}" 2>&1 | tee /tmp/wpcs-collect.log

      - name: Run WPCS (violations on added lines)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s /tmp/wpcs-files.txt ]; then
            echo 'WPCS: nothing to check — green no-op.'
            exit 0
          fi
          # گزارش کامل JSON (خطا + هشدار) روی کل فایل‌های تغییرکرده؛
          # فیلترِ خطوط add شده در step بعدی انجام می‌شود.
          set +e
          vendor/bin/phpcs --standard=phpcs.xml.dist --report=json \
            $(cat /tmp/wpcs-files.txt) > /tmp/wpcs.json 2>/tmp/wpcs-stderr.log
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ ! -s /tmp/wpcs.json ]; then
            echo '::error::phpcs failed to run (see stderr below)'
            cat /tmp/wpcs-stderr.log
            exit "$rc"
          fi

          set +e
          python3 - <<'PY' > /tmp/wpcs-new.txt
          import json, sys
          added = set(open('/tmp/wpcs-added.txt').read().split())
          # خروجی phpcs ممکن است پیشوند progress داشته باشد (ruleset ما
          # <arg value="sp"/> دارد و report=json آن را خاموش نمی‌کند)؛
          # JSON از اولین '{' استخراج می‌شود.
          raw = open('/tmp/wpcs.json').read()
          start = raw.find('{')
          if start < 0:
              print(f'no JSON object found in phpcs output (len={len(raw)}); head: {raw[:200]!r}')
              sys.exit(1)
          try:
              report = json.loads(raw[start:])
          except Exception as e:
              print(f'cannot parse phpcs JSON: {e}')
              sys.exit(1)
          found = []
          for path, data in report.get('files', {}).items():
              for m in data.get('messages', []):
                  key = f"{path}:{m['line']}"
                  if key in added:
                      found.append(f"{path}:{m['line']} [{m['type']}] {m['source']} — {m['message']}")
          # فقط وقتی خروجی چاپ شود که نقضی هست — print() خالی هم یک newline
          # می‌نویسد و test -s را true می‌کند (باگ run 34329655919).
          if found:
              print('\n'.join(found))
          PY
          pyrc=$?
          if [ "$pyrc" -ne 0 ]; then
            echo "::error::WPCS gate script failed (see output below)"
            cat /tmp/wpcs-new.txt
            exit 1
          fi

          if [ -s /tmp/wpcs-new.txt ]; then
            echo "::error::$(wc -l < /tmp/wpcs-new.txt) WPCS violation(s) on added lines:"
            cat /tmp/wpcs-new.txt
            PR_NUM="${{ github.event.pull_request.number }}"
            if [ -n "$PR_NUM" ]; then
              {
                echo "### WPCS — violations on added lines (run ${{ github.run_id }})"
                echo '```'
                cat /tmp/wpcs-new.txt
                echo '```'
              } > /tmp/wpcs-pr.md
              gh pr comment "$PR_NUM" --body-file /tmp/wpcs-pr.md || echo '::notice::PR comment failed'
            fi
            exit 1
          fi
          echo 'WPCS: no violations on added lines — green.'

      # شواهدِ قابلِ‌بازیابی: خروجیِ step‌ها در blob ذخیره می‌شود و از API
      # خوانده نمی‌شود؛ نتیجهٔ self-test (اثباتِ رگرسیون) و خروجیِ collector
      # (scope + متادیتای خطوطِ add شده) روی PR آینه می‌شود تا «سبز بودن»
      # قابلِ استنباط باشد و نه ادعا. روی غیرِ PR (push به main) چیزی
      # کامنت نمی‌شود.
      - name: Mirror WPCS collector evidence onto the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo 'WPCS: not a pull_request run — evidence mirror skipped.'
            exit 0
          fi
          {
            echo "### WPCS collector evidence (run ${{ github.run_id }}, attempt ${{ github.run_attempt }})"
            echo '```'
            echo '--- collector self-test (deterministic regression proof) ---'
            cat /tmp/wpcs-selftest.log 2>/dev/null || echo '(self-test log missing)'
            echo '--- collection (scope + added-line metadata) ---'
            cat /tmp/wpcs-collect.log 2>/dev/null || echo '(collector log missing)'
            echo '```'
          } > /tmp/wpcs-evidence.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/wpcs-evidence.md \
            || echo '::notice::WPCS evidence mirror failed (non-fatal)'
